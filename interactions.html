<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fiche interaction</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="./common.css">
<script src="./common.js"></script>
<style>
  .list-item .date { font-size: 11px; color: var(--text-muted); min-width: 58px; }
  .type-pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    background: var(--sequoia-green-light);
    color: var(--sequoia-green-dark);
    font-size: 10.5px;
    font-weight: 600;
    margin-top: 2px;
  }

  /* ---- CR markdown editor ---- */
  .cr-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    row-gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 6px;
  }
  .cr-toolbar button {
    border: none;
    background: transparent;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cr-toolbar button:hover { background: #fff; }
  .cr-toolbar button.active { background: var(--sequoia-green); color: #fff; }
  .cr-toolbar .spacer { flex: 1 1 12px; min-width: 8px; }
  .cr-save-status { font-size: 11px; color: var(--text-muted); padding-right: 4px; }

  .objet-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: #fff;
    font-size: 21px;
    font-weight: 700;
    padding: 2px 0;
    width: 100%;
    min-width: 0;
  }
  .objet-input::placeholder { color: rgba(255,255,255,0.6); }
  .objet-input:hover { border-bottom-color: rgba(255,255,255,0.4); }
  .objet-input:focus { outline: none; border-bottom-color: #fff; }

  .header-subrow { display: flex; gap: 10px; margin-top: 4px; min-width: 0; }
  .header-subrow input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: #fff;
    opacity: 0.9;
    font-size: 13px;
    padding: 2px 0;
    min-width: 0;
  }
  .header-subrow input[type="date"] { width: 118px; flex-shrink: 0; color-scheme: dark; }
  .header-subrow input[type="text"] { flex: 1; min-width: 40px; }
  .header-subrow input::placeholder { color: rgba(255,255,255,0.6); }
  .header-subrow input:hover { border-bottom-color: rgba(255,255,255,0.4); }
  .header-subrow input:focus { outline: none; border-bottom-color: #fff; }

  .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 2px; }

  .edit-toggle-btn {
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }
  .edit-toggle-btn:hover { background: rgba(255,255,255,0.32); }

  .close-fiche-btn {
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }
  .close-fiche-btn:hover { background: #dc2626; }

  .empty-hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    padding: 12px 0 20px;
  }

  .cr-editable {
    width: 100%;
    min-height: 160px;
    max-height: 420px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 0 0 8px 8px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }
  .cr-editable:focus { border-color: var(--sequoia-green); }
  .cr-editable img { max-width: 100%; border-radius: 6px; margin: 6px 0; }
  .cr-editable p:first-child, .cr-editable h1:first-child, .cr-editable h2:first-child, .cr-editable h3:first-child { margin-top: 0; }
  .cr-editable:empty::before { content: attr(data-placeholder); color: var(--text-muted); font-style: italic; }
  /* Cap heading sizes so a "Titre" line stays proportionate instead of
     taking over the whole card (also applies to legacy Markdown content
     that used to render with the browser's default, much larger H1/H2). */
  .cr-editable h1, .cr-editable h2, .cr-editable h3 {
    font-size: 15px;
    font-weight: 700;
    margin: 10px 0 4px;
  }
  .cr-editable ul, .cr-editable ol { padding-left: 20px; margin: 6px 0; }

  /* ---- Attachments ---- */
  .pj-dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .pj-dropzone.dragover { border-color: var(--sequoia-green); background: var(--sequoia-green-light); }
  .pj-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .pj-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  .pj-item .pj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pj-item a { color: var(--sequoia-green-dark); text-decoration: none; font-weight: 500; }
  .pj-item a:hover { text-decoration: underline; }
  .pj-item .pj-remove { color: var(--danger); cursor: pointer; font-size: 13px; background: none; border: none; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="btn-new" id="btn-new">+ Nouvelle interaction</button>
    </div>
    <div class="list" id="list">
      <div class="empty-list">Chargement…</div>
    </div>
  </aside>

  <main class="fiche-wrap" id="fiche-wrap">
    <div class="placeholder">Sélectionnez une interaction</div>
  </main>
</div>

<div class="form-modal-backdrop" id="create-modal" hidden>
  <div class="form-modal">
    <button class="form-modal-close" id="create-close">✕</button>
    <h2 class="form-modal-title">Nouvelle interaction</h2>
    <div class="form-modal-grid">
      <div class="form-field full"><label>Objet</label><input id="new-objet" autofocus></div>
      <div class="form-field full">
        <label>Partenaire(s) <span class="required-mark">*</span></label>
        <div id="new-ref-partenaires"></div>
        <div class="form-field-hint" id="new-partenaire-hint">Sans partenaire, l'interaction n'apparaîtra pas dans la fiche de la structure.</div>
      </div>
      <div class="form-field full"><label>Contact(s) partenaire</label><div id="new-ref-contact-partenaire"></div></div>
      <div class="form-field"><label>Date</label><input id="new-date" type="date"></div>
      <div class="form-field"><label>Type</label><select id="new-type"></select></div>
      <div class="form-field"><label>Prochaine échéance</label><input id="new-echeance" type="date"></div>
      <div class="form-field"><label>Suites</label><input id="new-suites"></div>
      <div class="form-field full"><label>Compte-rendu</label><textarea id="new-cr"></textarea></div>
      <div class="form-modal-note">Les autres liens (contact cluster, établissement, laboratoire, équipe, opportunité) se renseignent depuis la fiche une fois l'interaction créée.</div>
    </div>
    <div class="form-modal-actions">
      <button class="btn-secondary" id="create-cancel">Annuler</button>
      <button class="btn-primary" id="create-submit">Créer</button>
    </div>
  </div>
</div>

<script>
  const COLUMNS = [
    { name: 'Date', optional: true },
    { name: 'Type', optional: true },
    { name: 'Partenaires', title: 'Partenaire(s)', optional: true },
    { name: 'Objet', optional: false },
    { name: 'ContactPartenaire', title: 'Contact(s) partenaire', optional: true },
    { name: 'EtablissementCluster', title: 'Etablissement Cluster', optional: true },
    { name: 'LaboratoireCluster', title: 'Laboratoire Cluster', optional: true },
    { name: 'EquipeCluster', title: 'Equipe Cluster', optional: true },
    { name: 'ContactCluster', title: 'Contact(s) cluster', optional: true },
    { name: 'ProchaineEcheance', title: 'Prochaine échéance', optional: true },
    { name: 'Suites', optional: true },
    { name: 'Opportunites', title: 'Opportunité(s)', optional: true },
    { name: 'CR', title: 'Compte-rendu', optional: true },
    { name: 'PJ', title: 'Pièce-jointe', optional: true }
  ];

  let allRecords = [];
  let currentMappings = null;
  let current = null; // currently displayed mapped record
  let editMode = false; // whether the "other fields" section is in edit mode

  grist.ready({ requiredAccess: 'full', columns: COLUMNS, allowSelectBy: true });

  function sortByDateDesc(records) {
    return [...records].sort((a, b) => {
      const da = typeof a.Date === 'number' ? a.Date : 0;
      const db = typeof b.Date === 'number' ? b.Date : 0;
      return db - da;
    });
  }

  function renderList() {
    const listEl = document.getElementById('list');
    const filtered = sortByDateDesc(allRecords);

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty-list">Aucune interaction. Cliquez sur "+ Nouvelle interaction" pour en créer une.</div>';
      return;
    }

    listEl.innerHTML = '';
    filtered.forEach(r => {
      const item = document.createElement('div');
      item.className = 'list-item' + (current && r.id === current.id ? ' active' : '');

      const dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = formatDate(r.Date);

      const info = document.createElement('div');
      info.style.overflow = 'hidden';
      info.innerHTML =
        '<div class="name">' + escapeHtml(r.Objet || 'Sans objet') + '</div>' +
        (r.Type ? '<span class="type-pill">' + escapeHtml(r.Type) + '</span>' : '');

      item.appendChild(dateEl);
      item.appendChild(info);
      item.addEventListener('click', () => {
        grist.setCursorPos({ rowId: r.id }).catch(() => {});
        selectRecord(r);
      });

      listEl.appendChild(item);
    });
  }

  function selectRecord(r) {
    current = r;
    editMode = false;
    renderFiche(r);
    renderList();
  }

  function closeFiche() {
    current = null;
    editMode = false;
    renderFiche(null);
    renderList();
  }

  function saveStatus(text) {
    const el = document.getElementById('cr-save-status');
    if (el) el.textContent = text;
  }

  const saveCR = debounce(async function (recordId, html) {
    try {
      saveStatus('Enregistrement…');
      await grist.getTable().update({ id: recordId, fields: { [currentMappings.CR]: html } });
      saveStatus('Enregistré ✓');
    } catch (err) {
      saveStatus('Erreur d’enregistrement');
      console.error(err);
    }
  }, 800);

  // ---- WYSIWYG compte-rendu ----
  // Stored format is sanitized HTML. Images keep a stable data-att-id
  // reference instead of a live download URL (those URLs carry a
  // short-lived auth token) — resolved to a real src only for display,
  // and stripped back to the stable form before saving.

  function looksLikeHtml(text) {
    return /<[a-z][\s\S]*>/i.test(text || '');
  }

  // Normalizes any stored CR value (legacy plain Markdown, or current
  // HTML) into sanitized HTML with img[data-att-id] placeholders.
  function normalizeCrToHtml(raw) {
    if (!raw) return '';
    const html = looksLikeHtml(raw) ? raw : marked.parse(raw);
    const clean = DOMPurify.sanitize(html, { ADD_ATTR: ['data-att-id'] });
    const tmp = document.createElement('div');
    tmp.innerHTML = clean;
    tmp.querySelectorAll('img[src^="grist-att:"]').forEach(img => {
      img.setAttribute('data-att-id', img.getAttribute('src').replace('grist-att:', ''));
      img.removeAttribute('src');
    });
    return tmp.innerHTML;
  }

  // Resolves img[data-att-id] elements inside `container` to a live,
  // freshly-authenticated download URL for display.
  async function resolveImagesIn(container) {
    const imgs = container.querySelectorAll('img[data-att-id]');
    for (const img of imgs) {
      try {
        img.src = await getAttachmentDownloadUrl(img.getAttribute('data-att-id'));
      } catch (err) {
        img.alt = 'Image indisponible';
      }
    }
  }

  // Serializes the editable div's current content back to the stable
  // storage form (img src stripped, data-att-id kept) — never save a
  // live, soon-to-expire download URL.
  function serializeCrForSave(container) {
    const tmp = document.createElement('div');
    tmp.innerHTML = container.innerHTML;
    tmp.querySelectorAll('img[data-att-id]').forEach(img => img.removeAttribute('src'));
    return DOMPurify.sanitize(tmp.innerHTML, { ADD_ATTR: ['data-att-id'] });
  }

  async function renderPjList(r, container) {
    const ids = attachmentIdsFromValue(r.PJ);
    if (ids.length === 0) {
      container.innerHTML = '<div class="empty-list" style="padding:8px 0;">Aucune pièce jointe.</div>';
      return;
    }
    container.innerHTML = '<div class="empty-list" style="padding:8px 0;">Chargement…</div>';
    const metas = await Promise.all(ids.map(id => getAttachmentMeta(id).catch(() => ({ id, fileName: 'Fichier #' + id }))));
    container.innerHTML = '';
    metas.forEach(meta => {
      const row = document.createElement('div');
      row.className = 'pj-item';
      row.innerHTML =
        '<span>📎</span>' +
        '<span class="pj-name">' + escapeHtml(meta.fileName) + '</span>' +
        '<a href="#" data-id="' + meta.id + '" class="pj-download">Télécharger</a>' +
        '<button class="pj-remove" data-id="' + meta.id + '" title="Retirer">✕</button>';
      container.appendChild(row);
    });

    container.querySelectorAll('.pj-download').forEach(a => {
      a.addEventListener('click', async (e) => {
        e.preventDefault();
        const url = await getAttachmentDownloadUrl(a.dataset.id);
        window.open(url, '_blank');
      });
    });
    container.querySelectorAll('.pj-remove').forEach(btn => {
      btn.addEventListener('click', async () => {
        const remaining = ids.filter(id => String(id) !== String(btn.dataset.id));
        await grist.getTable().update({ id: r.id, fields: { [currentMappings.PJ]: ['L', ...remaining] } });
        r.PJ = ['L', ...remaining];
        renderPjList(r, container);
      });
    });
  }

  function setupDropzone(zone, input, r, listContainer) {
    const handleFiles = async (files) => {
      if (!files || files.length === 0) return;
      zone.textContent = 'Envoi en cours…';
      try {
        const newIds = await uploadAttachments(Array.from(files));
        const existing = attachmentIdsFromValue(r.PJ);
        const all = [...existing, ...newIds];
        await grist.getTable().update({ id: r.id, fields: { [currentMappings.PJ]: ['L', ...all] } });
        r.PJ = ['L', ...all];
        renderPjList(r, listContainer);
      } catch (err) {
        console.error(err);
      } finally {
        zone.textContent = 'Glissez un fichier ici, ou cliquez pour parcourir';
      }
    };

    zone.addEventListener('click', () => input.click());
    input.addEventListener('change', () => handleFiles(input.files));
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
  }

  function refViewBlock(label, labels) {
    if (!labels || labels.length === 0) return '';
    return '<div class="section-title">' + label + '</div><div class="tags">' +
      labels.map(l => '<span class="tag">' + escapeHtml(l) + '</span>').join('') +
      '</div>';
  }

  function renderFiche(r) {
    const wrap = document.getElementById('fiche-wrap');
    if (!r) {
      wrap.innerHTML = '<div class="placeholder">Sélectionnez une interaction</div>';
      return;
    }

    const labelsOf = (v) => (formatValue(v) ? formatValue(v).split(', ') : []);

    const headerHtml = editMode
      ? '<input class="objet-input" id="f-objet" placeholder="Objet" value="' + escapeHtml(r.Objet || '') + '">' +
        '<div class="header-subrow">' +
          '<input type="date" id="f-date" value="' + gristDateToInputValue(r.Date) + '">' +
          '<input type="text" id="f-type" placeholder="Type" value="' + escapeHtml(r.Type || '') + '">' +
        '</div>'
      : '<h1>' + escapeHtml(r.Objet || 'Sans objet') + '</h1>' +
        ([formatDate(r.Date), r.Type].filter(Boolean).length
          ? '<div class="subtitle">' + escapeHtml([formatDate(r.Date), r.Type].filter(Boolean).join(' · ')) + '</div>' : '');

    let metaHtml;
    if (editMode) {
      metaHtml =
        '<div class="info-grid">' +
          '<div class="info-item"><div class="label">Prochaine échéance</div><input type="date" class="editable-input" id="f-echeance" value="' + gristDateToInputValue(r.ProchaineEcheance) + '"></div>' +
          '<div class="info-item"><div class="label">Suites</div><input class="editable-input" id="f-suites" value="' + escapeHtml(r.Suites || '') + '"></div>' +
        '</div>' +
        '<div class="section-title">Partenaire(s)</div>' +
        '<div id="ref-partenaires"></div>' +
        '<div class="section-title">Contact(s) partenaire</div>' +
        '<div id="ref-contact-partenaire"></div>' +
        '<div class="section-title">Contact(s) cluster</div>' +
        '<div id="ref-contact-cluster"></div>' +
        '<div class="section-title">Etablissement Cluster</div>' +
        '<div id="ref-etablissement"></div>' +
        '<div class="section-title">Laboratoire Cluster</div>' +
        '<div id="ref-laboratoire"></div>' +
        '<div class="section-title">Equipe Cluster</div>' +
        '<div id="ref-equipe"></div>' +
        '<div class="section-title">Opportunité(s)</div>' +
        '<div id="ref-opportunites"></div>';
    } else {
      const rows = [
        r.ProchaineEcheance ? '<div class="info-item"><div class="label">Prochaine échéance</div><div class="value">' + escapeHtml(formatDate(r.ProchaineEcheance)) + '</div></div>' : '',
        r.Suites ? '<div class="info-item"><div class="label">Suites</div><div class="value">' + escapeHtml(r.Suites) + '</div></div>' : ''
      ].join('');
      const refBlocks =
        refViewBlock('Partenaire(s)', labelsOf(r.Partenaires)) +
        refViewBlock('Contact(s) partenaire', labelsOf(r.ContactPartenaire)) +
        refViewBlock('Contact(s) cluster', labelsOf(r.ContactCluster)) +
        refViewBlock('Etablissement Cluster', labelsOf(r.EtablissementCluster)) +
        refViewBlock('Laboratoire Cluster', labelsOf(r.LaboratoireCluster)) +
        refViewBlock('Equipe Cluster', labelsOf(r.EquipeCluster)) +
        refViewBlock('Opportunité(s)', labelsOf(r.Opportunites));
      const nothingElse = !rows && !refBlocks;
      metaHtml =
        (rows ? '<div class="info-grid">' + rows + '</div>' : '') +
        refBlocks +
        (nothingElse ? '<div class="empty-hint">Aucune autre information renseignée. Cliquez sur "✏️ Modifier" pour compléter la fiche.</div>' : '');
    }

    wrap.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div class="header-icon">📅</div>' +
          '<div class="header-text">' + headerHtml + '</div>' +
          '<div class="header-actions">' +
            '<button class="edit-toggle-btn" id="toggle-edit" title="' + (editMode ? 'Terminé' : 'Modifier') + '">' + (editMode ? '✓' : '✏️') + '</button>' +
            '<button class="close-fiche-btn" id="close-fiche" title="Fermer">✕</button>' +
          '</div>' +
        '</div>' +
        '<div class="card-body">' +
          metaHtml +

          '<div class="section-title">Compte-rendu</div>' +
          '<div class="cr-toolbar">' +
            '<button type="button" data-cmd="bold" title="Gras"><b>G</b></button>' +
            '<button type="button" data-cmd="italic" title="Italique"><i>I</i></button>' +
            '<button type="button" data-cmd="heading" title="Titre">H</button>' +
            '<button type="button" data-cmd="list" title="Liste">• Liste</button>' +
            '<button type="button" data-cmd="link" title="Lien">🔗</button>' +
            '<span class="spacer"></span>' +
            '<span class="cr-save-status" id="cr-save-status"></span>' +
          '</div>' +
          '<div class="cr-editable" id="cr-editor" contenteditable="true" data-placeholder="Rédigez le compte-rendu… (collez une image directement)"></div>' +

          '<div class="section-title">Pièces jointes</div>' +
          '<div class="pj-dropzone" id="pj-dropzone">Glissez un fichier ici, ou cliquez pour parcourir</div>' +
          '<input type="file" id="pj-input" multiple hidden>' +
          '<div class="pj-list" id="pj-list"></div>' +
        '</div>' +
      '</div>';

    document.getElementById('toggle-edit').addEventListener('click', () => {
      const editorEl = document.getElementById('cr-editor');
      if (editorEl) r.CR = serializeCrForSave(editorEl); // carry over any unsaved-but-pending CR edit across the re-render
      editMode = !editMode;
      renderFiche(r);
    });
    document.getElementById('close-fiche').addEventListener('click', closeFiche);

    if (editMode) {
      const saveField = createFieldSaver(saveStatus);
      const structureLinkCandidates = ['Structures', 'Structure', 'Structure_s_', 'structures'];

      function renderContactPartenairePicker(partenaireLabels) {
        renderRefPicker(
          document.getElementById('ref-contact-partenaire'),
          labelsOf(r.ContactPartenaire),
          'Contacts',
          (labels) => saveRefField(r.id, currentMappings.ContactPartenaire, labels, document.getElementById('cr-save-status')),
          { linkCandidates: structureLinkCandidates, parentTableId: 'Structures', parentLabels: partenaireLabels }
        );
      }

      renderRefPicker(document.getElementById('ref-partenaires'), labelsOf(r.Partenaires), 'Structures',
        (labels) => { saveRefField(r.id, currentMappings.Partenaires, labels, document.getElementById('cr-save-status')); renderContactPartenairePicker(chipLabels(labels)); });
      renderContactPartenairePicker(labelsOf(r.Partenaires));
      renderRefPicker(document.getElementById('ref-contact-cluster'), labelsOf(r.ContactCluster), 'Contacts',
        (labels) => saveRefField(r.id, currentMappings.ContactCluster, labels, document.getElementById('cr-save-status')));
      renderRefPicker(document.getElementById('ref-opportunites'), labelsOf(r.Opportunites), 'Opportunites',
        (labels) => saveRefField(r.id, currentMappings.Opportunites, labels, document.getElementById('cr-save-status')));
      renderRefPicker(document.getElementById('ref-etablissement'), labelsOf(r.EtablissementCluster), 'Structures',
        (labels) => saveRefField(r.id, currentMappings.EtablissementCluster, labels, document.getElementById('cr-save-status')));
      renderRefPicker(document.getElementById('ref-laboratoire'), labelsOf(r.LaboratoireCluster), 'Structures',
        (labels) => saveRefField(r.id, currentMappings.LaboratoireCluster, labels, document.getElementById('cr-save-status')));
      renderRefPicker(document.getElementById('ref-equipe'), labelsOf(r.EquipeCluster), 'Structures',
        (labels) => saveRefField(r.id, currentMappings.EquipeCluster, labels, document.getElementById('cr-save-status')));

      document.getElementById('f-objet').addEventListener('input', (e) => saveField(r.id, currentMappings.Objet, e.target.value));
      document.getElementById('f-type').addEventListener('input', (e) => saveField(r.id, currentMappings.Type, e.target.value));
      document.getElementById('f-date').addEventListener('input', (e) => saveField(r.id, currentMappings.Date, inputValueToGristDate(e.target.value)));
      document.getElementById('f-echeance').addEventListener('input', (e) => saveField(r.id, currentMappings.ProchaineEcheance, inputValueToGristDate(e.target.value)));
      document.getElementById('f-suites').addEventListener('input', (e) => saveField(r.id, currentMappings.Suites, e.target.value));
    }

    const editor = document.getElementById('cr-editor');
    editor.innerHTML = normalizeCrToHtml(r.CR);
    resolveImagesIn(editor);

    function exec(cmd) {
      editor.focus();
      if (cmd === 'heading') document.execCommand('formatBlock', false, 'H3');
      else if (cmd === 'list') document.execCommand('insertUnorderedList');
      else if (cmd === 'link') {
        const url = prompt('URL du lien :', 'https://');
        if (url) document.execCommand('createLink', false, url);
      } else {
        document.execCommand(cmd);
      }
      saveCR(r.id, serializeCrForSave(editor));
    }
    document.querySelectorAll('.cr-toolbar button[data-cmd]').forEach(btn => {
      // mousedown + preventDefault keeps the current text selection alive
      // (a plain click would blur the editor first and lose it).
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); exec(btn.dataset.cmd); });
    });

    editor.addEventListener('input', () => saveCR(r.id, serializeCrForSave(editor)));

    editor.addEventListener('paste', async (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          const placeholder = document.createElement('span');
          placeholder.textContent = 'Téléversement de l’image…';
          placeholder.style.color = 'var(--text-muted)';
          const sel = window.getSelection();
          if (sel && sel.rangeCount) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(placeholder);
            range.collapse(false);
          } else {
            editor.appendChild(placeholder);
          }
          try {
            const [id] = await uploadAttachments([file]);
            const img = document.createElement('img');
            img.setAttribute('data-att-id', id);
            img.src = await getAttachmentDownloadUrl(id);
            placeholder.replaceWith(img);
          } catch (err) {
            placeholder.textContent = 'Échec du téléversement de l’image.';
            console.error(err);
          }
          saveCR(r.id, serializeCrForSave(editor));
          return;
        }
      }
    });

    const pjList = document.getElementById('pj-list');
    renderPjList(r, pjList);
    setupDropzone(document.getElementById('pj-dropzone'), document.getElementById('pj-input'), r, pjList);
  }

  grist.onRecords(function (records, mappings) {
    currentMappings = mappings;
    allRecords = mapRecords(records, mappings);
    // If the interaction shown in the fiche fell out of the (possibly
    // filtered) list — e.g. the linked Structure changed — Grist doesn't
    // always re-fire onRecord, so clear it here explicitly.
    if (current && !allRecords.some(r => r.id === current.id)) {
      current = null;
      renderFiche(null);
    }
    renderList();
  });

  grist.onRecord(function (record, mappings) {
    // Deliberately not opening the fiche here: Grist restores the last
    // cursor position on load, which would otherwise auto-open an
    // interaction (loading the CR markdown libs and fetching its
    // attachments) before the user asked for it. The list-click handler
    // is the only thing that opens the fiche.
    currentMappings = mappings;
  });

  const createModal = document.getElementById('create-modal');
  let newPartenaireChips = [];
  let newContactPartenaireChips = [];
  const NEW_STRUCTURE_LINK_CANDIDATES = ['Structures', 'Structure', 'Structure_s_', 'structures'];

  function renderNewContactPartenairePicker(partenaireLabels) {
    renderRefPicker(
      document.getElementById('new-ref-contact-partenaire'), [], 'Contacts',
      (chips) => { newContactPartenaireChips = chips; },
      { linkCandidates: NEW_STRUCTURE_LINK_CANDIDATES, parentTableId: 'Structures', parentLabels: partenaireLabels }
    );
  }

  async function openCreateModal() {
    ['new-objet', 'new-date', 'new-echeance', 'new-suites', 'new-cr']
      .forEach(id => { document.getElementById(id).value = ''; });

    const typeSelect = document.getElementById('new-type');
    typeSelect.innerHTML = '<option value="">—</option>';

    newPartenaireChips = [];
    newContactPartenaireChips = [];
    const hintEl = document.getElementById('new-partenaire-hint');
    hintEl.textContent = "Sans partenaire, l'interaction n'apparaîtra pas dans la fiche de la structure.";
    hintEl.classList.remove('error');
    renderRefPicker(document.getElementById('new-ref-partenaires'), [], 'Structures',
      (chips) => {
        newPartenaireChips = chips;
        renderNewContactPartenairePicker(chipLabels(chips));
        if (chips.length) hintEl.classList.remove('error');
      });
    renderNewContactPartenairePicker([]);

    createModal.hidden = false;
    document.getElementById('new-objet').focus();

    // Prefer the column's real Grist-defined Choice list (includes values
    // like a just-added "Webinaire" that no existing record uses yet).
    // Fall back to scanning the *whole* Interactions table for distinct
    // values actually in use if Type isn't a Choice column.
    try {
      const tableId = await grist.getTable().getTableId();
      let typeValues = await fetchColumnChoices(tableId, currentMappings.Type);
      if (!typeValues) {
        const data = await fetchTableCached(tableId);
        typeValues = Array.from(new Set((data[currentMappings.Type] || []).filter(Boolean)));
      }
      typeValues = [...typeValues].sort((a, b) => String(a).localeCompare(String(b), 'fr'));
      typeSelect.innerHTML = '<option value="">—</option>' +
        typeValues.map(t => '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>').join('');
    } catch (err) {
      console.error('Could not load Type values', err);
    }
  }
  function closeCreateModal() { createModal.hidden = true; }

  document.getElementById('btn-new').addEventListener('click', openCreateModal);
  document.getElementById('create-close').addEventListener('click', closeCreateModal);
  document.getElementById('create-cancel').addEventListener('click', closeCreateModal);
  createModal.addEventListener('click', (e) => { if (e.target === createModal) closeCreateModal(); });

  document.getElementById('create-submit').addEventListener('click', async () => {
    const objet = document.getElementById('new-objet').value.trim();
    if (!objet) { document.getElementById('new-objet').focus(); return; }

    const hintEl = document.getElementById('new-partenaire-hint');
    if (newPartenaireChips.length === 0) {
      hintEl.textContent = 'Choisis au moins un partenaire (sinon l\'interaction n\'apparaîtra nulle part).';
      hintEl.classList.add('error');
      const input = document.querySelector('#new-ref-partenaires .ref-input');
      if (input) input.focus();
      return;
    }
    hintEl.classList.remove('error');

    const fields = {};
    if (currentMappings.Objet) fields[currentMappings.Objet] = objet;
    if (currentMappings.Date) fields[currentMappings.Date] = inputValueToGristDate(document.getElementById('new-date').value);
    if (currentMappings.Type) fields[currentMappings.Type] = document.getElementById('new-type').value.trim();
    if (currentMappings.ProchaineEcheance) fields[currentMappings.ProchaineEcheance] = inputValueToGristDate(document.getElementById('new-echeance').value);
    if (currentMappings.Suites) fields[currentMappings.Suites] = document.getElementById('new-suites').value.trim();
    if (currentMappings.CR) fields[currentMappings.CR] = document.getElementById('new-cr').value.trim();
    if (currentMappings.Partenaires && newPartenaireChips.length) {
      fields[currentMappings.Partenaires] = ['L', ...newPartenaireChips.map(c => c.id)];
    }
    if (currentMappings.ContactPartenaire && newContactPartenaireChips.length) {
      fields[currentMappings.ContactPartenaire] = ['L', ...newContactPartenaireChips.map(c => c.id)];
    }

    try {
      const created = await grist.getTable().create({ fields });
      const newId = Array.isArray(created) ? created[0].id : created.id;
      closeCreateModal();
      grist.setCursorPos({ rowId: newId }).catch(() => {});
    } catch (err) {
      console.error(err);
      alert('Erreur lors de la création de l’interaction.');
    }
  });
</script>

</body>
