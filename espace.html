      (e.pj.length ? '<div class="es-section"><h5>Pièces jointes</h5><div class="pa-pj">' + e.pj.map(id => '<button type="button" class="es-pill" data-pj="' + id + '">📎 <span data-pj-nom="' + id + '">Pièce jointe #' + id + '</span></button>').join('') + '</div></div>' : '');
    return { head, tabs: [], body };
  }

  function ligneAction(a) {
    const j = a.due ? E.joursAvant(a.due, nowTs()) : null;
    return '<div class="es-row"><input type="checkbox" data-fait="' + a.id + '"' + (a.done ? ' checked' : '') + (related.actions.cols.Fait ? '' : ' disabled') + ' aria-label="Faite">' +
      '<div style="min-width:0' + (a.done ? ';opacity:.6;text-decoration:line-through' : '') + '"><div class="t">' + (a.important ? '<span class="es-imp">★</span> ' : '') + H(a.label) + '</div>' +
      (a.contactIds.length ? '<div class="s">' + H(a.contactIds.map(id => (D.cById.get(id) || {}).name).filter(Boolean).join(', ')) + '</div>' : '') + '</div>' +
      '<span class="r' + (j !== null && j < 0 && !a.done ? '" style="color:var(--es-late);font-weight:600' : '') + '">' + H(a.due ? formatDate(a.due) : '') + '</span></div>';
  }
  function ligneProjet(p) {
    return '<div class="es-row click" data-open="projet:' + p.id + '"><div style="min-width:0;flex:1"><div class="t">' + H(p.title) + '</div><div class="s">' +
      H([p.type, p.partnerIds.length ? nomsS(p.partnerIds) : 'Interne'].filter(Boolean).join(' · ')) + '</div></div>' + badgeEtape(p.stage) + '</div>';
  }
  function ligneContact(c) {
    return '<div class="es-row click" data-open="contact:' + c.id + '">' + avatar(c.name, '#64748b') + '<div style="min-width:0"><div class="t">' + H(c.name) + '</div><div class="s">' +
      H([c.fonction, c.email].filter(Boolean).join(' · ')) + '</div></div></div>';
  }
  const vide = (msg) => '<div class="es-empty">' + H(msg) + '</div>';

  function ficheProjet(p, tab) {
    const lies = D.liesProjet.get(p.id);
    const personnes = p.contactIds.map(id => D.cById.get(id)).filter(Boolean);
    const tabs = [['general', 'Général'], ['echanges', 'Échanges', lies.echanges.length], ['actions', 'Actions', lies.actions.filter(a => !a.done).length],
      ['personnes', 'Personnes', personnes.length], ['documents', 'Documents', (p.docs || []).length + (p.liens || []).length]];
    const head = '<div class="es-sheet-top">' + badgeEtape(p.stage) + badgeType(p.type) +
      '<span class="ed-actions"><button type="button" class="es-btn" data-edit="opportunites:' + p.id + '">✎ Modifier</button>' +
      '<button type="button" class="es-btn" data-new="interactions" data-ctx="projet:' + p.id + '">+ Échange</button></span>' +
      '<button type="button" class="es-btn icon close" data-close aria-label="Fermer">✕</button></div>' +
      '<h2>' + H(p.title) + '</h2><div class="desc">' + H(p.partnerIds.length ? '' : 'Projet interne') + '</div>' +
      '<div class="es-pills">' + p.partnerIds.concat(p.teamIds).map(id => '<button type="button" class="es-pill" data-open="structure:' + id + '">' + H(nomS(id)) +
        (p.teamIds.includes(id) ? ' <small>équipe</small>' : '') + '</button>').join('') + '</div>' + barreTemps(p, true);
    let body = '';
    if (tab === 'general') {
      body = '<div class="es-info"><div><span>Montant</span><b>' + H(formatMontantOrDash(p.montant)) + '</b></div><div><span>Étape</span><b>' + H(p.stage || '—') + '</b></div>' +
        '<div><span>Début</span><b>' + H(formatDate(p.debut) || '—') + '</b></div><div><span>Échéance</span><b>' + H(formatDate(p.echeance) || '—') + '</b></div>' +
        '<div><span>Échanges</span><b>' + lies.echanges.length + '</b></div><div><span>Actions ouvertes</span><b>' + lies.actions.filter(a => !a.done).length + '</b></div></div>' +
        (p.commentaire ? '<div class="es-section"><h5>Journal</h5><div class="es-note">' + H(p.commentaire) + '</div></div>' : '') +
        (lies.echanges.length ? '<div class="es-section"><h5>Dernier échange</h5>' + ligneEchange(lies.echanges[0]) + '</div>' : '');
    } else if (tab === 'echanges') {
      body = (lies.echanges.length ? '<div class="es-list">' + lies.echanges.map(ligneEchange).join('') + '</div>'
        : vide('Aucun échange rattaché. Renseignez le projet dans la colonne « Opportunités » d’un échange.')) +
        '<button type="button" class="es-btn" data-new="interactions" data-ctx="projet:' + p.id + '" style="margin-top:12px">+ Échange sur ce projet</button>';
    } else if (tab === 'actions') {
      body = (lies.actions.length ? '<div class="es-list">' + lies.actions.slice().sort((a, b) => (a.done - b.done) || ((Number(a.due) || Infinity) - (Number(b.due) || Infinity))).map(ligneAction).join('') + '</div>' : vide('Aucune action.')) +
        (related.actions.tableId ? '<form class="es-form" data-ajout-action="' + p.id + '"><input class="grow" name="label" placeholder="Nouvelle action…" required><input type="date" name="due"><button class="es-btn primary" type="submit">Ajouter</button></form>' : '');
    } else if (tab === 'personnes') {
      body = personnes.length ? '<div class="es-list">' + personnes.map(ligneContact).join('') + '</div>' : vide('Personne n’est rattaché à ce projet.');
    } else if (tab === 'documents') {
      body = documentsProjet(p);
    } else if (tab === 'liens') {
      body = (p.liens.length ? '<div class="es-list">' + p.liens.map((l, i) => '<div class="es-row"><div style="min-width:0;flex:1"><a class="es-link" href="' + H(l.url) + '" target="_blank" rel="noopener">' + H(l.libelle) + '</a>' +
        (l.libelle !== l.url ? '<div class="s">' + H(l.url) + '</div>' : '') + '</div><button type="button" class="es-x" data-suppr-lien="' + i + '" aria-label="Retirer">×</button></div>').join('') + '</div>'
        : vide('Aucun lien. Ajoutez l’adresse d’un document (drive, dépôt, site).')) +
        '<form class="es-form" data-ajout-lien="' + p.id + '"><input name="libelle" placeholder="Libellé"><input class="grow" name="url" type="url" placeholder="https://…" required><button class="es-btn primary" type="submit">Ajouter</button></form>';
    }
    return { head, tabs, body };
  }

  // Les fichiers d'un projet (colonne Pièces jointes) et ses liens (colonne
  // texte). Chaque bloc n'apparaît que si sa colonne existe ; sinon, le widget
  // propose de la créer.
  let envoiEnCours = null; // { projet, message, erreur }
  function documentsProjet(p) {
    const op = related.opportunites;
    const aDocs = !!colDocuments(), aLiens = !!op.cols.Liens;
    let html = '';
    if (!aDocs && !aLiens) {
      return '<div class="doc-setup"><p>Pour joindre des fichiers (brief, PDF, convention…) à un projet, il faut une colonne de type <b>Pièces jointes</b> dans la table ' + H(op.tableId) + '. ' +
        'Pour des liens vers un drive ou un site, une colonne texte <b>Liens</b>.</p>' +
        '<div class="doc-setup-btns"><button type="button" class="es-btn primary" data-doc-colonne="Documents">Ajouter la colonne Documents</button>' +
        '<button type="button" class="es-btn" data-doc-colonne="Liens">Ajouter la colonne Liens</button></div></div>';
    }
    if (aDocs) {
      const etat = envoiEnCours && envoiEnCours.projet === p.id ? envoiEnCours : null;
      html += '<div class="es-section" style="margin-top:0"><h5>Fichiers</h5>' +
        (p.docs.length ? '<div class="es-list">' + p.docs.map(id =>
          '<div class="es-row"><span class="doc-ico">📄</span><div style="min-width:0;flex:1"><button type="button" class="doc-nom" data-pj="' + id + '"><span data-pj-nom="' + id + '">Fichier #' + id + '</span></button>' +
          '<div class="s" data-pj-taille="' + id + '"></div></div>' +
          '<button type="button" class="es-x" data-doc-retirer="' + id + '" title="Retirer du projet" aria-label="Retirer du projet">×</button></div>').join('') + '</div>'
          : '<div class="es-muted" style="font-size:13px;font-style:italic;margin-bottom:8px">Aucun fichier.</div>') +
        '<label class="fi-drop doc-drop" data-doc-projet="' + p.id + '"><input type="file" multiple hidden data-doc-upload="' + p.id + '">' +
        (etat && !etat.erreur ? '<b>' + H(etat.message) + '</b>' : '<b>Déposer un fichier</b> ou cliquer pour parcourir') + '</label>' +
        (etat && etat.erreur ? '<div class="fi-trier warn doc-err"><div><b>Le fichier n’a pas pu être envoyé.</b> ' + H(etat.message) +
          '<br>En attendant, déposez-le directement dans la cellule <b>' + H(colDocuments()) + '</b> de ce projet, dans la table ' + H(op.tableId) + ' de Grist : il apparaîtra ici.' +
          (aLiens ? ' Ou ajoutez ci-dessous un lien vers le fichier.' : '') + '</div></div>' : '') + '</div>';
    } else {
      html += '<div class="doc-setup small"><span>Pas encore de colonne de fichiers.</span><button type="button" class="es-btn" data-doc-colonne="Documents">Ajouter la colonne Documents</button></div>';
    }
    if (aLiens) {
      html += '<div class="es-section"><h5>Liens</h5>' + (p.liens.length ? '<div class="es-list">' + p.liens.map((l, i) => '<div class="es-row"><span class="doc-ico">🔗</span><div style="min-width:0;flex:1"><a class="es-link" href="' + H(l.url) + '" target="_blank" rel="noopener">' + H(l.libelle) + '</a>' +
        (l.libelle !== l.url ? '<div class="s">' + H(l.url) + '</div>' : '') + '</div><button type="button" class="es-x" data-suppr-lien="' + i + '" aria-label="Retirer">×</button></div>').join('') + '</div>'
        : '<div class="es-muted" style="font-size:13px;font-style:italic">Aucun lien.</div>') +
        '<form class="es-form" data-ajout-lien="' + p.id + '"><input name="libelle" placeholder="Libellé"><input class="grow" name="url" type="url" placeholder="https://…" required><button class="es-btn primary" type="submit">Ajouter</button></form></div>';
    }
    return html;
  }

  async function envoyerDocuments(projetId, fichiers) {
    const liste = Array.from(fichiers || []).filter(Boolean);
    const col = colDocuments();
    const p = D.pById.get(projetId);
    if (!liste.length || !col || !p) return;
    envoiEnCours = { projet: projetId, message: 'Envoi de ' + liste.length + ' fichier(s)…', erreur: false };
    renderSheet();
    try {
      const ids = await uploadAttachments(liste);
      await updateRecord(related.opportunites.tableId, projetId, { [col]: ['L', ...p.docs, ...ids] });
      envoiEnCours = null;
      await charger(false);
      render();
      setStatus(ids.length + ' fichier(s) ajouté(s) ✓');
    } catch (err) {
      console.error(err);
      envoiEnCours = { projet: projetId, message: err && err.message ? err.message : String(err), erreur: true };
      renderSheet();
    }
  }

  async function ajouterColonneProjet(nom) {
    const op = related.opportunites;
    const def = nom === 'Documents' ? { type: 'Attachments', label: 'Documents', isFormula: false } : { type: 'Text', label: 'Liens', isFormula: false };
    try {
      await grist.docApi.applyUserActions([['AddColumn', op.tableId, nom, def]]);
      invalidateTableCache(op.tableId);
      if (typeof _colMetaCache !== 'undefined') delete _colMetaCache[op.tableId];
      await charger(true);
      render();
      setStatus('Colonne ' + nom + ' ajoutée ✓');
    } catch (err) { console.error(err); toast('Ajout de la colonne impossible : ' + (err && err.message ? err.message : err), true); }
  }

  function ficheStructure(s, tab) {
    const st = statsStructure(s);
    const tabs = [['projets', 'Projets', st.projets.length], ['contacts', 'Contacts', st.contacts.length], ['echanges', 'Échanges', st.echanges.length]];
    const head = '<div class="es-sheet-top">' + avatar(s.name, couleurStructure(s), true) +
      (s.type ? '<span class="es-badge">' + H(s.type) + '</span>' : '') + (s.categorie ? '<span class="es-badge">' + H(s.categorie) + '</span>' : '') +
      '<button type="button" class="es-btn icon close" data-close aria-label="Fermer">✕</button></div>' +
      '<h2>' + H(s.name) + '</h2><div class="desc">' + H([s.activite, s.axe, s.pilier].filter(Boolean).join(' · ')) + '</div>';
    let body = '';
    if (tab === 'projets') body = st.projets.length ? '<div class="es-list">' + st.projets.map(ligneProjet).join('') + '</div>' : vide('Aucun projet.');
    else if (tab === 'contacts') body = st.contacts.length ? '<div class="es-list">' + st.contacts.map(ligneContact).join('') + '</div>' : vide('Aucun contact.');
    else body = st.echanges.length ? '<div class="es-list">' + st.echanges.map(ligneEchange).join('') + '</div>' : vide('Aucun échange.');
    return { head, tabs, body };
  }

  function ficheContact(c, tab) {
    const ech = D.echanges.filter(e => e.contactIds.includes(c.id));
    const act = D.actions.filter(a => a.contactIds.includes(c.id));
    const proj = D.projets.filter(p => p.contactIds.includes(c.id));
    const tabs = [['echanges', 'Échanges', ech.length], ['actions', 'Actions', act.filter(a => !a.done).length], ['projets', 'Projets', proj.length]];
    const head = '<div class="es-sheet-top">' + avatar(c.name, '#64748b', true) +
      '<span class="ed-actions"><button type="button" class="es-btn" data-edit="contacts:' + c.id + '">✎ Modifier</button>' +
      '<button type="button" class="es-btn" data-new="interactions" data-ctx="contact:' + c.id + '">+ Échange</button></span>' +
      '<button type="button" class="es-btn icon close" data-close aria-label="Fermer">✕</button></div>' +
      '<h2>' + H(c.name) + '</h2><div class="desc">' + H(c.fonction) + '</div>' +
      '<div class="es-pills">' + c.structureIds.map(id => '<button type="button" class="es-pill" data-open="structure:' + id + '">' + H(nomS(id)) + '</button>').join('') +
      (c.email ? '<button type="button" class="es-pill" data-copier="' + H(c.email) + '">✉ ' + H(c.email) + '</button>' : '') +
      (c.tel ? '<button type="button" class="es-pill" data-copier="' + H(c.tel) + '">☎ ' + H(c.tel) + '</button>' : '') + '</div>';
    let body = '';
    if (tab === 'echanges') body = ech.length ? '<div class="es-list">' + ech.map(ligneEchange).join('') + '</div>' : vide('Aucun échange.');
    else if (tab === 'actions') body = act.length ? '<div class="es-list">' + act.map(ligneAction).join('') + '</div>' : vide('Aucune action.');
    else body = proj.length ? '<div class="es-list">' + proj.map(ligneProjet).join('') + '</div>' : vide('Aucun projet.');
    return { head, tabs, body };
  }

  function ficheAction(a) {
    const j = a.due ? E.joursAvant(a.due, nowTs()) : null;
    const head = '<div class="es-sheet-top">' + (a.statut ? '<span class="es-badge">' + H(a.statut) + '</span>' : '') + (a.important ? '<span class="es-badge" style="background:#fef3c7">★ Importante</span>' : '') +
      '<button type="button" class="es-btn icon close" data-close aria-label="Fermer">✕</button></div><h2>' + H(a.label) + '</h2>' +
      '<div class="desc">' + (a.due ? 'Échéance ' + H(formatDate(a.due)) + ' (' + H(jRel(j)) + ')' : 'Sans échéance') + (a.done ? ' · faite' : '') + '</div>' +
      '<div class="es-pills">' + a.projectIds.map(id => '<button type="button" class="es-pill" data-open="projet:' + id + '">' + H((D.pById.get(id) || {}).title || '#' + id) + ' <small>projet</small></button>').join('') +
      a.partnerIds.map(id => '<button type="button" class="es-pill" data-open="structure:' + id + '">' + H(nomS(id)) + '</button>').join('') +
      a.contactIds.map(id => D.cById.get(id)).filter(Boolean).map(c => '<button type="button" class="es-pill" data-open="contact:' + c.id + '">' + H(c.name) + '</button>').join('') + '</div>';
    const ech = a.interactionIds.map(id => D.eById.get(id)).filter(Boolean);
    const body = '<label class="es-row" style="cursor:pointer"><input type="checkbox" data-fait="' + a.id + '"' + (a.done ? ' checked' : '') + (related.actions.cols.Fait ? '' : ' disabled') + '> Marquer comme faite</label>' +
      (a.notes ? '<div class="es-section"><h5>Notes</h5><div class="es-note">' + H(a.notes) + '</div></div>' : '') +
      (ech.length ? '<div class="es-section"><h5>Échange d’origine</h5>' + ech.map(ligneEchange).join('') + '</div>' : '');
    return { head, tabs: [], body };
  }

  // ---------------------------------------------------------------------
  // Édition : contacts, structures, échanges, opportunités
  // ---------------------------------------------------------------------
  // Un seul formulaire, construit d'après le type réel de chaque colonne du
  // document (texte, nombre, date, choix, référence…) : une colonne ajoutée
  // dans Grist apparaît d'elle-même, sans toucher au widget. Les colonnes
  // formules ne sont pas modifiables et n'apparaissent pas.
  const EDIT_TITRES = { contacts: 'contact', structures: 'structure', interactions: 'échange', opportunites: 'opportunité' };
  const EDIT_NOUVEAU = { contacts: 'Nouveau contact', structures: 'Nouvelle structure', interactions: 'Nouvel échange', opportunites: 'Nouvelle opportunité' };
  // Rôles dont la colonne est une date : de quoi la reconnaître même sans métadonnées.
  const ROLES_DATE = ['Date', 'ProchaineEcheance', 'DateDebut', 'Echeance', 'FaitLe'];

  function tableDe(cle) { return cle === 'structures' ? structTableId : (related[cle] || {}).tableId; }

  // Les colonnes à montrer en premier : celles dont le widget connaît le rôle,
  // dans l'ordre de la configuration.
  function rolesPrioritaires(cle) {
    if (cle === 'structures') return Object.values(colsStructure).filter(Boolean);
    const r = related[cle];
    return r ? Object.values(r.cols).filter(Boolean) : [];
  }

  async function metaEdition(cle) {
    const tableId = tableDe(cle);
    const data = await fetchTableCached(tableId);
    let meta = cle === 'structures' ? await fetchColumnMeta(tableId) : (related[cle].meta || []);
    const ids = dataColumns(data);
    // Une colonne que les métadonnées ne décrivent pas (API REST refusée, par
    // exemple) : son type se devine par les valeurs ; une liste de références
    // dont on ignore la cible est laissée de côté plutôt que mal écrite.
    const connues = new Set(meta.map(m => m.id));
    const colsDate = cle === 'structures' ? [] : ROLES_DATE.map(r => related[cle].cols[r]).filter(Boolean);
    meta = meta.concat(ids.filter(id => !connues.has(id)).map(id => {
      const v = (data[id] || []).find(x => x !== null && x !== undefined && x !== '');
      const type = colsDate.includes(id) ? 'Date' : typeof v === 'number' ? 'Numeric' : typeof v === 'boolean' ? 'Bool' : Array.isArray(v) ? '' : 'Text';
      return { id, type, label: id, isFormula: false, choices: [] };
    }).filter(m => m.type));
    const ordre = rolesPrioritaires(cle);
    const cols = meta.filter(m => !m.isFormula && m.id !== 'manualSort' && !/^gristHelper_/.test(m.id) && ids.includes(m.id))
      .sort((a, b) => {
        const ia = ordre.indexOf(a.id), ib = ordre.indexOf(b.id);
        return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
      });
    const records = recordsFromTableData(data);
    // Les tables visées par les références, pour proposer leurs lignes.
    const cibles = Array.from(new Set(cols.map(m => (/^Ref(?:List)?:(.+)$/.exec(m.type) || [])[1]).filter(Boolean)));
    const options = {};
    for (const t of cibles) options[t] = await optionsReference(t);
    // Une colonne « Laboratoire(s) Cluster » ne propose que des laboratoires,
    // « Équipe(s) Cluster » que des équipes, « Établissement(s) » que des
    // établissements — comme le formulaire du Pilotage.
    const optionsCol = {};
    cols.forEach(m => {
      const cible = (/^Ref(?:List)?:(.+)$/.exec(m.type) || [])[1];
      if (cible !== structTableId) return;
      const filtre = filtreRoleStructure(m);
      if (!filtre) return;
      const gardes = new Set(D.structures.filter(filtre).map(x => x.id));
      const courants = new Set(records.flatMap(r => refIdsFromValue(r[m.id])));
      const sousListe = (options[cible] || []).filter(o => gardes.has(o.id) || courants.has(o.id));
      // Aucune structure typée ainsi : la liste entière plutôt qu'un champ vide.
      if (gardes.size) optionsCol[m.id] = sousListe;
    });
    return { tableId, cols, records, options, optionsCol };
  }

  function filtreRoleStructure(m) {
    const k = normalizeKey((m.id || '') + ' ' + (m.label || ''));
    const type = (s) => normalizeKey(s.type);
    if (k.includes('labo')) return (s) => s.roleRecherche.includes('laboratoire');
    if (k.includes('equipe')) return (s) => s.roleRecherche.includes('equipe') || s.isTeam;
    if (k.includes('etablissement')) return (s) => type(s).includes('academique') || s.roleRecherche === 'institut' || s.roleRecherche.includes('etablissement');
    return null;
  }

  // Les lignes d'une table visée par une référence, avec un libellé lisible
  // et unique (deux contacts homonymes restent distinguables).
  async function optionsReference(tableId) {
    let liste;
    if (tableId === structTableId) liste = D.structures.map(s => ({ id: s.id, label: s.name }));
    else if (tableId === related.contacts.tableId) liste = D.contacts.map(c => ({ id: c.id, label: c.name + (c.structureIds.length ? ' — ' + nomS(c.structureIds[0]) : '') }));
    else if (tableId === related.opportunites.tableId) liste = D.projets.map(p => ({ id: p.id, label: p.title }));
    else if (tableId === related.interactions.tableId) liste = D.echanges.map(e => ({ id: e.id, label: (e.date ? formatDate(e.date) + ' · ' : '') + (e.objet || e.type || 'Échange') }));
    else {
      try {
        const data = await fetchTableCached(tableId);
        const col = guessDisplayColumn(data);
        liste = (data.id || []).map((id, i) => ({ id, label: txt(data[col][i]) || '#' + id }));
      } catch (err) { liste = []; }
    }
    const vus = {};
    liste.forEach(o => { vus[o.label] = (vus[o.label] || 0) + 1; });
    return liste.map(o => (vus[o.label] > 1 ? { id: o.id, label: o.label + ' (#' + o.id + ')' } : o))
      .sort((a, b) => a.label.localeCompare(b.label, 'fr'));
  }

  const estCR = (cle, m) => cle === 'interactions' && m.id === related.interactions.cols.CR;

  function champEdition(cle, m, valeur, options, optionsCol) {
    const id = 'ed-' + m.id;
    const lbl = '<label for="' + H(id) + '">' + H(m.label || m.id) + '</label>';
    const base = m.type.split(':')[0];
    const cible = (/^Ref(?:List)?:(.+)$/.exec(m.type) || [])[1];
    if (estCR(cle, m)) {
      return '<div class="ed-field full"><label>' + H(m.label || 'Compte rendu') + '</label><div class="ed-rte">' +
        '<div class="ed-rte-bar">' + [['bold', 'G', 'Gras'], ['italic', 'I', 'Italique'], ['insertUnorderedList', '• Liste', 'Liste'], ['formatBlock:h3', 'Titre', 'Titre']]
          .map(([cmd, t, l]) => '<button type="button" data-rte="' + cmd + '" title="' + l + '">' + t + '</button>').join('') + '</div>' +
        '<div class="ed-cr" contenteditable="true" data-col="' + H(m.id) + '" data-kind="cr"></div></div></div>';
    }
    if (base === 'Bool') return '<div class="ed-field"><label class="ed-check"><input type="checkbox" id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="bool"' + (valeur ? ' checked' : '') + '> ' + H(m.label || m.id) + '</label></div>';
    if (base === 'Date') return '<div class="ed-field">' + lbl + '<input type="date" id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="date" value="' + H(valeur ? gristDateToInputValue(valeur) : '') + '"></div>';
    if (base === 'DateTime') {
      const v = valeur ? new Date(valeur * 1000 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
      return '<div class="ed-field">' + lbl + '<input type="datetime-local" id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="datetime" value="' + H(v) + '"></div>';
    }
    if (base === 'Numeric' || base === 'Int') return '<div class="ed-field">' + lbl + '<input type="number" step="' + (base === 'Int' ? '1' : 'any') + '" id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="' + (base === 'Int' ? 'int' : 'num') + '" value="' + H(valeur === null || valeur === undefined ? '' : valeur) + '"></div>';
    if (base === 'Choice') {
      const choix = m.choices.slice();
      if (valeur && !choix.includes(valeur)) choix.push(valeur);
      return '<div class="ed-field">' + lbl + '<select id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="choice"><option value="">—</option>' +
        choix.map(c => '<option' + (c === valeur ? ' selected' : '') + '>' + H(c) + '</option>').join('') + '</select></div>';
    }
    if (base === 'ChoiceList' || base === 'RefList') {
      return '<div class="ed-field">' + lbl.replace('<label for="' + H(id) + '">', '<label>') + msFilterMarkup(id, m.label || m.id, 'Aucun') +
        '<div class="ed-chips" id="ed-chips-' + H(m.id) + '"></div></div>';
    }
    if (base === 'Ref') {
      const opts = (optionsCol && optionsCol[m.id]) || options[cible] || [];
      return '<div class="ed-field">' + lbl + '<select id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="ref"><option value="0">—</option>' +
        opts.map(o => '<option value="' + o.id + '"' + (o.id === valeur ? ' selected' : '') + '>' + H(o.label) + '</option>').join('') + '</select></div>';
    }
    if (base === 'Attachments') {
      const n = attachmentIdsFromValue(valeur).length;
      return '<div class="ed-field"><label>' + H(m.label || m.id) + '</label><div class="es-muted" style="font-size:12.5px;padding-top:6px">' + n + ' fichier(s) — à gérer dans l’onglet Documents de la fiche.</div></div>';
    }
    // Texte : une zone sur plusieurs lignes pour les notes et descriptions.
    // Un texte sur plusieurs lignes (liens, notes) doit garder ses retours à la ligne.
    const long = /comment|note|descr|suite|detail|détail|journal|lien/i.test(m.id + ' ' + (m.label || '')) || /\n/.test(String(valeur || '')) || String(valeur || '').length > 80;
    return '<div class="ed-field' + (long ? ' full' : '') + '">' + lbl + (long
      ? '<textarea id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="text" rows="3">' + H(valeur || '') + '</textarea>'
      : '<input type="text" id="' + H(id) + '" data-col="' + H(m.id) + '" data-kind="text" value="' + H(valeur === null || valeur === undefined ? '' : formatValue(valeur)) + '">') + '</div>';
  }

  let editeur = null; // { cle, id, meta, initial, selects: { colId: { widget, parLabel } } }

  async function ouvrirEditeur(cle, id, defauts) {
    const tableId = tableDe(cle);
    if (!tableId) { toast('Table introuvable', true); return; }
    setStatus('Ouverture…');
    let meta;
    try { meta = await metaEdition(cle); } catch (err) { console.error(err); toast('Lecture impossible', true); setStatus(''); return; }
    setStatus('');
    const rec = id ? meta.records.find(r => r.id === id) : null;
    if (id && !rec) { toast('Ligne introuvable', true); return; }
    const valeurs = {};
    meta.cols.forEach(m => { valeurs[m.id] = rec ? rec[m.id] : ((defauts || {})[m.id] !== undefined ? defauts[m.id] : null); });
    const retour = ui.sheet && ui.sheet.kind !== 'edit' ? Object.assign({}, ui.sheet) : null;
    editeur = { cle, id: id || null, meta, valeurs, selects: {}, retour };
    ui.sheet = { kind: 'edit' };
    const nom = rec ? (cle === 'structures' ? nomS(id) : cle === 'contacts' ? (D.cById.get(id) || {}).name : cle === 'opportunites' ? (D.pById.get(id) || {}).title
      : [formatDate((D.eById.get(id) || {}).date), (D.eById.get(id) || {}).objet].filter(Boolean).join(' · ')) : '';
    const sheet = $('sheet');
    sheet.innerHTML = '<div class="es-sheet-head"><div class="es-sheet-top"><span class="es-badge">' + H(id ? 'Modifier ' + EDIT_TITRES[cle] : EDIT_NOUVEAU[cle]) + '</span>' +
      '<button type="button" class="es-btn icon close" data-ed-annuler aria-label="Fermer">✕</button></div>' +
      '<h2>' + H(nom || (id ? '' : EDIT_NOUVEAU[cle])) + '</h2></div>' +
      '<form class="es-sheet-body ed-form" id="ed-form"><div class="ed-grid">' + meta.cols.map(m => champEdition(cle, m, valeurs[m.id], meta.options, meta.optionsCol)).join('') + '</div>' +
      '<div class="ed-foot">' + (id ? '<button type="button" class="es-btn ed-suppr" data-ed-suppr>Supprimer</button>' : '') +
      '<span class="grow"></span><button type="button" class="es-btn" data-ed-annuler>Annuler</button><button type="submit" class="es-btn primary">Enregistrer</button></div></form>';
    sheet.classList.add('open'); $('backdrop').classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
    // Les listes à choix multiples et l'éditeur de compte rendu ne s'animent
    // qu'une fois dans la page.
    meta.cols.forEach(m => {
      const base = m.type.split(':')[0];
      if (base !== 'ChoiceList' && base !== 'RefList') return;
      const root = document.getElementById('ed-' + m.id);
      if (base === 'ChoiceList') {
        const courants = listeChoix(valeurs[m.id]);
        const choix = m.choices.concat(courants.filter(c => !m.choices.includes(c)));
        editeur.selects[m.id] = { kind: 'choicelist', widget: createMultiSelect(root, { values: choix, selected: courants, labelAll: 'Aucun', onChange: (sel) => pastilles(m.id, sel) }) };
        pastilles(m.id, courants);
      } else {
        const cible = m.type.split(':')[1];
        const opts = meta.optionsCol[m.id] || meta.options[cible] || [];
        const parLabel = new Map(opts.map(o => [o.label, o.id]));
        const ids = refIdsFromValue(valeurs[m.id]);
        const selected = opts.filter(o => ids.includes(o.id)).map(o => o.label);
        editeur.selects[m.id] = { kind: 'reflist', parLabel, widget: createMultiSelect(root, { values: opts.map(o => o.label), selected, labelAll: 'Aucun', onChange: (sel) => pastilles(m.id, sel) }) };
        pastilles(m.id, selected);
      }
    });
    const cr = sheet.querySelector('[data-kind="cr"]');
    if (cr) { cr.innerHTML = normalizeCrToHtml(valeurs[cr.dataset.col] || ''); resolveImagesIn(cr); }
    const premier = sheet.querySelector('.ed-form input[type="text"], .ed-form textarea');
    if (premier) premier.focus();
  }

  // Les valeurs retenues d'une liste multiple, en clair sous le bouton : « 1
  // sélectionné » ne dit pas lequel. Un clic sur la croix retire la valeur.
  function pastilles(col, valeurs) {
    const el = document.getElementById('ed-chips-' + col);
    if (!el) return;
    el.innerHTML = valeurs.map(v => '<span class="ed-chip">' + H(v) + '<button type="button" data-chip-retirer="' + H(col) + '" data-val="' + H(v) + '" aria-label="Retirer ' + H(v) + '">×</button></span>').join('');
  }

  // Ce que le formulaire contient, dans la forme que Grist attend pour chaque type.
  function lireFormulaire() {
    const form = $('ed-form');
    const out = {};
    form.querySelectorAll('[data-col]').forEach(el => {
      const col = el.dataset.col, k = el.dataset.kind;
      if (k === 'text') out[col] = el.value;
      else if (k === 'num') out[col] = el.value === '' ? null : Number(el.value);
      else if (k === 'int') out[col] = el.value === '' ? null : parseInt(el.value, 10);
      else if (k === 'date') out[col] = el.value ? inputValueToGristDate(el.value) : null;
      else if (k === 'datetime') out[col] = el.value ? Math.floor(new Date(el.value).getTime() / 1000) : null;
      else if (k === 'bool') out[col] = el.checked;
      else if (k === 'choice') out[col] = el.value;
      else if (k === 'ref') out[col] = Number(el.value) || 0;
      else if (k === 'cr') out[col] = serializeCrForSave(el);
    });
    Object.entries(editeur.selects).forEach(([col, s]) => {
      const sel = s.widget.getSelected();
      out[col] = s.kind === 'reflist' ? (sel.length ? ['L', ...sel.map(l => s.parLabel.get(l)).filter(Boolean)] : null) : (sel.length ? ['L', ...sel] : null);
    });
    return out;
  }

  // Seules les colonnes réellement changées partent : une valeur qu'on n'a pas
  // touchée n'est pas réécrite (et une formule d'initialisation reste en paix).
  function normaliserPourComparer(v) {
    if (v === null || v === undefined || v === '' || v === 0 || v === false) return '';
    if (Array.isArray(v)) return JSON.stringify(v[0] === 'L' ? v.slice(1) : v);
    return JSON.stringify(v);
  }

  async function enregistrerEditeur() {
    const { cle, id, valeurs } = editeur;
    const tableId = tableDe(cle);
    const saisie = lireFormulaire();
    const champs = {};
    Object.keys(saisie).forEach(col => {
      // Une création envoie tout ce qui est rempli, valeurs préremplies comprises ;
      // une modification, seulement ce qui a changé.
      const garde = id ? normaliserPourComparer(saisie[col]) !== normaliserPourComparer(valeurs[col]) : normaliserPourComparer(saisie[col]) !== '';
      if (garde) champs[col] = saisie[col];
    });
    if (id && !Object.keys(champs).length) { fermerEditeur(); return; }
    try {
      let nouvelId = id;
      if (id) await updateRecord(tableId, id, champs);
      else nouvelId = await addRecord(tableId, champs);
      const retour = editeur.retour;
      editeur = null;
      await charger(true);
      if (cle === 'structures' && !id && nouvelId) { voirStructure(nouvelId); }
      else if (!id && nouvelId && cle === 'opportunites') { ui.sheet = { kind: 'projet', id: nouvelId, tab: null }; render(); }
      else if (!id && nouvelId && cle === 'contacts') { ui.sheet = { kind: 'contact', id: nouvelId, tab: null }; render(); }
      else { ui.sheet = retour; render(); }
      setStatus(id ? 'Modifications enregistrées ✓' : 'Créé ✓');
    } catch (err) {
      console.error(err);
      toast('Enregistrement refusé par le document : ' + (err && err.message ? err.message : err), true);
    }
  }

  async function supprimerEditeur(bouton) {
    if (!bouton.dataset.arme) {
      bouton.dataset.arme = '1';
      bouton.textContent = 'Confirmer la suppression';
      return;
    }
    const { cle, id } = editeur;
    try {
      await removeRecord(tableDe(cle), id);
      editeur = null;
      ui.sheet = null;
      if (cle === 'structures') ui.partenaires.sel = null;
      await charger(true);
      render();
      setStatus('Supprimé');
    } catch (err) { console.error(err); toast('Suppression impossible', true); }
  }

  function fermerEditeur() {
    const retour = editeur && editeur.retour;
    editeur = null;
    ui.sheet = retour;
    renderSheet();
  }

  // Valeurs de départ d'une création, selon d'où on la lance.
  function defautsCreation(cle, contexte) {
    const d = {};
    const today = inputValueToGristDate(new Date().toISOString().slice(0, 10));
    const r = cle === 'structures' ? null : related[cle];
    const liste = (col, ids) => { if (col && ids && ids.length) d[col] = colValue(r, col, ids); };
    if (cle === 'interactions') {
      if (r.cols.Date) d[r.cols.Date] = today;
      if (contexte.structure) liste(r.cols.Partenaires, [contexte.structure]);
      if (contexte.projet) {
        const p = D.pById.get(contexte.projet);
        liste(r.cols.Opportunites, [contexte.projet]);
        if (p) liste(r.cols.Partenaires, p.partnerIds);
      }
      if (contexte.contact) {
        const col = colsVers('interactions', related.contacts.tableId)[0];
        liste(col, [contexte.contact]);
        const c = D.cById.get(contexte.contact);
        if (c && c.structureIds.length) liste(r.cols.Partenaires, c.structureIds.slice(0, 1));
      }
    } else if (cle === 'contacts' && contexte.structure) liste(r.cols.Structures, [contexte.structure]);
    else if (cle === 'opportunites') {
      if (contexte.structure) liste(r.cols.Partenaires, [contexte.structure]);
      if (r.cols.Statut && D.etapes.length) d[r.cols.Statut] = D.etapes[0];
      if (r.cols.DateDebut) d[r.cols.DateDebut] = today;
    }
    return d;
  }

  function renderSheet() {
    const s = ui.sheet;
    const sheet = $('sheet');
    if (!s || !D) { sheet.classList.remove('open'); $('backdrop').classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); return; }
    // Un formulaire en cours ne se redessine pas : on perdrait la saisie.
    if (s.kind === 'edit') { if (!editeur) { ui.sheet = null; renderSheet(); } return; }
    let f = null;
    if (s.kind === 'projet' && D.pById.has(s.id)) f = ficheProjet(D.pById.get(s.id), s.tab || 'general');
    else if (s.kind === 'structure' && D.sById.has(s.id)) f = ficheStructure(D.sById.get(s.id), s.tab || 'projets');
    else if (s.kind === 'contact' && D.cById.has(s.id)) f = ficheContact(D.cById.get(s.id), s.tab || 'echanges');
    else if (s.kind === 'action' && D.aById.has(s.id)) f = ficheAction(D.aById.get(s.id));
    else if (s.kind === 'echange' && D.eById.has(s.id)) f = ficheEchange(D.eById.get(s.id), s.retour);
    else if (s.kind === 'depense' && F) { const d = F.depenses.find(x => x.id === s.id); if (d) f = ficheDepense(d); }
    if (!f) { ui.sheet = null; return renderSheet(); }
    const actif = s.tab || (f.tabs[0] || [])[0];
    sheet.innerHTML = '<div class="es-sheet-head">' + f.head + '</div>' +
      (f.tabs.length ? '<div class="es-sheet-tabs">' + f.tabs.map(([k, l, n]) => '<button type="button" data-tab="' + k + '" class="' + (k === actif ? 'on' : '') + '">' + H(l) +
        (n !== undefined ? '<span class="n">' + n + '</span>' : '') + '</button>').join('') + '</div>' : '') +
      '<div class="es-sheet-body">' + f.body + '</div>';
    sheet.classList.add('open'); $('backdrop').classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
    remplirComptesRendus();
  }

  function voirStructure(id) {
    const s = D.sById.get(id);
    if (!s) return;
    const f = ui.partenaires;
    f.mode = 'fiche'; f.sel = id; f.toutDeplier = false;
    // La structure doit figurer dans la liste filtrée, sinon la fiche retomberait sur la première.
    if (!structuresFiltrees().some(x => x.id === id)) { f.filtre = 'tous'; f.type = ''; f.q = ''; }
    ui.vue = 'partenaires'; ui.sheet = null;
    render();
    const item = document.querySelector('.pa-item.on');
    if (item) item.scrollIntoView({ block: 'nearest' });
    $('main').scrollTop = 0;
  }

  function ouvrir(ref) {
    const [kind, id] = String(ref).split(':');
    // Une structure s'ouvre dans sa fiche complète, onglet Partenaires.
    if (kind === 'structure') { voirStructure(Number(id)); return; }
    // Le lecteur de compte rendu garde la fiche d'où l'on vient, pour y revenir.
    const retour = kind === 'echange' && ui.sheet && ui.sheet.kind !== 'edit' && ui.sheet.kind !== 'echange' ? Object.assign({}, ui.sheet) : null;
    ui.sheet = { kind, id: Number(id), tab: null, retour };
    renderSheet();
  }

  // ---------------------------------------------------------------------
  // Vue : finance (suivi budgétaire, import SIFAC)
  // ---------------------------------------------------------------------
  // Trois tables facultatives (Budget_lignes, Depenses, Sifac_lignes), dont
  // les colonnes portent les noms fixés par finance.js : c'est l'espace qui
  // les crée, il n'a pas à deviner leur nom.
  const FN = window.finance;
  let F = null; // { tables: { budget, depenses, ecritures }, budget, depenses, ecritures, colsManquantes }

  async function chargerFinance(force) {
    const tables = {};
    const colsManquantes = [];
    for (const cle of Object.keys(FN.FIN_TABLES)) {
      const def = FN.FIN_TABLES[cle];
      if (force) invalidateTableCache(def.tableId);
      try {
        const data = await fetchTableCached(def.tableId);
        const presentes = dataColumns(data);
        def.colonnes.forEach(c => { if (!presentes.includes(c.id)) colsManquantes.push(def.tableId + '.' + c.id); });
        tables[cle] = { tableId: def.tableId, records: recordsFromTableData(data), cols: presentes };
      } catch (err) { tables[cle] = null; }
    }
    const rec = (cle) => (tables[cle] ? tables[cle].records : []);
    const num = (v) => Number(v) || 0;
    const ref = (v) => (typeof v === 'number' && v > 0 ? v : null);
    const budget = rec('budget').map(r => ({
      id: r.id, libelle: txt(r.Libelle) || 'Sans libellé', exercice: num(r.Exercice) || null,
      categorie: txt(r.Categorie), prevu: num(r.Montant_prevu), financeur: txt(r.Financeur), pfi: txt(r.PFI), notes: txt(r.Notes)
    }));
    const depenses = rec('depenses').map(r => ({
      id: r.id, flux: txt(r.Flux), libelle: txt(r.Libelle), fournisseur: txt(r.Fournisseur), codeTiers: txt(r.Code_tiers),
      compte: txt(r.Compte), libelleCompte: txt(r.Libelle_compte), categorie: txt(r.Categorie), statut: txt(r.Statut),
      montant: num(r.Montant), engage: num(r.Montant_engage), facture: num(r.Montant_facture), paye: num(r.Montant_paye),
      dateEngagement: r.Date_engagement || null, dateFacture: r.Date_facture || null, datePaiement: r.Date_paiement || null,
      pfi: txt(r.PFI), otp: txt(r.OTP), source: txt(r.Source) || 'Manuelle', orpheline: !!r.Orpheline,
      budgetLigne: ref(r.Budget_ligne), projet: ref(r.Opportunite), notes: txt(r.Notes)
    }));
    const ecritures = rec('ecritures').map(r => ({
      id: r.id, pfi: txt(r.PFI), exercice: num(r.Exercice) || null, flux: txt(r.Flux), libelleFlux: txt(r.Libelle_flux),
      rubrique: txt(r.Rubrique), tiers: txt(r.Tiers), codeTiers: txt(r.Code_tiers), compte: txt(r.Compte),
      libelleCompte: txt(r.Libelle_compte), compteExecution: txt(r.Compte_execution), otp: txt(r.OTP),
      dateEngagement: r.Date_engagement || null, engage: num(r.Montant_engage), serviceFait: num(r.Montant_service_fait),
      dateServiceFait: r.Date_service_fait || null, numFacture: txt(r.Num_facture), dateFacture: r.Date_facture || null,
      facture: num(r.Montant_facture), paye: num(r.Montant_paye), datePaiement: r.Date_paiement || null, report: num(r.Report)
    }));
    // Les exercices qu'une dépense touche : ceux de ses écritures, ou l'année
    // de sa première date pour une dépense saisie à la main.
    const exercicesFlux = new Map();
    ecritures.forEach(e => {
      const k = e.pfi + '|' + e.flux;
      if (!exercicesFlux.has(k)) exercicesFlux.set(k, new Set());
      if (e.exercice) exercicesFlux.get(k).add(e.exercice);
    });
    depenses.forEach(d => {
      const s = exercicesFlux.get(d.pfi + '|' + d.flux);
      const an = (ts) => (ts ? new Date(ts * 1000).getUTCFullYear() : null);
      d.exercices = s && s.size ? Array.from(s) : [an(d.dateEngagement || d.dateFacture || d.datePaiement)].filter(Boolean);
    });
    F = { tables, budget, depenses, ecritures, colsManquantes, bById: new Map(budget.map(b => [b.id, b])) };
  }

  function exercicesConnus() {
    const s = new Set([new Date().getFullYear()]);
    F.budget.forEach(b => { if (b.exercice) s.add(b.exercice); });
    F.ecritures.forEach(e => { if (e.exercice) s.add(e.exercice); });
    F.depenses.forEach(d => d.exercices.forEach(a => s.add(a)));
    return Array.from(s).sort((a, b) => b - a);
  }
  const eur = (n) => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const eur2 = (n) => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
  const pct = (x) => (x === null || x === undefined ? '—' : Math.round(x * 100) + ' %');
  const STATUT_COULEUR = { 'Engagé': '#f59e0b', 'Livré': '#3b82f6', 'Payé': '#16a34a' };
  const CAT_COULEUR = { Personnel: '#8c62b3', Fonctionnement: '#4fa5d8', Investissement: '#4cae8c' };
  function badgeStatutDepense(s) {
    return s ? '<span class="es-badge"><i style="background:' + (STATUT_COULEUR[s] || '#94a3b8') + '"></i>' + H(s) + '</span>' : '';
  }
  function jauge(taux) {
    if (taux === null || taux === undefined) return '<span class="es-muted">—</span>';
    const w = Math.min(100, taux * 100);
    const coul = taux > 1 ? 'var(--es-late)' : taux > 0.9 ? 'var(--es-warn)' : 'var(--sequoia-green)';
    return '<span class="fi-jauge" title="' + pct(taux) + '"><span style="width:' + w.toFixed(1) + '%;background:' + coul + '"></span></span> <span class="fi-pct">' + pct(taux) + '</span>';
  }

  function financeFiltresPfi(liste, champ) {
    const pfi = ui.finance.pfi;
    return pfi ? liste.filter(x => (x[champ || 'pfi'] || '') === pfi) : liste;
  }

  function vueFinance() {
    const f = ui.finance;
    const manquantes = Object.keys(FN.FIN_TABLES).filter(k => !F.tables[k]);
    const exos = exercicesConnus();
    if (!f.exercice || !exos.includes(Number(f.exercice))) f.exercice = exos.includes(new Date().getFullYear()) ? new Date().getFullYear() : exos[0];
    const pfis = Array.from(new Set(F.budget.map(b => b.pfi).concat(F.ecritures.map(e => e.pfi), F.depenses.map(d => d.pfi)).filter(Boolean))).sort();
    const toolbar = '<div class="es-toolbar"><h1>Finance</h1>' +
      '<select class="es-select" data-set="finance.exercice" aria-label="Exercice">' + exos.map(a => '<option value="' + a + '"' + (Number(f.exercice) === a ? ' selected' : '') + '>Exercice ' + a + '</option>').join('') + '</select>' +
      (pfis.length > 1 ? '<select class="es-select" data-set="finance.pfi" aria-label="PFI"><option value="">Tous les PFI</option>' + pfis.map(p => '<option' + (p === f.pfi ? ' selected' : '') + '>' + H(p) + '</option>').join('') + '</select>' : '') +
      '<span class="grow"></span><div class="es-seg">' + [['synthese', 'Synthèse'], ['depenses', 'Dépenses'], ['ecritures', 'Écritures SIFAC'], ['import', 'Import SIFAC']].map(([k, l]) =>
        '<button type="button" data-set="finance.sous" data-val="' + k + '" class="' + (f.sous === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
    let alerte = '';
    if (manquantes.length) {
      alerte = '<div class="es-card fi-setup"><div class="es-card-head"><h3>Mettre en place l’espace Finance</h3></div><div class="es-card-body">' +
        '<p>Le suivi budgétaire s’appuie sur trois tables du document. ' + (manquantes.length === 3 ? 'Aucune n’existe encore.' : 'Il en manque ' + manquantes.length + '.') + '</p><ul>' +
        Object.keys(FN.FIN_TABLES).map(k => { const t = FN.FIN_TABLES[k]; return '<li><b>' + H(t.tableId) + '</b> — ' + H(t.titre) + (F.tables[k] ? ' <span class="es-muted">(présente)</span>' : '') + '</li>'; }).join('') +
        '</ul><button type="button" class="es-btn primary" data-fin-creer>Créer les tables manquantes</button> <span class="es-muted" style="font-size:12px">Ajoute ' + manquantes.length + ' table(s) au document, avec leurs colonnes. Rien d’existant n’est modifié.</span></div></div>';
    } else if (F.colsManquantes.length) {
      alerte = '<div class="es-card fi-setup warn"><div class="es-card-body">Colonnes attendues absentes du document : <b>' + H(F.colsManquantes.join(', ')) +
        '</b>. Les écritures qui les visent échoueront ; ajoutez-les dans Grist (même identifiant).</div></div>';
    }
    let corps = '';
    if (!manquantes.length) {
      corps = f.sous === 'depenses' ? financeDepenses() : f.sous === 'ecritures' ? financeEcritures() : f.sous === 'import' ? financeImport() : financeSynthese();
    }
    return '<div class="es-inner">' + toolbar + alerte + corps + '</div>';
  }

  function courbeFinance(exo, budgetTotal) {
    const ecr = financeFiltresPfi(F.ecritures);
    const man = financeFiltresPfi(F.depenses).filter(d => d.source !== 'SIFAC');
    const src = ecr.concat(man.map(d => ({ dateEngagement: d.dateEngagement, engage: d.engage, datePaiement: d.datePaiement, paye: d.paye })));
    const eng = FN.cumulMensuel(src, exo, 'dateEngagement', 'engage', nowTs());
    const pay = FN.cumulMensuel(src, exo, 'datePaiement', 'paye', nowTs());
    const W = 560, Hh = 200, pl = 8, pr = 8, pt = 12, pb = 22;
    const max = Math.max(1, budgetTotal, ...eng.filter(v => v !== null), ...pay.filter(v => v !== null)) * 1.08;
    const x = (i) => pl + (i + 0.5) * (W - pl - pr) / 12;
    const y = (v) => pt + (Hh - pt - pb) * (1 - v / max);
    const trace = (serie, coul, tiret) => {
      const pts = serie.map((v, i) => (v === null ? null : x(i).toFixed(1) + ',' + y(v).toFixed(1))).filter(Boolean);
      return pts.length ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + coul + '" stroke-width="2.4"' + (tiret ? ' stroke-dasharray="5 4"' : '') + '/>' +
        serie.map((v, i) => (v === null ? '' : '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.6" fill="' + coul + '"><title>' + H(ESPACE_MOIS_COURTS[i] + ' : ' + eur(v)) + '</title></circle>')).join('') : '';
    };
    const ligneBudget = budgetTotal > 0 ? '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(budgetTotal).toFixed(1) + '" y2="' + y(budgetTotal).toFixed(1) +
      '" stroke="var(--es-late)" stroke-dasharray="3 4" opacity=".7"/><text x="' + (W - pr) + '" y="' + (y(budgetTotal) - 4).toFixed(1) + '" text-anchor="end">budget ' + H(formatMontantCompact(budgetTotal)) + '</text>' : '';
    return '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="Consommation cumulée">' +
      '<line x1="0" x2="' + W + '" y1="' + (Hh - pb) + '" y2="' + (Hh - pb) + '" stroke="var(--border)"/>' + ligneBudget +
      trace(eng, '#f59e0b', true) + trace(pay, 'var(--sequoia-green)') +
      ESPACE_MOIS_COURTS.map((m, i) => '<text x="' + x(i).toFixed(1) + '" y="' + (Hh - 6) + '" text-anchor="middle">' + H(m) + '</text>').join('') + '</svg>' +
      '<div class="es-graph-legend" style="padding:6px 0 0"><span><i style="background:#f59e0b"></i>Engagé cumulé</span><span><i style="background:var(--sequoia-green)"></i>Payé cumulé</span>' +
      (budgetTotal > 0 ? '<span><i style="background:var(--es-late)"></i>Budget prévu</span>' : '') + '</div>';
  }

  function financeSynthese() {
    const exo = Number(ui.finance.exercice);
    const budget = financeFiltresPfi(F.budget).filter(b => b.exercice === exo);
    const depensesExo = financeFiltresPfi(F.depenses).filter(d => d.exercices.includes(exo));
    const t = FN.totauxExercice(financeFiltresPfi(F.ecritures), financeFiltresPfi(F.depenses).filter(d => d.source !== 'SIFAC'), exo);
    const prevu = budget.reduce((s, b) => s + b.prevu, 0);
    const cons = FN.consommationBudget(budget, depensesExo);
    const orphelines = depensesExo.filter(d => d.orpheline).length;
    const kpi = (lbl, val, sub, cls) => '<div class="es-card es-kpi"><div class="lbl">' + H(lbl) + '</div><div class="val">' + val + '</div><div class="sub' + (cls ? ' ' + cls : '') + '">' + sub + '</div></div>';
    const kpis = '<div class="es-kpis">' +
      kpi('Budget prévu', H(eur(prevu)), H(budget.length + ' ligne(s) budgétaire(s)')) +
      kpi('Engagé', H(eur(t.engage)), (prevu ? jauge(t.engage / prevu) : 'commandes et engagements') + (t.report ? '<br>dont ' + H(eur(t.report)) + ' de reports' : '')) +
      kpi('Facturé', H(eur(t.facture)), 'service fait et facturé') +
      kpi('Payé', H(eur(t.paye)), prevu ? pct(t.paye / prevu) + ' du budget' : 'décaissé') +
      kpi('Reste à engager', H(eur(prevu - t.engage)), prevu - t.engage < 0 ? 'dépassement' : 'budget − engagé', prevu - t.engage < 0 ? 'alerte' : '') +
      '</div>';
    // Par catégorie : prévu / engagé / payé côte à côte.
    const cats = FN.FIN_CATEGORIES.map(c => ({ c, prevu: budget.filter(b => b.categorie === c).reduce((s, b) => s + b.prevu, 0), ...t.parCategorie[c] }));
    const maxC = Math.max(1, ...cats.map(c => Math.max(c.prevu, c.engage)));
    const catsHtml = cats.map(c => '<div class="fi-cat"><div class="fi-cat-head"><i style="background:' + CAT_COULEUR[c.c] + '"></i><b>' + H(c.c) + '</b><span>' +
      H(eur(c.engage)) + ' engagé' + (c.prevu ? ' / ' + H(eur(c.prevu)) + ' prévu' : '') + '</span></div>' +
      '<div class="fi-bars"><div class="fi-bar prevu" style="width:' + (c.prevu / maxC * 100).toFixed(1) + '%" title="Prévu ' + H(eur(c.prevu)) + '"></div>' +
      '<div class="fi-bar engage" style="width:' + (c.engage / maxC * 100).toFixed(1) + '%;background:' + CAT_COULEUR[c.c] + '99" title="Engagé ' + H(eur(c.engage)) + '"></div>' +
      '<div class="fi-bar paye" style="width:' + (c.paye / maxC * 100).toFixed(1) + '%;background:' + CAT_COULEUR[c.c] + '" title="Payé ' + H(eur(c.paye)) + '"></div></div></div>').join('');
    const lignesHtml = '<div class="es-table-wrap"><table class="es-table fi-table"><thead><tr><th>Ligne budgétaire</th><th>Catégorie</th><th class="num">Prévu</th><th class="num">Engagé</th><th class="num">Payé</th><th class="num">Reste</th><th>Consommation</th><th></th></tr></thead><tbody>' +
      (cons.lignes.length ? cons.lignes.map(l => '<tr data-fin-ligne="' + l.ligne.id + '"><td class="ttl">' + H(l.ligne.libelle) + (l.ligne.financeur ? '<div class="es-muted" style="font-weight:400;font-size:12px">' + H(l.ligne.financeur) + '</div>' : '') +
        '</td><td>' + H(l.ligne.categorie) + '</td><td class="num">' + H(eur(l.ligne.prevu)) + '</td><td class="num">' + H(eur(l.engage)) + '</td><td class="num">' + H(eur(l.paye)) +
        '</td><td class="num' + (l.reste < 0 ? ' fi-neg' : '') + '">' + H(eur(l.reste)) + '</td><td>' + jauge(l.taux) + '</td><td><button type="button" class="es-x" data-fin-suppr-ligne="' + l.ligne.id + '" aria-label="Supprimer la ligne">×</button></td></tr>').join('')
        : '<tr><td colspan="8" class="es-empty">Aucune ligne budgétaire pour ' + exo + '. Ajoutez-en une ci-dessous.</td></tr>') +
      '</tbody></table></div>' +
      '<form class="es-form" data-fin-ajout-ligne><input class="grow" name="libelle" placeholder="Nouvelle ligne (ex. Missions, Équipement GPU…)" required>' +
      '<select class="es-select" name="categorie">' + FN.FIN_CATEGORIES.map(c => '<option' + (c === 'Fonctionnement' ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' +
      '<input name="prevu" type="number" min="0" step="100" placeholder="Montant prévu" required style="width:140px"><input name="financeur" placeholder="Financeur" style="width:140px">' +
      '<button class="es-btn primary" type="submit">Ajouter à ' + exo + '</button></form>';
    const aTrier = cons.nonAffectees.nb
      ? '<div class="fi-trier"><b>' + cons.nonAffectees.nb + ' dépense(s)</b> de ' + exo + ' (' + H(eur(cons.nonAffectees.montant)) + ') ne sont rattachées à aucune ligne budgétaire. ' +
        '<button type="button" class="es-btn" data-fin-voir="non-affectees">Les trier</button></div>' : '';
    const orph = orphelines ? '<div class="fi-trier warn"><b>' + orphelines + ' dépense(s)</b> ne figurent plus dans le dernier export SIFAC (annulées ou déplacées ?). <button type="button" class="es-btn" data-fin-voir="orphelines">Voir</button></div>' : '';
    const top = FN.topFournisseurs(depensesExo, 8);
    const maxT = Math.max(1, ...top.map(x => x.montant));
    const topHtml = top.length ? top.map(x => '<div class="es-hbar"><span class="nom" title="' + H(x.nom) + '">' + H(x.nom) + '</span><div class="track"><div class="fill" style="width:' +
      (x.montant / maxT * 100).toFixed(1) + '%;background:#9cc3ab"></div></div><span class="n" style="width:auto">' + H(formatMontantCompact(x.montant)) + '</span></div>').join('') : '<div class="es-empty">Aucune dépense.</div>';
    return kpis + aTrier + orph +
      '<div class="es-grid-2"><div class="es-card es-chart"><div class="es-card-head"><h3>Consommation ' + exo + '</h3><span class="aside">cumul mois par mois</span></div><div class="es-card-body">' + courbeFinance(exo, prevu) + '</div></div>' +

  // ---- Import ----
  let apercu = null; // { nomFichier, pfi, exercice, ecritures, avertissements }

  function planImport(a) {
    // Les écritures du même PFI sur les autres exercices restent en place ; celles
    // de l'exercice importé sont remplacées. Les dépenses sont recalculées sur
    // l'ensemble, pour qu'un report d'un exercice sur l'autre retombe sur le même flux.
    const remplacees = F.ecritures.filter(e => e.pfi === a.pfi && e.exercice === Number(a.exercice));
    const autres = F.ecritures.filter(e => e.pfi === a.pfi && e.exercice !== Number(a.exercice));
    const agregats = FN.agregerParFlux(autres.concat(a.ecritures));
    const rappro = FN.rapprocher(agregats, F.depenses, a.pfi);
    return { remplacees, agregats, rappro };
  }

  function financeImport() {
    const intro = '<div class="es-card"><div class="es-card-body fi-import">' +
      '<h3 style="margin:0 0 6px;font-size:15px">Importer un export SIFAC</h3>' +
      '<p class="es-muted" style="margin:0 0 12px;font-size:13px">Un fichier par PFI et par exercice, au format Excel (.xlsx) ou CSV : l’état des dépenses du PFI tel que SIFAC l’exporte. ' +
      'Réimporter le même PFI sur le même exercice remplace ses écritures ; les rattachements faits à la main (ligne budgétaire, projet, notes) sont conservés.</p>' +
      '<label class="fi-drop"><input type="file" id="fin-fichier" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>' +

    return intro + '<div class="es-card"><div class="es-card-head"><h3>Aperçu — ' + H(apercu.nomFichier) + '</h3></div><div class="es-card-body">' +
      '<div class="es-info fi-info"><div><span>PFI</span><b>' + H(apercu.pfi) + '</b></div><div><span>Exercice</span><b><input type="number" id="fin-exo" value="' + H(apercu.exercice) + '" min="2000" max="2100" style="width:90px;font:inherit;font-weight:600;border:1px solid var(--border);border-radius:6px;padding:2px 6px"></b></div>' +
      '<div><span>Écritures lues</span><b>' + apercu.ecritures.length + '</b></div><div><span>Flux</span><b>' + new Set(apercu.ecritures.map(e => e.flux)).size + '</b></div>' +
      '<div><span>Engagé / facturé</span><b>' + H(eur(somme('engage'))) + ' / ' + H(eur(somme('facture'))) + '</b></div><div><span>Payé</span><b>' + H(eur(somme('paye'))) + '</b></div></div>' +
      '<ul class="fi-plan"><li><b>' + p.remplacees.length + '</b> écriture(s) déjà présentes pour ' + H(apercu.pfi) + ' / ' + H(apercu.exercice) + ' seront remplacées par les <b>' + apercu.ecritures.length + '</b> du fichier.</li>' +
      '<li><b>' + p.rappro.aCreer.length + '</b> nouvelle(s) dépense(s), <b>' + p.rappro.aMettreAJour.length + '</b> mise(s) à jour.</li>' +
      (p.rappro.orphelines.length ? '<li><b>' + p.rappro.orphelines.length + '</b> dépense(s) absentes de SIFAC seront signalées (jamais supprimées).</li>' : '') + '</ul>' +
      (apercu.avertissements.length ? '<div class="fi-trier warn">' + apercu.avertissements.map(H).join('<br>') + '</div>' : '') +
      '<div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="es-btn primary" data-fin-importer>Importer</button><button type="button" class="es-btn" data-fin-annuler>Annuler</button></div>' +

  }

  async function lireFichier(fichier) {
    const nom = fichier.name || 'fichier';
    try {
      let lignes;
      if (/\.csv$/i.test(nom) || fichier.type === 'text/csv') lignes = FN.lireCsv(await fichier.text());
      else {
        if (typeof window.readXlsxFile !== 'function') throw new Error('Lecteur Excel indisponible — exportez en CSV.');
        lignes = await window.readXlsxFile(fichier);
      }
      const lu = FN.lireExportSifac(lignes);
      apercu = Object.assign({ nomFichier: nom }, lu);
    } catch (err) {
      apercu = { nomFichier: nom, erreur: err && err.message ? err.message : String(err) };
    }
    render();
  }

  async function importer() {
    if (!apercu || apercu.erreur) return;
    const exo = Number(apercu.exercice);
    if (!exo) { toast('Exercice invalide', true); return; }
    const p = planImport(apercu);
    const tE = FN.FIN_TABLES.ecritures.tableId, tD = FN.FIN_TABLES.depenses.tableId;
    const actions = [];
    if (p.remplacees.length) actions.push(['BulkRemoveRecord', tE, p.remplacees.map(e => e.id)]);
    const nouvelles = apercu.ecritures.map(e => FN.champsEcriture(e, exo));
    if (nouvelles.length) actions.push(['BulkAddRecord', tE, nouvelles.map(() => null), FN.enColonnes(nouvelles)]);
    const aCreer = p.rappro.aCreer.map(FN.champsSifac);
    if (aCreer.length) actions.push(['BulkAddRecord', tD, aCreer.map(() => null), FN.enColonnes(aCreer)]);
    const maj = p.rappro.aMettreAJour.map(u => FN.champsSifac(u.agregat));
    if (maj.length) actions.push(['BulkUpdateRecord', tD, p.rappro.aMettreAJour.map(u => u.id), FN.enColonnes(maj)]);
    if (p.rappro.orphelines.length) actions.push(['BulkUpdateRecord', tD, p.rappro.orphelines, { Orpheline: p.rappro.orphelines.map(() => true) }]);
    setStatus('Import en cours…');
    try {
      // Une seule transaction : un échec ne laisse jamais un exercice à moitié remplacé.
      await grist.docApi.applyUserActions(actions);
      apercu = null;
      await chargerFinance(true);
      ui.finance.exercice = exo;
      ui.finance.sous = 'synthese';
      render();
      setStatus('Import terminé ✓');
      toast('Import terminé : ' + nouvelles.length + ' écritures, ' + aCreer.length + ' nouvelles dépenses, ' + maj.length + ' mises à jour');
    } catch (err) {
      console.error(err);
      toast('Import refusé par le document : ' + (err && err.message ? err.message : err), true);
      setStatus('');
    }
  }

  function render() {

    renderTop();
    const vues = { dashboard: vueDashboard, projets: vueProjets, partenaires: vuePartenaires, contacts: vueContacts, actions: vueActions, finance: vueFinance };
    const main = $('main');
    const focus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.q;
    const caret = focus ? document.activeElement.selectionStart : null;
    main.innerHTML = (vues[ui.vue] || vueDashboard)();
    if (focus) {
      const champ = main.querySelector('[data-q="' + focus + '"]');

    if (ui.vue === 'partenaires') remplirComptesRendus();
    renderSheet();

  async function ecrire(tableId, rowId, fields, msg) {
    try {
      await updateRecord(tableId, rowId, fields);
      await charger(false);
      render();
      setStatus(msg || 'Enregistré ✓');
    } catch (err) {
      console.error(err);
      setStatus('Enregistrement impossible');
      toast('Enregistrement impossible : ' + (err && err.message ? err.message : err), true);

  function basculerFaite(id, fait) {
    const ac = related.actions;
    if (!ac.cols.Fait) return;
    const fields = { [ac.cols.Fait]: fait };
    if (ac.cols.FaitLe) fields[ac.cols.FaitLe] = fait ? inputValueToGristDate(new Date().toISOString().slice(0, 10)) : null;
    ecrire(ac.tableId, id, fields, fait ? 'Action faite ✓' : 'Action rouverte');
  }
  function deplacerProjet(id, etape) {
    const op = related.opportunites;
    const p = D.pById.get(id);
    if (!op.cols.Statut || !p || p.stage === etape || etape === 'Sans étape') return;
    ecrire(op.tableId, id, { [op.cols.Statut]: etape }, 'Étape : ' + etape);
  }
  function deplacerAction(id, statut) {
    const ac = related.actions;
    const a = D.aById.get(id);
    if (!ac.cols.Statut || !a || a.statut === statut) return;
    ecrire(ac.tableId, id, { [ac.cols.Statut]: statut === 'Sans statut' ? '' : statut }, 'Statut : ' + statut);
  }
  async function ajouterAction(projetId, label, due) {
    const ac = related.actions;
    const p = D.pById.get(projetId);
    if (!ac.tableId || !p) return;
    const fields = {};
    if (ac.cols.Intitule) fields[ac.cols.Intitule] = label;
    if (ac.cols.Echeance && due) fields[ac.cols.Echeance] = inputValueToGristDate(due);
    if (ac.cols.Opportunite) fields[ac.cols.Opportunite] = colValue(ac, ac.cols.Opportunite, [projetId]);
    if (ac.cols.Partenaires && p.partnerIds.length) fields[ac.cols.Partenaires] = colValue(ac, ac.cols.Partenaires, p.partnerIds);
    if (ac.cols.Contacts && moi()) fields[ac.cols.Contacts] = colValue(ac, ac.cols.Contacts, [moi().id]);
    try {
      await addRecord(ac.tableId, fields);
      await charger(false);
      render();
      setStatus('Action ajoutée ✓');
    } catch (err) { console.error(err); toast('Ajout impossible', true); }
  }
  async function ajouterActionStructure(structureId, label, due) {
    const ac = related.actions;
    if (!ac.tableId) return;
    const fields = {};
    if (ac.cols.Intitule) fields[ac.cols.Intitule] = label;
    if (ac.cols.Echeance && due) fields[ac.cols.Echeance] = inputValueToGristDate(due);
    if (ac.cols.Partenaires) fields[ac.cols.Partenaires] = colValue(ac, ac.cols.Partenaires, [structureId]);
    if (ac.cols.Contacts && moi()) fields[ac.cols.Contacts] = colValue(ac, ac.cols.Contacts, [moi().id]);
    try {
      await addRecord(ac.tableId, fields);
      await charger(false);
      render();
      setStatus('Action ajoutée ✓');
    } catch (err) { console.error(err); toast('Ajout impossible', true); }
  }

  function enregistrerLiens(projetId, liens) {
    const op = related.opportunites;
    if (!op.cols.Liens) return;
    ecrire(op.tableId, projetId, { [op.cols.Liens]: E.ecrireLiens(liens) }, 'Liens enregistrés ✓');
  }

  // ---------------------------------------------------------------------
  // Événements (délégués)
  // ---------------------------------------------------------------------
  function poser(chemin, valeur) {
    const [vue, cle] = chemin.split('.');
    ui[vue][cle] = valeur;
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    const hors = !t.closest('.es-pop') && !t.closest('#btn-moi') && !t.closest('#btn-cloche');
    if (hors) fermerPop();

    if (t.closest('#btn-moi')) {
      if ($('pop-host').innerHTML) return fermerPop();
      ouvrirPop(popProfil(''), $('btn-moi'));
      const q = $('pop-q'); if (q) q.focus();
      return;
    }
    if (t.closest('#btn-cloche')) {
      if ($('pop-host').innerHTML) return fermerPop();
      ouvrirPop(popAlertes(), $('btn-cloche'));
      return;
    }
    if (t.closest('#btn-refresh')) { charger(true).then(() => { render(); setStatus('À jour ✓'); }); return; }
    const moiBtn = t.closest('[data-moi]');
    if (moiBtn) {
      moiId = Number(moiBtn.dataset.moi) || null;
      ecrireLocal('moi', moiId);
      fermerPop(); render(); return;
    }
    const alerte = t.closest('[data-alerte]');
    if (alerte) {
      const id = alerte.dataset.alerte;
      if (!alertesVues.includes(id)) { alertesVues = alertesVues.concat(id).slice(-300); ecrireLocal('alertes-vues', alertesVues); }
      fermerPop();
      const [kind, rid] = id.split(':');
      ouvrir((kind === 'projet' ? 'projet:' : 'action:') + rid);
      renderTop();
      return;
    }
    const tab = t.closest('.es-tab');
    if (tab) { ui.vue = tab.dataset.vue; ui.sheet = null; render(); $('main').scrollTop = 0; return; }
    const kpiVue = t.closest('.es-kpi[data-vue]');
    if (kpiVue) { ui.vue = kpiVue.dataset.vue; render(); return; }
    if (t.closest('[data-close]') || t === $('backdrop')) { if (editeur) fermerEditeur(); else { ui.sheet = null; renderSheet(); } return; }
    const onglet = t.closest('.es-sheet-tabs [data-tab]');
    if (onglet) { ui.sheet.tab = onglet.dataset.tab; renderSheet(); return; }
    const copier = t.closest('[data-copier]');
    if (copier) { copierTexte(copier.dataset.copier).then(() => toast('Copié ✓')); return; }
    const suppr = t.closest('[data-suppr-lien]');
    if (suppr && ui.sheet) {
      const p = D.pById.get(ui.sheet.id);
      enregistrerLiens(p.id, p.liens.filter((_, i) => i !== Number(suppr.dataset.supprLien)));
      return;
    }
    if (t.matches('[data-fait]')) return; // géré par « change »
    if (t.closest('[data-ed-annuler]')) { fermerEditeur(); return; }
    if (t.closest('[data-retour]') && ui.sheet && ui.sheet.retour) { ui.sheet = ui.sheet.retour; renderSheet(); return; }
    const chip = t.closest('[data-chip-retirer]');
    if (chip && editeur) {
      const sel = editeur.selects[chip.dataset.chipRetirer];
      const reste = sel.widget.getSelected().filter(v => v !== chip.dataset.val);
      sel.widget.setSelected(reste);
      pastilles(chip.dataset.chipRetirer, reste);
      return;
    }
    const docCol = t.closest('[data-doc-colonne]');
    if (docCol) { ajouterColonneProjet(docCol.dataset.docColonne); return; }
    const retirer = t.closest('[data-doc-retirer]');
    if (retirer && ui.sheet) {
      const p = D.pById.get(ui.sheet.id);
      if (!retirer.dataset.arme) { retirer.dataset.arme = '1'; retirer.textContent = 'Retirer ?'; retirer.classList.add('arme'); return; }
      const reste = p.docs.filter(x => String(x) !== retirer.dataset.docRetirer);
      ecrire(related.opportunites.tableId, p.id, { [colDocuments()]: reste.length ? ['L', ...reste] : null }, 'Fichier retiré du projet');
      return;
    }
    const suppr2 = t.closest('[data-ed-suppr]');
    if (suppr2) { supprimerEditeur(suppr2); return; }
    const rte = t.closest('[data-rte]');
    if (rte) {
      const [cmd, arg] = rte.dataset.rte.split(':');
      document.execCommand(cmd, false, arg || null);
      const zone = document.querySelector('.ed-cr'); if (zone) zone.focus();
      return;
    }
    const edit = t.closest('[data-edit]');
    if (edit) { const [cle, id] = edit.dataset.edit.split(':'); ouvrirEditeur(cle, Number(id)); return; }
    const nouv = t.closest('[data-new]');
    if (nouv) {
      const ctx = {};
      if (nouv.dataset.ctx) { const [k, v] = nouv.dataset.ctx.split(':'); ctx[k] = Number(v); }
      ouvrirEditeur(nouv.dataset.new, null, defautsCreation(nouv.dataset.new, ctx));
      return;
    }
    const selS = t.closest('[data-sel-structure]');
    if (selS) { voirStructure(Number(selS.dataset.selStructure)); return; }
    const dep = t.closest('[data-deplier]');
    if (dep) {
      const id = Number(dep.dataset.deplier), d = ui.partenaires.deplies;
      if (ui.partenaires.toutDeplier) { ui.partenaires.toutDeplier = false; D.echanges.forEach(e => d.add(e.id)); d.delete(id); }
      else if (d.has(id)) d.delete(id); else d.add(id);
      render(); return;
    }
    const pj = t.closest('[data-pj]');
    if (pj) {
      getAttachmentDownloadUrl(pj.dataset.pj).then(url => window.open(url, '_blank', 'noopener')).catch(() => toast('Pièce jointe indisponible', true));
      return;
    }
    if (t.closest('[data-fin-creer]')) {
      const manquantes = Object.keys(FN.FIN_TABLES).filter(k => !F.tables[k]);
      if (!confirm('Créer ' + manquantes.length + ' table(s) dans le document : ' + manquantes.map(k => FN.FIN_TABLES[k].tableId).join(', ') + ' ?')) return;
      financeEcrire(FN.actionsCreationTables(manquantes), 'Tables créées ✓');
      return;
    }
    const voir = t.closest('[data-fin-voir]');
    if (voir) { Object.assign(ui.finance, { sous: 'depenses', affect: voir.dataset.finVoir, statut: '', categorie: '', q: '' }); render(); return; }
    if (t.closest('[data-fin-nouvelle]')) { ui.finance.nouvelle = !ui.finance.nouvelle; render(); return; }
    if (t.closest('[data-fin-annuler]')) { apercu = null; render(); return; }
    if (t.closest('[data-fin-importer]')) { importer(); return; }
    const supprLigne = t.closest('[data-fin-suppr-ligne]');
    if (supprLigne) {
      const b = F.bById.get(Number(supprLigne.dataset.finSupprLigne));
      if (b && confirm('Supprimer la ligne budgétaire « ' + b.libelle + ' » ? Les dépenses rattachées redeviendront « à trier ».')) {
        financeEcrire([['RemoveRecord', FN.FIN_TABLES.budget.tableId, b.id]], 'Ligne supprimée');
      }
      return;
    }
    const supprDep = t.closest('[data-fin-suppr-depense]');
    if (supprDep) {
      if (confirm('Supprimer cette dépense manuelle ?')) {
        ui.sheet = null;
        financeEcrire([['RemoveRecord', FN.FIN_TABLES.depenses.tableId, Number(supprDep.dataset.finSupprDepense)]], 'Dépense supprimée');
      }
      return;
    }
    // Un champ dans une ligne cliquable ne doit pas ouvrir la fiche.
    if (t.closest('select, input, textarea, .fi-drop')) return;
    const set = t.closest('button[data-set]');
    if (set) { poser(set.dataset.set, set.dataset.val); render(); return; }
    const tog = t.closest('[data-toggle]');
    if (tog) { const [v, k] = tog.dataset.toggle.split('.'); ui[v][k] = !ui[v][k]; render(); return; }
    const tri = t.closest('th[data-tri]');
    if (tri) {
      const f = ui[tri.dataset.tri];
      if (f.tri === tri.dataset.val) f.asc = !f.asc; else { f.tri = tri.dataset.val; f.asc = true; }
      render(); return;
    }
    const an = t.closest('[data-annee]');
    if (an) { ui.projets.annee += Number(an.dataset.annee); render(); return; }
    const mois = t.closest('[data-mois]');
    if (mois) {
      const n = Number(mois.dataset.mois);
      const base = ui.actions.mois ? new Date(ui.actions.mois) : new Date();
      ui.actions.mois = n === 0 ? null : new Date(base.getFullYear(), base.getMonth() + n, 1).getTime();
      render(); return;
    }
    const open = t.closest('[data-open]');
    if (open) { ouvrir(open.dataset.open); return; }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      fermerPop();
      if (document.querySelector('.ms-filter-panel:not([hidden])')) { document.querySelectorAll('.ms-filter-panel').forEach(p => { p.hidden = true; }); return; }
      if (editeur) fermerEditeur(); else if (ui.sheet) { ui.sheet = null; renderSheet(); }
    }
    if (e.key === 'Enter' && e.target.closest && e.target.closest('.nd[data-open]')) ouvrir(e.target.closest('.nd').dataset.open);
  });

  document.addEventListener('input', debounce((e) => {
    const t = e.target;
    if (t.id === 'pop-q') {
      const q = t.value;
      $('pop-host').querySelector('.es-pop').innerHTML = popProfil(q);
      const champ = $('pop-q'); champ.focus(); champ.setSelectionRange(q.length, q.length);
      return;
    }
    if (t.dataset && t.dataset.q) { ui[t.dataset.q].q = t.value; render(); }
  }, 180));

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-fait]')) { basculerFaite(Number(t.dataset.fait), t.checked); return; }
    if (t.matches('[data-fin-affecter]')) {
      financeEcrire([['UpdateRecord', FN.FIN_TABLES.depenses.tableId, Number(t.dataset.finAffecter), { Budget_ligne: Number(t.value) || 0 }]], 'Dépense rattachée ✓');
      return;
    }
    if (t.matches('[data-fin-projet]')) {
      financeEcrire([['UpdateRecord', FN.FIN_TABLES.depenses.tableId, Number(t.dataset.finProjet), { Opportunite: Number(t.value) || 0 }]], 'Projet rattaché ✓');
      return;
    }
    if (t.id === 'fin-fichier' && t.files && t.files[0]) { lireFichier(t.files[0]); return; }
    if (t.dataset && t.dataset.docUpload && t.files && t.files.length) { envoyerDocuments(Number(t.dataset.docUpload), t.files); return; }
    if (t.id === 'fin-exo' && apercu) { apercu.exercice = Number(t.value) || apercu.exercice; render(); return; }
    if (t.matches('select[data-set]')) { poser(t.dataset.set, t.value); render(); }
  });

  document.addEventListener('submit', (e) => {
    const form = e.target;
    if (form.id === 'ed-form') { e.preventDefault(); enregistrerEditeur(); return; }
    if (form.hasAttribute('data-fin-ajout-ligne')) {
      e.preventDefault();
      financeEcrire([['AddRecord', FN.FIN_TABLES.budget.tableId, null, {
        Libelle: form.libelle.value.trim(), Categorie: form.categorie.value, Montant_prevu: Number(form.prevu.value) || 0,
        Financeur: form.financeur.value.trim(), Exercice: Number(ui.finance.exercice), PFI: ui.finance.pfi || ''
      }]], 'Ligne budgétaire ajoutée ✓');
      return;
    }
    if (form.hasAttribute('data-fin-ajout-depense')) {
      e.preventDefault();
      const m = Number(form.montant.value) || 0, st = form.statut.value, dt = inputValueToGristDate(form.date.value);
      ui.finance.nouvelle = false;
      financeEcrire([['AddRecord', FN.FIN_TABLES.depenses.tableId, null, {
        Libelle: form.libelle.value.trim(), Fournisseur: form.fournisseur.value.trim(), Categorie: form.categorie.value, Statut: st,
        Montant: m, Montant_engage: m, Montant_facture: st === 'Engagé' ? 0 : m, Montant_paye: st === 'Payé' ? m : 0,
        Date_engagement: dt, Date_paiement: st === 'Payé' ? dt : null, Source: 'Manuelle', PFI: ui.finance.pfi || '',
        Budget_ligne: Number(form.ligne.value) || 0
      }]], 'Dépense ajoutée ✓');
      return;
    }
    if (form.dataset.finNotes) {
      e.preventDefault();
      financeEcrire([['UpdateRecord', FN.FIN_TABLES.depenses.tableId, Number(form.dataset.finNotes), { Notes: form.notes.value }]], 'Note enregistrée ✓');
      return;
    }
    if (form.dataset.ajoutActionStructure) {
      e.preventDefault();
      const label = form.label.value.trim();
      if (label) ajouterActionStructure(Number(form.dataset.ajoutActionStructure), label, form.due.value);
      return;
    }
    if (form.dataset.ajoutAction) {
      e.preventDefault();
      const label = form.label.value.trim();
      if (label) ajouterAction(Number(form.dataset.ajoutAction), label, form.due.value);
    } else if (form.dataset.ajoutLien) {
      e.preventDefault();
      const p = D.pById.get(Number(form.dataset.ajoutLien));
      const url = form.url.value.trim();
      if (!/^https?:\/\//i.test(url)) { toast('Adresse invalide : elle doit commencer par http:// ou https://', true); return; }
      enregistrerLiens(p.id, p.liens.concat({ libelle: form.libelle.value.trim() || url, url }));
    }
  });

  // Dépôt d'un fichier SIFAC sur la zone d'import.
  document.addEventListener('dragover', (e) => { if (e.target.closest && e.target.closest('.fi-drop')) { e.preventDefault(); e.target.closest('.fi-drop').classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { if (e.target.closest && e.target.closest('.fi-drop')) e.target.closest('.fi-drop').classList.remove('over'); });
  document.addEventListener('drop', (e) => {
    const zone = e.target.closest && e.target.closest('.fi-drop');
    if (!zone || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    if (zone.dataset.docProjet) envoyerDocuments(Number(zone.dataset.docProjet), e.dataTransfer.files);
    else lireFichier(e.dataTransfer.files[0]);
  });

  // Glisser-déposer natif : projets entre étapes, actions entre statuts.
  let glisse = null;
  document.addEventListener('dragstart', (e) => {
    const p = e.target.closest && e.target.closest('[data-drag-projet]');
    const a = e.target.closest && e.target.closest('[data-drag-action]');
    if (p && ui.projets.groupe === 'etape') glisse = { kind: 'projet', id: Number(p.dataset.dragProjet), el: p };
    else if (a && related.actions.cols.Statut) glisse = { kind: 'action', id: Number(a.dataset.dragAction), el: a };
    else { if (p || a) e.preventDefault(); return; }
    glisse.el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(glisse.id));
  });
  document.addEventListener('dragend', () => { if (glisse) glisse.el.classList.remove('dragging'); glisse = null; document.querySelectorAll('.es-col.over').forEach(c => c.classList.remove('over')); });
  document.addEventListener('dragover', (e) => {
    if (!glisse) return;
    const col = e.target.closest(glisse.kind === 'projet' ? '[data-drop-etape]' : '[data-drop-statut]');
    if (!col) return;
    e.preventDefault();
    document.querySelectorAll('.es-col.over').forEach(c => { if (c !== col) c.classList.remove('over'); });
    col.classList.add('over');
  });
  document.addEventListener('drop', (e) => {
    if (!glisse) return;
    const col = e.target.closest(glisse.kind === 'projet' ? '[data-drop-etape]' : '[data-drop-statut]');
    if (!col) return;
    e.preventDefault();
    if (glisse.kind === 'projet') deplacerProjet(glisse.id, col.dataset.dropEtape);
    else deplacerAction(glisse.id, col.dataset.dropStatut);
  });

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  grist.onRecords(async function (records, maps) {
    mappings = maps || {};
    if (structTableId === null) {
      try { structTableId = await grist.getTable().getTableId(); } catch (err) { console.error(err); }
    }
    await charger(!!D);
    render();
  });
  window.addEventListener('focus', () => { if (D) charger(true).then(render); });
})();
</script>
</body>
</html>
