<!DOCTYPE html>
<html lang="fr">
<head>

<title>Espace SequoIA — Cluster SequoIA</title>
<link rel="stylesheet" href="./common.css?v=20260925g">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="./common.js?v=20260925g"></script>
<script src="./pilotage.js?v=20260925g"></script>
<script src="./espace.js?v=20260925g"></script>
<script src="./finance.js?v=20260925g"></script>
<script src="./vendor/read-excel-file-5.8.8.min.js"></script>
<style>
/* Une application à onglets, dans la charte de common.css : fond gris
   clair, cartes blanches arrondies, barre d'onglets en pastilles, fiche
   qui glisse depuis la droite. */
:root {
  --es-radius: 12px;
  --es-surface-2: #f8faf9;
  --es-sep: #eef1ef;
  --es-ink: #111816;
  --es-warn: #b45309;
  --es-late: #b3261e;
  --es-shadow: 0 1px 2px rgba(16, 24, 20, .04), 0 1px 1px rgba(16, 24, 20, .03);
  --es-sheet: 620px;
  /* Repli des étapes, comme pilotage.html : stageColor() lit d'abord les
     couleurs réelles de la colonne Statut. */
  --stage-idee: #9ca3af; --stage-prospection: #6b7280; --stage-premierechange: #60a5fa;
  --stage-qualification: #3b82f6; --stage-recherchedequipe: #8b5cf6; --stage-montage: #f97316;
  --stage-contractualisation: #facc15; --stage-projetlance: #22c55e; --stage-concretiseencours: #22c55e;
  --stage-termine: #15803d; --stage-abandonne: #ef4444;
}
body { background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; }
.es-app { height: 100vh; display: flex; flex-direction: column; }

/* ---------- Barre du haut ---------- */
.es-top {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  flex-wrap: wrap; flex-shrink: 0;
}
.es-top-left { display: flex; gap: 8px; align-items: center; }
.es-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
  border: 1px solid var(--border); background: var(--card-bg); border-radius: 9px;
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.es-btn:hover { background: var(--es-surface-2); }
.es-btn.primary { background: var(--sequoia-green); border-color: var(--sequoia-green); color: #fff; font-weight: 600; }
.es-btn.primary:hover { background: var(--sequoia-green-dark); }
.es-btn.icon { width: 34px; padding: 0; justify-content: center; position: relative; }
.es-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--es-late); }
.es-avatar {
  width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; background: var(--sequoia-green); flex-shrink: 0;
}
.es-avatar.lg { width: 40px; height: 40px; font-size: 14px; border-radius: 11px; }
.es-me { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
.es-me small { color: var(--text-muted); font-size: 11px; }

.es-tabs {
  margin-left: auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px;
  background: #e4e8e6; border: 1px solid var(--border); overflow-x: auto; max-width: 100%;
}
.es-tab {
  border: 0; background: transparent; border-radius: 999px; padding: 6px 15px;
  font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s;
}
.es-tab.on { background: var(--es-ink); color: #fff; }
.es-tab:not(.on):hover { background: rgba(255,255,255,.6); }

/* Menus déroulants (profil, cloche) */
.es-pop {
  position: absolute; top: 54px; z-index: 50; width: 300px; max-height: 70vh; overflow: auto;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(16, 24, 20, .14); padding: 8px;
}
.es-pop h4 { margin: 6px 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.es-pop input { width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 8px; padding: 0 9px; font: inherit; font-size: 13px; margin-bottom: 6px; }
.es-pop-item {
  display: flex; gap: 9px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none;
  padding: 7px 6px; border-radius: 8px; cursor: pointer; font-size: 13px;
}
.es-pop-item:hover { background: var(--es-surface-2); }
.es-pop-item.nouveau { background: #eef4ff; }
.es-pop-item .sub { display: block; font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.es-pop-empty { padding: 14px 8px; text-align: center; font-size: 12.5px; color: var(--text-muted); }

/* ---------- Zone principale ---------- */
.es-main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 28px; }
.es-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.es-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--es-radius);
  box-shadow: var(--es-shadow);
}
.es-card-head { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 4px; }
.es-card-head h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
.es-card-head .aside { margin-left: auto; font-size: 11.5px; color: var(--text-muted); }
.es-card-body { padding: 8px 16px 16px; }
.es-muted { color: var(--text-muted); }
.es-empty { padding: 24px 10px; text-align: center; color: var(--text-muted); font-size: 13px; font-style: italic; }

/* Toolbar commune aux listes */
.es-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.es-toolbar h1 { margin: 0 8px 0 0; font-size: 22px; font-weight: 650; }
.es-search {
  height: 34px; min-width: 220px; flex: 0 1 300px; border: 1px solid var(--border); border-radius: 9px;
  padding: 0 11px; font: inherit; font-size: 13px; background: var(--card-bg);
}
.es-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--card-bg); }
.es-seg button { border: 0; background: none; padding: 0 12px; height: 32px; font-size: 12.5px; cursor: pointer; }
.es-seg button + button { border-left: 1px solid var(--border); }
.es-seg button.on { background: var(--es-ink); color: #fff; }
.es-select { height: 34px; border: 1px solid var(--border); border-radius: 9px; padding: 0 8px; font: inherit; font-size: 12.5px; background: var(--card-bg); }
.es-toolbar .grow { flex: 1; }
.es-count { font-size: 12.5px; color: var(--text-muted); }

/* ---------- Tableau de bord ---------- */
.es-hero {
  position: relative; overflow: hidden; border-radius: 16px; min-height: 168px; color: #fff;
  background: #1b3b30; isolation: isolate;
}
.es-blob { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .85; z-index: -2; }
.es-blob.b1 { width: 340px; height: 340px; background: var(--pilier-core); top: -140px; left: -60px; animation: es-flot1 16s ease-in-out infinite alternate; }
.es-blob.b2 { width: 300px; height: 300px; background: var(--pilier-secu); top: -60px; left: 38%; animation: es-flot2 19s ease-in-out infinite alternate; }
.es-blob.b3 { width: 320px; height: 320px; background: var(--pilier-env); bottom: -170px; right: -40px; animation: es-flot3 22s ease-in-out infinite alternate; }
@keyframes es-flot1 { to { transform: translate(120px, 60px) scale(1.15); } }
@keyframes es-flot2 { to { transform: translate(-90px, 70px) scale(.9); } }
@keyframes es-flot3 { to { transform: translate(-140px, -50px) scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .es-blob { animation: none; } }
.es-hero::after {
  content: ''; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.18));
  backdrop-filter: saturate(120%);
}
.es-hero-body { padding: 24px 26px; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
.es-hero-kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.es-hero h1 { margin: 4px 0 6px; font-size: 32px; font-weight: 650; letter-spacing: -.01em; }
.es-hero p { margin: 0; opacity: .9; font-size: 14px; }
.es-hero-stats { margin-left: auto; display: flex; gap: 22px; }
.es-hero-stats div { text-align: right; }
.es-hero-stats b { display: block; font-size: 24px; font-weight: 650; }
.es-hero-stats span { font-size: 12px; opacity: .85; }

.es-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.es-kpi { padding: 14px 16px; }
.es-kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.es-kpi .val { font-size: 26px; font-weight: 650; margin-top: 4px; }
.es-kpi .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.es-kpi .sub.alerte { color: var(--es-late); font-weight: 600; }

.es-grid-3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
.es-grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
@media (max-width: 1100px) { .es-grid-3, .es-grid-2 { grid-template-columns: 1fr; } }

.es-chart svg { width: 100%; height: auto; display: block; }
.es-chart text { font-size: 10.5px; fill: var(--text-muted); }
.es-hbar { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 8px; font-size: 12.5px; margin: 7px 0; }
.es-hbar .track { height: 10px; border-radius: 5px; background: var(--es-sep); overflow: hidden; }
.es-hbar .fill { height: 100%; border-radius: 5px; }
.es-hbar .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.es-hbar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.es-legend { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.es-legend button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left; }
.es-legend i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.es-legend .n { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.es-donut-wrap { display: flex; gap: 16px; align-items: center; }
.es-donut-wrap svg { width: 130px; height: 130px; flex-shrink: 0; }

.es-alerts { display: flex; flex-direction: column; }
.es-alert { display: flex; gap: 10px; align-items: center; padding: 9px 2px; border-top: 1px solid var(--es-sep); cursor: pointer; font-size: 13px; }
.es-alert:first-child { border-top: 0; }
.es-alert .when { margin-left: auto; font-size: 12px; white-space: nowrap; font-weight: 600; }
.es-alert .when.late { color: var(--es-late); }
.es-alert .when.soon { color: var(--es-warn); }
.es-alert .kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); display: block; }

/* ---------- Graphe ---------- */
.es-graph { position: relative; }
.es-graph svg { width: 100%; height: auto; display: block; }
.es-graph line { stroke: #c9d2cd; stroke-width: 1.1; }
.es-graph .nd { cursor: pointer; }
.es-graph .nd circle { stroke: #fff; stroke-width: 2; }
.es-graph .nd text { font-size: 10.5px; fill: var(--text); paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.es-graph .nd:hover circle { stroke: var(--es-ink); }
.es-graph-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); padding: 0 16px 12px; flex-wrap: wrap; }
.es-graph-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* ---------- Projets : cartes ---------- */
.es-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: flex-start; }
.es-col { flex: 0 0 280px; background: #eaeeec; border-radius: 12px; padding: 8px; }
.es-col.over { outline: 2px dashed var(--sequoia-green); outline-offset: -2px; }
.es-col-head { display: flex; align-items: center; gap: 7px; padding: 4px 6px 8px; font-size: 12.5px; font-weight: 650; }
.es-col-head i { width: 9px; height: 9px; border-radius: 50%; }
.es-col-head .n { margin-left: auto; color: var(--text-muted); font-weight: 500; }
.es-col-sum { font-size: 11.5px; color: var(--text-muted); padding: 0 6px 8px; margin-top: -6px; }
.es-col-cards { display: flex; flex-direction: column; gap: 8px; min-height: 30px; }
.es-pcard { padding: 11px 12px; cursor: pointer; }
.es-pcard:hover { border-color: #c5cfca; }
.es-pcard.dragging { opacity: .45; }
.es-pcard h4 { margin: 6px 0 4px; font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.es-pcard .who { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.es-pcard .foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11.5px; color: var(--text-muted); }
.es-pcard .foot .m { margin-left: auto; font-weight: 600; color: var(--text); }
.es-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; background: var(--es-sep); color: var(--text); white-space: nowrap;
}
.es-badge i { width: 7px; height: 7px; border-radius: 50%; }
/* Dispositifs : mêmes teintes que pilotage.html */
.es-badge.tag-cifre { background: #f5e8f7; color: #7d2e7d; }
.es-badge.tag-chaire { background: #f0eaf6; color: #5c3f7d; }
.es-badge.tag-labcom { background: #e7f1f8; color: #2b5c7d; }
.es-badge.tag-national { background: #f8f0e0; color: #7a5a14; }
.es-badge.tag-interne { background: #e9edf1; color: #3f5261; }
.es-badge.tag-europe { background: #ece9f8; color: #4a3d86; }
.es-badge.tag-stage { background: #dce8f2; color: #1e4a7a; }
.es-badge.tag-autre { background: #eef0ef; color: #5a625e; }
.es-time { height: 4px; border-radius: 2px; background: var(--es-sep); margin-top: 9px; overflow: hidden; }
.es-time > div { height: 100%; background: var(--sequoia-green); border-radius: 2px; }
.es-time.late > div { background: var(--es-late); }

/* ---------- Tableaux ---------- */
.es-table-wrap { overflow-x: auto; }
table.es-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.es-table th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
  font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none;
}
.es-table th.sorted::after { content: ' ↓'; }
.es-table th.sorted.asc::after { content: ' ↑'; }
.es-table td { padding: 9px 12px; border-bottom: 1px solid var(--es-sep); vertical-align: middle; }
.es-table tbody tr { cursor: pointer; }
.es-table tbody tr:hover { background: var(--es-surface-2); }
.es-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.es-table .ttl { font-weight: 600; max-width: 360px; }

/* ---------- Frise ---------- */
.es-cal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
.es-cal-head b { font-size: 15px; min-width: 60px; text-align: center; }
.es-frise { padding: 0 16px 16px; }
.es-frise-row { display: grid; grid-template-columns: 260px 1fr; align-items: center; min-height: 32px; border-top: 1px solid var(--es-sep); }
.es-frise-row.head { border-top: 0; min-height: 24px; }
.es-frise-lbl { font-size: 12.5px; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.es-frise-track { position: relative; height: 32px; background:
  repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 12 - 1px), var(--es-sep) calc(100% / 12 - 1px), var(--es-sep) calc(100% / 12)); }
.es-frise-months { display: grid; grid-template-columns: repeat(12, 1fr); font-size: 11px; color: var(--text-muted); text-transform: capitalize; }
.es-seg-bar {
  position: absolute; top: 8px; height: 16px; border-radius: 6px; cursor: pointer; font-size: 10.5px; line-height: 16px;
  padding: 0 6px; overflow: hidden; white-space: nowrap; color: #fff; font-weight: 600;
}
.es-seg-bar.open-end { border-top-right-radius: 0; border-bottom-right-radius: 0; opacity: .8; }
.es-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--es-late); opacity: .6; }

/* ---------- Partenaires ---------- */
.es-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.es-scard { padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.es-scard:hover { border-color: #c5cfca; }
.es-scard-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.es-scard-top b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.es-scard-top small { font-size: 12px; color: var(--text-muted); }
.es-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.es-stats div { background: var(--es-surface-2); border-radius: 8px; padding: 6px 8px; }
.es-stats b { display: block; font-size: 15px; }
.es-stats span { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.es-scard .last { font-size: 11.5px; color: var(--text-muted); }
.es-scard .last.old { color: var(--es-warn); }

/* ---------- Actions ---------- */
.es-acard { padding: 10px 11px; cursor: grab; display: flex; gap: 9px; align-items: flex-start; }
.es-acard.fait { opacity: .6; }
.es-acard.fait .lbl { text-decoration: line-through; }
.es-acard input { margin-top: 2px; }
.es-acard .lbl { font-size: 13px; font-weight: 550; line-height: 1.3; }
.es-acard .meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.es-acard .due { font-weight: 600; }
.es-acard .due.late { color: var(--es-late); }
.es-imp { color: #d97706; }
.es-month { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--es-sep); border-left: 1px solid var(--es-sep); margin: 0 16px 16px; }
.es-month .dname { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 6px; border-right: 1px solid var(--es-sep); border-bottom: 1px solid var(--es-sep); background: var(--es-surface-2); }
.es-day { min-height: 92px; padding: 5px; border-right: 1px solid var(--es-sep); border-bottom: 1px solid var(--es-sep); font-size: 11.5px; }
.es-day.autre { background: var(--es-surface-2); color: var(--text-muted); }
.es-day.auj .num { background: var(--es-ink); color: #fff; border-radius: 50%; }
.es-day .num { display: inline-flex; width: 21px; height: 21px; align-items: center; justify-content: center; font-weight: 600; }
.es-chip { display: block; margin-top: 3px; padding: 2px 6px; border-radius: 5px; background: var(--sequoia-green-light); color: var(--sequoia-green-dark); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.es-chip.late { background: #fdecea; color: var(--es-late); }
.es-chip.fait { background: var(--es-sep); color: var(--text-muted); text-decoration: line-through; }
.es-chip.projet { background: #eef2ff; color: #3730a3; }

/* ---------- Fiche latérale ---------- */
.es-backdrop { position: fixed; inset: 0; background: rgba(17, 24, 22, .28); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
.es-backdrop.open { opacity: 1; pointer-events: auto; }
.es-sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--es-sheet), 100vw); z-index: 61;
  background: var(--card-bg); border-left: 1px solid var(--border); box-shadow: -14px 0 40px rgba(16, 24, 20, .12);
  transform: translateX(102%); transition: transform .25s ease; display: flex; flex-direction: column;
}
.es-sheet.open { transform: none; }
.es-sheet-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--es-sep); }
.es-sheet-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.es-sheet-top .close { margin-left: auto; }
.es-sheet h2 { margin: 10px 0 4px; font-size: 19px; line-height: 1.3; font-weight: 650; }
.es-sheet .desc { font-size: 13px; color: var(--text-muted); }
.es-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.es-pill { border: 1px solid var(--border); background: var(--card-bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.es-pill:hover { border-color: var(--sequoia-green); }
.es-pill small { color: var(--text-muted); }
.es-progress { margin-top: 12px; }
.es-progress .bar { height: 6px; border-radius: 3px; background: var(--es-sep); overflow: hidden; }
.es-progress .bar > div { height: 100%; background: var(--sequoia-green); }
.es-progress.late .bar > div { background: var(--es-late); }
.es-progress .lbls { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.es-sheet-tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--es-sep); overflow-x: auto; }

        Liens: ['Liens', 'Liens_documents', 'Pieces_jointes_liens'],
        // Colonne Pièces jointes : retenue seulement si le document la déclare de ce type.
        Documents: ['Documents', 'Fichiers', 'Pieces_jointes', 'PJ', 'Attachments']
      }
    },
    actions: {
      optional: true,
      tableCandidates: ['Actions_MP', 'ActionsMP', 'ACTIONS_MP', 'Actions', 'Action'],
      roles: {
        Intitule: ['Intitule', 'Intitulé', 'Libelle', 'Libellé', 'Titre', 'Objet'],
        Echeance: ['Echeance', 'Échéance', 'Date_echeance', 'Date'],
        Fait: ['Fait', 'Faite', 'Termine', 'Terminé', 'Done'],
        FaitLe: ['Fait_le', 'FaitLe', 'Fait le', 'Date_fait'],
        Opportunite: ['Opportunite', 'Opportunité', 'Opportunites', 'Opportunités'],
        Partenaires: ['Partenaires', 'Partenaire', 'Structures', 'Structure'],
        Interaction: ['Interaction', 'Interactions'],
        Contacts: ['Contacts', 'Contact', 'Contact(s)', 'Interlocuteurs'],
        Notes: ['Notes', 'Note', 'Commentaire', 'Détail'],
        Statut: ['Statut', 'Status', 'Etat', 'État', 'Colonne', 'Avancement'],
        Important: ['Important', 'Importante', 'Importance_haute', 'Strategique', 'Stratégique']
      }
    }
  };

  // ---------------------------------------------------------------------
  // État
  // ---------------------------------------------------------------------
  let mappings = {};
  let structTableId = null;
  let related = {};
  let stageChoices = [];
  let statutActionChoices = [];
  let D = null; // modèle normalisé
  const ui = {
    vue: new URLSearchParams(location.search).get('vue') || 'dashboard',
    projets: { q: '', mode: 'cartes', groupe: 'etape', type: '', tri: 'echeance', asc: true, annee: new Date().getFullYear(), miens: false },
    partenaires: { q: '', mode: 'fiche', filtre: 'partenaires', type: '', sel: null, tri: 'dernier', asc: false, deplies: new Set(), toutDeplier: false },
    contacts: { q: '', mode: 'tableau', tri: 'nom', asc: true },
    actions: { q: '', mode: 'kanban', miennes: false, faites: false, mois: null },
    finance: { sous: 'synthese', exercice: null, pfi: '', q: '', statut: '', categorie: '', affect: '', nouvelle: false },
    sheet: null // { kind, id, tab }
  };

  // Préférences propres à chaque personne : qui elle est, les alertes déjà
  // vues. Le navigateur peut refuser le stockage (fenêtre privée) : le
  // widget fonctionne alors sans s'en souvenir.
  function lireLocal(cle, defaut) {
    try { const v = localStorage.getItem('espace-sequoia:' + cle); return v ? JSON.parse(v) : defaut; }
    catch (err) { return defaut; }
  }
  function ecrireLocal(cle, valeur) {
    try { localStorage.setItem('espace-sequoia:' + cle, JSON.stringify(valeur)); } catch (err) { /* sans mémoire */ }
  }
  let moiId = lireLocal('moi', null);
  let alertesVues = lireLocal('alertes-vues', []);

  function setStatus(msg) {
    $('status').textContent = msg || '';
    if (msg) setTimeout(() => { if ($('status').textContent === msg) $('status').textContent = ''; }, 3000);
  }

  grist.ready({ requiredAccess: 'full', columns: COLUMNS, allowSelectBy: true });

  // ---------------------------------------------------------------------
  // Lecture du document
  // ---------------------------------------------------------------------
  async function resolveRelated(key) {
    const conf = RELATED[key];
    for (const tableId of conf.tableCandidates) {
      try {
        const data = await fetchTableCached(tableId);
        const cols = resolveColumns(dataColumns(data), conf.roles);
        const meta = await fetchColumnMeta(tableId);
        const refTargets = {};
        meta.forEach(m => {
          const cible = /^Ref(?:List)?:(.+)$/.exec(m.type || '');
          if (cible) refTargets[m.id] = cible[1];
        });
        return {
          tableId, cols, refTargets, meta,
          listCols: meta.filter(m => /^(RefList|ChoiceList):?/.test(m.type || '')).map(m => m.id),
          records: recordsFromTableData(data)
        };
      } catch (err) { /* candidat suivant */ }
    }
    return { tableId: null, cols: {}, refTargets: {}, meta: [], listCols: [], records: [] };
  }

  // Les colonnes de `key` qui désignent la table `cible`, d'après les
  // métadonnées, plus celle que la configuration nomme.
  function colsVers(key, cible, connue) {
    const r = related[key];
    if (!r || !cible) return [];
    const cols = Object.keys(r.refTargets).filter(c => r.refTargets[c] === cible);
    if (connue && !cols.includes(connue)) cols.unshift(connue);
    return cols;
  }
  function idsPar(rec, cols) {
    const out = new Set();
    cols.forEach(c => refIdsFromValue(rec[c]).forEach(id => out.add(id)));
    return Array.from(out);
  }

  async function choixDe(key, colId) {
    const r = related[key];
    if (!r || !r.tableId || !colId) return { choices: [], styles: {} };
    return fetchChoiceStyles(r.tableId, colId);
  }

  async function charger(force) {
    if (force) {
      Object.values(related).forEach(r => { if (r.tableId) invalidateTableCache(r.tableId); });
      if (structTableId) invalidateTableCache(structTableId);
    }
    const keys = Object.keys(RELATED);
    const res = await Promise.all(keys.map(resolveRelated));
    keys.forEach((k, i) => { related[k] = res[i]; });
    const [stages, statuts] = await Promise.all([
      choixDe('opportunites', related.opportunites.cols.Statut),
      choixDe('actions', related.actions.cols.Statut)
    ]);
    stageChoices = stages.choices;
    registerStatusStyles(stages.styles);
    statutActionChoices = statuts.choices;
    let structures = [];
    if (structTableId) {
      try {
        const data = await fetchTableCached(structTableId);
        colsStructure = resoudreColsStructure(dataColumns(data), data);
        structures = recordsFromTableData(data);
      }
      catch (err) { console.error('Structures illisibles', err); }
    }
    D = construire(structures);
    await chargerFinance(force);
  }

  // ---------------------------------------------------------------------
  // Modèle normalisé
  // ---------------------------------------------------------------------
  // Texte brut d'un compte rendu pour les extraits : les anciens CR sont en
  // Markdown, et « # Réunion … **Mathieu** » ne se lit pas dans un aperçu.
  function texteCR(brut) {
    const t = String(brut || '');
    if (looksLikeHtml(t)) return t;
    return t.replace(/^\s{0,3}#{1,6}\s*/gm, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1')
      .replace(/(^|[\s(])[*_]([^*_\n]+)[*_]/g, '$1$2').replace(/`([^`]+)`/g, '$1').replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^\s*[-*+]\s+/gm, '· ').replace(/^\s*>\s?/gm, '');
  }

  // La colonne de fichiers des opportunités, si elle existe et qu'elle est bien
  // de type Pièces jointes (un texte nommé « Documents » n'en est pas une).
  function colDocuments() {
    const op = related.opportunites;
    const col = op && op.cols.Documents;
    if (!col) return null;
    const m = (op.meta || []).find(x => x.id === col);
    return m && m.type === 'Attachments' ? col : null;
  }

  // Les colonnes de la table Structures : celles associées dans les réglages du
  // widget d'abord, sinon retrouvées par leur nom — une colonne url_logo ou
  // pilier_sequoia n'a pas à être associée à la main pour s'afficher.
  const STRUCT_ROLES = {
    Nom: ['nom_acteur', 'Nom', 'Nom_structure', 'Name'],
    TypeActeur: ['type_acteur', 'TypeActeur', 'Type_acteur', "Type d'acteur"],
    Categorie: ['acteur_categorie', 'Categorie', 'Catégorie', 'categorie_acteur', 'Statut_partenaire', 'Relation'],
    Activite: ['entreprise_activite', 'secteur_activite', 'Secteur', 'Activite', 'Activité'],
    Taille: ['entreprise_taille', 'Taille'],
    AxeSequoia: ['axe_sequoia', 'AxeSequoia', 'Axe_SequoIA'],
    PilierSequoia: ['pilier_sequoia', 'PilierSequoia', 'Pilier_SequoIA'],
    Logo: ['url_logo', 'Logo', 'logo_url', 'URL_logo'],
    SiteWeb: ['site_web', 'SiteWeb', 'url_site', 'Site'],
    Description: ['description', 'Description', 'presentation'],
    RechercheEquipeLabo: ['recherche_equipe_labo', 'RechercheEquipeLabo'],
    RechercheEquipeActivite: ['recherche_equipe_activite', 'RechercheEquipeActivite'],
    RechercheStructure: ['recherche_structure', 'RechercheStructure']
  };
  let colsStructure = {};
  function resoudreColsStructure(ids, data) {
    const devinees = resolveColumns(ids, STRUCT_ROLES);
    const out = {};
    Object.keys(STRUCT_ROLES).forEach(role => { out[role] = (mappings[role] && ids.includes(mappings[role]) ? mappings[role] : devinees[role]) || null; });
    // La catégorie est ce qui distingue un prospect d'un partenaire. Si son nom
    // ne dit rien, on prend la colonne qui contient la valeur « Prospect ».
    const aProspect = (col) => (data && data[col] || []).some(v => listeChoix(v).some(x => normalizeKey(x) === 'prospect'));
    if (!out.Categorie || !aProspect(out.Categorie)) {
      const col = ids.find(aProspect);
      if (col) out.Categorie = col;
    }
    return out;
  }

  function construire(structuresBrutes) {
    const sf = (s, role) => (colsStructure[role] ? s[colsStructure[role]] : undefined);
    const structures = structuresBrutes.map(s => {
      const categorie = txt(sf(s, 'Categorie'));
      return {
        id: s.id,
        name: txt(sf(s, 'Nom')) || 'Sans nom',
        type: txt(sf(s, 'TypeActeur')),
        categorie,
        activite: txt(sf(s, 'Activite')),
        axe: txt(sf(s, 'AxeSequoia')),
        pilier: txt(sf(s, 'PilierSequoia')),
        logo: txt(sf(s, 'Logo')),
        site: txt(sf(s, 'SiteWeb')),
        description: txt(sf(s, 'Description')),
        taille: txt(sf(s, 'Taille')),
        piliers: listeChoix(sf(s, 'PilierSequoia')),
        axes: listeChoix(sf(s, 'AxeSequoia')),
        isTeam: !!(txt(sf(s, 'RechercheEquipeLabo')) || txt(sf(s, 'RechercheEquipeActivite'))),
        // « Laboratoire », « Équipe », « Institut »… : ce que la structure est dans la recherche.
        roleRecherche: normalizeKey(txt(sf(s, 'RechercheStructure'))),
        isProspect: normalizeKey(categorie).includes('prospect')
      };
    });
    const sById = new Map(structures.map(s => [s.id, s]));

    const ct = related.contacts;
    const contacts = ct.records.map(r => {
      const c = ct.cols;
      const nom = txt(r[c.NomComplet]) || [txt(r[c.Prenom]), txt(r[c.Nom])].filter(Boolean).join(' ');
      return {
        id: r.id, name: nom || 'Sans nom', fonction: txt(r[c.Fonction]),
        email: txt(r[c.Email]), tel: txt(r[c.Telephone]), principal: !!(c.ContactPrincipal && r[c.ContactPrincipal]),
        structureIds: idsPar(r, colsVers('contacts', structTableId, c.Structures))
      };
    });
    const cById = new Map(contacts.map(c => [c.id, c]));

    const op = related.opportunites;
    const oc = op.cols;
    const projets = op.records.map(r => {
      const partnerIds = refIdsFromValue(r[oc.Partenaires]);
      const toutes = idsPar(r, colsVers('opportunites', structTableId, oc.Partenaires));
      return {
        id: r.id,
        title: txt(r[oc.Sujet]) || 'Sans titre',
        type: txt(r[oc.Type]),
        stage: txt(r[oc.Statut]),
        montant: Number(r[oc.Montant]) || 0,
        debut: r[oc.DateDebut] || null,
        echeance: r[oc.Echeance] || null,
        axe: txt(r[oc.AxeSequoia]),
        commentaire: oc.Commentaire ? stripHtml(String(r[oc.Commentaire] || '')) : '',
        liens: oc.Liens ? E.lireLiens(r[oc.Liens]) : null,
        docs: colDocuments() ? attachmentIdsFromValue(r[colDocuments()]) : null,
        partnerIds,
        teamIds: toutes.filter(id => !partnerIds.includes(id)),
        contactIds: idsPar(r, colsVers('opportunites', ct.tableId))
      };
    });
    const pById = new Map(projets.map(p => [p.id, p]));

    const it = related.interactions;
    const ic = it.cols;
    const echanges = it.records.map(r => ({
      id: r.id,
      date: r[ic.Date] || null,
      type: txt(r[ic.Type]),
      objet: txt(r[ic.Objet]),
      cr: ic.CR ? excerpt(texteCR(r[ic.CR]), 260) : '',
      crBrut: ic.CR ? (r[ic.CR] || '') : '',
      suites: txt(r[ic.Suites]),
      prochaine: r[ic.ProchaineEcheance] || null,
      pj: ic.PJ ? attachmentIdsFromValue(r[ic.PJ]) : [],
      partnerIds: idsPar(r, colsVers('interactions', structTableId, ic.Partenaires)),
      contactIds: idsPar(r, colsVers('interactions', ct.tableId)),
      projectIds: idsPar(r, colsVers('interactions', op.tableId, ic.Opportunites))
    })).sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
    const eById = new Map(echanges.map(e => [e.id, e]));

    const ac = related.actions;
    const aco = ac.cols;
    const actions = ac.records.map(r => ({
      id: r.id,
      label: txt(r[aco.Intitule]) || 'Action sans intitulé',
      due: r[aco.Echeance] || null,
      done: !!r[aco.Fait],
      statut: txt(r[aco.Statut]),
      important: aco.Important ? !!r[aco.Important] : false,
      notes: aco.Notes ? stripHtml(String(r[aco.Notes] || '')) : '',
      projectIds: idsPar(r, colsVers('actions', op.tableId, aco.Opportunite)),
      partnerIds: idsPar(r, colsVers('actions', structTableId, aco.Partenaires)),
      interactionIds: idsPar(r, colsVers('actions', it.tableId, aco.Interaction)),
      contactIds: idsPar(r, colsVers('actions', ct.tableId, aco.Contacts))
    }));
    const aById = new Map(actions.map(a => [a.id, a]));

    // Le rattachement d'un projet, direct ou par ricochet : l'échange d'où
    // sort une de ses actions, l'action née d'un de ses échanges.
    const liesProjet = new Map();
    projets.forEach(p => {
      const ech = new Set(echanges.filter(e => e.projectIds.includes(p.id)).map(e => e.id));
      const act = new Set(actions.filter(a => a.projectIds.includes(p.id)).map(a => a.id));
      Array.from(act).forEach(id => aById.get(id).interactionIds.forEach(e => { if (eById.has(e)) ech.add(e); }));
      actions.forEach(a => { if (a.interactionIds.some(e => ech.has(e))) act.add(a.id); });
      liesProjet.set(p.id, {
        echanges: Array.from(ech).map(id => eById.get(id)).sort((x, y) => (Number(y.date) || 0) - (Number(x.date) || 0)),
        actions: Array.from(act).map(id => aById.get(id))
      });
    });

    const dernierEchange = new Map();
    echanges.forEach(e => e.partnerIds.forEach(id => {
      if (!dernierEchange.has(id) || Number(e.date) > Number(dernierEchange.get(id))) dernierEchange.set(id, e.date);
    }));

    const etapes = orderStages(stageChoices.concat(projets.map(p => p.stage)));
    return { structures, sById, contacts, cById, projets, pById, echanges, eById, actions, aById, liesProjet, dernierEchange, etapes };
  }

  const nomS = (id) => (D.sById.get(id) || {}).name || '#' + id;
  const nomsS = (ids) => ids.map(nomS).join(', ');
  const actif = (p) => !isStageIn(p.stage, 'clos') && !isStageIn(p.stage, 'termine');

  // ---------------------------------------------------------------------
  // Éléments communs
  // ---------------------------------------------------------------------
  const PALETTE_TYPES = { economique: '#2563eb', recherche: '#7c3aed', institutionnel: '#0891b2', academique: '#7c3aed' };
  function couleurStructure(s) {
    if (!s) return '#94a3b8';
    if (s.isTeam) return '#7c3aed';
    const k = normalizeKey(s.type);
    const hit = Object.keys(PALETTE_TYPES).find(t => k.includes(t));
    return hit ? PALETTE_TYPES[hit] : '#1f6b3f';
  }
  function avatar(nom, couleur, grand) {
    return '<span class="es-avatar' + (grand ? ' lg' : '') + '" style="background:' + H(couleur) + '">' + H(initials(nom)) + '</span>';
  }
  function badgeEtape(stage) {
    if (!stage) return '<span class="es-badge">Sans étape</span>';
    return '<span class="es-badge" style="background:' + stageColor(stage) + ';color:' + stageTextColor(stage) + '">' + H(stage) + '</span>';
  }
  function badgeType(type) {
    return type ? '<span class="es-badge ' + H(dispositifClass(type)) + '">' + H(type) + '</span>' : '';
  }
  function jRel(j) {
    if (j === null) return '';
    if (j === 0) return "aujourd'hui";
    return j > 0 ? 'dans ' + j + ' j' : 'il y a ' + (-j) + ' j';
  }
  function barreTemps(p, grand) {
    const av = E.avancementTemps(p.debut, p.echeance, nowTs());
    if (av === null) return '';
    const late = av >= 1 && actif(p);
    if (!grand) return '<div class="es-time' + (late ? ' late' : '') + '" title="' + Math.round(av * 100) + ' % du temps écoulé"><div style="width:' + (av * 100).toFixed(1) + '%"></div></div>';
    return '<div class="es-progress' + (late ? ' late' : '') + '"><div class="bar"><div style="width:' + (av * 100).toFixed(1) + '%"></div></div>' +
      '<div class="lbls"><span>' + H(formatDate(p.debut)) + '</span><span>' + Math.round(av * 100) + ' % du temps écoulé · échéance ' +
      H(jRel(E.joursAvant(p.echeance, nowTs()))) + '</span><span>' + H(formatDate(p.echeance)) + '</span></div></div>';
  }
  function correspond(q, champs) {
    const k = normalizeKey(q);
    return !k || champs.some(c => normalizeKey(c).includes(k));
  }
  function moi() { return moiId && D ? D.cById.get(moiId) || null : null; }

  // ---------------------------------------------------------------------
  // Barre du haut : profil, alertes, onglets
  // ---------------------------------------------------------------------
  function renderTop() {
    const m = moi();
    $('btn-moi').innerHTML = m
      ? avatar(m.name, 'var(--sequoia-green)') + '<span class="es-me">' + H(m.name) + '<small>' + H(m.fonction || 'Cluster SequoIA') + '</small></span>'
      : avatar('?', '#94a3b8') + '<span class="es-me">Qui êtes-vous ?<small>Choisir mon profil</small></span>';
    document.querySelectorAll('.es-tab').forEach(b => b.classList.toggle('on', b.dataset.vue === ui.vue));
    const alertes = E.alertesEspace({ projets: D.projets, actions: D.actions }, nowTs(), { vues: alertesVues });
    $('cloche-dot').hidden = !alertes.some(a => !a.vue);
  }

  function fermerPop() { $('pop-host').innerHTML = ''; }
  function ouvrirPop(html, ancre) {
    $('pop-host').innerHTML = '<div class="es-pop" style="left:' + ancre.offsetLeft + 'px">' + html + '</div>';
  }

  function popProfil(q) {
    const liste = D.contacts
      .filter(c => correspond(q || '', [c.name, c.fonction, nomsS(c.structureIds)]))
      .sort((a, b) => a.name.localeCompare(b.name, 'fr')).slice(0, 60);
    const items = liste.map(c =>
      '<button type="button" class="es-pop-item" data-moi="' + c.id + '">' + avatar(c.name, 'var(--sequoia-green)') +
      '<span>' + H(c.name) + '<span class="sub">' + H([c.fonction, nomsS(c.structureIds)].filter(Boolean).join(' · ')) + '</span></span></button>').join('');
    return '<h4>Qui êtes-vous ?</h4><input type="search" id="pop-q" placeholder="Rechercher un contact…" value="' + H(q || '') + '">' +
      '<div id="pop-list">' + (items || '<div class="es-pop-empty">Aucun contact.</div>') + '</div>' +
      (moiId ? '<button type="button" class="es-pop-item" data-moi="0">Ne plus me reconnaître</button>' : '');
  }

  function popAlertes() {
    const alertes = E.alertesEspace({ projets: D.projets, actions: D.actions }, nowTs(), { vues: alertesVues });
    if (!alertes.length) return '<h4>Alertes</h4><div class="es-pop-empty">Rien d’urgent.</div>';
    const ligne = a => '<button type="button" class="es-pop-item' + (a.vue ? '' : ' nouveau') + '" data-alerte="' + H(a.id) + '">' +
      '<span><span class="sub">' + H(a.type) + '</span>' + H(a.titre) + '<span class="sub">' + H(jRel(a.jours)) + '</span></span></button>';
    const nouvelles = alertes.filter(a => !a.vue), vues = alertes.filter(a => a.vue);
    return (nouvelles.length ? '<h4>Nouvelles</h4>' + nouvelles.map(ligne).join('') : '') +
      (vues.length ? '<h4>Déjà consultées</h4>' + vues.map(ligne).join('') : '');
  }

  // ---------------------------------------------------------------------
  // Graphiques (SVG dessiné à la main : pas de dépendance)
  // ---------------------------------------------------------------------
  function barresMensuelles(serie) {
    const W = 560, Hh = 170, pb = 22, pt = 10;
    const max = Math.max(1, ...serie.map(m => m.count));
    const bw = W / serie.length;
    const bars = serie.map((m, i) => {
      const h = ((Hh - pb - pt) * m.count) / max;
      const x = i * bw + bw * 0.18, y = Hh - pb - h;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) +
        '" rx="4" fill="' + (i === serie.length - 1 ? 'var(--sequoia-green)' : '#9cc3ab') + '"><title>' + H(m.label + ' ' + m.annee + ' : ' + m.count) + '</title></rect>' +
        (m.count ? '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (y - 3).toFixed(1) + '" text-anchor="middle">' + m.count + '</text>' : '') +
        '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (Hh - 6) + '" text-anchor="middle">' + H(m.label) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="Échanges par mois">' +
      '<line x1="0" x2="' + W + '" y1="' + (Hh - pb) + '" y2="' + (Hh - pb) + '" stroke="var(--border)"/>' + bars + '</svg>';
  }

  function donut(parts) {
    const total = parts.reduce((t, p) => t + p.value, 0) || 1;
    const R = 50, r = 32, c = 60;
    let a0 = -Math.PI / 2;
    const arcs = parts.map(p => {
      const a1 = a0 + (2 * Math.PI * p.value) / total;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const pt = (rad, a) => (c + rad * Math.cos(a)).toFixed(2) + ' ' + (c + rad * Math.sin(a)).toFixed(2);
      const d = parts.length === 1
        ? 'M ' + pt(R, 0) + ' A ' + R + ' ' + R + ' 0 1 1 ' + pt(R, Math.PI) + ' A ' + R + ' ' + R + ' 0 1 1 ' + pt(R, 0) +
          ' M ' + pt(r, 0) + ' A ' + r + ' ' + r + ' 0 1 0 ' + pt(r, Math.PI) + ' A ' + r + ' ' + r + ' 0 1 0 ' + pt(r, 0) + ' Z'
        : 'M ' + pt(R, a0) + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + pt(R, a1) + ' L ' + pt(r, a1) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 0 ' + pt(r, a0) + ' Z';
      a0 = a1;
      return '<path d="' + d + '" fill="' + p.color + '" fill-rule="evenodd"><title>' + H(p.label + ' : ' + p.value) + '</title></path>';
    }).join('');
    return '<svg viewBox="0 0 120 120" role="img" aria-label="Répartition">' + arcs +
      '<text x="60" y="58" text-anchor="middle" style="font-size:18px;font-weight:650;fill:var(--text)">' + total + '</text>' +
      '<text x="60" y="73" text-anchor="middle" style="font-size:9px;fill:var(--text-muted)">projets + échanges</text></svg>';
  }

  // Graphe de relations : nœuds structure / projet / contact, arêtes = liens.
  function graphe(nodes, edges, width, height) {
    if (!nodes.length) return '<div class="es-empty">Rien à relier pour l’instant.</div>';
    const pos = E.dispositionGraphe(nodes, edges, width, height, null, { haut: 24, droite: 190, bas: 24, gauche: 24 });
    const lignes = edges.filter(([a, b]) => pos[a] && pos[b]).map(([a, b]) =>
      '<line x1="' + pos[a].x + '" y1="' + pos[a].y + '" x2="' + pos[b].x + '" y2="' + pos[b].y + '"/>').join('');
    const pts = nodes.map(n => {
      const p = pos[n.id];
      return '<g class="nd" data-open="' + H(n.open) + '" tabindex="0"><circle cx="' + p.x + '" cy="' + p.y + '" r="' + n.r + '" fill="' + n.color + '"><title>' + H(n.label) + '</title></circle>' +
        (n.showLabel !== false ? '<text x="' + (p.x + n.r + 3) + '" y="' + (p.y + 3.5) + '">' + H(n.label.length > 28 ? n.label.slice(0, 27) + '…' : n.label) + '</text>' : '') + '</g>';
    }).join('');
    return '<svg viewBox="0 0 ' + width + ' ' + height + '">' + lignes + pts + '</svg>';
  }

  function grapheProjets(limite) {
    const projets = D.projets.filter(actif).slice(0, limite || 60);
    const sIds = new Set();
    const edges = [];
    projets.forEach(p => p.partnerIds.concat(p.teamIds).forEach(id => { if (D.sById.has(id)) { sIds.add(id); edges.push(['s' + id, 'p' + p.id]); } }));
    const nodes = Array.from(sIds).map(id => {
      const s = D.sById.get(id);
      const deg = edges.filter(e => e[0] === 's' + id).length;
      return { id: 's' + id, label: s.name, color: couleurStructure(s), r: 6 + Math.min(8, deg * 1.5), open: 'structure:' + id };
    }).concat(projets.map(p => ({ id: 'p' + p.id, label: p.title, color: stageColor(p.stage), r: 5, open: 'projet:' + p.id, showLabel: false })));
    return { nodes, edges };
  }

  const LEGENDE_GRAPHE = '<div class="es-graph-legend"><span><i style="background:#2563eb"></i>Économique</span>' +
    '<span><i style="background:#7c3aed"></i>Recherche / équipe</span><span><i style="background:#0891b2"></i>Institutionnel</span>' +
    '<span><i style="background:#f97316"></i>Projet (couleur d’étape — survoler pour le nom)</span></div>';

        '</b><button type="button" class="es-btn icon" data-annee="1" aria-label="Année suivante">›</button>' +
        '<span class="es-count" style="margin-left:8px">Du début à l’échéance · ' + rangs.length + ' projet' + (rangs.length > 1 ? 's' : '') + ' sur l’année' +
        (sansDate ? ' · ' + sansDate + ' sans date de début' : '') + '</span></div><div class="es-frise">' +

        rangs.map(({ p, seg }) => '<div class="es-frise-row"><span class="es-frise-lbl" data-open="projet:' + p.id + '" title="' + H(p.title) + '">' + H(p.title) + '</span>' +

        (rangs.length ? '' : '<div class="es-empty">Aucun projet daté sur ' + an + '.</div>') + '</div></div>';
    }
    return '<div class="es-inner">' + toolbar + corps + '</div>';
  }

  // ---------------------------------------------------------------------
  // Vue : partenaires
  // ---------------------------------------------------------------------
  const RELANCE_JOURS = 90; // au-delà, un partenaire est « à relancer », comme dans le CRM

  // Ce qu'on sait d'une structure en un coup d'œil : de quoi remplir la fiche,
  // les cartes et le tableau de la vision globale.
  function bilanStructure(s) {
    const now = nowTs();
    const projets = D.projets.filter(p => p.partnerIds.includes(s.id) || p.teamIds.includes(s.id));
    const contacts = D.contacts.filter(c => c.structureIds.includes(s.id));
    const echanges = D.echanges.filter(e => e.partnerIds.includes(s.id));
    const idsContacts = new Set(contacts.map(c => c.id));
    const idsProjets = new Set(projets.map(p => p.id));
    const actions = D.actions.filter(a => a.partnerIds.includes(s.id) || a.projectIds.some(id => idsProjets.has(id)) ||
      a.contactIds.some(id => idsContacts.has(id)));
    const der = echanges.length ? echanges[0].date : null; // échanges triés du plus récent au plus ancien
    const jours = der ? -E.joursAvant(der, now) : null;
    // Prochaine chose à faire : l'action ouverte la plus proche, sinon la
    // prochaine échéance notée sur un échange.
    const ouvertes = actions.filter(a => !a.done).sort((a, b) => (Number(a.due) || Infinity) - (Number(b.due) || Infinity));
    const echeanceEchange = echanges.filter(e => e.prochaine && E.joursAvant(e.prochaine, now) >= -30)
      .sort((a, b) => a.prochaine - b.prochaine)[0];
    const prochaine = ouvertes[0] ? { label: ouvertes[0].label, date: ouvertes[0].due, action: ouvertes[0].id }
      : echeanceEchange ? { label: echeanceEchange.suites || echeanceEchange.objet || 'Échéance', date: echeanceEchange.prochaine } : null;
    const actifs = projets.filter(actif);
    return {
      projets, actifs, contacts, echanges, actions, ouvertes, prochaine, der, jours,
      montant: sumMontants(actifs),
      aRelancer: !s.isTeam && !s.isProspect && (jours === null || jours > RELANCE_JOURS)
    };
  }

  function structuresFiltrees() {
    const f = ui.partenaires;
    return D.structures.filter(s => {
      const cat = f.filtre === 'tous' ? true : f.filtre === 'prospects' ? s.isProspect : f.filtre === 'equipes' ? s.isTeam
        : f.filtre === 'relancer' ? bilanStructure(s).aRelancer : (!s.isProspect && !s.isTeam);
      return cat && (!f.type || s.type === f.type) && correspond(f.q, [s.name, s.type, s.activite, s.axe, s.pilier, s.description]);
    });
  }
  function statsStructure(s) { return bilanStructure(s); }

  function logoStructure(s, grand) {
    if (s.logo && /^https?:\/\//i.test(s.logo)) {
      return '<span class="pa-logo' + (grand ? ' lg' : '') + '"><img src="' + H(s.logo) + '" alt="" loading="lazy"></span>';
    }
    return '<span class="pa-logo' + (grand ? ' lg' : '') + '" style="background:' + couleurStructure(s) + ';color:#fff">' + H(initials(s.name)) + '</span>';
  }

  function vuePartenaires() {
    const f = ui.partenaires;
    const liste = structuresFiltrees().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const types = Array.from(new Set(D.structures.map(s => s.type).filter(Boolean))).sort();
    const toolbar = '<div class="es-toolbar"><h1>Partenaires</h1>' +
      '<input class="es-search" data-q="partenaires" placeholder="Rechercher une structure…" value="' + H(f.q) + '">' +
      '<div class="es-seg">' + [['partenaires', 'Partenaires'], ['relancer', 'À relancer'], ['prospects', 'Prospects'], ['equipes', 'Équipes'], ['tous', 'Tous']].map(([k, l]) =>
        '<button type="button" data-set="partenaires.filtre" data-val="' + k + '" class="' + (f.filtre === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
      '<select class="es-select" data-set="partenaires.type"><option value="">Tous les types</option>' + types.map(t => '<option' + (t === f.type ? ' selected' : '') + '>' + H(t) + '</option>').join('') + '</select>' +
      '<span class="grow"></span><span class="es-count">' + liste.length + ' structure' + (liste.length > 1 ? 's' : '') + '</span>' +
      '<button type="button" class="es-btn" data-new="structures">+ Structure</button>' +
      '<div class="es-seg">' + [['fiche', 'Fiche'], ['tableau', 'Vue globale'], ['cartes', 'Cartes'], ['graphe', 'Graphe']].map(([k, l]) =>
        '<button type="button" data-set="partenaires.mode" data-val="' + k + '" class="' + (f.mode === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
    let corps;
    if (f.mode === 'fiche') corps = partenairesFiche(liste);
    else if (f.mode === 'tableau') corps = partenairesTableau(liste);
    else if (f.mode === 'graphe') {
      const ids = new Set(liste.map(s => s.id));
      const projets = D.projets.filter(p => p.partnerIds.concat(p.teamIds).some(id => ids.has(id)));
      const edges = [];
      projets.forEach(p => p.partnerIds.concat(p.teamIds).forEach(id => { if (ids.has(id)) edges.push(['s' + id, 'p' + p.id]); }));
      const lies = new Set(edges.map(e => e[0]));
      const nodes = liste.filter(s => lies.has('s' + s.id)).map(s => ({ id: 's' + s.id, label: s.name, color: couleurStructure(s),
        r: 6 + Math.min(9, edges.filter(e => e[0] === 's' + s.id).length * 1.5), open: 'structure:' + s.id }))
        .concat(projets.map(p => ({ id: 'p' + p.id, label: p.title, color: stageColor(p.stage), r: 5, open: 'projet:' + p.id, showLabel: projets.length <= 30 })));
      corps = '<div class="es-card es-graph">' + graphe(nodes, edges, 1100, 620) + LEGENDE_GRAPHE +
        '<div class="es-graph-legend">Seules les structures rattachées à au moins un projet apparaissent (' + (liste.length - nodes.filter(n => n.id[0] === 's').length) + ' sans projet).</div></div>';
    } else {
      corps = liste.length ? '<div class="es-cards">' + liste.map(s => {
        const b = bilanStructure(s);
        return '<article class="es-card es-scard" data-open="structure:' + s.id + '"><div class="es-scard-top">' + logoStructure(s, true) +
          '<div style="min-width:0"><b>' + H(s.name) + '</b><small>' + H([s.type, s.activite].filter(Boolean).join(' · ') || s.categorie || '—') + '</small></div></div>' +
          '<div class="es-stats"><div><b>' + b.actifs.length + '</b><span>projets</span></div><div><b>' + b.contacts.length +
          '</b><span>contacts</span></div><div><b>' + b.echanges.length + '</b><span>échanges</span></div></div>' +
          '<div class="last' + (b.aRelancer ? ' old' : '') + '">' + (b.jours === null ? 'Aucun échange enregistré' : 'Dernier échange ' + H(jRel(-b.jours))) + '</div></article>';
      }).join('') + '</div>' : '<div class="es-card"><div class="es-empty">Aucune structure.</div></div>';
    }
    return '<div class="es-inner">' + toolbar + corps + '</div>';
  }

  // ---- Vue globale : un tableau triable de toutes les structures ----
  function partenairesTableau(liste) {
    const f = ui.partenaires;
    const lignes = liste.map(s => ({ s, b: bilanStructure(s) }));
    const val = ({ s, b }, k) => k === 'nom' ? s.name : k === 'type' ? s.type : k === 'projets' ? b.actifs.length : k === 'montant' ? b.montant
      : k === 'contacts' ? b.contacts.length : k === 'echanges' ? b.echanges.length : k === 'dernier' ? (Number(b.der) || 0)
      : k === 'actions' ? b.ouvertes.length : k === 'prochaine' ? (b.prochaine && b.prochaine.date ? Number(b.prochaine.date) : Infinity) : '';
    lignes.sort((x, y) => {
      const a = val(x, f.tri), c = val(y, f.tri);
      const r = typeof a === 'number' ? a - c : String(a || '').localeCompare(String(c || ''), 'fr');
      return f.asc ? r : -r;
    });
    const cols = [['nom', 'Structure'], ['type', 'Type'], ['projets', 'Projets actifs'], ['montant', 'Montant'], ['contacts', 'Contacts'],
      ['echanges', 'Échanges'], ['dernier', 'Dernier contact'], ['actions', 'Actions ouvertes'], ['prochaine', 'Prochaine action']];
    const aRelancer = lignes.filter(x => x.b.aRelancer).length;
    return '<div class="pa-resume">' +
      '<span><b>' + lignes.length + '</b> structures</span><span><b>' + lignes.filter(x => x.b.actifs.length).length + '</b> avec un projet actif</span>' +
      '<span><b>' + H(formatMontantCompact(lignes.reduce((t, x) => t + x.b.montant, 0)) || '0 €') + '</b> en jeu</span>' +
      '<span class="' + (aRelancer ? 'alerte' : '') + '"><b>' + aRelancer + '</b> à relancer (sans contact depuis ' + RELANCE_JOURS + ' j)</span></div>' +
      '<div class="es-card es-table-wrap"><table class="es-table"><thead><tr>' + cols.map(([k, l]) =>
        '<th data-tri="partenaires" data-val="' + k + '" class="' + (f.tri === k ? 'sorted' + (f.asc ? ' asc' : '') : '') + '">' + l + '</th>').join('') +
      '</tr></thead><tbody>' + lignes.map(({ s, b }) =>
        '<tr data-sel-structure="' + s.id + '"><td class="ttl"><span style="display:inline-flex;gap:9px;align-items:center">' + logoStructure(s) + H(s.name) + '</span></td>' +
        '<td>' + H(s.type) + '</td><td class="num">' + b.actifs.length + '</td><td class="num">' + H(formatMontantOrDash(b.montant)) + '</td>' +
        '<td class="num">' + b.contacts.length + '</td><td class="num">' + b.echanges.length + '</td>' +
        '<td class="num' + (b.aRelancer ? ' pa-late' : '') + '">' + (b.der ? H(formatDate(b.der)) + ' <span class="es-muted">(' + b.jours + ' j)</span>' : '—') + '</td>' +
        '<td class="num">' + b.ouvertes.length + '</td>' +
        '<td>' + (b.prochaine ? H(excerpt(b.prochaine.label, 50)) + (b.prochaine.date ? ' <span class="es-muted">· ' + H(formatDate(b.prochaine.date)) + '</span>' : '') : '<span class="es-muted">—</span>') + '</td></tr>').join('') +
      '</tbody></table>' + (lignes.length ? '' : '<div class="es-empty">Aucune structure.</div>') + '</div>';
  }

  // ---- Fiche : la liste à gauche, la fiche 360° à droite (comme le CRM) ----
  function partenairesFiche(liste) {
    const f = ui.partenaires;
    if (!f.sel || !liste.some(s => s.id === f.sel)) f.sel = liste[0] ? liste[0].id : null;
    const items = liste.map(s => {
      const b = bilanStructure(s);
      return '<button type="button" class="pa-item' + (s.id === f.sel ? ' on' : '') + '" data-sel-structure="' + s.id + '">' + logoStructure(s) +
        '<span class="pa-item-txt"><b>' + H(s.name) + '</b><small>' + H([s.categorie || s.type, b.contacts.length ? b.contacts.length + ' contact' + (b.contacts.length > 1 ? 's' : '') : ''].filter(Boolean).join(' · ')) + '</small></span>' +
        (b.aRelancer ? '<span class="pa-dot" title="À relancer — ' + (b.jours === null ? 'aucun échange' : 'dernier contact il y a ' + b.jours + ' j') + '"></span>' : '') + '</button>';
    }).join('');
    const s = f.sel ? D.sById.get(f.sel) : null;
    return '<div class="pa-layout"><nav class="pa-list es-card" aria-label="Structures">' + (items || '<div class="es-empty">Aucune structure.</div>') + '</nav>' +
      '<div class="pa-fiche">' + (s ? ficheSeptante(s) : '<div class="es-card"><div class="es-empty">Sélectionnez une structure.</div></div>') + '</div></div>';
  }

  function panneau(titre, n, action, corps) {
    return '<section class="es-card pa-panel"><div class="pa-panel-head"><h3>' + H(titre) + '</h3>' +
      (n !== null && n !== undefined ? '<span class="pa-n">' + n + '</span>' : '') + (action || '') + '</div>' + corps + '</section>';
  }

  function ficheSeptante(s) {
    const f = ui.partenaires;
    const b = bilanStructure(s);
    const coul = couleurStructure(s);
    const badge = (texte, titre, cls, style) => texte ? '<span class="pa-badge' + (cls ? ' ' + cls : '') + '" title="' + H(titre) + '"' + (style ? ' style="' + style + '"' : '') + '>' + H(texte) + '</span>' : '';
    const tete = '<div class="es-card pa-head">' + logoStructure(s, true) + '<div class="pa-head-txt"><h2>' + H(s.name) + '</h2>' +
      '<div class="pa-pills">' +
      badge(s.type, "Type d'acteur", 'type', 'background:' + coul + '1a;color:' + coul + ';border-color:' + coul + '55') +
      badge(s.categorie, 'Catégorie', s.isProspect ? 'prospect' : 'cat') +
      badge(s.activite ? '◆ ' + s.activite : '', "Secteur d'activité", 'secteur') +
      badge(s.taille, 'Taille', 'taille') +
      '</div><div class="pa-pills">' + s.piliers.map(v => '<span class="value-pill ' + pilierClass(v) + '" title="Pilier SequoIA">' + H(v) + '</span>').join('') +
      s.axes.map(v => '<span class="pa-badge axe" title="Axe SequoIA">' + H(v) + '</span>').join('') +
      (s.site ? '<a class="es-link" href="' + H(/^https?:\/\//.test(s.site) ? s.site : 'https://' + s.site) + '" target="_blank" rel="noopener">' + H(s.site.replace(/^https?:\/\//, '')) + ' ↗</a>' : '') + '</div>' +
      (s.description ? '<p class="pa-desc">' + H(s.description) + '</p>' : '') + '</div>' +
      '<div class="pa-head-actions"><button type="button" class="es-btn" data-edit="structures:' + s.id + '">✎ Modifier</button>' +
      '<button type="button" class="es-btn primary" data-new="interactions" data-ctx="structure:' + s.id + '">+ Échange</button></div></div>';

    const kpi = (lbl, val, sub, warn, extra) => '<div class="es-card es-kpi"><div class="lbl">' + H(lbl) + '</div><div class="val' + (warn ? ' pa-late' : '') + '" style="font-size:22px">' + val + '</div>' + (extra || '') + '<div class="sub">' + sub + '</div></div>';
    const kpis = '<div class="es-kpis">' +
      kpi('Dernier contact', b.jours === null ? '—' : H(b.jours + ' j'), b.der ? H(formatDate(b.der)) : 'aucun échange', b.aRelancer && b.jours !== null,
        b.jours === null ? '' : meterMarkup(b.jours, RELANCE_JOURS, { unit: 'jours', label: b.jours > RELANCE_JOURS ? 'à relancer' : 'dans les temps' })) +
      kpi('Échanges', String(b.echanges.length), b.echanges.length ? 'depuis le début' : 'aucun') +
      kpi('Projets', String(b.actifs.length) + (b.montant ? ' · ' + H(formatMontantCompact(b.montant)) : ''), b.projets.length - b.actifs.length ? (b.projets.length - b.actifs.length) + ' terminé(s) ou abandonné(s)' : 'en cours ou en montage') +
      kpi('Prochaine action', b.prochaine ? '<span style="font-size:15px">' + H(excerpt(b.prochaine.label, 44)) + '</span>' : '—', b.prochaine && b.prochaine.date ? 'avant le ' + H(formatDate(b.prochaine.date)) : 'rien de planifié') +
      '</div>';

    const projetsHtml = b.projets.length ? '<div class="es-list pa-pad">' + b.projets.slice()
      .sort((x, y) => (actif(y) - actif(x)) || (stageRank(y.stage) - stageRank(x.stage)))
      .map(p => '<div class="es-row click" data-open="projet:' + p.id + '"><div style="min-width:0;flex:1"><div class="t">' + H(p.title) + '</div><div class="s">' +
        H([p.type, p.montant ? formatMontantCompact(p.montant) : '', p.echeance ? 'échéance ' + formatDate(p.echeance) : ''].filter(Boolean).join(' · ')) + '</div>' +
        barreTemps(p) + '</div>' + badgeEtape(p.stage) + '</div>').join('') + '</div>' : '<div class="es-empty">Aucun projet.</div>';

    const contactsHtml = b.contacts.length ? '<div class="es-list pa-pad">' + b.contacts.slice().sort((x, y) => (y.principal - x.principal) || x.name.localeCompare(y.name, 'fr'))
      .map(c => '<div class="es-row click" data-open="contact:' + c.id + '">' + avatar(c.name, 'var(--sequoia-green)') + '<div style="min-width:0;flex:1"><div class="t">' + H(c.name) +
        (c.principal ? ' <span class="es-imp" title="Contact principal">★</span>' : '') + '</div><div class="s">' + H([c.fonction, c.email].filter(Boolean).join(' · ')) + '</div></div>' +
        (c.email ? '<button type="button" class="es-x" data-copier="' + H(c.email) + '" title="Copier l’adresse" aria-label="Copier l’adresse">⧉</button>' : '') + '</div>').join('') + '</div>'
      : '<div class="es-empty">Aucun contact.</div>';
    const copierTous = b.contacts.filter(c => c.email).length > 1
      ? '<button type="button" class="es-btn pa-mini" data-copier="' + H(b.contacts.filter(c => c.email).map(c => c.email).join('; ')) + '">⧉ ' + b.contacts.filter(c => c.email).length + ' adresses</button>' : '';

    const actionsHtml = (b.ouvertes.length ? '<div class="es-list pa-pad">' + b.ouvertes.map(ligneAction).join('') + '</div>' : '<div class="es-empty">Aucune action en cours.</div>') +
      (related.actions.tableId ? '<form class="es-form pa-pad" data-ajout-action-structure="' + s.id + '" style="margin-top:0;padding-bottom:14px"><input class="grow" name="label" placeholder="Nouvelle action…" required><input type="date" name="due"><button class="es-btn primary" type="submit">Ajouter</button></form>' : '');

    const tous = f.toutDeplier;
    const echHtml = b.echanges.length ? '<div class="pa-timeline">' + b.echanges.map(e => {
      const ouvert = tous || f.deplies.has(e.id);
      const qui = e.contactIds.map(id => (D.cById.get(id) || {}).name).filter(Boolean).join(', ');
      const autres = e.partnerIds.filter(id => id !== s.id).map(nomS).join(', ');
      const projets = e.projectIds.map(id => D.pById.get(id)).filter(Boolean);
      return '<article class="pa-ech' + (ouvert ? ' open' : '') + '"><button type="button" class="pa-ech-head" data-deplier="' + e.id + '" aria-expanded="' + ouvert + '">' +
        '<span class="pa-ech-date">' + H(e.date ? formatDate(e.date) : '—') + '</span><span class="pa-ech-txt"><b>' + H([e.type, e.objet].filter(Boolean).join(' · ') || 'Sans objet') + '</b>' +
        '<small>' + H([qui, autres ? 'avec ' + autres : ''].filter(Boolean).join(' · ')) + '</small>' +
        (!ouvert && e.cr ? '<small class="pa-ech-ext">' + H(excerpt(e.cr, 160)) + '</small>' : '') + '</span>' +
        '<span class="pa-ech-icons">' + (e.pj.length ? '📎 ' + e.pj.length : '') + (e.crBrut ? ' <span title="Compte rendu">CR</span>' : '') + '</span></button>' +
        (ouvert ? '<div class="pa-ech-body">' +
          '<div class="pa-ech-tools"><button type="button" class="es-btn pa-mini" data-open="echange:' + e.id + '">📖 Lire en grand</button>' +
          '<button type="button" class="es-btn pa-mini" data-edit="interactions:' + e.id + '">✎ Modifier l’échange</button></div>' +
          (projets.length ? '<div class="pa-pills" style="margin:0 0 8px">' + projets.map(p => '<button type="button" class="es-pill" data-open="projet:' + p.id + '">' + H(p.title) + ' <small>projet</small></button>').join('') + '</div>' : '') +
          (e.crBrut ? '<div class="pa-cr" data-cr="' + e.id + '"></div>' : '<div class="es-muted" style="font-style:italic;font-size:13px">Pas de compte rendu.</div>') +
          (e.suites || e.prochaine ? '<div class="pa-suites"><b>Suites</b> ' + H(e.suites || '') + (e.prochaine ? ' <span class="es-muted">· échéance ' + H(formatDate(e.prochaine)) + '</span>' : '') + '</div>' : '') +
          (e.pj.length ? '<div class="pa-pj">' + e.pj.map(id => '<button type="button" class="es-pill" data-pj="' + id + '">📎 <span data-pj-nom="' + id + '">Pièce jointe #' + id + '</span></button>').join('') + '</div>' : '') +
          '</div>' : '') + '</article>';
    }).join('') + '</div>' : '<div class="es-empty">Aucun échange enregistré.</div>';
    const toggle = b.echanges.length ? '<button type="button" class="es-btn pa-mini" data-toggle="partenaires.toutDeplier">' + (tous ? 'Tout replier' : 'Tout déplier') + '</button>' : '';

    return tete + kpis + '<div class="pa-grid"><div class="pa-col">' +
      panneau('Projets', b.projets.length, '<button type="button" class="es-btn pa-mini" data-new="opportunites" data-ctx="structure:' + s.id + '">+ Opportunité</button>', projetsHtml) +
      panneau('Contacts', b.contacts.length, copierTous + '<button type="button" class="es-btn pa-mini' + (copierTous ? ' pa-mini2' : '') + '" data-new="contacts" data-ctx="structure:' + s.id + '">+ Contact</button>', contactsHtml) +
      '</div><div class="pa-col">' +
      panneau('Actions', b.ouvertes.length, '', actionsHtml) +
      panneau('Historique des échanges', b.echanges.length, toggle, echHtml) +
      '</div></div>';
  }

  // Les comptes rendus dépliés : HTML nettoyé (DOMPurify) et images servies par
  // le document. Fait après le rendu, le HTML ne transitant pas par une chaîne.
  const nomsPj = {};
  function remplirComptesRendus() {
    document.querySelectorAll('[data-cr]').forEach(el => {
      const e = D.eById.get(Number(el.dataset.cr));
      if (!e) return;
      el.innerHTML = normalizeCrToHtml(e.crBrut);
      resolveImagesIn(el);
    });
    const poser = (id, m) => {
      document.querySelectorAll('[data-pj-nom="' + id + '"]').forEach(el => { el.textContent = m.fileName; });
      document.querySelectorAll('[data-pj-taille="' + id + '"]').forEach(el => { el.textContent = m.fileSize ? formatTaille(m.fileSize) : ''; });
    };
    document.querySelectorAll('[data-pj-nom]').forEach(el => {
      const id = el.dataset.pjNom;
      if (nomsPj[id]) { poser(id, nomsPj[id]); return; }
      getAttachmentMeta(id).then(m => { nomsPj[id] = m; poser(id, m); }).catch(() => {});
    });
  }

  // ---------------------------------------------------------------------
  // Vue : contacts
  // ---------------------------------------------------------------------
  function vueContacts() {
    const f = ui.contacts;
    const liste = D.contacts.filter(c => correspond(f.q, [c.name, c.fonction, c.email, nomsS(c.structureIds)]));
    const nEch = (c) => D.echanges.filter(e => e.contactIds.includes(c.id));
    const toolbar = '<div class="es-toolbar"><h1>Contacts</h1>' +
      '<input class="es-search" data-q="contacts" placeholder="Rechercher un nom, une fonction, une structure…" value="' + H(f.q) + '">' +
      '<span class="grow"></span><span class="es-count">' + liste.length + ' contact' + (liste.length > 1 ? 's' : '') + '</span>' +
      '<button type="button" class="es-btn" data-new="contacts">+ Contact</button>' +
      '<div class="es-seg">' + [['tableau', 'Tableau'], ['graphe', 'Graphe']].map(([k, l]) =>
        '<button type="button" data-set="contacts.mode" data-val="' + k + '" class="' + (f.mode === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
    let corps;
    if (f.mode === 'graphe') {
      const edges = [];
      const sIds = new Set();
      liste.forEach(c => c.structureIds.forEach(id => { if (D.sById.has(id)) { sIds.add(id); edges.push(['c' + c.id, 's' + id]); } }));
      const nodes = Array.from(sIds).map(id => { const s = D.sById.get(id); return { id: 's' + id, label: s.name, color: couleurStructure(s), r: 9, open: 'structure:' + id }; })
        .concat(liste.map(c => ({ id: 'c' + c.id, label: c.name, color: '#94a3b8', r: 4.5, open: 'contact:' + c.id, showLabel: liste.length <= 40 })));
      corps = '<div class="es-card es-graph">' + graphe(nodes, edges, 1100, 620) +
        '<div class="es-graph-legend"><span><i style="background:#94a3b8"></i>Contact</span><span>Les grands points sont les structures.</span></div></div>';
    } else {
      const val = (c, k) => k === 'structures' ? nomsS(c.structureIds) : k === 'echanges' ? nEch(c).length
        : k === 'dernier' ? (Number((nEch(c)[0] || {}).date) || 0) : c[k === 'nom' ? 'name' : k];
      const tri = liste.slice().sort((a, b) => {
        const x = val(a, f.tri), y = val(b, f.tri);
        const r = typeof x === 'number' ? x - y : String(x || '').localeCompare(String(y || ''), 'fr');
        return f.asc ? r : -r;
      });
      const cols = [['nom', 'Nom'], ['fonction', 'Fonction'], ['structures', 'Structure(s)'], ['email', 'Email'], ['echanges', 'Échanges'], ['dernier', 'Dernier échange']];
      corps = '<div class="es-card es-table-wrap"><table class="es-table"><thead><tr>' + cols.map(([k, l]) =>
        '<th data-tri="contacts" data-val="' + k + '" class="' + (f.tri === k ? 'sorted' + (f.asc ? ' asc' : '') : '') + '">' + l + '</th>').join('') +
        '</tr></thead><tbody>' + tri.map(c => {
          const e = nEch(c);
          return '<tr data-open="contact:' + c.id + '"><td class="ttl"><span style="display:inline-flex;gap:8px;align-items:center">' + avatar(c.name, '#64748b') + H(c.name) +
            '</span></td><td>' + H(c.fonction) + '</td><td>' + H(nomsS(c.structureIds)) + '</td><td>' + H(c.email) +
            '</td><td class="num">' + e.length + '</td><td class="num">' + H(e[0] ? formatDate(e[0].date) : '—') + '</td></tr>';
        }).join('') + '</tbody></table>' + (tri.length ? '' : '<div class="es-empty">Aucun contact.</div>') + '</div>';
    }
    return '<div class="es-inner">' + toolbar + corps + '</div>';
  }

  // ---------------------------------------------------------------------
  // Vue : actions
  // ---------------------------------------------------------------------
  function actionsFiltrees() {
    const f = ui.actions;
    const m = moi();
    return D.actions.filter(a =>
      (f.faites || !a.done) &&
      (!f.miennes || (m && a.contactIds.includes(m.id))) &&
      correspond(f.q, [a.label, a.notes, a.projectIds.map(id => (D.pById.get(id) || {}).title).join(' '), nomsS(a.partnerIds)]));
  }
  function carteAction(a) {
    const j = a.due ? E.joursAvant(a.due, nowTs()) : null;
    const ctx = a.projectIds.map(id => (D.pById.get(id) || {}).title).filter(Boolean).concat(nomsS(a.partnerIds) ? [nomsS(a.partnerIds)] : []).join(' · ');
    const qui = a.contactIds.map(id => (D.cById.get(id) || {}).name).filter(Boolean).join(', ');
    return '<article class="es-card es-acard' + (a.done ? ' fait' : '') + '" draggable="true" data-drag-action="' + a.id + '" data-open="action:' + a.id + '">' +
      '<input type="checkbox" data-fait="' + a.id + '"' + (a.done ? ' checked' : '') + (related.actions.cols.Fait ? '' : ' disabled') + ' aria-label="Faite">' +
      '<div style="min-width:0"><div class="lbl">' + (a.important ? '<span class="es-imp" title="Importante">★</span> ' : '') + H(a.label) + '</div>' +
      '<div class="meta">' + (a.due ? '<span class="due' + (j < 0 && !a.done ? ' late' : '') + '">' + H(formatDate(a.due)) + '</span>' : 'Sans échéance') +
      (ctx ? ' · ' + H(ctx) : '') + (qui ? '<br>' + H(qui) : '') + '</div></div></article>';
  }
  function colonnesActions(liste) {
    const now = nowTs();
    if (related.actions.cols.Statut) {
      const ordre = statutActionChoices.length ? statutActionChoices : Array.from(new Set(liste.map(a => a.statut).filter(Boolean)));
      return { draggable: true, groupes: E.grouper(liste, a => a.statut, ordre, 'Sans statut') };
    }
    const cle = (a) => {
      if (a.done) return 'Faites';
      if (!a.due) return 'Sans échéance';
      const j = E.joursAvant(a.due, now);
      return j < 0 ? 'En retard' : j <= 7 ? 'Cette semaine' : 'Plus tard';
    };
    return { draggable: false, groupes: E.grouper(liste, cle, ['En retard', 'Cette semaine', 'Plus tard', 'Sans échéance'].concat(ui.actions.faites ? ['Faites'] : [])) };
  }
  function vueActions() {
    const f = ui.actions;
    if (!related.actions.tableId) {
      return '<div class="es-inner"><div class="es-toolbar"><h1>Actions</h1></div><div class="es-card"><div class="es-empty">Aucune table d’actions dans ce document (Actions_MP ou Actions).</div></div></div>';
    }
    const liste = actionsFiltrees();
    const toolbar = '<div class="es-toolbar"><h1>Actions</h1>' +
      '<input class="es-search" data-q="actions" placeholder="Rechercher une action, un projet…" value="' + H(f.q) + '">' +
      (moi() ? '<button type="button" class="es-btn' + (f.miennes ? ' primary' : '') + '" data-toggle="actions.miennes">Mes actions</button>' : '') +
      '<button type="button" class="es-btn' + (f.faites ? ' primary' : '') + '" data-toggle="actions.faites">Voir les faites</button>' +
      '<span class="grow"></span><span class="es-count">' + liste.filter(a => !a.done).length + ' ouverte(s)</span>' +
      '<div class="es-seg">' + [['kanban', 'Kanban'], ['calendrier', 'Calendrier']].map(([k, l]) =>
        '<button type="button" data-set="actions.mode" data-val="' + k + '" class="' + (f.mode === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
    let corps;
    if (f.mode === 'calendrier') {
      const base = f.mois ? new Date(f.mois) : new Date();
      const premier = new Date(base.getFullYear(), base.getMonth(), 1);
      const decal = (premier.getDay() + 6) % 7;
      const debut = new Date(premier); debut.setDate(1 - decal);
      const cleJour = (d) => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      const parJour = {};
      const poser = (ts, html) => { const d = new Date(Number(ts) * 1000); const k = d.getUTCFullYear() + '-' + d.getUTCMonth() + '-' + d.getUTCDate(); (parJour[k] = parJour[k] || []).push(html); };
      const now = nowTs();
      liste.forEach(a => { if (a.due) poser(a.due, '<span class="es-chip' + (a.done ? ' fait' : E.joursAvant(a.due, now) < 0 ? ' late' : '') + '" data-open="action:' + a.id + '" title="' + H(a.label) + '">' + H(a.label) + '</span>'); });
      D.projets.filter(actif).forEach(p => { if (p.echeance) poser(p.echeance, '<span class="es-chip projet" data-open="projet:' + p.id + '" title="Échéance : ' + H(p.title) + '">⚑ ' + H(p.title) + '</span>'); });
      const auj = cleJour(new Date());
      let cases = '';
      for (let i = 0; i < 42; i++) {
        const d = new Date(debut); d.setDate(debut.getDate() + i);
        const k = cleJour(d);
        cases += '<div class="es-day' + (d.getMonth() !== premier.getMonth() ? ' autre' : '') + (k === auj ? ' auj' : '') + '"><span class="num">' + d.getDate() + '</span>' + (parJour[k] || []).join('') + '</div>';
      }
      const sansDate = liste.filter(a => !a.due && !a.done).length;
      corps = '<div class="es-card"><div class="es-cal-head"><button type="button" class="es-btn icon" data-mois="-1" aria-label="Mois précédent">‹</button><b style="text-transform:capitalize;min-width:150px">' +
        H(premier.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })) + '</b><button type="button" class="es-btn icon" data-mois="1" aria-label="Mois suivant">›</button>' +
        '<button type="button" class="es-btn" data-mois="0">Aujourd’hui</button><span class="es-count" style="margin-left:8px">⚑ = échéance de projet' +
        (sansDate ? ' · ' + sansDate + ' action(s) sans échéance' : '') + '</span></div>' +
        '<div class="es-month">' + ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(n => '<div class="dname">' + n + '</div>').join('') + cases + '</div></div>';
    } else {
      const { draggable, groupes } = colonnesActions(liste);
      corps = (draggable ? '' : '<div class="es-count">Colonnes calculées d’après l’échéance — ajoutez une colonne « Statut » à la table des actions pour un kanban libre.</div>') +
        '<div class="es-board">' + groupes.map(g =>
          '<div class="es-col"' + (draggable ? ' data-drop-statut="' + H(g.cle) + '"' : '') + '><div class="es-col-head">' + H(g.cle) +
          '<span class="n">' + g.elements.length + '</span></div><div class="es-col-cards">' + g.elements
            .sort((a, b) => (a.done - b.done) || ((Number(a.due) || Infinity) - (Number(b.due) || Infinity))).map(carteAction).join('') + '</div></div>').join('') + '</div>';
    }
    return '<div class="es-inner">' + toolbar + corps + '</div>';
  }

  // ---------------------------------------------------------------------
  // Fiche latérale
  // ---------------------------------------------------------------------
  function ligneEchange(e) {
    return '<div class="es-row click" data-open="echange:' + e.id + '" title="Lire le compte rendu"><span class="d">' + H(e.date ? formatDate(e.date) : '—') + '</span><div style="min-width:0">' +
      '<div class="t">' + H([e.type, e.objet].filter(Boolean).join(' · ') || 'Sans objet') + '</div>' +
      (e.partnerIds.length ? '<div class="s">' + H(nomsS(e.partnerIds)) + '</div>' : '') +
      (e.cr ? '<div class="cr">' + H(e.cr) + '</div>' : '') +
      (e.crBrut ? '<span class="lire-cr">📖 Lire le compte rendu</span>' : '') + '</div>' +
      '<button type="button" class="es-x ed-crayon" data-edit="interactions:' + e.id + '" title="Modifier l’échange" aria-label="Modifier l’échange">✎</button></div>';
  }
  // Un échange en pleine page : de quoi lire un compte rendu confortablement.
  function ficheEchange(e, retour) {
    const qui = e.contactIds.map(id => D.cById.get(id)).filter(Boolean);
    const projets = e.projectIds.map(id => D.pById.get(id)).filter(Boolean);
    const head = '<div class="es-sheet-top">' + (retour ? '<button type="button" class="es-btn" data-retour>← Retour</button>' : '') +
      (e.type ? '<span class="es-badge">' + H(e.type) + '</span>' : '') + '<span class="es-muted" style="font-size:13px">' + H(e.date ? formatDate(e.date) : '') + '</span>' +
      '<span class="ed-actions"><button type="button" class="es-btn" data-edit="interactions:' + e.id + '">✎ Modifier</button></span>' +
      '<button type="button" class="es-btn icon close" data-close aria-label="Fermer">✕</button></div>' +
      '<h2>' + H(e.objet || 'Sans objet') + '</h2>' +
      '<div class="es-pills">' + e.partnerIds.map(id => '<button type="button" class="es-pill" data-open="structure:' + id + '">' + H(nomS(id)) + '</button>').join('') +
      projets.map(p => '<button type="button" class="es-pill" data-open="projet:' + p.id + '">' + H(p.title) + ' <small>projet</small></button>').join('') + '</div>' +
      (qui.length ? '<div class="lecture-qui">' + qui.map(c => '<button type="button" class="lecture-personne" data-open="contact:' + c.id + '">' + avatar(c.name, '#64748b') + H(c.name) + '</button>').join('') + '</div>' : '');
    const body = (e.crBrut ? '<article class="lecture-cr" data-cr="' + e.id + '"></article>' : vide('Pas de compte rendu pour cet échange.')) +
      (e.suites || e.prochaine ? '<div class="es-section"><h5>Suites</h5><div class="es-note">' + H(e.suites || '') + (e.prochaine ? '\nÉchéance : ' + H(formatDate(e.prochaine)) : '') + '</div></div>' : '') +
