<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pipeline opportunités</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="./common.css">
<script src="./common.js"></script>
<style>
  body { overflow: hidden; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar .search-box { width: 280px; }
  .topbar .search-box input {
    width: 100%;
    padding: 8px 12px 8px 30px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    background: var(--bg);
  }

  .board {
    display: flex;
    gap: 14px;
    padding: 16px 20px;
    height: calc(100vh - 57px);
    overflow-x: auto;
    overflow-y: hidden;
    align-items: flex-start;
  }

  .column {
    background: #eef1ef;
    border-radius: 12px;
    min-width: 260px;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }

  .column-header {
    padding: 12px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--sequoia-green-dark);
  }

  .column-count {
    background: #fff;
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .column-cards {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }

  .column-cards.dragover { background: var(--sequoia-green-light); border-radius: 8px; }

  .opp-card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    cursor: grab;
  }
  .opp-card:active { cursor: grabbing; }
  .opp-card .opp-title {
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .opp-card .opp-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .opp-card .opp-tag {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--sequoia-green-light);
    color: var(--sequoia-green-dark);
    font-weight: 600;
  }
  .opp-card .opp-date { font-size: 11px; color: var(--text-muted); }

  .empty-board { padding: 40px; text-align: center; color: var(--text-muted); width: 100%; }

  /* Detail modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: #fff; border-radius: 14px; max-width: 480px; width: 90%;
    padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal h2 { margin: 0 0 12px; font-size: 19px; }
  .modal .close-btn {
    float: right; border: none; background: none; font-size: 18px;
    cursor: pointer; color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 Rechercher une opportunité...">
  </div>
</div>

<div class="board" id="board">
  <div class="empty-board">Chargement…</div>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" id="modal-content"></div>
</div>

<script>
  const COLUMNS = [
    { name: 'Sujet', optional: false },
    { name: 'Type', optional: true },
    { name: 'Partenaires', title: 'Partenaire(s)', optional: true },
    { name: 'EtablissementCluster', title: 'Etablissement(s) Cluster', optional: true },
    { name: 'LaboratoireCluster', title: 'Laboratoire(s) Cluster', optional: true },
    { name: 'EquipeCluster', title: 'Equipe(s) Cluster', optional: true },
    { name: 'AxeSequoia', title: 'Axe SequoIA', optional: true },
    { name: 'Statut', optional: false },
    { name: 'ContactCluster', title: 'Contact(s) Cluster', optional: true },
    { name: 'ContactPartenaire', title: 'Contact(s) partenaire', optional: true },
    { name: 'DateDebut', title: 'Date de début', optional: true },
    { name: 'Echeance', title: 'Echéance', optional: true },
    { name: 'Montant', title: 'Montant (€)', optional: true },
    { name: 'Commentaire', optional: true }
  ];

  let allRecords = [];
  let currentMappings = null;
  const STATUS_ORDER = []; // preserves first-seen order across renders

  grist.ready({ requiredAccess: 'full', columns: COLUMNS });

  function matchesQuery(o, query) {
    if (!query) return true;
    const haystack = [o.Sujet, o.Type, o.AxeSequoia, formatValue(o.Partenaires)]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(query);
  }

  function groupByStatus(records) {
    const groups = {};
    records.forEach(o => {
      const status = o.Statut || 'Sans statut';
      if (!STATUS_ORDER.includes(status)) STATUS_ORDER.push(status);
      (groups[status] = groups[status] || []).push(o);
    });
    return groups;
  }

  function renderBoard() {
    const query = (document.getElementById('search').value || '').trim().toLowerCase();
    const filtered = allRecords.filter(o => matchesQuery(o, query));
    const groups = groupByStatus(allRecords); // build/maintain full status list from all data
    const board = document.getElementById('board');

    if (allRecords.length === 0) {
      board.innerHTML = '<div class="empty-board">Aucune opportunité.</div>';
      return;
    }

    board.innerHTML = '';
    STATUS_ORDER.forEach(status => {
      const cardsForStatus = filtered.filter(o => (o.Statut || 'Sans statut') === status);
      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML =
        '<div class="column-header"><span>' + escapeHtml(status) + '</span>' +
        '<span class="column-count">' + cardsForStatus.length + '</span></div>' +
        '<div class="column-cards" data-status="' + escapeHtml(status) + '"></div>';
      board.appendChild(col);

      const cardsEl = col.querySelector('.column-cards');
      cardsForStatus.forEach(o => cardsEl.appendChild(buildCard(o)));

      cardsEl.addEventListener('dragover', (e) => { e.preventDefault(); cardsEl.classList.add('dragover'); });
      cardsEl.addEventListener('dragleave', () => cardsEl.classList.remove('dragover'));
      cardsEl.addEventListener('drop', async (e) => {
        e.preventDefault();
        cardsEl.classList.remove('dragover');
        const id = Number(e.dataTransfer.getData('text/plain'));
        const newStatus = cardsEl.dataset.status;
        const record = allRecords.find(r => r.id === id);
        if (!record || record.Statut === newStatus) return;
        record.Statut = newStatus; // optimistic
        renderBoard();
        try {
          await grist.getTable().update({ id, fields: { [currentMappings.Statut]: newStatus } });
        } catch (err) {
          console.error(err);
        }
      });
    });
  }

  function buildCard(o) {
    const card = document.createElement('div');
    card.className = 'opp-card';
    card.draggable = true;
    card.innerHTML =
      '<div class="opp-title">' + escapeHtml(o.Sujet || 'Sans sujet') + '</div>' +
      '<div class="opp-tags">' +
        (o.Type ? '<span class="opp-tag">' + escapeHtml(o.Type) + '</span>' : '') +
        (o.AxeSequoia ? '<span class="opp-tag">' + escapeHtml(o.AxeSequoia) + '</span>' : '') +
      '</div>' +
      '<div class="opp-date">' + [formatDate(o.DateDebut), formatMontant(o.Montant)].filter(Boolean).join(' · ') + '</div>';

    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', String(o.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('click', () => {
      grist.setCursorPos({ rowId: o.id }).catch(() => {});
      openModal(o);
    });
    return card;
  }

  function openModal(o) {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modal-content');
    content.innerHTML =
      '<button class="close-btn" id="modal-close">✕</button>' +
      '<h2>' + escapeHtml(o.Sujet || 'Sans sujet') + '</h2>' +
      '<div class="tags">' +
        (o.Type ? '<span class="tag">' + escapeHtml(o.Type) + '</span>' : '') +
        (o.AxeSequoia ? '<span class="tag">' + escapeHtml(o.AxeSequoia) + '</span>' : '') +
        (o.Statut ? '<span class="tag">' + escapeHtml(o.Statut) + '</span>' : '') +
      '</div>' +
      '<div class="info-grid">' +
        '<div class="info-item"><div class="label">Partenaire(s)</div><div class="value">' + escapeHtml(formatValue(o.Partenaires)) + '</div></div>' +
        '<div class="info-item"><div class="label">Date de début</div><div class="value">' + escapeHtml(formatDate(o.DateDebut)) + '</div></div>' +
        '<div class="info-item"><div class="label">Échéance</div><div class="value">' + escapeHtml(formatDate(o.Echeance) || formatValue(o.Echeance)) + '</div></div>' +
        '<div class="info-item"><div class="label">Montant</div><div class="value">' + escapeHtml(formatMontant(o.Montant)) + '</div></div>' +
        '<div class="info-item"><div class="label">Etablissement(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.EtablissementCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Laboratoire(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.LaboratoireCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Equipe(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.EquipeCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Contact(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.ContactCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Contact(s) partenaire</div><div class="value">' + escapeHtml(formatValue(o.ContactPartenaire)) + '</div></div>' +
      '</div>' +
      '<div class="section-title">Commentaire</div>' +
      '<div class="comment-box" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13.5px;white-space:pre-wrap;">' +
        (o.Commentaire ? escapeHtml(o.Commentaire) : '<span style="color:var(--text-muted);font-style:italic;">Aucun commentaire.</span>') +
      '</div>';
    modal.hidden = false;
    document.getElementById('modal-close').addEventListener('click', () => { modal.hidden = true; });
  }

  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') document.getElementById('modal').hidden = true;
  });

  grist.onRecords(function (records, mappings) {
    currentMappings = mappings;
    allRecords = mapRecords(records, mappings);
    renderBoard();
  });

  document.getElementById('search').addEventListener('input', renderBoard);
</script>

</body>
</html>
