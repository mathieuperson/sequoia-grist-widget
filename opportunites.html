<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pipeline opportunités</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="./common.css">
<script src="./common.js"></script>
<style>
  body { overflow: hidden; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 15px; margin: 0; color: var(--text); }
  .topbar .btn-new { width: auto; margin-top: 0; padding: 8px 16px; }

  .board {
    display: flex;
    gap: 14px;
    padding: 16px 20px;
    height: calc(100vh - 53px);
    overflow-x: auto;
    overflow-y: hidden;
    align-items: flex-start;
  }

  .column {
    background: #eef1ef;
    border-radius: 12px;
    border-top: 4px solid var(--status-default);
    min-width: 260px;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }

  .column-header {
    padding: 12px 14px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .column-header .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .column-header span.label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .column-count {
    background: #fff;
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .column-cards {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }

  .column-cards.dragover { background: var(--sequoia-green-light); border-radius: 8px; }

  .opp-card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    cursor: grab;
  }
  .opp-card:active { cursor: grabbing; }
  .opp-card .opp-title {
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .opp-card .opp-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .opp-card .opp-tag {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--sequoia-green-light);
    color: var(--sequoia-green-dark);
    font-weight: 600;
  }
  .opp-card .opp-date { font-size: 11px; color: var(--text-muted); }

  .empty-board { padding: 40px; text-align: center; color: var(--text-muted); width: 100%; }

  /* Detail modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: #fff; border-radius: 14px; max-width: 480px; width: 90%;
    max-height: 85vh; overflow-y: auto;
    padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal h2 { margin: 0 0 4px; font-size: 19px; }
  .modal .close-btn {
    float: right; border: none; background: none; font-size: 18px;
    cursor: pointer; color: var(--text-muted);
  }
  .modal .sujet-input {
    width: 100%;
    font-size: 19px;
    font-weight: 700;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 2px 0;
    margin-bottom: 4px;
    font-family: inherit;
    color: var(--text);
  }
  .modal .sujet-input:hover { border-bottom-color: var(--border); }
  .modal .sujet-input:focus { outline: none; border-bottom-color: var(--sequoia-green); }

  .modal .tags { margin-bottom: 16px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 11px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Pipeline opportunités</h1>
  <button class="btn-new" id="btn-new">+ Nouvelle opportunité</button>
</div>

<div class="board" id="board">
  <div class="empty-board">Chargement…</div>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" id="modal-content"></div>
</div>

<div class="form-modal-backdrop" id="create-modal" hidden>
  <div class="form-modal">
    <button class="form-modal-close" id="create-close">✕</button>
    <h2 class="form-modal-title">Nouvelle opportunité</h2>
    <div class="form-modal-grid">
      <div class="form-field full"><label>Sujet</label><input id="new-sujet" autofocus></div>
      <div class="form-field"><label>Type</label><input id="new-type"></div>
      <div class="form-field"><label>Statut</label><select id="new-statut"></select></div>
      <div class="form-field"><label>Axe SequoIA</label><input id="new-axe"></div>
      <div class="form-field"><label>Date de début</label><input id="new-date-debut" type="date"></div>
      <div class="form-field"><label>Échéance</label><input id="new-echeance" type="date"></div>
      <div class="form-field"><label>Montant (€)</label><input id="new-montant" type="number"></div>
      <div class="form-field full"><label>Commentaire</label><textarea id="new-commentaire"></textarea></div>
      <div class="form-modal-note">Le(s) partenaire(s) et contact(s) associés ne sont pas modifiables depuis ce widget : renseignez-les depuis la table Opportunités dans Grist si besoin.</div>
    </div>
    <div class="form-modal-actions">
      <button class="btn-secondary" id="create-cancel">Annuler</button>
      <button class="btn-primary" id="create-submit">Créer</button>
    </div>
  </div>
</div>

<script>
  const COLUMNS = [
    { name: 'Sujet', optional: false },
    { name: 'Type', optional: true },
    { name: 'Partenaires', title: 'Partenaire(s)', optional: true },
    { name: 'EtablissementCluster', title: 'Etablissement(s) Cluster', optional: true },
    { name: 'LaboratoireCluster', title: 'Laboratoire(s) Cluster', optional: true },
    { name: 'EquipeCluster', title: 'Equipe(s) Cluster', optional: true },
    { name: 'AxeSequoia', title: 'Axe SequoIA', optional: true },
    { name: 'Statut', optional: false },
    { name: 'ContactCluster', title: 'Contact(s) Cluster', optional: true },
    { name: 'ContactPartenaire', title: 'Contact(s) partenaire', optional: true },
    { name: 'DateDebut', title: 'Date de début', optional: true },
    { name: 'Echeance', title: 'Echéance', optional: true },
    { name: 'Montant', title: 'Montant (€)', optional: true },
    { name: 'Commentaire', optional: true }
  ];

  let allRecords = [];
  let currentMappings = null;
  const STATUS_ORDER = []; // preserves first-seen order across renders

  grist.ready({ requiredAccess: 'full', columns: COLUMNS, allowSelectBy: true });

  function groupByStatus(records) {
    const groups = {};
    records.forEach(o => {
      const status = o.Statut || 'Sans statut';
      if (!STATUS_ORDER.includes(status)) STATUS_ORDER.push(status);
      (groups[status] = groups[status] || []).push(o);
    });
    return groups;
  }

  function renderBoard() {
    groupByStatus(allRecords); // maintain the full status list from all data
    const board = document.getElementById('board');

    if (allRecords.length === 0) {
      board.innerHTML = '<div class="empty-board">Aucune opportunité. Cliquez sur "+ Nouvelle opportunité" pour en créer une.</div>';
      return;
    }

    board.innerHTML = '';
    STATUS_ORDER.forEach(status => {
      const cardsForStatus = allRecords.filter(o => (o.Statut || 'Sans statut') === status);
      const color = statusColor(status);
      const col = document.createElement('div');
      col.className = 'column';
      col.style.borderTopColor = color;
      col.innerHTML =
        '<div class="column-header"><span class="status-dot" style="background:' + color + '"></span>' +
        '<span class="label">' + escapeHtml(status) + '</span>' +
        '<span class="column-count">' + cardsForStatus.length + '</span></div>' +
        '<div class="column-cards" data-status="' + escapeHtml(status) + '"></div>';
      board.appendChild(col);

      const cardsEl = col.querySelector('.column-cards');
      cardsForStatus.forEach(o => cardsEl.appendChild(buildCard(o)));

      cardsEl.addEventListener('dragover', (e) => { e.preventDefault(); cardsEl.classList.add('dragover'); });
      cardsEl.addEventListener('dragleave', () => cardsEl.classList.remove('dragover'));
      cardsEl.addEventListener('drop', async (e) => {
        e.preventDefault();
        cardsEl.classList.remove('dragover');
        const id = Number(e.dataTransfer.getData('text/plain'));
        const newStatus = cardsEl.dataset.status;
        const record = allRecords.find(r => r.id === id);
        if (!record || record.Statut === newStatus) return;
        record.Statut = newStatus; // optimistic
        renderBoard();
        try {
          await grist.getTable().update({ id, fields: { [currentMappings.Statut]: newStatus } });
        } catch (err) {
          console.error(err);
        }
      });
    });
  }

  function buildCard(o) {
    const card = document.createElement('div');
    card.className = 'opp-card';
    card.draggable = true;
    card.innerHTML =
      '<div class="opp-title">' + escapeHtml(o.Sujet || 'Sans sujet') + '</div>' +
      '<div class="opp-tags">' +
        (o.Type ? '<span class="opp-tag">' + escapeHtml(o.Type) + '</span>' : '') +
        (o.AxeSequoia ? '<span class="opp-tag">' + escapeHtml(o.AxeSequoia) + '</span>' : '') +
      '</div>' +
      '<div class="opp-date">' + [formatDate(o.DateDebut), formatMontant(o.Montant)].filter(Boolean).join(' · ') + '</div>';

    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', String(o.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('click', () => {
      grist.setCursorPos({ rowId: o.id }).catch(() => {});
      openModal(o);
    });
    return card;
  }

  function openModal(o) {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modal-content');
    content.innerHTML =
      '<button class="close-btn" id="modal-close">✕</button>' +
      '<input class="sujet-input" id="f-sujet" placeholder="Sujet" value="' + escapeHtml(o.Sujet || '') + '">' +
      '<div class="tags">' +
        '<input class="editable-input" id="f-type" placeholder="Type" value="' + escapeHtml(o.Type || '') + '" style="width:auto;display:inline-block;max-width:120px;">' +
        '<span class="status-pill" style="background:' + statusColor(o.Statut) + '">' + escapeHtml(o.Statut || 'Sans statut') + '</span>' +
      '</div>' +
      '<div class="info-grid">' +
        '<div class="info-item"><div class="label">Axe SequoIA</div><input class="editable-input" id="f-axe" value="' + escapeHtml(o.AxeSequoia || '') + '"></div>' +
        '<div class="info-item"><div class="label">Partenaire(s)</div><div class="value">' + escapeHtml(formatValue(o.Partenaires)) + '</div></div>' +
        '<div class="info-item"><div class="label">Date de début</div><input type="date" class="editable-input" id="f-date-debut" value="' + gristDateToInputValue(o.DateDebut) + '"></div>' +
        '<div class="info-item"><div class="label">Échéance</div><input type="date" class="editable-input" id="f-echeance" value="' + gristDateToInputValue(o.Echeance) + '"></div>' +
        '<div class="info-item"><div class="label">Montant (€)</div><input type="number" class="editable-input" id="f-montant" value="' + (o.Montant != null ? o.Montant : '') + '"></div>' +
        '<div class="info-item"><div class="label">Etablissement(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.EtablissementCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Laboratoire(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.LaboratoireCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Equipe(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.EquipeCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Contact(s) Cluster</div><div class="value">' + escapeHtml(formatValue(o.ContactCluster)) + '</div></div>' +
        '<div class="info-item"><div class="label">Contact(s) partenaire</div><div class="value">' + escapeHtml(formatValue(o.ContactPartenaire)) + '</div></div>' +
      '</div>' +
      '<div class="section-title">Commentaire <span class="save-status" id="save-status"></span></div>' +
      '<textarea class="editable-textarea" id="f-commentaire" placeholder="Aucun commentaire.">' + escapeHtml(o.Commentaire || '') + '</textarea>';

    modal.hidden = false;
    document.getElementById('modal-close').addEventListener('click', () => { modal.hidden = true; });

    const statusEl = document.getElementById('save-status');
    const save = createFieldSaver((text) => { statusEl.textContent = text; });

    document.getElementById('f-sujet').addEventListener('input', (e) => save(o.id, currentMappings.Sujet, e.target.value));
    document.getElementById('f-type').addEventListener('input', (e) => save(o.id, currentMappings.Type, e.target.value));
    document.getElementById('f-axe').addEventListener('input', (e) => save(o.id, currentMappings.AxeSequoia, e.target.value));
    document.getElementById('f-date-debut').addEventListener('change', (e) => save(o.id, currentMappings.DateDebut, inputValueToGristDate(e.target.value)));
    document.getElementById('f-echeance').addEventListener('change', (e) => save(o.id, currentMappings.Echeance, inputValueToGristDate(e.target.value)));
    document.getElementById('f-montant').addEventListener('input', (e) => save(o.id, currentMappings.Montant, e.target.value === '' ? null : Number(e.target.value)));
    document.getElementById('f-commentaire').addEventListener('input', (e) => save(o.id, currentMappings.Commentaire, e.target.value));
  }

  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') document.getElementById('modal').hidden = true;
  });

  const createModal = document.getElementById('create-modal');

  function openCreateModal() {
    ['new-sujet', 'new-type', 'new-axe', 'new-date-debut', 'new-echeance', 'new-montant', 'new-commentaire']
      .forEach(id => { document.getElementById(id).value = ''; });

    const statutSelect = document.getElementById('new-statut');
    statutSelect.innerHTML = STATUS_ORDER
      .map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>')
      .join('');

    createModal.hidden = false;
    document.getElementById('new-sujet').focus();
  }
  function closeCreateModal() { createModal.hidden = true; }

  document.getElementById('btn-new').addEventListener('click', openCreateModal);
  document.getElementById('create-close').addEventListener('click', closeCreateModal);
  document.getElementById('create-cancel').addEventListener('click', closeCreateModal);
  createModal.addEventListener('click', (e) => { if (e.target === createModal) closeCreateModal(); });

  document.getElementById('create-submit').addEventListener('click', async () => {
    const sujet = document.getElementById('new-sujet').value.trim();
    if (!sujet) { document.getElementById('new-sujet').focus(); return; }

    const fields = {};
    if (currentMappings.Sujet) fields[currentMappings.Sujet] = sujet;
    if (currentMappings.Type) fields[currentMappings.Type] = document.getElementById('new-type').value.trim();
    if (currentMappings.Statut) fields[currentMappings.Statut] = document.getElementById('new-statut').value;
    if (currentMappings.AxeSequoia) fields[currentMappings.AxeSequoia] = document.getElementById('new-axe').value.trim();
    if (currentMappings.DateDebut) fields[currentMappings.DateDebut] = inputValueToGristDate(document.getElementById('new-date-debut').value);
    if (currentMappings.Echeance) fields[currentMappings.Echeance] = inputValueToGristDate(document.getElementById('new-echeance').value);
    const montant = document.getElementById('new-montant').value;
    if (currentMappings.Montant) fields[currentMappings.Montant] = montant === '' ? null : Number(montant);
    if (currentMappings.Commentaire) fields[currentMappings.Commentaire] = document.getElementById('new-commentaire').value.trim();

    try {
      const created = await grist.getTable().create({ fields });
      const newId = Array.isArray(created) ? created[0].id : created.id;
      closeCreateModal();
      grist.setCursorPos({ rowId: newId }).catch(() => {});
    } catch (err) {
      console.error(err);
      alert('Erreur lors de la création de l’opportunité.');
    }
  });

  grist.onRecords(function (records, mappings) {
    currentMappings = mappings;
    allRecords = mapRecords(records, mappings);
    renderBoard();
  });
</script>

</body>
</html>
