              ? 'Masquer l’historique'
              : 'Voir les ' + doneAvant.length + ' terminée' + (doneAvant.length > 1 ? 's' : '') +
                ' avant aujourd’hui') +
          '</button>'
        : ''),
      '<span class="pil-card-aside">' + terminees.length + '</span>') : '';

    return '<div class="pil-view-head"><div>' +
        '<h1 class="pil-h1" id="act-title">Mes actions</h1>' +
        '<p class="pil-sub">' + (statusMsg ? '<span class="pil-status">' + H(statusMsg) + '</span>' : '') +
          open.length + ' action' + (open.length > 1 ? 's' : '') + ' ouverte' + (open.length > 1 ? 's' : '') +
          ' · ' + retard + ' en retard' +
          (duJour.length ? ' · ' + H(charge) + ' à traiter aujourd’hui' : '') +
          ' · triées par urgence et par enjeu</p>' +
      '</div>' +
      '<button type="button" class="pil-btn primary" id="btn-action-vue">+ Nouvelle action</button>' +
      '</div>' +
      // La capture en une ligne : l'échéance et les rattachements se lisent
      // dans la phrase, sans ouvrir de formulaire.
      '<div class="pil-quick">' +
        '<input class="pil-quick-input" id="quick-action" placeholder="Nouvelle action : « Relancer @Thales sur #TrustAI lundi !! ~30min »"' +
          ' aria-label="Ajouter une action en une ligne" autocomplete="off">' +
        '<button type="button" class="pil-btn primary" id="quick-add">Ajouter</button>' +
        '<div class="pil-quick-hint" id="quick-hint"></div>' +
      '</div>' +
      '<div class="pil-act-filters">' +
        '<button type="button" class="pil-chip-btn' + (actionsCourtes ? ' on' : '') + '" id="flt-courtes"' +
          ' aria-pressed="' + (actionsCourtes ? 'true' : 'false') + '">Moins de 15 min</button>' +
        '<span class="pil-kbd-help">' +
          '<kbd>n</kbd> nouvelle · <kbd>j</kbd>/<kbd>k</kbd> parcourir · <kbd>x</kbd> cocher · ' +
          '<kbd>e</kbd> éditer · <kbd>1</kbd>-<kbd>3</kbd> reporter · <kbd>/</kbd> rechercher' +
        '</span>' +
      '</div>' +
      suggestBlock +
      (groups || '<p class="pil-empty">Aucune action ouverte. Écrivez la première ci-dessus.</p>') +
      doneBlock;
  }

  function renderAction(a, now) {
    const motif = actionMotif(a, { now, relanceSeuil: 30 });
    const effort = formatEffort(estimatedEffortMinutes(a));
    const d = daysSince(a.due, now);
    const prio = prioriteOf(a.priorite);
    const recur = parseRecurrence(a.recurrence);
    return '<div class="pil-action' + (a.done ? ' done' : '') + '">' +
      '<label class="pil-check-wrap">' +
        '<input type="checkbox" class="pil-check" data-action="' + H(a.id) + '"' + (a.done ? ' checked' : '') +
        ' aria-label="Terminer : ' + H(a.label) + '">' +
      '</label>' +
      '<div class="pil-row-main">' +
        '<div class="pil-action-title">' +
          // La priorité se lit avant l'intitulé : c'est ce qui dit par quoi
          // commencer quand deux actions tombent le même jour.
          (prio && prio.key !== 'normale'
            ? '<span class="pil-prio ' + prio.key + '" title="Priorité ' + H(prio.label.toLowerCase()) + '">' +
              (prio.key === 'haute' ? '!!' : '!') + '</span>' : '') +
          H(a.label) + '</div>' +
        '<div class="pil-action-ctx">' + H(a.partnerName || 'Interne') +
          (a.projectTitle ? ' · ' + H(a.projectTitle) : '') +
        '</div>' +
        '<div class="pil-action-tags">' +
          (motif ? '<span class="pil-motif ' + motif.tone + '">' + H(motif.label) + '</span>' : '') +
          (a.stage ? '<span class="pil-stage-chip" style="background:' + stageColor(a.stage) +
            ';color:' + stageTextColor(a.stage) + '">' + H(a.stage) + '</span>' : '') +
          // Où en est l'affaire que cette action fait avancer : une relance en
          // qualification et une signature en contractualisation ne pèsent pas
          // pareil, et l'étiquette seule ne le dit pas.
          (a.stage ? statusProgressMarkup(a.stage, model.stages, { label: false }) : '') +
          // Tant que les deux sources coexistent, dire laquelle porte la ligne :
          // une action déduite d'un échange se solde en vidant son échéance,
          // pas en cochant une case dans la table.
          (a.source === 'interaction' && model.hasActionTable
            ? '<span class="pil-tag tag-autre">issue d’un échange</span>' : '') +
          (recur ? '<span class="pil-tag tag-autre" title="Cocher créera l’occurrence suivante">↻ ' +
            H(a.recurrence) + '</span>' : '') +
          (a.start && isDeferred(a, now)
            ? '<span class="pil-tag tag-autre">à partir du ' + H(formatDate(a.start)) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="pil-action-side">' +
        '<div class="pil-action-due' + (d !== null && d > 0 ? ' danger' : '') + '">' + H(dueLabel(a.due, now)) + '</div>' +
        (effort ? '<div class="pil-action-effort">' + H(effort) + '</div>' : '') +
        // Reporter en un clic : sur une liste, replanifier est le geste le
        // plus fréquent, et ouvrir un formulaire pour ça coûte trop cher.
        (a.done ? '' : '<div class="pil-snooze">' + snoozeTargets(now).map(t =>
          '<button type="button" class="pil-snooze-btn" data-snooze="' + H(a.id) + '"' +
          ' data-due="' + t.due + '" title="Reporter à ' + H(t.label.toLowerCase()) + '">' +
          H(t.label) + '</button>').join('') + '</div>') +
      '</div>' +
      '</div>';
  }

  // ---------------------------------------------------------------------
  // Rendu — Kanban des actions
  //
  // La liste dit quoi faire d'abord ; le kanban dit où en est chaque chose.
  // Les colonnes viennent de la colonne Statut de la table des actions, dans
  // l'ordre du document. Sans cette colonne, deux colonnes suffisent : à faire
  // et terminé, portées par la case « Fait » qui existe déjà.
  // ---------------------------------------------------------------------

  const KANBAN_DEFAUT = ['À faire', 'Terminé'];

  const KANBAN_GROUPES = [
    { key: 'statut', label: 'Statut' },
    { key: 'partenaire', label: 'Partenaire' },
    { key: 'priorite', label: 'Priorité' },
    { key: 'echeance', label: 'Échéance' }
  ];

  function kanbanColonnes(actions) {
    if (kanbanGroupe === 'partenaire') {
      const noms = Array.from(new Set((actions || []).map(a => a.partnerName || 'Interne')));
      return noms.sort((a, b) => a.localeCompare(b, 'fr'));
    }
    if (kanbanGroupe === 'priorite') return PILOTAGE_PRIORITES.map(p => p.label);
    if (kanbanGroupe === 'echeance') return PILOTAGE_URGENCES.map(u => u.label);
    return statutActionChoices.length ? statutActionChoices : KANBAN_DEFAUT;
  }

  // La colonne d'arrivée : celle qui solde l'action. On la reconnaît à son
  // nom, à défaut c'est la dernière — un kanban se lit de gauche à droite.
  function estColonneFinale(label, colonnes) {
    const k = normalizeKey(label);
    if (/trait|fait|termin|done|fini|clos/.test(k)) return true;
    return colonnes.indexOf(label) === colonnes.length - 1 &&
      !colonnes.some(c => /trait|fait|termin|done|fini|clos/.test(normalizeKey(c)));
  }

  // Où placer une action : son statut s'il est renseigné et connu, sinon
  // « terminé » si elle est cochée, sinon la première colonne.
  function colonneDe(a, colonnes, now) {
    if (kanbanGroupe === 'partenaire') return a.partnerName || 'Interne';
    if (kanbanGroupe === 'priorite') return ((prioriteOf(a.priorite) || {}).label) || 'Normale';
    if (kanbanGroupe === 'echeance') {
      const u = PILOTAGE_URGENCES.find(x => x.key === urgenceOfAction(a, now === undefined ? today() : now));
      return (u || PILOTAGE_URGENCES[PILOTAGE_URGENCES.length - 1]).label;
    }
    const statut = (a.statut || '').trim();
    const trouve = colonnes.find(c => normalizeKey(c) === normalizeKey(statut));
    if (trouve) return trouve;
    if (a.done) return colonnes.find(c => estColonneFinale(c, colonnes)) || colonnes[colonnes.length - 1];
    return colonnes[0];
  }

  function actionsDuKanban() {
    return model.actions
      .filter(a => a.source === 'table' || !a.done)
      .filter(a => matchesQuery([a.label, a.partnerName, a.projectTitle]))
      .filter(a => !kanbanPartenaires.length || kanbanPartenaires.includes(a.partnerName))
      .filter(a => !kanbanUrgentes || (prioriteOf(a.priorite) || {}).key === 'haute');
  }

  // Une carte d'action, la même dans les trois vues du tableau.
  function carteAction(a, now, colonnes, deplacable) {
      const prio = prioriteOf(a.priorite);
      const urgence = urgenceOf(a.due, now);
      const deTable = a.source === 'table';
      const qui = contactNames(a.contactIds);
      return '<article class="pil-kc' + (a.done ? ' done' : '') + '" draggable="' + (deTable && deplacable ? 'true' : 'false') +
          '" data-carte="' + H(a.id) + '">' +
        '<div class="pil-kc-title">' + H(a.label) + '</div>' +
        '<div class="pil-kc-meta">' + H(a.partnerName || 'Interne') +
          (a.projectTitle ? ' · ' + H(a.projectTitle) : '') + '</div>' +
        // Qui s'en occupe, s'il y a quelqu'un : une carte sans visage laisse
        // croire que tout repose sur soi.
        (qui ? '<div class="pil-kc-qui">' +
          '<span class="pil-kc-av">' + H(initials(qui.split(',')[0].trim())) + '</span>' +
          H(qui) + '</div>' : '') +
        // La priorité se lit d'un coup d'œil, comme dans un tableau de tickets.
        (prio ? '<div class="pil-kc-tags"><span class="pil-kc-prio ' + prio.key + '">' +
          H(prio.label) + (prio.key === 'haute' ? ' 🔥' : '') + '</span></div>' : '') +
        '<div class="pil-kc-foot">' +
          '<span class="pil-kc-due ' + urgence + '">' + H(dueLabel(a.due, now)) + '</span>' +
          (deTable && deplacable
            ? '<select class="pil-kc-move" data-move="' + H(a.id) + '" aria-label="Déplacer « ' + H(a.label) + ' »">' +
                colonnes.map(c => '<option' + (c === colonneDe(a, colonnes, now) ? ' selected' : '') + '>' + H(c) + '</option>').join('') +
              '</select>'
            : (deTable ? '' :
              '<span class="pil-kc-source" title="Cette action vient d’un échange : reprenez-la dans vos actions pour la déplacer">issue d’un échange</span>')) +
        '</div>' +
      '</article>';
    }

  // ---- Matrice d'Eisenhower ----
  //
  // Deux axes : ce qui presse, ce qui compte. « Urgent » se lit de l'echeance
  // (en retard, aujourd'hui, cette semaine) ; « important » de la colonne
  // Important si le document en a une, sinon de la priorite haute. Vue de
  // lecture : on n'y deplace pas de carte, car un glisser changerait en
  // silence une echeance ou une priorite.
  const EISENHOWER = [
    { key: 'faire',     important: true,  urgent: true,  titre: 'Faire maintenant',  regle: 'important et urgent' },
    { key: 'planifier', important: true,  urgent: false, titre: 'Planifier',         regle: 'important, pas urgent' },
    { key: 'deleguer',  important: false, urgent: true,  titre: 'Déléguer ou expédier', regle: 'urgent, pas important' },
    { key: 'limiter',   important: false, urgent: false, titre: 'Plus tard',         regle: 'ni l’un ni l’autre' }
  ];

  function estUrgente(a, now) {
    return ['retard', 'aujourdhui', 'semaine'].includes(urgenceOfAction(a, now));
  }

  function estImportante(a) {
    if (a.important !== null && a.important !== undefined) return !!a.important;
    return (prioriteOf(a.priorite) || {}).key === 'haute';
  }

  function renderEisenhower(actions, now) {
    const act = related.actions || { cols: {} };
    const cases = EISENHOWER.map(q => {
      const dedans = actions.filter(a =>
        estImportante(a) === q.important && estUrgente(a, now) === q.urgent);
      return '<section class="pil-eis ' + q.key + '">' +
        '<div class="pil-eis-head">' +
          '<span class="pil-eis-titre">' + H(q.titre) + '</span>' +
          '<span class="pil-kcol-count">' + dedans.length + '</span>' +
        '</div>' +
        '<div class="pil-eis-regle">' + H(q.regle) + '</div>' +
        '<div class="pil-eis-body">' +
          (dedans.length ? dedans.map(a => carteAction(a, now, [], false)).join('')
            : '<div class="pil-kcol-vide">Rien ici</div>') +
        '</div>' +
      '</section>';
    }).join('');
    return '<div class="pil-eisenhower">' + cases + '</div>' +
      '<p class="pil-kfiltres-note">« Important » suit ' +
        (act.cols.Important ? 'la colonne Important de la table des actions.'
          : 'la priorité haute. Une colonne « Important » (case à cocher) dans la table des actions la remplacerait.') +
      ' Cliquez une carte pour la modifier.</p>';
  }

  // ---- Calendrier ----
  //
  // Un mois, une action sur son echeance. Ce qui n'a pas de date est liste
  // dessous : invisible dans un calendrier, ce serait la meilleure facon de
  // l'oublier.
  const JOURS_SEM = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];

  function moisAffiche() {
    if (moisCalendrier) return new Date(moisCalendrier);
    const d = new Date();
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
  }

  function renderCalendrier(actions, now) {
    const debut = moisAffiche();
    const annee = debut.getUTCFullYear();
    const mois = debut.getUTCMonth();
    const nbJours = new Date(Date.UTC(annee, mois + 1, 0)).getUTCDate();
    // Lundi comme premier jour de la semaine : getUTCDay() donne 0 pour dimanche.
    const decalage = (new Date(Date.UTC(annee, mois, 1)).getUTCDay() + 6) % 7;

    const parJour = {};
    const sansDate = [];
    actions.forEach(a => {
      const cle = a.due ? gristDateToInputValue(a.due) : null;
      if (!cle) { sansDate.push(a); return; }
      (parJour[cle] = parJour[cle] || []).push(a);
    });

    const cellules = [];
    for (let i = 0; i < decalage; i++) cellules.push('<div class="pil-cal-jour vide"></div>');
    for (let j = 1; j <= nbJours; j++) {
      const cle = new Date(Date.UTC(annee, mois, j)).toISOString().slice(0, 10);
      const dedans = parJour[cle] || [];
      const cejour = cle === todayKey();
      cellules.push('<div class="pil-cal-jour' + (cejour ? ' aujourdhui' : '') + '">' +
        '<div class="pil-cal-num">' + j + '</div>' +
        dedans.map(a => {
          const prio = prioriteOf(a.priorite);
          return '<button type="button" class="pil-cal-act' + (a.done ? ' done' : '') +
            (prio && prio.key === 'haute' ? ' haute' : '') +
            '" data-carte="' + H(a.id) + '" title="' + H(a.label + ' — ' + (a.partnerName || 'Interne')) + '">' +
            H(a.label) + '</button>';
        }).join('') +
      '</div>');
    }

    const nomMois = new Date(Date.UTC(annee, mois, 1))
      .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' });

    return '<div class="pil-cal-barre">' +
        '<button type="button" class="pil-btn" id="cal-prec" aria-label="Mois précédent">←</button>' +
        '<span class="pil-cal-mois">' + H(nomMois) + '</span>' +
        '<button type="button" class="pil-btn" id="cal-suiv" aria-label="Mois suivant">→</button>' +
        '<button type="button" class="pil-btn" id="cal-auj">Ce mois-ci</button>' +
      '</div>' +
      '<div class="pil-calendrier">' +
        JOURS_SEM.map(j => '<div class="pil-cal-tete">' + j + '</div>').join('') +
        cellules.join('') +
      '</div>' +
      (sansDate.length
        ? '<section class="pil-cal-sansdate">' +
            '<div class="pil-kcol-head"><span class="pil-kcol-title">Sans échéance</span>' +
              '<span class="pil-kcol-count">' + sansDate.length + '</span></div>' +
            '<div class="pil-cal-sansdate-body">' +
              sansDate.map(a => carteAction(a, now, [], false)).join('') +
            '</div>' +
          '</section>'
        : '');
  }

  function renderKanban() {
    const actions = actionsDuKanban();
    const now = today();
    const colonnes = kanbanColonnes(actions);
    // Déplacer une carte n'a de sens qu'entre des états : on ne change pas le
    // partenaire d'une action en la glissant, et son échéance encore moins.
    const deplacable = kanbanGroupe === 'statut';
    const act = related.actions || { cols: {} };
    const partenaires = Array.from(new Set(model.actions.map(a => a.partnerName).filter(Boolean)))
      .sort((a, b) => a.localeCompare(b, 'fr'));

    const carte = (a) => carteAction(a, now, colonnes, deplacable);

    const colonnesHtml = colonnes.map(c => {
      const dedans = actions.filter(a => colonneDe(a, colonnes, now) === c);
      return '<section class="pil-kcol" data-colonne="' + H(c) + '">' +
        '<div class="pil-kcol-head"><span class="pil-kcol-title">' + H(c) + '</span>' +
          '<span class="pil-kcol-count">' + dedans.length + '</span></div>' +
        '<div class="pil-kcol-body"' + (deplacable ? ' data-drop="' + H(c) + '"' : '') + '>' +
          (dedans.length ? dedans.map(carte).join('') : '<div class="pil-kcol-vide">Rien ici</div>') +
        '</div>' +
      '</section>';
    }).join('');

    const MODES = [
      { key: 'kanban', label: 'Kanban' },
      { key: 'eisenhower', label: 'Eisenhower' },
      { key: 'calendrier', label: 'Calendrier' }
    ];
    const bascule = '<div class="pil-modes" role="tablist">' +
      MODES.map(m => '<button type="button" class="pil-mode' + (m.key === tableauMode ? ' on' : '') +
        '" data-mode="' + m.key + '" role="tab" aria-selected="' + (m.key === tableauMode) + '">' +
        H(m.label) + '</button>').join('') + '</div>';

    const filtres =
      '<div class="pil-kfiltres">' +
        // Le regroupement ne concerne que le kanban : les deux autres vues ont
        // leurs propres axes.
        (tableauMode !== 'kanban' ? '' :
        '<label class="pil-kgroupe">Grouper par ' +
          '<select id="kanban-groupe">' +
            KANBAN_GROUPES.map(g => '<option value="' + g.key + '"' +
              (g.key === kanbanGroupe ? ' selected' : '') + '>' + H(g.label) + '</option>').join('') +
          '</select>' +
        '</label>') +
        msFilterMarkup('ms-kpartenaire', 'Partenaire', 'Tous les partenaires') +
        '<button type="button" class="pil-chip-btn' + (kanbanUrgentes ? ' on' : '') + '" id="flt-urgentes"' +
          ' aria-pressed="' + (kanbanUrgentes ? 'true' : 'false') + '">Urgentes seulement</button>' +
        // La note suit ce qui décide vraiment des colonnes : les choix de la
        // colonne. Une colonne Statut présente mais sans choix définis ne
        // donne rien non plus.
        (statutActionChoices.length || kanbanGroupe !== 'statut' || tableauMode !== 'kanban' ? '' :
          '<span class="pil-kfiltres-note">Deux colonnes par défaut. Pour les vôtres ' +
          '(à faire, en cours, traité), donnez à la table des actions une colonne ' +
          '« Statut » de type Choix, avec ces valeurs.</span>') +
      '</div>';

    // Ce qui a été soldé : sans ce repère, un tableau ne montre que ce qui
    // reste, et donne le sentiment de n'avancer jamais.
    const faitesLe = (depuis) => model.actions.filter(a =>
      a.done && a.doneOn && a.doneOn >= depuis).length;
    const jour = todayKey();
    const ilYA = (n) => gristDateToInputValue(inDays(-n));
    const ouvertes = model.actions.filter(a => !a.done).length;
    const avancement =
      '<section class="pil-avancement">' +
        ['Aujourd’hui', 'Sur 7 jours', 'Sur 30 jours'].map((label, i) => {
          const depuis = [jour, ilYA(7), ilYA(30)][i];
          const n = faitesLe(depuis);
          return '<div class="pil-av-bloc">' +
            '<div class="pil-av-nb">' + n + '</div>' +
            '<div class="pil-av-label">' + H(label) + '</div>' +
            meterMarkup(n, Math.max(n + ouvertes, 1), { mode: 'part', label: '' }) +
          '</div>';
        }).join('') +
      '</section>';

    return '<div class="pil-view-head"><div>' +
        '<h1 class="pil-h1" id="kanban-title">Tableau des actions</h1>' +
        '<p class="pil-sub">' + (statusMsg ? '<span class="pil-status">' + H(statusMsg) + '</span>' : '') +
          actions.length + ' action' + (actions.length > 1 ? 's' : '') + ' affichée' + (actions.length > 1 ? 's' : '') +
          (tableauMode === 'kanban' ? ' · glissez une carte d’une colonne à l’autre'
            : tableauMode === 'eisenhower' ? ' · ce qui presse en haut, ce qui compte à gauche'
            : ' · sur leur échéance') + '</p>' +
      '</div>' +
      '<button type="button" class="pil-btn primary" id="btn-action-kanban">+ Nouvelle action</button>' +
      '</div>' + avancement + bascule + filtres +
      (tableauMode === 'eisenhower' ? renderEisenhower(actions, now)
        : tableauMode === 'calendrier' ? renderCalendrier(actions, now)
        : '<div class="pil-kanban">' + colonnesHtml + '</div>') +
      '<div class="pil-kdata" hidden data-partenaires="' + H(partenaires.join('|')) + '"></div>';
  }

  // Déplacer une carte : le statut suit la colonne, et la case « Fait » suit
  // le statut — une action dans « traité » qui resterait à cocher se
  // retrouverait dans la liste des choses à faire.
  async function deplacerAction(id, colonne) {
    const act = related.actions;
    const a = model.actions.find(x => x.id === id);
    if (!a || a.source !== 'table' || !act.tableId) return;
    const colonnes = kanbanColonnes();
    const finale = estColonneFinale(colonne, colonnes);
    const fields = {};
    if (act.cols.Statut) fields[act.cols.Statut] = colonne;
    if (act.cols.Fait) fields[act.cols.Fait] = finale;
    if (act.cols.FaitLe) fields[act.cols.FaitLe] = finale ? inDays(0) : null;
    if (!Object.keys(fields).length) return;
    try {
      setStatus('Déplacement…');
      await updateRecord(act.tableId, a.rowId, fields);
      await refresh();
      setStatus('Action déplacée ✓');
    } catch (err) { console.error(err); setStatus('Erreur d’enregistrement'); }
  }

  function bindKanban() {
    const hote = el('view-kanban');
    const data = hote.querySelector('.pil-kdata');
    const partenaires = data && data.dataset.partenaires ? data.dataset.partenaires.split('|').filter(Boolean) : [];
    const ms = createMultiSelect(hote.querySelector('#ms-kpartenaire'), {
      values: partenaires,
      selected: kanbanPartenaires,
      labelAll: 'Tous les partenaires',
      onChange: (choisis) => { kanbanPartenaires = choisis; render(); }
    });
    if (!ms) return;

    hote.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { tableauMode = b.dataset.mode; render(); });
    });
    const prec = hote.querySelector('#cal-prec');
    const suiv = hote.querySelector('#cal-suiv');
    const auj = hote.querySelector('#cal-auj');
    const glisserMois = (n) => {
      const d = moisAffiche();
      moisCalendrier = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
      render();
    };
    if (prec) prec.addEventListener('click', () => glisserMois(-1));
    if (suiv) suiv.addEventListener('click', () => glisserMois(1));
    if (auj) auj.addEventListener('click', () => { moisCalendrier = null; render(); });
    // Dans le calendrier et la matrice, une carte s'ouvre : rien ne s'y glisse.
    if (tableauMode !== 'kanban') {
      hote.querySelectorAll('[data-carte]').forEach(c => {
        c.addEventListener('click', () => editActionModal(c.dataset.carte));
      });
    }

    const groupe = hote.querySelector('#kanban-groupe');
    if (groupe) groupe.addEventListener('change', () => { kanbanGroupe = groupe.value; render(); });

    hote.querySelectorAll('[data-move]').forEach(sel => {
      sel.addEventListener('change', () => deplacerAction(sel.dataset.move, sel.value));
    });

    // Glisser-déposer : le sélecteur de chaque carte reste le chemin sûr
    // (tactile, clavier), celui-ci est le raccourci à la souris.
    hote.querySelectorAll('[data-carte]').forEach(carte => {
      carte.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', carte.dataset.carte);
        carte.classList.add('drag');
      });
      carte.addEventListener('dragend', () => carte.classList.remove('drag'));
    });
    hote.querySelectorAll('[data-drop]').forEach(zone => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('survol'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('survol'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('survol');
        const id = e.dataTransfer.getData('text/plain');
        if (id) deplacerAction(id, zone.dataset.drop);
      });
    });
  }

  // ---------------------------------------------------------------------
  // Rendu global et navigation
  // ---------------------------------------------------------------------
  const VIEWS = { dashboard: renderDashboard, projets: null, actions: renderActions, kanban: renderKanban };
  // ?vue=kanban ou ?vue=actions : la même URL sert aussi de widget dédié à
  // une seule vue, barre latérale masquée.
  const VIEW_ALIASES = { projects: 'projets', todo: 'actions', actions: 'actions', tableau: 'kanban' };
  const singleView = VIEW_ALIASES[view] || ((view in VIEWS) ? view : null);
  const locked = !!new URLSearchParams(location.search).get('vue');
  if (locked) {
    view = singleView || 'dashboard';
    document.querySelector('.pil-sidebar').hidden = true;
  } else {
    view = 'dashboard';
  }

  function render() {
    if (!model) return;
    Object.keys(VIEWS).forEach(v => { el('view-' + v).hidden = v !== view; });
    if (view === 'projets') {
      refreshFilterOptions();
      renderProjets();
    } else {
      el('view-' + view).innerHTML = VIEWS[view]();
      if (view === 'kanban') bindKanban();
    }
    document.querySelectorAll('.pil-nav-item[data-view]').forEach(b => {
      const active = b.dataset.view === view;
      b.classList.toggle('active', active);
      b.setAttribute('aria-current', active ? 'page' : 'false');
    });
    el('nav-projets').textContent = model.projects.length || '';
    el('nav-actions').textContent = model.actions.filter(a => !a.done).length || '';
    renderErrors();
  }

  // Une table absente est signalée sans casser le reste de la vue, comme
  // dans crm.html.
  function renderErrors() {
    const errs = Object.keys(RELATED)
      .filter(k => !RELATED[k].optional)
      .map(k => related[k] && related[k].error).filter(Boolean);
    if (!errs.length) return;
    const host = el('view-' + view);
    host.insertAdjacentHTML('afterbegin',
      '<p class="pil-empty" style="color:var(--danger)">' + H(errs.join(' · ')) + '</p>');
  }

  let statusTimer = null;
  function setStatus(msg) {
    statusMsg = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { statusMsg = ''; render(); }, 2600);
    render();
  }

  async function refresh() {
    await loadRelated();
    await loadStructures();
    model = buildModel();
    render();
  }

  function goto(v) {
    if (locked || !(v in VIEWS)) return;
    view = v;
    render();
    el('view-' + v).scrollIntoView({ block: 'start' });
  }

  // ---------------------------------------------------------------------
  // Écritures
  // ---------------------------------------------------------------------
  const DAY = 86400;
  function inDays(n) {
    const d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000) + n * DAY;
  }

  async function moveProject(rowId, stage) {
    const opp = related.opportunites;
    if (!opp.tableId || !opp.cols.Statut) { setStatus('Colonne Statut introuvable'); return; }
    const project = model.projects.find(p => p.id === rowId);
    if (!project || project.stage === stage) return;
    project.stage = stage;          // retour immédiat, avant l'aller-retour Grist
    render();
    try {
      setStatus('Enregistrement…');
      await updateRecord(opp.tableId, rowId, { [opp.cols.Statut]: stage });
      await refresh();
      setStatus('Enregistré ✓');
    } catch (err) {
      console.error(err);
      setStatus('Erreur d’enregistrement');
      await refresh();
    }
  }

  // Cocher une action vide sa "Prochaine échéance" dans Grist — l'échéance
  // est traitée — et garde la trace du jour dans les options du widget pour
  // le bloc « Terminé aujourd'hui ». Décocher restaure l'échéance : rien
  // n'est perdu.
  async function toggleAction(key, checked) {
    const a = model.actions.find(x => x.id === key);
    if (!a) return;
    // Une action de la table porte son état dans le document : rien à garder
    // dans les options du widget, et la date se pose au même moment.
    if (a.source === 'table') {
      const act = related.actions;
      const fields = { [act.cols.Fait]: checked };
      if (act.cols.FaitLe) fields[act.cols.FaitLe] = checked ? inDays(0) : null;
      // Une action récurrente qu'on solde laisse la suivante derrière elle :
      // la relance périodique ne se retape pas chaque fois.
      const suite = checked ? nextOccurrence(a.recurrence, a.due, today()) : null;
      try {
        setStatus('Enregistrement…');
        await updateRecord(act.tableId, a.rowId, fields);
        if (suite !== null) await addRecord(act.tableId, nextRecurrenceFields(act, a, suite));
        await refresh();
        setStatus(suite !== null ? 'Fait ✓ — prochaine le ' + formatDate(suite) : 'Enregistré ✓');
      } catch (err) {
        console.error(err);
        setStatus('Erreur d’enregistrement');
      }
      return;
    }
    const inter = related.interactions;
    options.dueBackup = options.dueBackup || {};
    try {
      setStatus('Enregistrement…');
      if (checked) {
        options.done[key] = todayKey();
        if (inter.tableId && inter.cols.ProchaineEcheance && a.due !== null && a.due !== undefined) {
          options.dueBackup[key] = a.due;
          await updateRecord(inter.tableId, a.rowId, { [inter.cols.ProchaineEcheance]: null });
        }
      } else {
        delete options.done[key];
        if (inter.tableId && inter.cols.ProchaineEcheance && options.dueBackup[key] !== undefined) {
          await updateRecord(inter.tableId, a.rowId, { [inter.cols.ProchaineEcheance]: options.dueBackup[key] });
          delete options.dueBackup[key];
        }
      }
      await saveOptions();
      await refresh();
      setStatus('Enregistré ✓');
    } catch (err) {
      console.error(err);
      setStatus('Erreur d’enregistrement');
    }
  }

  // Édition d'une action. Celles qui viennent de la table s'éditent en
  // entier ; une action déduite d'un échange n'a que ce que l'interaction
  // porte — son intitulé (les « suites ») et son échéance.
  function editActionModal(key) {
    const a = model.actions.find(x => x.id === key);
    if (!a) return;
    const deTable = a.source === 'table';
    const act = related.actions || { cols: {} };
    const rel = deTable ? act : related.interactions;
    if (!rel.tableId) { setStatus('Table introuvable'); return; }

    const partenaires = sortedPartners();
    const projets = model.projects.slice().sort((a2, b2) => a2.title.localeCompare(b2.title, 'fr'));
    // Les échanges, du plus récent au plus ancien, datés pour distinguer deux
    // réunions de même objet.
    const echanges = model.interactions.slice()
      .sort((x, y) => (Number(y.date) || 0) - (Number(x.date) || 0))
      .map(i => ({
        id: i.id,
        name: (i.objet || i.type || 'Échange') + (i.date ? ' — ' + formatDate(i.date) : '')
      }));

    // Les rattachements enregistrés, lus sur la ligne d'origine : une action
    // de la table porte les siens, une action déduite ceux de son interaction.
    const row = deTable
      ? act.records.find(r => r.id === a.rowId)
      : related.interactions.records.find(r => r.id === a.rowId);
    const inter = related.interactions;
    const lus = (col) => refIdsFromValue(row ? row[col] : null);
    const partnerIds = deTable ? lus(act.cols.Partenaires) : lus(inter.cols.Partenaires);
    const projetIds = deTable ? lus(act.cols.Opportunite) : lus(inter.cols.Opportunites);
    const echangeIds = deTable ? lus(act.cols.Interaction) : [a.rowId];

    const selects = {
      partner: {
        values: partenaires.map(p => p.name),
        selected: partenaires.filter(p => partnerIds.includes(p.id)).map(p => p.name),
        labelAll: 'Aucun partenaire'
      },
      projet: {
        values: projets.map(p => p.title),
        selected: projets.filter(p => projetIds.includes(p.id)).map(p => p.title),
        labelAll: 'Aucune opportunité'
      },
      echange: {
        values: echanges.map(i => i.name),
        selected: echanges.filter(i => echangeIds.includes(i.id)).map(i => i.name),
        labelAll: 'Aucun échange'
      }
    };
    // Qui est concerné : la colonne n'existe que si le document la porte.
    const contacts = contactsListe();
    const contactIds = deTable && act.cols.Contacts ? lus(act.cols.Contacts) : [];
    if (deTable && act.cols.Contacts) {
      selects.contact = {
        values: contacts.map(c => c.name),
        selected: contacts.filter(c => contactIds.includes(c.id)).map(c => c.name),
        labelAll: 'Personne en particulier'
      };
    }
    // Quelle colonne porte quoi, selon la table d'origine. L'échange n'est
    // modifiable que sur une action de la table : une action déduite *est*
    // son interaction, on ne la rattache pas à une autre.
    const colPartenaires = deTable ? act.cols.Partenaires : inter.cols.Partenaires;
    const colProjets = deTable ? act.cols.Opportunite : inter.cols.Opportunites;

    openModal({
      title: 'Éditer : ' + a.label,
      submit: 'Enregistrer',
      selects,
      fields:
        field('Intitulé', '<input name="label" value="' + H(a.label) + '" required>') +
        field('Échéance', '<input type="date" name="due" value="' +
          (a.due ? gristDateToInputValue(a.due) : '') + '">') +
        (colPartenaires ? msField('Partenaire(s)', 'partner') : '') +
        (colProjets ? msField('Opportunité', 'projet') : '') +
        // Rien n'est rattache, mais le partenaire a un projet en cours : le
        // proposer plutot que de le supposer.
        (colProjets && a.projetDevine
          ? '<p class="pil-modal-note">Aucune opportunité rattachée. Le projet le plus avancé de ' +
            H(a.partnerName || 'ce partenaire') + ' est « ' + H(a.projetDevine.title) + ' » : ' +
            'choisissez-le ci-dessus si c’est le bon.</p>'
          : '') +
        (deTable && act.cols.Contacts ? msField('Qui est concerné', 'contact') : '') +
        (deTable && act.cols.Interaction ? msField('Échange associé', 'echange') : '') +
        (deTable && act.cols.Priorite ? selectField('Priorité', 'priorite',
          PILOTAGE_PRIORITES.map(x => x.label), (prioriteOf(a.priorite) || {}).label || 'Normale') : '') +
        (deTable && act.cols.Duree ? field('Durée estimée (min)',
          '<input type="number" name="duree" min="0" step="15" value="' + (a.duree || '') + '">') : '') +
        (deTable && act.cols.Debut ? field('À faire à partir du',
          '<input type="date" name="debut" value="' + (a.start ? gristDateToInputValue(a.start) : '') + '">') : '') +
        (deTable && act.cols.Recurrence ? field('Répétition',
          '<input name="recurrence" value="' + H(a.recurrence) + '" placeholder="chaque lundi…">') : '') +
        (deTable && act.cols.Notes ? field('Notes',
          '<textarea name="notes">' + H(a.notes) + '</textarea>') : '') +
        (deTable ? '' : '<p class="pil-modal-note">Cette action est portée par un échange : seuls ces ' +
          'champs existent, et les modifier modifie l’interaction elle-même. Pour lui donner une ' +
          'priorité, une durée, une date de début, des interlocuteurs ou des notes, reprenez-la dans ' +
          'la table des actions — le bouton ci-dessous la recopie et libère l’échange.</p>'),
      // Une action déduite n'a que ce que porte son interaction. La reprendre
      // dans la table lui donne les siens, sans perdre ses rattachements.
      secondary: (!deTable && act.tableId) ? {
        label: 'Reprendre dans mes actions',
        erreur: 'Reprise impossible.',
        run: () => reprendreCommeAction(a)
      } : null,
      // La suppression ne porte que sur une action de la table : effacer
      // l'interaction dont une action est déduite emporterait son compte rendu.
      remove: deTable ? async () => {
        await removeRecord(act.tableId, a.rowId);
        await refresh();
        setStatus('Action supprimée');
      } : null,
      onSubmit: async (form, sel) => {
        const label = form.label.value.trim();
        if (!label) return 'Un intitulé est nécessaire.';
        const fields = {};
        const due = form.due.value ? inputValueToGristDate(form.due.value) : null;
        if (deTable) {
          if (act.cols.Intitule) fields[act.cols.Intitule] = label;
          if (act.cols.Echeance) fields[act.cols.Echeance] = due;
          if (act.cols.Priorite && form.priorite) fields[act.cols.Priorite] = form.priorite.value;
          if (act.cols.Duree && form.duree) fields[act.cols.Duree] = Number(form.duree.value) || null;
          if (act.cols.Debut && form.debut) {
            fields[act.cols.Debut] = form.debut.value ? inputValueToGristDate(form.debut.value) : null;
          }
          if (act.cols.Recurrence && form.recurrence) fields[act.cols.Recurrence] = form.recurrence.value.trim();
          if (act.cols.Notes && form.notes) fields[act.cols.Notes] = form.notes.value.trim();
          if (act.cols.Interaction) {
            const ids = echanges.filter(i => sel.echange.getSelected().includes(i.name)).map(i => i.id);
            fields[act.cols.Interaction] = ids.length ? colValue(act, act.cols.Interaction, ids) : null;
          }
          if (act.cols.Contacts && sel.contact) {
            const ids = contacts.filter(c => sel.contact.getSelected().includes(c.name)).map(c => c.id);
            fields[act.cols.Contacts] = ids.length ? colValue(act, act.cols.Contacts, ids) : null;
          }
        } else {
          if (inter.cols.Suites) fields[inter.cols.Suites] = label;
          if (inter.cols.ProchaineEcheance) fields[inter.cols.ProchaineEcheance] = due;
        }
        // Les rattachements visent la colonne de la table d'origine.
        if (colPartenaires) {
          const ids = structureIds(partenaires, sel.partner.getSelected());
          fields[colPartenaires] = ids.length ? colValue(rel, colPartenaires, ids) : null;
        }
        if (colProjets) {
          const ids = sel.projet.getSelected()
            .map(t => (projets.find(p => p.title === t) || {}).id).filter(Boolean);
          fields[colProjets] = ids.length ? colValue(rel, colProjets, ids) : null;
        }
        try {
          await updateRecord(rel.tableId, a.rowId, fields);
          await refresh();
          setStatus('Action enregistrée ✓');
        } catch (err) { console.error(err); return 'Erreur d’enregistrement.'; }
      }
    });
  }

  // Reprendre une action déduite d'un échange dans la table des actions : la
  // même action, mais qui existe pour elle-même et peut donc porter priorité,
  // durée, date de début, interlocuteurs et notes. Les rattachements de
  // l'échange la suivent, et l'échange est libéré de sa suite pour qu'elle ne
  // figure pas deux fois dans la liste.
  async function reprendreCommeAction(a) {
    const act = related.actions;
    const inter = related.interactions;
    if (!act.tableId) throw new Error('table des actions absente');
    const ligne = inter.records.find(r => r.id === a.rowId);
    if (!ligne) throw new Error('échange introuvable');

    const fields = {};
    const pose = (colId, valeur) => { if (colId) fields[colId] = valeur; };
    pose(act.cols.Intitule, a.label);
    if (act.cols.Echeance) fields[act.cols.Echeance] = a.due;
    if (act.cols.Interaction) fields[act.cols.Interaction] = colValue(act, act.cols.Interaction, [a.rowId]);
    const reprendre = (source, cible) => {
      if (!source || !cible) return;
      const ids = refIdsFromValue(ligne[source]);
      if (ids.length) fields[cible] = colValue(act, cible, ids);
    };
    reprendre(inter.cols.Partenaires, act.cols.Partenaires);
    reprendre(inter.cols.Opportunites, act.cols.Opportunite);
    reprendre(inter.cols.ContactPartenaire, act.cols.Contacts);

    setStatus('Reprise de l’action…');
    const nouvelId = await addRecord(act.tableId, fields);
    // L'échange garde son compte rendu et sa date ; il perd sa suite, qui vit
    // désormais dans la table des actions.
    const vide = {};
    if (inter.cols.Suites) vide[inter.cols.Suites] = '';
    if (inter.cols.ProchaineEcheance) vide[inter.cols.ProchaineEcheance] = null;
    if (Object.keys(vide).length) await updateRecord(inter.tableId, a.rowId, vide);
    await refresh();
    setStatus('Action reprise ✓');
    if (nouvelId) editActionModal('act:' + nouvelId);
  }

  // L'occurrence suivante reprend tout de l'action soldée sauf son état :
  // même intitulé, mêmes rattachements, même règle de répétition.
  function nextRecurrenceFields(act, a, due) {
    const fields = {};
    if (act.cols.Intitule) fields[act.cols.Intitule] = a.label;
    if (act.cols.Echeance) fields[act.cols.Echeance] = due;
    if (act.cols.Recurrence) fields[act.cols.Recurrence] = a.recurrence;
    if (act.cols.Priorite && a.priorite) fields[act.cols.Priorite] = a.priorite;
    if (act.cols.Duree && a.duree) fields[act.cols.Duree] = a.duree;
    if (act.cols.Notes && a.notes) fields[act.cols.Notes] = a.notes;
    if (act.cols.Partenaires && a.partnerId) {
      fields[act.cols.Partenaires] = colValue(act, act.cols.Partenaires, [a.partnerId]);
    }
    if (act.cols.Opportunite && a.projectId) {
      fields[act.cols.Opportunite] = colValue(act, act.cols.Opportunite, [a.projectId]);
    }
    return fields;
  }

  // Reporter une action : sur la table, c'est son échéance ; sur une action
  // déduite, celle de l'interaction qui la porte.
  async function snoozeAction(key, due) {
    const a = model.actions.find(x => x.id === key);
    if (!a) return;
    const rel = a.source === 'table' ? related.actions : related.interactions;
    const col = a.source === 'table' ? rel.cols.Echeance : rel.cols.ProchaineEcheance;
    if (!rel.tableId || !col) { setStatus('Aucune colonne d’échéance'); return; }
    try {
      setStatus('Enregistrement…');
      await updateRecord(rel.tableId, a.rowId, { [col]: due });
      await refresh();
      setStatus('Reporté au ' + formatDate(due));
    } catch (err) {
      console.error(err);
      setStatus('Erreur d’enregistrement');
    }
  }

  // Ce que la ligne de saisie rapide donnera, affiché pendant la frappe : on
  // voit que « lundi » a été compris avant de valider.
  function quickPreview() {
    const input = el('quick-action');
    const hint = el('quick-hint');
    if (!input || !hint) return;
    const brut = input.value.trim();
    if (!brut) { hint.textContent = ''; return; }
    const p = parseQuickAction(brut, today());
    const bouts = [];
    if (p.due !== null) bouts.push('échéance ' + formatDate(p.due));
    const partner = quickMatch(model.partners, p.partnerHint, 'name');
    const projet = quickMatch(model.projects, p.projectHint, 'title');
    if (p.partnerHint) bouts.push(partner ? 'partenaire ' + partner.name : 'partenaire « ' + p.partnerHint + ' » inconnu');
    if (p.projectHint) bouts.push(projet ? 'opportunité ' + projet.title : 'opportunité « ' + p.projectHint + ' » inconnue');
    if (p.priorite) bouts.push('priorité ' + p.priorite.toLowerCase());
    if (p.duree) bouts.push(formatEffort(p.duree));
    hint.textContent = (p.label || '(intitulé vide)') + (bouts.length ? ' — ' + bouts.join(', ') : '');
  }

  // Un indice de saisie vise une ligne par son nom, sans exiger l'exactitude :
  // « @thales » doit trouver « Thales SIX GTS France ».
  function quickMatch(liste, hint, champ) {
    if (!hint) return null;
    const k = normalizeKey(hint);
    if (!k) return null;
    return liste.find(x => normalizeKey(x[champ]) === k) ||
      liste.find(x => normalizeKey(x[champ]).includes(k)) ||
      liste.find(x => k.includes(normalizeKey(x[champ]))) || null;
  }

  async function submitQuickAction() {
    const input = el('quick-action');
    if (!input) return;
    const p = parseQuickAction(input.value, today());
    if (!p.label) { setStatus('Un intitulé est nécessaire'); return; }
    const partner = quickMatch(model.partners, p.partnerHint, 'name');
    const projet = quickMatch(model.projects, p.projectHint, 'title');
    const act = related.actions;
    try {
      setStatus('Enregistrement…');
      if (act && act.tableId) {
        const fields = {};
        if (act.cols.Intitule) fields[act.cols.Intitule] = p.label;
        if (act.cols.Echeance && p.due !== null) fields[act.cols.Echeance] = p.due;
        if (act.cols.Partenaires && partner) fields[act.cols.Partenaires] = colValue(act, act.cols.Partenaires, [partner.id]);
        if (act.cols.Opportunite && projet) fields[act.cols.Opportunite] = colValue(act, act.cols.Opportunite, [projet.id]);
        if (act.cols.Priorite && p.priorite) fields[act.cols.Priorite] = p.priorite;
        if (act.cols.Duree && p.duree) fields[act.cols.Duree] = p.duree;
        await addRecord(act.tableId, fields);
      } else {
        const inter = related.interactions;
        if (!inter.tableId) { setStatus('Table Interactions introuvable'); return; }
        const fields = {};
        if (inter.cols.Suites) fields[inter.cols.Suites] = p.label;
        if (inter.cols.Objet) fields[inter.cols.Objet] = p.label;
        if (inter.cols.ProchaineEcheance && p.due !== null) fields[inter.cols.ProchaineEcheance] = p.due;
        if (inter.cols.Partenaires && partner) fields[inter.cols.Partenaires] = ['L', partner.id];
        await addRecord(inter.tableId, fields);
      }
      input.value = '';
      await refresh();
      setStatus('Action ajoutée ✓');
      const next = el('quick-action');
      if (next) next.focus();
    } catch (err) {
      console.error(err);
      setStatus('Erreur d’enregistrement');
    }
  }

  async function acceptSuggestion(id) {
    const s = runSuggestionRules(model, { now: today(), dismissed: options.dismissed })
      .find(x => x.id === id);
    if (!s) return;
    const act = related.actions;
    const inter = related.interactions;
    const fields = {};
    let tableId = null;
    let prefixe = '';
    if (act && act.tableId) {
      tableId = act.tableId;
      prefixe = 'act:';
      if (act.cols.Intitule) fields[act.cols.Intitule] = s.label;
      if (act.cols.Echeance) fields[act.cols.Echeance] = inDays(7);
      if (act.cols.Partenaires && s.partnerId) fields[act.cols.Partenaires] = colValue(act, act.cols.Partenaires, [s.partnerId]);
      if (act.cols.Opportunite && s.projectId) fields[act.cols.Opportunite] = colValue(act, act.cols.Opportunite, [s.projectId]);
    } else {
      if (!inter.tableId) { setStatus('Table Interactions introuvable'); return; }
      tableId = inter.tableId;
      prefixe = 'int:';
      if (inter.cols.Suites) fields[inter.cols.Suites] = s.label;
      if (inter.cols.Objet) fields[inter.cols.Objet] = s.label;
      if (inter.cols.ProchaineEcheance) fields[inter.cols.ProchaineEcheance] = inDays(7);
      if (inter.cols.Partenaires && s.partnerId) fields[inter.cols.Partenaires] = ['L', s.partnerId];
      if (inter.cols.Opportunites && s.projectId) fields[inter.cols.Opportunites] = ['L', s.projectId];
      // Volontairement sans Date : une interaction sans date est une suite
      // prévue, pas un échange qui a eu lieu. Lui en donner une fausserait le
      // "dernier contact" du partenaire.
    }
    try {
      setStatus('Enregistrement…');
      const rowId = await addRecord(tableId, fields);
      options.dismissed.push(s.id);
      options.origin = options.origin || {};
      if (rowId) options.origin[prefixe + rowId] = 'suggestion';
      await saveOptions();
      await refresh();
      setStatus('Action ajoutée ✓');
    } catch (err) {
      console.error(err);
      setStatus('Erreur d’enregistrement');
    }
  }

  // ---------------------------------------------------------------------
  // Popups (création d'une action, d'une note, d'un partenaire)
  // ---------------------------------------------------------------------
  function openModal(conf) {
    const host = el('modal-host');
    host.innerHTML = '<div class="pil-modal-backdrop" role="dialog" aria-modal="true" aria-label="' + H(conf.title) + '">' +
      '<form class="pil-modal"><h2>' + H(conf.title) + '</h2>' +
      '<div class="pil-modal-body">' + conf.fields + '</div>' +
      '<div class="pil-modal-foot"><span class="pil-modal-msg" id="modal-msg"></span>' +
        (conf.remove ? '<button type="button" class="pil-btn danger" data-remove>Supprimer</button>' : '') +
        (conf.secondary ? '<button type="button" class="pil-btn" data-secondary>' +
          H(conf.secondary.label) + '</button>' : '') +
        '<button type="button" class="pil-btn" data-close>Annuler</button>' +
        '<button type="submit" class="pil-btn primary">' + H(conf.submit) + '</button>' +
      '</div></form></div>';
    const form = host.querySelector('form');
    const close = () => { host.innerHTML = ''; };
    host.querySelector('[data-close]').addEventListener('click', close);
    // Supprimer demande confirmation : c'est le seul geste du formulaire qui
    // ne se rattrape pas.
    const btnRemove = host.querySelector('[data-remove]');
    if (btnRemove) btnRemove.addEventListener('click', async () => {
      if (!btnRemove.dataset.armed) {
        btnRemove.dataset.armed = '1';
        btnRemove.textContent = 'Confirmer la suppression';
        return;
      }
      try { await conf.remove(); close(); }
      catch (err) { console.error(err); el('modal-msg').textContent = 'Suppression impossible.'; }
    });
    // L'action secondaire peut ouvrir une autre fenêtre à sa suite : refermer
    // celle-ci d'abord, sinon la fermeture emporterait la nouvelle. Ce qu'elle
    // a à dire passe donc par le bandeau d'état, pas par cette fenêtre.
    const btnSecond = host.querySelector('[data-secondary]');
    if (btnSecond) btnSecond.addEventListener('click', async () => {
      btnSecond.disabled = true;
      close();
      try { await conf.secondary.run(); }
      catch (err) {
        console.error(err);
        setStatus(conf.secondary.erreur || 'Opération impossible.');
      }
    });
    host.querySelector('.pil-modal-backdrop').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) close();
    });
    host.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    // Les sélecteurs multiples ne s'animent qu'une fois le markup dans le DOM.
    // `conf.selects` les déclare par nom ; onSubmit les reçoit pour lire la
    // sélection, un <form> ne portant pas ces champs.
    // `spec.onChange` reçoit les autres composants : c'est ce qui permet à un
    // champ de restreindre les valeurs d'un autre (les équipes d'un labo).
    const selects = {};
    Object.keys(conf.selects || {}).forEach(name => {
      const spec = conf.selects[name];
      selects[name] = createMultiSelect(form.querySelector('#ms-' + name), {
        values: spec.values, selected: spec.selected || [],
        labelAll: spec.labelAll || 'Aucune sélection',
        single: !!spec.single,
        onChange: spec.onChange ? (selection) => spec.onChange(selection, selects) : null
      });
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = await conf.onSubmit(form, selects);
      if (err) el('modal-msg').textContent = err;
      else close();
    });
    const first = form.querySelector('input, select, textarea');
    if (first) first.focus();
  }

  function field(label, html) {
    return '<div class="pil-field"><label>' + H(label) + '</label>' + html + '</div>';
  }

  function openActionModal() {
    const partenaires = sortedPartners();
    const act = related.actions || { cols: {} };
    const projets = model.projects.slice()
      .filter(p => !isStageIn(p.stage, 'clos'))
      .sort((a, b) => a.title.localeCompare(b.title, 'fr'));
    openModal({
      title: 'Créer une action',
      submit: 'Créer l’action',
      selects: {
        partner: { values: partenaires.map(p => p.name) },
        projet: { values: projets.map(p => p.title), labelAll: 'Aucune opportunité' }
      },
      fields:
        field('Intitulé', '<input name="label" required>') +
        msField('Partenaire', 'partner') +
        (act.tableId ? msField('Opportunité', 'projet') : '') +
        field('Échéance', '<input type="date" name="due" value="' + todayKey() + '">') +
        // Chaque champ n'apparaît que si le document porte sa colonne.
        (act.cols.Priorite ? selectField('Priorité', 'priorite',
          PILOTAGE_PRIORITES.map(x => x.label), 'Normale') : '') +
        (act.cols.Duree ? field('Durée estimée (min)',
          '<input type="number" name="duree" min="0" step="15" placeholder="30">') : '') +
        (act.cols.Debut ? field('À faire à partir du (facultatif)',
          '<input type="date" name="debut">') : '') +
        (act.cols.Recurrence ? field('Répétition (facultatif)',
          '<input name="recurrence" placeholder="chaque lundi, tous les 30 jours…">') : '') +
        (act.tableId ? field('Notes', '<textarea name="notes"></textarea>') : ''),
      onSubmit: async (form, selects) => {
        const label = form.label.value.trim();
        if (!label) return 'Un intitulé est nécessaire.';
        const partnerIds = structureIds(partenaires, selects.partner.getSelected());
        try {
          if (act.tableId) {
            const fields = {};
            if (act.cols.Intitule) fields[act.cols.Intitule] = label;
            if (act.cols.Echeance) fields[act.cols.Echeance] = inputValueToGristDate(form.due.value);
            if (act.cols.Notes && form.notes.value.trim()) fields[act.cols.Notes] = form.notes.value.trim();
            if (act.cols.Priorite && form.priorite) fields[act.cols.Priorite] = form.priorite.value;
            if (act.cols.Duree && form.duree && form.duree.value) fields[act.cols.Duree] = Number(form.duree.value);
            if (act.cols.Debut && form.debut && form.debut.value) fields[act.cols.Debut] = inputValueToGristDate(form.debut.value);
            if (act.cols.Recurrence && form.recurrence && form.recurrence.value.trim()) {
              fields[act.cols.Recurrence] = form.recurrence.value.trim();
            }
            if (act.cols.Partenaires && partnerIds.length) fields[act.cols.Partenaires] = colValue(act, act.cols.Partenaires, partnerIds);
            if (act.cols.Opportunite) {
              const ids = selects.projet.getSelected()
                .map(t => (projets.find(p => p.title === t) || {}).id)
                .filter(Boolean);
              if (ids.length) fields[act.cols.Opportunite] = colValue(act, act.cols.Opportunite, ids);
            }
            await addRecord(act.tableId, fields);
          } else {
            // Sans table Actions, la tâche s'écrit comme avant : une suite
            // attendue portée par une interaction.
            const inter = related.interactions;
            if (!inter.tableId) return 'Table Interactions introuvable.';
            const fields = {};
            if (inter.cols.Suites) fields[inter.cols.Suites] = label;
            if (inter.cols.Objet) fields[inter.cols.Objet] = label;
            if (inter.cols.ProchaineEcheance) fields[inter.cols.ProchaineEcheance] = inputValueToGristDate(form.due.value);
            if (inter.cols.Partenaires && partnerIds.length) fields[inter.cols.Partenaires] = ['L', ...partnerIds];
            await addRecord(inter.tableId, fields);
          }
          await refresh();
          setStatus('Action créée ✓');
        } catch (err) { console.error(err); return 'Erreur d’enregistrement.'; }
      }
    });
  }

  function openNoteModal() {
    const partenaires = sortedPartners();
    openModal({
      title: 'Ajouter une note',
      submit: 'Enregistrer la note',
      selects: { partner: { values: partenaires.map(p => p.name) } },
      fields:
        msField('Partenaire', 'partner') +
        field('Objet', '<input name="objet" required>') +
        field('Type', '<input name="type" value="Réunion">') +
        field('Compte rendu', '<textarea name="cr"></textarea>') +
        field('Date', '<input type="date" name="date" value="' + todayKey() + '">'),
      onSubmit: async (form, selects) => {
        const inter = related.interactions;
        if (!inter.tableId) return 'Table Interactions introuvable.';
        const objet = form.objet.value.trim();
        if (!objet) return 'Un objet est nécessaire.';
        // Une note sans partenaire ne se rattache à rien : le choix multiple
        // n'a pas d'équivalent du `required` d'un <select>.
        const partenaireIds = structureIds(partenaires, selects.partner.getSelected());
        if (!partenaireIds.length) return 'Un partenaire au moins est nécessaire.';
        const fields = {};
        if (inter.cols.Objet) fields[inter.cols.Objet] = objet;
        if (inter.cols.Date) fields[inter.cols.Date] = inputValueToGristDate(form.date.value);
        if (inter.cols.Type) fields[inter.cols.Type] = form.type.value.trim();
        if (inter.cols.CR && form.cr.value.trim()) fields[inter.cols.CR] = '<p>' + escapeHtml(form.cr.value.trim()) + '</p>';
        if (inter.cols.Partenaires) fields[inter.cols.Partenaires] = ['L', ...partenaireIds];
        try {
          await addRecord(inter.tableId, fields);
          await refresh();
          setStatus('Note enregistrée ✓');
        } catch (err) { console.error(err); return 'Erreur d’enregistrement.'; }
      }
    });

  // Les partenaires que proposent les formulaires d'opportunité. Les prospects
  // en font partie : c'est souvent à eux que se rattache une idée.
  function sortedPartners() {
    return model.partners.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  }

  function selectField(label, name, values, current, extra) {
    const options = (extra || '') + values.map(v =>
      '<option' + (v === current ? ' selected' : '') + '>' + H(v) + '</option>').join('');
    return field(label, '<select name="' + name + '">' + options + '</select>');
  }

  // Champ à choix multiple : même composant déroulant que les filtres du
  // Kanban (recherche, tout cocher). Les valeurs et la sélection de départ
  // sont déclarées dans `conf.selects` d'openModal, qui l'anime.
  function msField(label, name) {
    return field(label, msFilterMarkup('ms-' + name, label, 'Aucune sélection'));
  }

  // Ces sélecteurs travaillent sur des noms de structures ; les colonnes de
  // référence, elles, attendent des identifiants de ligne.
  function structureIds(structures, names) {
    const byName = {};
    structures.forEach(s => { if (!(s.name in byName)) byName[s.name] = s.id; });
    return names.map(n => byName[n]).filter(id => id !== undefined);
  }

  function structureNames(structures, ids) {
    return structures.filter(s => ids.includes(s.id)).map(s => s.name);
  }

  // Les structures à proposer pour un rôle : un laboratoire est une structure
  // dont la colonne « Structure de recherche » le dit. La comparaison passe par
  // normalizeKey et une sous-chaîne, pour accepter le libellé du document tel
  // qu'il est saisi ("Établissement", "Établissement d'enseignement supérieur").
  function getStructuresForForm(role) {
    const roleOf = (s) => normalizeKey(formatValue(sField(s, 'RechercheStructure')));
    const typeOf = (s) => normalizeKey(formatValue(sField(s, 'TypeActeur')));
    const matches = {
      // Un établissement du Cluster est un acteur académique, ou un acteur de
      // recherche dont la structure est un institut. Une liste vide dit alors
      // qu'aucune structure n'est typée ainsi — c'est une information, pas un
      // champ à remplir de tout le reste.
      etablissement: (s) => typeOf(s).includes('academique') ||
        (typeOf(s).includes('recherche') && roleOf(s) === 'institut'),
      laboratoire: (s) => roleOf(s).includes('laboratoire'),
      // Une équipe se reconnaît aussi à son activité, comme dans isTeam().
      equipe: (s) => roleOf(s).includes('equipe') || isTeam(s)
    }[role];
    return structures
      .filter(s => !matches || matches(s))
      .map(s => ({
        id: s.id,
        name: txt(formatValue(sField(s, 'Nom'))) || ('#' + s.id),
        labo: txt(formatValue(sField(s, 'RechercheEquipeLabo')))
      }))
      .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  }

  // Les équipes rattachées aux laboratoires choisis. Une équipe porte le nom de
  // son laboratoire dans « Laboratoire » ; si ce rattachement manque, on rend
  // la liste entière plutôt que rien.
  function equipesDesLabos(equipes, labos) {
    if (!labos.length) return equipes;
    const clefs = labos.map(normalizeKey);
    const filtrees = equipes.filter(e => clefs.includes(normalizeKey(e.labo)));
    return filtrees.length ? filtrees : equipes;
  }

  // Édition d’une opportunité existante
  function editOpportuniteModal(projectId) {
    const opp = related.opportunites;
    if (!opp.tableId) { setStatus('Table Opportunités introuvable'); return; }
    const project = model.projects.find(p => p.id === projectId);
    if (!project) return;

    const dispositifs = typeChoices.length ? typeChoices : PILOTAGE_DISPOSITIFS.map(d => d.label);
    const stages = model.stages;
    const row = opp.records.find(r => r.id === projectId);
    if (!row) return;

    // Les structures proposées par rôle, et celles déjà rattachées à la ligne :
    // un formulaire d'édition doit partir de l'état enregistré.
    const etabs = getStructuresForForm('etablissement');
    const labos = getStructuresForForm('laboratoire');
    const equipes = getStructuresForForm('equipe');
    const rawType = row[opp.cols.Type];
    const typesActuels = Array.isArray(rawType)
      ? rawType.slice(1).filter(v => typeof v === 'string')
      : (project.dispositif ? [project.dispositif] : []);
    const partenaires = sortedPartners();
    const equipesLibres = model.teams.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    // Les équipes proposées suivent les laboratoires retenus, dès l'ouverture.
    const labosActuels = structureNames(labos, refIdsFromValue(row[opp.cols.Laboratoire]));

    openModal({
      title: 'Éditer : ' + project.title,
      submit: 'Enregistrer',
      selects: {
        type: { values: dispositifs, selected: typesActuels, single: !isListCol(opp, opp.cols.Type) },
        partner: {
          values: partenaires.map(p => p.name),
          selected: partenaires.filter(p => project.partnerIds.includes(p.id)).map(p => p.name),
          labelAll: 'Projet interne (aucun partenaire)'
        },
        etablissement: { values: etabs.map(s => s.name), selected: structureNames(etabs, refIdsFromValue(row[opp.cols.Etablissement])) },
        laboratoire: {
          values: labos.map(s => s.name),
          selected: labosActuels,
          onChange: (choisis, all) => all.equipe.setOptions(equipesDesLabos(equipes, choisis).map(e => e.name))
        },
        equipe: {
          values: equipesDesLabos(equipes, labosActuels).map(e => e.name),
          selected: structureNames(equipes, refIdsFromValue(row[opp.cols.EquipeCluster]))
        },
        team: {
          values: equipesLibres.map(t => t.name),
          selected: structureNames(equipesLibres, refIdsFromValue(row[opp.teamWriteCol]))
        }
      },
      fields:
        field('Sujet', '<input name="sujet" value="' + H(project.title) + '" required>') +
        msField('Type', 'type') +
        selectField('Étape', 'statut', stages, project.stage) +
        msField('Partenaire', 'partner') +
        (opp.cols.Etablissement ? msField('Établissement', 'etablissement') : '') +
        (opp.cols.Laboratoire ? msField('Laboratoire', 'laboratoire') : '') +
        (opp.cols.EquipeCluster ? msField('Équipe Cluster', 'equipe') : '') +
        (opp.teamWriteCol ? msField(opp.teamWriteLabel || 'Équipe de recherche', 'team') : '') +
        field('Montant (€)', '<input type="number" name="montant" value="' + (project.montant || '') + '" min="0" step="1000">') +
        field('Date de début', '<input type="date" name="debut" value="' + (project.stageSince ? gristDateToInputValue(project.stageSince) : '') + '">') +
        field('Échéance / date de dépôt', '<input type="date" name="echeance" value="' + (project.depotDue ? gristDateToInputValue(project.depotDue) : '') + '">'),
      onSubmit: async (form, selects) => {
        const sujet = form.sujet.value.trim();
        if (!sujet) return 'Un sujet est nécessaire.';
        const fields = {};
        if (opp.cols.Sujet && sujet !== project.title) fields[opp.cols.Sujet] = sujet;
        // Une valeur de Choice est une chaîne, une ChoiceList ['L', …valeurs],
        // comme les colonnes de référence multiples.
        if (opp.cols.Type) {
          const types = selects.type.getSelected();
          if (types.length) fields[opp.cols.Type] = colValue(opp, opp.cols.Type, types);
        }
        if (opp.cols.Statut && form.statut.value !== project.stage) fields[opp.cols.Statut] = form.statut.value;
        if (opp.cols.Montant && form.montant.value) fields[opp.cols.Montant] = Number(form.montant.value);
        if (opp.cols.DateDebut && form.debut.value) fields[opp.cols.DateDebut] = inputValueToGristDate(form.debut.value);
        if (opp.cols.Echeance && form.echeance.value) fields[opp.cols.Echeance] = inputValueToGristDate(form.echeance.value);
        [[opp.cols.Partenaires, 'partner', partenaires], [opp.cols.Etablissement, 'etablissement', etabs],
         [opp.cols.Laboratoire, 'laboratoire', labos], [opp.cols.EquipeCluster, 'equipe', equipes],
         [opp.teamWriteCol, 'team', equipesLibres]].forEach(([col, name, list]) => {
          if (!col) return;
          const ids = structureIds(list, selects[name].getSelected());
          if (ids.length) fields[col] = ['L', ...ids];
        });
        try {
          if (Object.keys(fields).length > 0) {
            await updateRecord(opp.tableId, projectId, fields);
          }
          await refresh();
          setStatus('Opportunité enregistrée ✓');
        } catch (err) { console.error(err); return 'Erreur d’enregistrement.'; }
      }
    });
  }

  // ---------------------------------------------------------------------
  // Événements
  // ---------------------------------------------------------------------
  initFilters();

  document.querySelectorAll('.pil-nav-item[data-view]').forEach(b =>
    b.addEventListener('click', () => goto(b.dataset.view)));

  el('search').addEventListener('input', debounce((e) => {
    query = e.target.value.trim().toLowerCase();
    render();
  }, 180));

  el('btn-action').addEventListener('click', openActionModal);
  el('btn-note').addEventListener('click', openNoteModal);

  document.querySelector('.pil-scroll').addEventListener('click', (e) => {
    const goBtn = e.target.closest('[data-goto]');
    if (goBtn) return goto(goBtn.dataset.goto);
    const sugg = e.target.closest('[data-suggest]');
    if (sugg) return acceptSuggestion(sugg.dataset.suggest);
    const snooze = e.target.closest('[data-snooze]');
    if (snooze) return snoozeAction(snooze.dataset.snooze, Number(snooze.dataset.due));
    // Cliquer la ligne l'édite — sauf sur la case à cocher et les boutons de
    // report, qui ont déjà leur geste.
    const ligne = e.target.closest('.pil-action');
    if (ligne && !e.target.closest('.pil-check-wrap') && !e.target.closest('[data-snooze]')) {
      const box = ligne.querySelector('.pil-check');
      if (box) return editActionModal(box.dataset.action);
    }
    if (e.target.closest('#quick-add')) return submitQuickAction();
    if (e.target.closest('#btn-terminees')) {
      voirTerminees = !voirTerminees;
      return render();
    }
    if (e.target.closest('#flt-urgentes')) {
      kanbanUrgentes = !kanbanUrgentes;
      return render();
    }
    if (e.target.closest('#btn-action-kanban')) return openActionModal();
    if (e.target.closest('#flt-courtes')) {
      actionsCourtes = !actionsCourtes;
      return render();
    }
    // Les boutons de création vivent dans les vues, donc re-rendus : ils
    // passent par la délégation plutôt que par un écouteur direct.
    if (e.target.closest('#btn-opportunite')) return openOpportuniteModal(null);
    if (e.target.closest('#btn-action-vue')) return openActionModal();
    const add = e.target.closest('[data-add-stage]');
    if (add) return openOpportuniteModal(add.dataset.addStage);
    const unfilter = e.target.closest('[data-unfilter]');
    if (unfilter) {
      const key = unfilter.dataset.unfilter;
      const next = projectFilters[key].filter(v => v !== unfilter.dataset.value);
      projectFilters[key] = next;
      filterWidgets[key].setSelected(next);
      return renderProjets();
    }
    if (e.target.closest('#filter-reset')) {
      Object.keys(projectFilters).forEach(key => {
        projectFilters[key] = [];
        if (filterWidgets[key]) filterWidgets[key].setSelected([]);
      });
      return renderProjets();
    }
  });

  // Saisie rapide : aperçu pendant la frappe, Entrée pour valider.
  document.querySelector('.pil-scroll').addEventListener('input', (e) => {
    if (e.target.id === 'quick-action') quickPreview();
  });
  document.querySelector('.pil-scroll').addEventListener('keydown', (e) => {
    if (e.target.id !== 'quick-action') return;
    if (e.key === 'Enter') { e.preventDefault(); submitQuickAction(); }
    if (e.key === 'Escape') { e.target.value = ''; quickPreview(); e.target.blur(); }
  });

  // Raccourcis de la todo liste. Ils ne s'appliquent qu'en vue « Mes actions »
  // et jamais pendant une saisie, sinon taper « n » dans un champ ouvrirait
  // un formulaire.
  document.addEventListener('keydown', (e) => {
    if (view !== 'actions' || e.metaKey || e.ctrlKey || e.altKey) return;
    const cible = e.target;
    const saisie = cible && (cible.tagName === 'INPUT' || cible.tagName === 'TEXTAREA' ||
      cible.tagName === 'SELECT' || cible.isContentEditable);
    if (el('modal-host').firstChild) return;
    if (e.key === '/' && !saisie) { e.preventDefault(); el('search').focus(); return; }
    if (saisie) return;
    const lignes = Array.from(document.querySelectorAll('#view-actions .pil-action'));
    if (e.key === 'n') {
      e.preventDefault();
      const q = el('quick-action');
      if (q) q.focus(); else openActionModal();
      return;
    }
    if (!lignes.length) return;
    const place = (i) => {
      actionCursor = Math.max(0, Math.min(lignes.length - 1, i));
      lignes.forEach((l, j) => l.classList.toggle('cursor', j === actionCursor));
      lignes[actionCursor].scrollIntoView({ block: 'nearest' });
    };
    if (e.key === 'j') { e.preventDefault(); return place(actionCursor === null ? 0 : actionCursor + 1); }
    if (e.key === 'k') { e.preventDefault(); return place(actionCursor === null ? 0 : actionCursor - 1); }
    if (actionCursor === null || !lignes[actionCursor]) return;
    const courante = lignes[actionCursor];
    if (e.key === 'x') {
      e.preventDefault();
      const box = courante.querySelector('.pil-check');
      if (box) toggleAction(box.dataset.action, !box.checked);
      return;
    }
    if (e.key === 'Enter' || e.key === 'e') {
      e.preventDefault();
      const box = courante.querySelector('.pil-check');
      if (box) editActionModal(box.dataset.action);
      return;
    }
    if (['1', '2', '3'].includes(e.key)) {
      e.preventDefault();
      const btn = courante.querySelectorAll('[data-snooze]')[Number(e.key) - 1];
      if (btn) snoozeAction(btn.dataset.snooze, Number(btn.dataset.due));
    }
  });

  document.querySelector('.pil-scroll').addEventListener('change', (e) => {
    const check = e.target.closest('.pil-check');
    if (check) return toggleAction(check.dataset.action, check.checked);
    const move = e.target.closest('.pil-move');
    if (move && move.value) return moveProject(Number(move.dataset.id), move.value);
  });

  // Glisser-déposer natif (pas de dépendance) ; l'alternative clavier est
  // le menu « Déplacer vers… » de chaque carte.
  let dragId = null;
  const scroll = document.querySelector('.pil-scroll');
  scroll.addEventListener('click', (e) => {
    const card = e.target.closest('.pil-cardlet');
    if (!card || e.target.classList.contains('pil-move')) return;
    const projectId = Number(card.dataset.id);
    editOpportuniteModal(projectId);
  });
  scroll.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' && document.activeElement.classList.contains('pil-cardlet')) {
      e.preventDefault();
      const projectId = Number(document.activeElement.dataset.id);
      if (!confirm('Supprimer cette opportunité?')) return;
      const opp = related.opportunites;
      if (opp.tableId) {
        removeRecord(opp.tableId, projectId).then(() => {
          refresh();
          setStatus('Opportunité supprimée ✓');
        }).catch(err => {
          console.error(err);
          setStatus('Erreur de suppression');
        });
      }
    }
  });
  scroll.addEventListener('dragstart', (e) => {
    const card = e.target.closest('.pil-cardlet');
    if (!card) return;
    dragId = Number(card.dataset.id);
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.id);
  });
  scroll.addEventListener('dragend', (e) => {
    const card = e.target.closest('.pil-cardlet');
    if (card) card.classList.remove('dragging');
    document.querySelectorAll('.pil-col-cards.dragover').forEach(c => c.classList.remove('dragover'));
  });
  scroll.addEventListener('dragover', (e) => {
    const zone = e.target.closest('.pil-col-cards');
    if (!zone || dragId === null) return;
    e.preventDefault();
    zone.classList.add('dragover');
  });
  scroll.addEventListener('dragleave', (e) => {
    const zone = e.target.closest('.pil-col-cards');
    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('dragover');
  });
  scroll.addEventListener('drop', (e) => {
    const zone = e.target.closest('.pil-col-cards');
    if (!zone || dragId === null) return;
    e.preventDefault();
    zone.classList.remove('dragover');
    const id = dragId;
    dragId = null;
    moveProject(id, zone.dataset.stage);
  });

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  grist.onRecords(async function (records, maps) {
    mappings = maps || {};
    if (structTableId === null) {
      try { structTableId = await grist.getTable().getTableId(); } catch (err) { console.error(err); }
    }
    if (!related.interactions) {
      await loadOptions();
      await loadRelated();
    }
    await loadStructures();
    model = buildModel();
    render();
  });

  if (typeof grist.onOptions === 'function') grist.onOptions(async function () {
    await loadOptions();
    if (model) { model = buildModel(); render(); }
  });
})();
</script>
</body>
</html>
