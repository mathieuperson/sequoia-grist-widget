<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cartographie SequoIA</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<style>
  /* Couleurs des marqueurs, par Type d'acteur — dédiées et distinctes des
     couleurs de piliers SequoIA (--pilier-core/-secu/-env, réservées aux
     badges de pilier). Progression Institution → Académique → Recherche →
     Innovation → Économique → Association, vérifiée avec le validateur de
     palette (scripts/validate_palette.js du skill dataviz) : bande de
     luminosité, plancher de chroma, séparation daltonisme et contraste OK,
     y compris paire à paire contre les 3 couleurs de pilier.
     --pilier-core (#8c62b3), --pilier-secu (#4fa5d8) et --pilier-env (#4cae8c)
     restent réservées aux badges de pilier — ne pas les réutiliser ici. */
  :root {
    --type-institution: #1d4ed8;
    --type-academique: #d97706;
    --type-recherche: #be185d;
    --type-innovation: #854d0e;
    --type-economique: #047857;
    --type-association: #b91c1c;
  }

  /* ---------- Carte ---------- */
  #map {
    flex: 1;
    height: 100%;
    background: var(--bg);
  }

  .map-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .map-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    row-gap: 6px;
    padding: 8px 12px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }

  .map-toolbar .spacer { flex: 1; }

  .map-toolbar button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .map-toolbar button:hover { border-color: var(--sequoia-green); color: var(--sequoia-green); }

  .count-strong { color: var(--text); font-weight: 600; }

  /* ---------- Bascule Carte / Statistiques ----------
     Sélecteurs qualifiés par .view-tabs : la règle générique
     ".map-toolbar button:hover" (un type + une classe) serait sinon plus
     spécifique qu'un simple ".view-tab:hover" et gagnerait sur l'onglet actif
     (texte vert sur fond vert, illisible). */
  .view-tabs { display: flex; gap: 4px; }

  .view-tabs .view-tab {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .view-tabs .view-tab:hover { border-color: var(--sequoia-green); color: var(--sequoia-green); }

  .view-tabs .view-tab.active {
    background: var(--sequoia-green);
    border-color: var(--sequoia-green);
    color: #fff;
  }

  .view-tabs .view-tab.active:hover {
    background: var(--sequoia-green-dark, var(--sequoia-green));
    border-color: var(--sequoia-green-dark, var(--sequoia-green));
    color: #fff;
  }

  /* ---------- Vue Statistiques ---------- */
  .stats-view {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--bg);
  }

  .stats-view[hidden] { display: none; }

  .stats-intro { margin: 0 0 14px; font-size: 12.5px; color: var(--text-muted); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .stat-card h3 { margin: 0 0 2px; font-size: 13.5px; color: var(--text); }

  .stat-total { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }

  .bar-list { display: flex; flex-direction: column; gap: 9px; }

  .bar-empty { font-size: 12.5px; color: var(--text-muted); }

  .bar-row { display: flex; flex-direction: column; gap: 3px; }

  .bar-row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
  }

  .bar-row-label {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-row-value { color: var(--text); font-weight: 600; flex: none; }

  .bar-track { height: 10px; background: var(--border); border-radius: 0 4px 4px 0; }

  .bar-fill {
    display: block;
    height: 100%;
    min-width: 3px;
    border-radius: 0 4px 4px 0;
    cursor: pointer;
    transition: filter .1s;
  }

  .bar-fill:hover, .bar-fill:focus-visible { filter: brightness(1.12); outline: none; }

  /* ---------- Bulle au survol des barres (Statistiques) ---------- */
  .chart-tooltip {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    background: var(--text);
    color: #fff;
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 12px;
    line-height: 1.35;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    max-width: 220px;
  }

  .chart-tooltip[hidden] { display: none; }

  .chart-tooltip .tt-value { font-weight: 700; font-size: 13px; }

  .chart-tooltip .tt-label { color: rgba(255, 255, 255, .8); }

  /* ---------- Légende ---------- */
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  /* ---------- Marqueurs (divIcon, pas d'image) ---------- */
  .pin {
    width: 22px;
    height: 22px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    background: var(--text-muted);
  }

  /* La couleur (Type d'acteur) est posée en style inline par le JS
     (pinBackground()) : ChoiceList possible côté Grist, dégradé si plusieurs
     types reconnus, gris de repli sinon — trop de combinaisons pour des
     classes CSS figées. */

  .pin.is-active {
    outline: 3px solid var(--sequoia-green);
    outline-offset: 1px;
  }

  .cluster-badge {
    background: var(--sequoia-green);
    color: #fff;
    border: 3px solid var(--sequoia-green-light);
    border-radius: 50%;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
  }

  /* ---------- Bulle ---------- */
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .leaflet-popup-content { margin: 12px; width: 260px !important; }

  .pop-head { display: flex; gap: 10px; align-items: flex-start; }

  .pop-logo {
    width: 46px;
    height: 46px;
    flex: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .pop-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .pop-logo .fallback {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .pop-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }

  .pop-type {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .pop-type-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .pop-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

  .pop-desc {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .pop-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .pop-actions a,
  .pop-actions button {
    font-size: 12px;
    font-family: inherit;
    border-radius: 7px;
    padding: 5px 9px;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }

  .pop-actions .primary {
    background: var(--sequoia-green);
    border-color: var(--sequoia-green);
    color: #fff;
  }

  .map-error {
    padding: 16px;
    margin: 16px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 13px;
    line-height: 1.5;
  }

  .map-error code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="search-box">
        <input id="search" type="search" placeholder="Rechercher une structure…" autocomplete="off">
      </div>
      <div class="list-controls">
        <label class="toggle-row">
          <input type="checkbox" id="show-prospects">
          Afficher les prospects
        </label>
        <button class="filter-toggle-btn" id="filter-toggle" type="button">Filtres ▾</button>
      </div>
      <div class="filter-panel" id="filter-panel" hidden>
        <div class="filter-field">
          <label for="filter-type_acteur">Type d'acteur</label>
          <select id="filter-type_acteur" data-field="type_acteur"><option value="">Tous</option></select>
        </div>
        <div class="filter-field">
          <label for="filter-acteur_categorie">Catégorie</label>
          <select id="filter-acteur_categorie" data-field="acteur_categorie"><option value="">Toutes</option></select>
        </div>
        <div class="filter-field">
          <label for="filter-entreprise_activite">Activité</label>
          <select id="filter-entreprise_activite" data-field="entreprise_activite"><option value="">Toutes</option></select>
        </div>
        <div class="filter-field">
          <label for="filter-entreprise_taille">Taille</label>
          <select id="filter-entreprise_taille" data-field="entreprise_taille"><option value="">Toutes</option></select>
        </div>
        <div class="filter-field">
          <label for="filter-pilier_sequoia">Pilier SequoIA</label>
          <select id="filter-pilier_sequoia" data-field="pilier_sequoia"><option value="">Tous</option></select>
        </div>
        <div class="filter-field">
          <label for="filter-axe_sequoia">Axe SequoIA</label>
          <select id="filter-axe_sequoia" data-field="axe_sequoia"><option value="">Tous</option></select>
        </div>
        <button class="filter-reset" id="filter-reset" type="button">Réinitialiser les filtres</button>
      </div>
      <div class="active-chips" id="active-chips" hidden></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="map-wrap">
    <div class="map-toolbar">
      <div class="view-tabs" role="tablist">
        <button class="view-tab active" id="tab-carte" type="button" data-view="carte" role="tab" aria-selected="true">🗺️ Carte</button>
        <button class="view-tab" id="tab-stats" type="button" data-view="stats" role="tab" aria-selected="false">📊 Statistiques</button>
      </div>
      <span><span class="count-strong" id="count">0</span> structure(s) affichée(s)</span>
      <span id="nogeo" class="count-muted"></span>
      <span class="spacer"></span>
      <div class="legend">
        <span class="legend-item"><i class="legend-dot" style="background:var(--type-institution)"></i>Institution</span>
        <span class="legend-item"><i class="legend-dot" style="background:var(--type-academique)"></i>Académique</span>
        <span class="legend-item"><i class="legend-dot" style="background:var(--type-recherche)"></i>Recherche</span>
        <span class="legend-item"><i class="legend-dot" style="background:var(--type-innovation)"></i>Innovation</span>
        <span class="legend-item"><i class="legend-dot" style="background:var(--type-economique)"></i>Économique</span>
        <span class="legend-item"><i class="legend-dot" style="background:var(--type-association)"></i>Association</span>
      </div>
      <button id="fit" type="button">Recadrer</button>
    </div>
    <div id="map"></div>
    <div class="stats-view" id="stats-view" hidden>
      <p class="stats-intro">Calculées sur les structures actuellement affichées (filtres de gauche compris).</p>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Type d'acteur</h3>
          <div class="stat-total" id="stat-total-type_acteur"></div>
          <div class="bar-list" id="chart-type_acteur"></div>
        </div>
        <div class="stat-card">
          <h3>Pilier SequoIA</h3>
          <div class="stat-total" id="stat-total-pilier_sequoia"></div>
          <div class="bar-list" id="chart-pilier_sequoia"></div>
        </div>
        <div class="stat-card">
          <h3>Axe SequoIA</h3>
          <div class="stat-total" id="stat-total-axe_sequoia"></div>
          <div class="bar-list" id="chart-axe_sequoia"></div>
        </div>
        <div class="stat-card">
          <h3>Secteur d'activité</h3>
          <div class="stat-total" id="stat-total-entreprise_activite"></div>
          <div class="bar-list" id="chart-entreprise_activite"></div>
        </div>
        <div class="stat-card">
          <h3>Taille d'entreprise</h3>
          <div class="stat-total" id="stat-total-entreprise_taille"></div>
          <div class="bar-list" id="chart-entreprise_taille"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="chart-tooltip" id="chart-tooltip" hidden></div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<!-- Leaflet est versionné dans vendor/ (pas de CDN) : le dépôt garde sa règle
     "aucune dépendance runtime externe", et le widget marche même si un réseau
     d'administration bloque les CDN. Mise à jour = npm pack + copie de dist/. -->
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="common.js"></script>
<script>
(function () {
  'use strict';

  // Les colonnes de Structures sont lues par leur identifiant réel, comme dans
  // index.html (pas de mapping) — sauf la latitude/longitude, ajoutées après coup
  // et dont le nom peut varier : on les détecte parmi ces candidats.
  const LAT_CANDIDATES = ['latitude', 'Latitude', 'lat', 'Lat', 'geo_latitude', 'lat_wgs84'];
  const LON_CANDIDATES = ['longitude', 'Longitude', 'lon', 'lng', 'Long', 'geo_longitude', 'lon_wgs84'];

  // Suit la convention des autres widgets : Pilier SequoIA d'abord, Axe SequoIA ensuite.
  const FILTER_FIELDS = ['type_acteur', 'acteur_categorie', 'entreprise_activite', 'entreprise_taille', 'pilier_sequoia', 'axe_sequoia'];
  const FILTER_LABELS = {
    type_acteur: "Type d'acteur", acteur_categorie: 'Catégorie', entreprise_activite: 'Activité',
    entreprise_taille: 'Taille', pilier_sequoia: 'Pilier SequoIA', axe_sequoia: 'Axe SequoIA'
  };
  const activeFilters = {
    type_acteur: '', acteur_categorie: '', entreprise_activite: '', entreprise_taille: '',
    pilier_sequoia: '', axe_sequoia: ''
  };

  let allRecords = [];
  let latCol = null;
  let lonCol = null;
  let currentId = null;
  const markersById = {};

  grist.ready({ requiredAccess: 'full', allowSelectBy: true });

  // ---------- Carte ----------
  const map = L.map('map', { zoomControl: true }).setView([48.1, -2.8], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const cluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    maxClusterRadius: 45,
    iconCreateFunction: c => L.divIcon({
      html: '<div class="cluster-badge">' + c.getChildCount() + '</div>',
      className: '',
      iconSize: [36, 36]
    })
  });
  map.addLayer(cluster);

  // ---------- Helpers ----------

  // Une ChoiceList arrive sous la forme ['L', 'a', 'b'] : on la rend lisible
  // (même helper que dans index.html).
  function listText(value) {
    if (!value) return '';
    if (Array.isArray(value)) return value.filter(v => typeof v === 'string' && v !== 'L').join(', ');
    return String(value);
  }

  function listValues(value) {
    if (!value) return [];
    if (Array.isArray(value)) return value.filter(v => typeof v === 'string' && v !== 'L');
    return [String(value)];
  }

  // Latitude/longitude peuvent être numériques ou saisies en texte avec une
  // virgule décimale : les deux doivent marcher.
  function toNumber(value) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : null;
    if (typeof value !== 'string') return null;
    const n = parseFloat(value.trim().replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }

  function detectGeoColumns(records) {
    const keys = new Set();
    records.forEach(r => Object.keys(r).forEach(k => keys.add(k)));
    const pick = candidates => candidates.find(c => keys.has(c))
      || Array.from(keys).find(k => candidates.some(c => k.toLowerCase() === c.toLowerCase()));
    latCol = pick(LAT_CANDIDATES) || null;
    lonCol = pick(LON_CANDIDATES) || null;
  }

  function coordsOf(record) {
    if (!latCol || !lonCol) return null;
    const lat = toNumber(record[latCol]);
    const lon = toNumber(record[lonCol]);
    if (lat === null || lon === null) return null;
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
    if (lat === 0 && lon === 0) return null;
    return [lat, lon];
  }

  // Couleur des marqueurs = Type d'acteur (pas Pilier SequoIA : ce dernier
  // pourra bientôt être multi-sélection côté Grist, donc pas une bonne source
  // pour une couleur unique de pin — les piliers restent affichés en badges
  // dans la bulle). Palette dédiée dans :root (--type-*), distincte des
  // couleurs de piliers.
  const TYPE_COLORS = {
    institution: 'var(--type-institution)',
    academique: 'var(--type-academique)',
    recherche: 'var(--type-recherche)',
    innovation: 'var(--type-innovation)',
    economique: 'var(--type-economique)',
    association: 'var(--type-association)'
  };

  // Réutilise les couleurs de pilier existantes (badges de la bulle) pour le
  // graphique "Pilier SequoIA" de la vue Statistiques — même code couleur,
  // pas une palette de plus à retenir.
  const PILIER_COLORS = {
    core: 'var(--pilier-core)',
    secu: 'var(--pilier-secu)',
    env: 'var(--pilier-env)'
  };

  function typeActeurClass(value) {
    if (!value) return '';
    const v = String(value).toLowerCase();
    if (v.includes('institution')) return 'institution';
    if (v.includes('académique') || v.includes('academique') || v.includes('formation')) return 'academique';
    if (v.includes('recherche')) return 'recherche';
    if (v.includes('innovation')) return 'innovation';
    if (v.includes('économique') || v.includes('economique') || v.includes('entreprise')) return 'economique';
    if (v.includes('association')) return 'association';
    return '';
  }

  // Un acteur peut porter plusieurs types (ChoiceList) : dégradé si plusieurs
  // couleurs reconnues, chaîne vide (repli gris du CSS) si aucune.
  function pinBackground(record) {
    const classes = Array.from(new Set(listValues(record.type_acteur).map(typeActeurClass).filter(Boolean)));
    if (classes.length === 0) return '';
    if (classes.length === 1) return TYPE_COLORS[classes[0]];
    const step = 100 / classes.length;
    const stops = classes.map((c, i) =>
      TYPE_COLORS[c] + ' ' + Math.round(i * step) + '%, ' + TYPE_COLORS[c] + ' ' + Math.round((i + 1) * step) + '%');
    return 'linear-gradient(135deg, ' + stops.join(', ') + ')';
  }

  // ---------- Statistiques (vue "Statistiques") ----------
  // Une valeur ChoiceList compte pour chacune de ses valeurs (un acteur avec
  // 2 piliers apparaît dans les 2 barres) : c'est la lecture attendue d'un
  // dénombrement par facette, pas une répartition qui doit sommer au total.
  const STATS_TOP_N = 8;

  function countBy(records, field) {
    const counts = new Map();
    records.forEach(record => {
      const values = listValues(record[field]);
      if (values.length === 0) {
        counts.set('Non renseigné', (counts.get('Non renseigné') || 0) + 1);
        return;
      }
      values.forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
    });
    let rows = Array.from(counts.entries())
      .map(([label, count]) => ({ label, count }))
      .sort((a, b) => b.count - a.count);
    if (rows.length > STATS_TOP_N) {
      const head = rows.slice(0, STATS_TOP_N - 1);
      const autres = rows.slice(STATS_TOP_N - 1).reduce((sum, r) => sum + r.count, 0);
      rows = head.concat([{ label: 'Autres', count: autres }]);
    }
    return rows;
  }

  const STAT_DIMENSIONS = [
    { field: 'type_acteur', colorFor: label => TYPE_COLORS[typeActeurClass(label)] || 'var(--text-muted)' },
    { field: 'pilier_sequoia', colorFor: label => PILIER_COLORS[pilierClass(label)] || 'var(--text-muted)' },
    { field: 'axe_sequoia', colorFor: () => 'var(--sequoia-green)' },
    { field: 'entreprise_activite', colorFor: () => 'var(--sequoia-green)' },
    { field: 'entreprise_taille', colorFor: () => 'var(--sequoia-green)' }
  ];

  // Recalculée à chaque render() : les graphiques suivent donc automatiquement
  // les filtres de gauche (recherche, prospects, Type/Catégorie/.../Axe), sans
  // câblage séparé.
  function renderStats(visible) {
    STAT_DIMENSIONS.forEach(dim => {
      const rows = countBy(visible, dim.field);
      const max = rows.length ? rows[0].count : 0;

      const totalEl = document.getElementById('stat-total-' + dim.field);
      totalEl.textContent = visible.length + (visible.length > 1 ? ' structures' : ' structure');

      const container = document.getElementById('chart-' + dim.field);
      if (rows.length === 0) {
        container.innerHTML = '<div class="bar-empty">Aucune donnée.</div>';
        return;
      }
      container.innerHTML = rows.map(row => {
        const pct = max ? Math.max(2, Math.round((row.count / max) * 100)) : 0;
        return '<div class="bar-row">'
          + '<div class="bar-row-head">'
          +   '<span class="bar-row-label">' + escapeHtml(row.label) + '</span>'
          +   '<span class="bar-row-value">' + row.count + '</span>'
          + '</div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + dim.colorFor(row.label) + '" '
          +   'tabindex="0" data-label="' + escapeHtml(row.label) + '" data-value="' + row.count + '"></div></div>'
          + '</div>';
      }).join('');
    });
  }

  // Une seule bulle, déléguée sur tout le conteneur : les listes de barres se
  // remplacent entièrement à chaque renderStats(), pas de ré-attachement
  // d'écouteur par barre à gérer.
  const chartTooltip = document.getElementById('chart-tooltip');
  chartTooltip.innerHTML = '<div class="tt-value"></div><div class="tt-label"></div>';
  const ttValue = chartTooltip.querySelector('.tt-value');
  const ttLabel = chartTooltip.querySelector('.tt-label');

  function showChartTooltip(bar, x, y) {
    ttValue.textContent = bar.dataset.value;
    ttLabel.textContent = bar.dataset.label;
    chartTooltip.style.left = x + 'px';
    chartTooltip.style.top = y + 'px';
    chartTooltip.hidden = false;
  }

  function hideChartTooltip() { chartTooltip.hidden = true; }

  const statsView = document.getElementById('stats-view');
  statsView.addEventListener('pointermove', event => {
    const bar = event.target.closest('.bar-fill');
    if (!bar) { hideChartTooltip(); return; }
    showChartTooltip(bar, event.clientX + 14, event.clientY + 14);
  });
  statsView.addEventListener('pointerleave', hideChartTooltip);
  statsView.addEventListener('focusin', event => {
    const bar = event.target.closest('.bar-fill');
    if (!bar) return;
    const rect = bar.getBoundingClientRect();
    showChartTooltip(bar, rect.right + 10, rect.top);
  });
  statsView.addEventListener('focusout', hideChartTooltip);

  // ---------- Bascule Carte / Statistiques ----------
  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-tab').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', String(b === btn));
      });
      const isStats = btn.dataset.view === 'stats';
      document.getElementById('map').hidden = isStats;
      statsView.hidden = !isStats;
      document.getElementById('fit').hidden = isStats;
      if (!isStats) {
        // Leaflet ne recalcule pas sa taille pendant qu'il est display:none :
        // sans ça la carte reste coupée après un aller-retour Statistiques → Carte.
        setTimeout(() => map.invalidateSize(), 0);
      }
    });
  });

  function matchesFilters(record) {
    const showProspects = document.getElementById('show-prospects').checked;
    if (!showProspects && listText(record.acteur_categorie).trim().toLowerCase() === 'prospect') return false;

    const query = document.getElementById('search').value.trim().toLowerCase();
    if (query && !String(record.nom_acteur || '').toLowerCase().includes(query)) return false;

    return FILTER_FIELDS.every(field => {
      const wanted = activeFilters[field];
      if (!wanted) return true;
      return listValues(record[field]).includes(wanted);
    });
  }

  // ---------- Bulle ----------
  function popupHtml(record) {
    const name = escapeHtml(record.nom_acteur || 'Sans nom');
    const logo = record.url_logo
      ? '<img src="' + escapeHtml(record.url_logo) + '" alt="" '
        + 'onerror="this.parentElement.innerHTML=\'<span class=&quot;fallback&quot;>'
        + escapeHtml(initials(record.nom_acteur)) + '</span>\'">'
      : '<span class="fallback">' + escapeHtml(initials(record.nom_acteur)) + '</span>';

    const pills = listValues(record.pilier_sequoia)
      .map(v => '<span class="value-pill ' + pilierClass(v) + '">' + escapeHtml(v) + '</span>')
      .join('');

    const site = record.url_site_web
      ? '<a href="' + escapeHtml(record.url_site_web) + '" target="_blank" rel="noopener">Site ↗</a>'
      : '';

    const type = [listText(record.type_acteur), listText(record.entreprise_taille)]
      .filter(Boolean).join(' · ');
    const typeColor = pinBackground(record) || 'var(--text-muted)';

    return ''
      + '<div class="pop">'
      +   '<div class="pop-head">'
      +     '<div class="pop-logo">' + logo + '</div>'
      +     '<div><div class="pop-name">' + name + '</div>'
      +       (type ? '<div class="pop-type"><i class="pop-type-dot" style="background:' + typeColor + '"></i>' + escapeHtml(type) + '</div>' : '')
      +     '</div>'
      +   '</div>'
      +   (pills ? '<div class="pop-pills">' + pills + '</div>' : '')
      +   (record.description ? '<div class="pop-desc">' + escapeHtml(record.description) + '</div>' : '')
      +   '<div class="pop-actions">'
      +     '<button class="primary" data-open="' + record.id + '" type="button">Ouvrir la fiche</button>'
      +     site
      +   '</div>'
      + '</div>';
  }

  // Le bouton de la bulle déplace le curseur Grist : la fiche partenaire liée
  // par "Sélectionner par" s'ouvre sur la structure cliquée.
  function openRecord(id) {
    currentId = id;
    grist.setCursorPos({ rowId: id }).catch(err => console.error(err));
    highlightActive();
  }

  map.on('popupopen', e => {
    const btn = e.popup.getElement().querySelector('[data-open]');
    if (btn) btn.addEventListener('click', () => openRecord(Number(btn.dataset.open)));
  });

  function highlightActive() {
    Object.entries(markersById).forEach(([id, marker]) => {
      const el = marker.getElement();
      if (el) el.querySelector('.pin').classList.toggle('is-active', Number(id) === currentId);
    });
  }

  // ---------- Rendu ----------
  function render() {
    const visible = allRecords.filter(matchesFilters);
    const placed = [];

    cluster.clearLayers();
    Object.keys(markersById).forEach(k => delete markersById[k]);

    visible.forEach(record => {
      const coords = coordsOf(record);
      if (!coords) return;
      const bg = pinBackground(record);
      const marker = L.marker(coords, {
        title: record.nom_acteur || '',
        icon: L.divIcon({
          className: '',
          html: '<div class="pin"' + (bg ? ' style="background:' + bg + '"' : '') + '></div>',
          iconSize: [22, 22],
          iconAnchor: [11, 22],
          popupAnchor: [0, -20]
        })
      });
      marker.bindPopup(() => popupHtml(record), { closeButton: true });
      markersById[record.id] = marker;
      placed.push(marker);
      cluster.addLayer(marker);
    });

    document.getElementById('count').textContent = placed.length;
    const missing = visible.length - placed.length;
    document.getElementById('nogeo').textContent = missing > 0
      ? '· ' + missing + ' sans coordonnées'
      : '';

    renderList(visible);
    renderStats(visible);
    highlightActive();
    return placed;
  }

  function fitToMarkers() {
    const layers = cluster.getLayers();
    if (layers.length === 0) return;
    map.fitBounds(L.featureGroup(layers).getBounds().pad(0.15));
  }

  function renderList(visible) {
    const listEl = document.getElementById('list');
    if (visible.length === 0) {
      listEl.innerHTML = '<div class="empty-list">Aucune structure ne correspond aux filtres.</div>';
      return;
    }

    listEl.innerHTML = '';
    [...visible]
      .sort((a, b) => String(a.nom_acteur || '').localeCompare(String(b.nom_acteur || ''), 'fr'))
      .forEach(record => {
        const item = document.createElement('div');
        item.className = 'list-item' + (record.id === currentId ? ' active' : '');
        const geo = coordsOf(record) ? '' : ' · sans coordonnées';
        item.innerHTML = '<div class="name">' + escapeHtml(record.nom_acteur || 'Sans nom') + '</div>'
          + '<div class="sub">' + escapeHtml(listText(record.type_acteur)) + escapeHtml(geo) + '</div>';
        item.addEventListener('click', () => {
          openRecord(record.id);
          const marker = markersById[record.id];
          if (marker) {
            cluster.zoomToShowLayer(marker, () => marker.openPopup());
          }
        });
        listEl.appendChild(item);
      });
  }

  function populateFilterOptions() {
    FILTER_FIELDS.forEach(field => {
      const select = document.getElementById('filter-' + field);
      const previous = select.value;
      const values = Array.from(new Set(
        allRecords.flatMap(r => listValues(r[field]))
      )).filter(Boolean).sort((a, b) => a.localeCompare(b, 'fr'));

      const placeholder = select.options[0];
      select.innerHTML = '';
      select.appendChild(placeholder);
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.value = values.includes(previous) ? previous : '';
      activeFilters[field] = select.value;
    });
    updateFilterUI();
  }

  // Puces de filtres actifs (retirables) + pastille de compte sur le bouton
  // "Filtres" + surlignage des <select> actifs — tout est dérivé d'une seule
  // fonction pour rester synchronisé quel que soit le point d'entrée
  // (sélection, réinitialisation, repeuplement des options).
  function updateFilterUI() {
    FILTER_FIELDS.forEach(field => {
      document.getElementById('filter-' + field).classList.toggle('is-active', !!activeFilters[field]);
    });

    const active = FILTER_FIELDS.filter(field => activeFilters[field]);
    const toggleBtn = document.getElementById('filter-toggle');
    const panelHidden = document.getElementById('filter-panel').hidden;
    toggleBtn.innerHTML = 'Filtres'
      + (active.length ? ' <span class="filter-count">' + active.length + '</span>' : '')
      + ' ' + (panelHidden ? '▾' : '▴');

    const chipsEl = document.getElementById('active-chips');
    chipsEl.hidden = active.length === 0;
    chipsEl.innerHTML = active.map(field =>
      '<span class="chip"><span>' + escapeHtml(FILTER_LABELS[field]) + ' : ' + escapeHtml(activeFilters[field]) + '</span>'
      + '<button type="button" data-field="' + field + '" aria-label="Retirer le filtre ' + escapeHtml(FILTER_LABELS[field]) + '">×</button></span>'
    ).join('');
  }

  document.getElementById('active-chips').addEventListener('click', event => {
    const btn = event.target.closest('button[data-field]');
    if (!btn) return;
    const field = btn.dataset.field;
    document.getElementById('filter-' + field).value = '';
    activeFilters[field] = '';
    updateFilterUI();
    render();
    fitToMarkers();
  });

  function showGeoError() {
    document.getElementById('map').innerHTML =
      '<div class="map-error"><strong>Colonnes de coordonnées introuvables.</strong><br>'
      + 'Le widget cherche une latitude parmi <code>' + LAT_CANDIDATES.join('</code>, <code>') + '</code> '
      + 'et une longitude parmi <code>' + LON_CANDIDATES.join('</code>, <code>') + '</code>.<br>'
      + 'Renomme la colonne dans Grist, ou ajoute son identifiant en tête de <code>cartographie.html</code>.</div>';
  }

  // ---------- Événements ----------
  document.getElementById('search').addEventListener('input', debounce(render, 200));
  document.getElementById('show-prospects').addEventListener('change', render);
  document.getElementById('fit').addEventListener('click', fitToMarkers);
  document.getElementById('filter-toggle').addEventListener('click', () => {
    const panel = document.getElementById('filter-panel');
    panel.hidden = !panel.hidden;
    updateFilterUI();
  });
  document.getElementById('filter-reset').addEventListener('click', () => {
    FILTER_FIELDS.forEach(field => {
      document.getElementById('filter-' + field).value = '';
      activeFilters[field] = '';
    });
    document.getElementById('search').value = '';
    updateFilterUI();
    render();
    fitToMarkers();
  });
  FILTER_FIELDS.forEach(field => {
    document.getElementById('filter-' + field).addEventListener('change', event => {
      activeFilters[field] = event.target.value;
      updateFilterUI();
      render();
      fitToMarkers();
    });
  });

  // ---------- Grist ----------
  let firstLoad = true;

  grist.onRecords(function (records) {
    allRecords = records || [];
    detectGeoColumns(allRecords);
    if (!latCol || !lonCol) {
      showGeoError();
      return;
    }
    populateFilterOptions();
    render();
    // Ne recadrer qu'au premier chargement : recadrer à chaque rafraîchissement
    // annulerait le zoom que l'utilisateur vient de faire à la main.
    if (firstLoad) {
      firstLoad = false;
      setTimeout(() => { map.invalidateSize(); fitToMarkers(); }, 0);
    }
  });

  // Le curseur Grist (clic dans un autre widget de la page) suit la sélection,
  // mais on n'ouvre pas la bulle automatiquement : seul un clic dans la carte
  // ou dans la liste le fait.
  grist.onRecord(function (record) {
    if (record && record.id) {
      currentId = record.id;
      highlightActive();
    }
  });
})();
</script>
</body>
</html>
