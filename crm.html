<input type="file" id="pj-input" multiple hidden>

<script>
  // ---------------------------------------------------------------------
  // Configuration
  // ---------------------------------------------------------------------
  // The widget is mapped onto Structures; Contacts / Interactions /
  // Opportunites are read and written through docApi (see common.js,
  // "Working across several tables from one widget"). Their column ids
  // aren't part of the widget mapping, so they're resolved by name.

  const COLUMNS = [
    { name: 'Nom', title: 'Nom de la structure', optional: false },
    { name: 'Description', optional: true },
    { name: 'TypeActeur', title: "Type d'acteur", optional: true },
    { name: 'Categorie', title: 'Catégorie', optional: true },
    { name: 'Activite', title: 'Activité', optional: true },
    { name: 'Taille', optional: true },
    { name: 'AxeSequoia', title: 'Axe SequoIA', optional: true },
    { name: 'PilierSequoia', title: 'Pilier SequoIA', optional: true },
    { name: 'SiteWeb', title: 'Site web', optional: true },
    { name: 'Logo', title: 'URL du logo', optional: true },
    { name: 'RechercheStructure', title: 'Structure de recherche', optional: true },
    { name: 'RechercheEquipeActivite', title: 'Équipe / activité', optional: true },
    { name: 'RechercheEquipeLabo', title: 'Laboratoire', optional: true }
  ];

  const RELATED = {
    contacts: {
      tableCandidates: ['Contacts', 'Contact'],
      linkRole: 'Structures',
      roles: {
        Nom: ['Nom'],
        Prenom: ['Prenom', 'Prénom'],
        NomComplet: ['Nom_Complet', 'NomComplet', 'Nom complet'],
        Fonction: ['Fonction', 'Poste'],
        Structures: ['Structures', 'Structure'],
        Email: ['Email', 'Mail', 'Courriel'],
        Telephone: ['Telephone', 'Téléphone', 'Tel'],
        Linkedin: ['Linkedin', 'LinkedIn'],
        ContactPrincipal: ['ContactPrincipal', 'Contact_Principal', 'Contact principal', 'Principal'],
        Commentaire: ['Commentaire', 'Commentaires', 'Notes']
      }
    },
    interactions: {
      tableCandidates: ['Interactions', 'Interaction'],
      linkRole: 'Partenaires',
      roles: {
        Objet: ['Objet', 'Sujet', 'Titre'],
        Date: ['Date'],
        Type: ['Type'],
        Partenaires: ['Partenaires', 'Partenaire', 'Structures', 'Structure'],
        ContactPartenaire: ['ContactPartenaire', 'Contact_Partenaire', 'Contact(s) partenaire', 'Contacts partenaire'],
        ContactCluster: ['ContactCluster', 'Contact_Cluster', 'Contact(s) cluster'],
        ProchaineEcheance: ['ProchaineEcheance', 'Prochaine_Echeance', 'Prochaine échéance', 'Echeance'],
        Suites: ['Suites', 'Suite', 'Prochaine action'],
        Opportunites: ['Opportunites', 'Opportunités', 'Opportunite'],
        CR: ['CR', 'Compte_rendu', 'Compte-rendu', 'CompteRendu'],
        PJ: ['PJ', 'Piece_jointe', 'Pièce-jointe', 'PiecesJointes', 'Attachments']
      }
    },
    // La table des actions n'est pas requise : le CRM sait s'en passer, et le
    // bloc « suites » de la fiche échange n'apparaît que si elle existe.
    actions: {
      optional: true,
      tableCandidates: ['Actions_MP', 'ActionsMP', 'ACTIONS_MP', 'Actions', 'Action'],
      linkRole: 'Partenaires',
      roles: {
        Intitule: ['Intitule', 'Intitulé', 'Libelle', 'Libellé', 'Titre', 'Objet'],
        Echeance: ['Echeance', 'Échéance', 'Date_echeance', 'Date'],
        Fait: ['Fait', 'Faite', 'Termine', 'Terminé', 'Done'],
        Opportunite: ['Opportunite', 'Opportunité', 'Opportunites', 'Opportunités'],
        Partenaires: ['Partenaires', 'Partenaire', 'Structures', 'Structure'],
        Interaction: ['Interaction', 'Interactions'],
        Contacts: ['Contacts', 'Contact', 'Contact(s)', 'Interlocuteurs'],
        Notes: ['Notes', 'Note', 'Commentaire', 'Détail'],
        Priorite: ['Priorite', 'Priorité', 'Importance']
      }
    },
    opportunites: {
      tableCandidates: ['Opportunites', 'Opportunités', 'Opportunite'],
      linkRole: 'Partenaires',
      roles: {
        Sujet: ['Sujet', 'Objet', 'Titre'],
        Type: ['Type'],
        Statut: ['Statut', 'Status', 'Etape'],
        AxeSequoia: ['AxeSequoia', 'Axe_Sequoia', 'Axe SequoIA', 'Axe'],
        PilierSequoia: ['PilierSequoia', 'Pilier_Sequoia', 'Pilier SequoIA', 'Pilier'],
        Montant: ['Montant', 'Montant_€', 'Budget'],
        DateDebut: ['DateDebut', 'Date_Debut', 'Date de début'],
        Echeance: ['Echeance', 'Echéance', 'Date_fin'],
        Commentaire: ['Commentaire', 'Commentaires', 'Notes'],
        Partenaires: ['Partenaires', 'Partenaire', 'Structures', 'Structure'],
        ContactPartenaire: ['ContactPartenaire', 'Contact_Partenaire', 'Contact(s) partenaire'],
        ContactCluster: ['ContactCluster', 'Contact_Cluster', 'Contact(s) Cluster']
      }
    }
  };

  const RELANCE_DAYS = 90; // beyond this, a partner shows up in "À relancer"

  // ---------------------------------------------------------------------
  // État
  // ---------------------------------------------------------------------
  let structures = [];        // mapped records of the widget's own table
  let mappings = null;        // role -> colId, for Structures
  let structTableId = null;
  let current = null;         // selected structure (mapped record)
  let related = {};           // key -> { tableId, cols, records, error }
  let statutChoices = [];     // choix de la colonne Statut, dans l'ordre du document
  // Les colonnes de la table Structures qui portent une liste : même règle que
  // pour les tables liées, Grist refusant ['L', …] sur une colonne à valeur
  // unique (et la cellule s'affiche alors en rose).
  let structListCols = [];
  let structureAOuvrir = null; // structure créée ici, à ouvrir dès qu'elle arrive
  let interactionOuverte = null; // échange dont l'aperçu est déplié dans la frise
  let actionsFaitesVisibles = false; // historique des actions, replié par défaut
  let contactsTousVisibles = false;  // au-delà de six contacts, le reste est replié
  let contactOuvert = null;          // contact dont la fiche est affichée
  let vue = 'fiche';             // 'fiche' ou 'annuaire'
  let annuaireSel = new Set();   // contacts cochés dans l'annuaire
  // Par défaut, tout sauf les prospects — comme les autres widgets.
  let filterMode = 'partenaires';
  let query = '';
  const PANEL_FILTERS = { type: 'TypeActeur', pilier: 'PilierSequoia', axe: 'AxeSequoia' };
  const PANEL_FILTER_LABELS = { type: "Type d'acteur", pilier: 'Pilier SequoIA', axe: 'Axe SequoIA' };
  const activeFilters = { type: '', pilier: '', axe: '' };

  grist.ready({ requiredAccess: 'full', columns: COLUMNS, allowSelectBy: true });

  // ---------------------------------------------------------------------
  // Chargement des tables liées
  // ---------------------------------------------------------------------

  // Resolves a table by trying each candidate id until one loads — a doc may
  // name it "Opportunites" or "Opportunite" and we can't know in advance.
  async function resolveRelated(key) {
    const conf = RELATED[key];
    for (const tableId of conf.tableCandidates) {
      try {
        const data = await fetchTableCached(tableId);
        const cols = resolveColumns(dataColumns(data), conf.roles);
        const meta = await fetchColumnMeta(tableId);

        // A row can point at a structure through several columns — an
        // interaction carries Partenaire(s) but also Etablissement /
        // Laboratoire / Equipe Cluster, all references to Structures. The
        // fiche must show it whichever column was used, so every
        // Structures-referencing column counts as a link, with the
        // configured one first (it stays the "normal" case, untagged).
        const primary = cols[conf.linkRole];
        const discovered = refColumnsTo(meta, structTableId);
        const linkCols = [primary, ...discovered.filter(c => c !== primary)].filter(Boolean);
        const colLabels = {};
        const formulaCols = new Set();
        meta.forEach(m => { colLabels[m.id] = m.label; if (m.isFormula) formulaCols.add(m.id); });
        // Grist attend ['L', …] pour une colonne qui porte une liste (RefList,
        // ChoiceList) et la valeur nue pour une colonne à valeur unique ; il
        // refuse l'autre forme, et la cellule s'affiche alors en rose dans la
        // table. L'écriture doit donc suivre le type réel de la colonne.
        const listCols = meta.filter(m => /^(RefList|ChoiceList):?/.test(m.type || '')).map(m => m.id);
        // Vers quelle table pointe chaque colonne de référence : de quoi
        // retrouver les colonnes qui visent les contacts sans les énumérer.
        const refTargets = {};
        meta.forEach(m => {
          const cible = /^Ref(?:List)?:(.+)$/.exec(m.type || '');
          if (cible) refTargets[m.id] = cible[1];
        });

        // Discovered link columns beyond the primary one (Etablissement /
        // Laboratoire / Equipe Cluster…) double as editable multi-select
        // fields in the create/edit popups — except a formula/lookup column,
        // which Grist would refuse to write to.
        const extraEditableLinkCols = discovered.filter(c => c !== primary && !formulaCols.has(c));

        return {
          tableId,
          cols,
          linkCols: linkCols.length ? linkCols : [primary].filter(Boolean),
          extraEditableLinkCols,
          listCols,
          refTargets,
          colLabels,
          records: recordsFromTableData(data),
          error: null
        };
      } catch (err) { /* try the next candidate */ }
    }
    return { tableId: null, cols: {}, linkCols: [], extraEditableLinkCols: [], listCols: [], refTargets: {}, colLabels: {}, records: [], error: 'Table introuvable (' + conf.tableCandidates.join(' / ') + ')' };
  }

  async function loadRelated() {
    const keys = Object.keys(RELATED);
    const results = await Promise.all(keys.map(resolveRelated));
    keys.forEach((k, i) => { related[k] = results[i]; });
    contactsParStructure = {}; // les contacts d'une structure ont pu changer
    await loadStatusColors();
  }

  // Les pastilles de statut d'opportunité reprennent les couleurs des choix
  // telles que le document les porte, pour coller à la table.
  async function loadStatusColors() {
    const opp = related.opportunites;
    if (!opp || !opp.tableId || !opp.cols.Statut) return;
    const { styles, choices } = await fetchChoiceStyles(opp.tableId, opp.cols.Statut);
    registerStatusStyles(styles);
    // L'ordre des choix est celui du document : il donne l'entonnoir, donc la
    // position d'une opportunité dedans, sans liste figée dans le widget.
    statutChoices = choices || [];
  }

  // Re-reads every related table from the document (their cached copy is
  // dropped on each write, but another user's edits need this explicit
  // refresh — hence the ↻ button and the refresh on window focus).
  async function refreshRelated(force) {
    if (force) {
      Object.keys(related).forEach(k => { if (related[k].tableId) invalidateTableCache(related[k].tableId); });
    }
    await loadRelated();
    render();
  }

  // ---------------------------------------------------------------------
  // Sélecteurs
  // ---------------------------------------------------------------------

  function rel(key) { return related[key] || { tableId: null, cols: {}, linkCols: [], extraEditableLinkCols: [], listCols: [], refTargets: {}, colLabels: {}, records: [] }; }

  function linkedRecords(key, structureId) {
    const r = rel(key);
    const linkCols = r.linkCols && r.linkCols.length ? r.linkCols : [r.cols[RELATED[key].linkRole]].filter(Boolean);
    if (linkCols.length === 0 || structureId == null) return [];
    return r.records.filter(rec => linkCols.some(col => recordLinksTo(rec, col, structureId)));
  }

  // ---- Rattachement indirect, par un contact ----
  //
  // Une opportunité saisie depuis la fiche du Cluster, avec pour contact
  // quelqu'un qui appartient aussi à l'Université de Rennes, concerne les deux
  // structures : c'est la même affaire vue de deux côtés. Mais son lien passe
  // par le contact, pas par une colonne de référence vers la structure, donc
  // `linkedRecords` ne la voit pas. D'où ce second chemin.
  let contactsParStructure = {}; // structureId -> Set d'ids de contacts

  function contactIdsOf(structureId) {
    if (!(structureId in contactsParStructure)) {
      contactsParStructure[structureId] =
        new Set(linkedRecords('contacts', structureId).map(c => c.id));
    }
    return contactsParStructure[structureId];
  }

  // Les colonnes de `key` qui pointent vers la table Contacts, relevées dans
  // les métadonnées : ContactPartenaire, ContactCluster, et toute autre que le
  // document ajouterait sans que le widget en sache le nom.
  function contactColumnsOf(key) {
    const r = rel(key);
    const cible = rel('contacts').tableId;
    if (!cible) return [];
    return Object.keys(r.refTargets || {}).filter(col => r.refTargets[col] === cible);
  }

  // Les contacts de cette ligne qui appartiennent à la structure ouverte.
  function contactsLinkingTo(key, rec, structureId) {
    const ids = contactIdsOf(structureId);
    if (!ids.size) return [];
    const trouves = new Set();
    contactColumnsOf(key).forEach(col => {
      refIdsFromValue(rec[col]).forEach(id => { if (ids.has(id)) trouves.add(id); });
    });
    return Array.from(trouves);
  }

  // Les lignes rattachées à la structure par un de leurs contacts, hors celles
  // que `deja` a déjà trouvées par une colonne de référence directe.
  function recordsViaContacts(key, structureId, deja) {
    const cols = contactColumnsOf(key);
    if (!cols.length || structureId == null) return [];
    const ids = contactIdsOf(structureId);
    if (!ids.size) return [];
    const vus = new Set(deja.map(x => x.id));
    return rel(key).records.filter(rec => !vus.has(rec.id) &&
      cols.some(col => refIdsFromValue(rec[col]).some(id => ids.has(id))));
  }

  // Which column attached this row to the open structure, when it isn't the
  // primary one — e.g. an interaction that lists IRISA as "Laboratoire
  // Cluster" rather than as a partner. Used to label it in the fiche so the
  // row doesn't look misfiled.
  function linkedVia(key, rec, structureId) {
    const r = rel(key);
    const primary = r.cols[RELATED[key].linkRole];
    const via = (r.linkCols || []).find(col => recordLinksTo(rec, col, structureId));
    if (via) return via === primary ? '' : (r.colLabels[via] || via);
    // Aucune colonne ne désigne cette structure : la ligne est là par un de
    // ses contacts. Le nommer, sinon elle a l'air mal classée.
    const noms = contactNamesFor(contactsLinkingTo(key, rec, structureId));
    return noms.length ? 'via ' + noms.join(', ') : '';
  }

  function contactsOf(id) {
    const cols = rel('contacts').cols;
    return linkedRecords('contacts', id).sort((a, b) => {
      // Contact principal first, then alphabetically.
      const pa = cols.ContactPrincipal ? (a[cols.ContactPrincipal] ? 0 : 1) : 1;
      const pb = cols.ContactPrincipal ? (b[cols.ContactPrincipal] ? 0 : 1) : 1;
      if (pa !== pb) return pa - pb;
      return contactName(a).localeCompare(contactName(b), 'fr');
    });
  }

  function interactionsOf(id) {
    const cols = rel('interactions').cols;
    return linkedRecords('interactions', id).sort((a, b) => {
      const da = cols.Date ? (Number(a[cols.Date]) || 0) : 0;
      const db = cols.Date ? (Number(b[cols.Date]) || 0) : 0;
      return db - da;
    });
  }

  function opportunitesOf(id) {
    const cols = rel('opportunites').cols;
    const directes = linkedRecords('opportunites', id);
    // L'ordre de l'entonnoir, celui que le document donne à sa colonne Statut :
    // une affaire en montage se lit avant une en contractualisation. Trier par
    // montant, comme avant, mêlait les étapes et donnait un classement qui ne
    // disait rien du parcours. À étape égale, le montant départage.
    const rangEtape = (o) => {
      if (!cols.Statut) return 0;
      const statut = formatValue(o[cols.Statut]);
      const i = statutChoices.indexOf(statut);
      // Un statut hors de la liste du document passe après ceux qu'elle
      // connaît, plutôt qu'en tête par accident.
      return i === -1 ? statutChoices.length : i;
    };
    return directes.concat(recordsViaContacts('opportunites', id, directes)).sort((a, b) => {
      // Abandoned ones sink to the bottom whatever their stage — they're
      // history, not pipeline.
      const aa = cols.Statut && isAbandoned(a[cols.Statut]) ? 1 : 0;
      const ab = cols.Statut && isAbandoned(b[cols.Statut]) ? 1 : 0;
      if (aa !== ab) return aa - ab;
      const ra = rangEtape(a);
      const rb = rangEtape(b);
      if (ra !== rb) return ra - rb;
      const ma = cols.Montant ? (Number(a[cols.Montant]) || 0) : 0;
      const mb = cols.Montant ? (Number(b[cols.Montant]) || 0) : 0;
      return mb - ma;
    });
  }

  function contactName(c) {
    const cols = rel('contacts').cols;
    const full = cols.NomComplet ? String(c[cols.NomComplet] || '').trim() : '';
    if (full) return full;
    const parts = [cols.Prenom && c[cols.Prenom], cols.Nom && c[cols.Nom]].filter(Boolean);
    return parts.join(' ') || 'Sans nom';
  }

  function contactNamesFor(ids) {
    const byId = {};
    rel('contacts').records.forEach(c => { byId[c.id] = c; });
    return (ids || []).map(id => (byId[id] ? contactName(byId[id]) : null)).filter(Boolean);
  }

  function isAbandoned(statut) {
    return normalizeKey(statut).startsWith('abandon');
  }

  // Everything the header + KPI row needs, computed in one place so the
  // browser tests can assert on it directly (window.__crm.kpis).
  function computeKpis(structureId) {
    const iCols = rel('interactions').cols;
    const oCols = rel('opportunites').cols;
    const interactions = interactionsOf(structureId);
    const opportunites = opportunitesOf(structureId);

    const dates = iCols.Date ? interactions.map(i => Number(i[iCols.Date]) || 0).filter(Boolean) : [];
    const lastContact = dates.length ? Math.max(...dates) : null;

    const active = opportunites.filter(o => !oCols.Statut || !isAbandoned(o[oCols.Statut]));
    const montantTotal = oCols.Montant ? active.reduce((sum, o) => sum + (Number(o[oCols.Montant]) || 0), 0) : 0;

    // Next action = soonest future deadline, from either an interaction
    // follow-up or an opportunity milestone.
    const todayDays = 0;
    const candidates = [];
    if (iCols.ProchaineEcheance) {
      interactions.forEach(i => {
        const d = Number(i[iCols.ProchaineEcheance]) || 0;
        if (d && daysSince(d) <= todayDays) {
          candidates.push({ date: d, label: (iCols.Suites && i[iCols.Suites]) || (iCols.Objet && i[iCols.Objet]) || 'Suite à donner' });
        }
      });
    }
    if (oCols.Echeance) {
      active.forEach(o => {
        const d = Number(o[oCols.Echeance]) || 0;
        if (d && daysSince(d) <= todayDays) {
          candidates.push({ date: d, label: (oCols.Sujet && o[oCols.Sujet]) || 'Opportunité' });
        }
      });
    }
    // Les actions de la todo comptent aussi : c'est souvent la vraie prochaine
    // chose à faire, et elle ne se lisait nulle part sur la fiche.
    const aCols = rel('actions').cols;
    const actionsOuvertes = actionsOfStructure(structureId).filter(x => !actionEstFaite(x));
    if (aCols.Echeance) {
      actionsOuvertes.forEach(x => {
        const d = Number(x[aCols.Echeance]) || 0;
        if (d && daysSince(d) <= todayDays) {
          candidates.push({ date: d, label: (aCols.Intitule && x[aCols.Intitule]) || 'Action' });
        }
      });
    }
    candidates.sort((a, b) => a.date - b.date);

    return {
      nbContacts: contactsOf(structureId).length,
      nbInteractions: interactions.length,
      nbOpportunites: opportunites.length,
      nbActions: actionsOuvertes.length,
      montantTotal,
      lastContact,
      joursDepuisContact: lastContact ? daysSince(lastContact) : null,
      prochaineAction: candidates[0] || null
    };
  }

  function needsRelance(structureId) {
    const k = computeKpis(structureId);
    return k.joursDepuisContact === null || k.joursDepuisContact > RELANCE_DAYS;
  }

  // ---------------------------------------------------------------------
  // Sidebar
  // ---------------------------------------------------------------------

  function structField(s, role) {
    return s ? formatValue(s[role]) : '';
  }

  // A Choice value arrives as a plain string, a ChoiceList as ['L', ...values] —
  // this always returns a clean array of strings, never the raw encoded form.
  function choiceListValues(value) {
    if (value === null || value === undefined) return [];
    if (Array.isArray(value)) {
      const list = value[0] === 'L' ? value.slice(1) : value;
      return list.filter(v => typeof v === 'string' && v);
    }
    return value === '' ? [] : [String(value)];
  }

  // populateChoiceSelect/renderChoiceListPicker/le panneau de filtres
  // travaillent sur des enregistrements bruts (vrais colIds Grist) ; on les
  // reconstruit à partir des enregistrements mappés (rôle -> colId) pour
  // qu'une valeur Choice en cours d'utilisation ailleurs remonte quand même.
  // La ligne creee arrive par l'abonnement Grist, pas par le code qui l'ecrit,
  // et l'abonnement peut la livrer avant comme apres que la creation rende son
  // identifiant. Les deux ordres doivent marcher, sinon la structure est creee
  // puis perdue de vue. Le filtre par defaut masque les prospects et une
  // nouvelle structure n'est pas forcement un partenaire : on passe sur
  // « Tous » pour ne pas la creer dans le vide.
  function ouvrirNouvelleStructure(id) {
    const deja = structures.find(s => s.id === id);
    if (!deja) { structureAOuvrir = id; return; }
    structureAOuvrir = null;
    setFilterMode('tous');
    selectStructure(deja);
  }

  function structColValue(colId, values) {
    return colValue({ listCols: structListCols }, colId, values);
  }

  function rawStructures() {
    return structures.map(x => {
      const o = { id: x.id };
      Object.keys(mappings).forEach(role => { if (mappings[role]) o[mappings[role]] = x[role]; });
      return o;
    });
  }

  function matchesFilters(s) {
    const cat = normalizeKey(structField(s, 'Categorie'));
    if (filterMode === 'partenaires' && cat === 'prospect') return false;
    if (filterMode === 'prospects' && cat !== 'prospect') return false;
    if (filterMode === 'relancer' && !needsRelance(s.id)) return false;

    for (const key in PANEL_FILTERS) {
      const wanted = activeFilters[key];
      if (!wanted) continue;
      if (!choiceListValues(s[PANEL_FILTERS[key]]).includes(wanted)) return false;
    }

    if (!query) return true;
    const haystack = [
      structField(s, 'Nom'), structField(s, 'Categorie'), structField(s, 'TypeActeur'),
      structField(s, 'Activite'), structField(s, 'PilierSequoia'), structField(s, 'AxeSequoia')
    ].join(' ').toLowerCase();
    return haystack.includes(query);
  }

  // Les structures retenues par les filtres de la barre laterale, dans l'ordre
  // affiche. La liste et l'annuaire lisent la meme chose.
  function structuresFiltrees() {
    return structures.filter(matchesFilters)
      .sort((a, b) => structField(a, 'Nom').localeCompare(structField(b, 'Nom'), 'fr'));
  }

  function renderList() {
    const listEl = document.getElementById('list');
    const visible = structuresFiltrees();

    document.getElementById('list-count').textContent =
      visible.length + (visible.length > 1 ? ' structures' : ' structure');

    // Suggestions de saisie = les structures du document. Sans ça, le
    // navigateur propose son propre historique de formulaires, sans rapport.
    const dl = document.getElementById('dl-structures');
    const names = structures.map(x => structField(x, 'Nom')).filter(Boolean)
      .sort((a, b) => a.localeCompare(b, 'fr'));
    const signature = names.length + '|' + names[0] + '|' + names[names.length - 1];
    if (dl.dataset.signature !== signature) {
      dl.innerHTML = names.map(n => '<option value="' + escapeHtml(n) + '">').join('');
      dl.dataset.signature = signature;
    }

    if (visible.length === 0) {
      listEl.innerHTML = '<div class="empty-list">Aucune structure ne correspond.</div>';
      return;
    }

    listEl.innerHTML = '';
    visible.forEach(s => {
      const nom = structField(s, 'Nom') || 'Sans nom';
      const logo = structField(s, 'Logo');
      const nbContacts = contactsOf(s.id).length;
      const k = computeKpis(s.id);

      const item = document.createElement('div');
      item.className = 'list-item' + (current && s.id === current.id ? ' active' : '');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (logo) {
        const img = document.createElement('img');
        img.src = logo;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
        img.onerror = () => { avatar.innerHTML = ''; avatar.textContent = initials(nom); };
        avatar.appendChild(img);
      } else {
        avatar.textContent = initials(nom);
      }

      const info = document.createElement('div');
      info.style.cssText = 'overflow:hidden;flex:1;min-width:0;';
      const sub = [structField(s, 'Categorie') || structField(s, 'TypeActeur'),
        nbContacts ? nbContacts + (nbContacts > 1 ? ' contacts' : ' contact') : ''].filter(Boolean).join(' · ');
      info.innerHTML =
        '<div class="name">' + escapeHtml(nom) + '</div>' +
        '<div class="sub">' + escapeHtml(sub) + '</div>';

      item.appendChild(avatar);
      item.appendChild(info);

      // Pastille ambre = relance due (un échange a eu lieu, mais il date) ;
      // pastille grise = aucun échange enregistré ; rien = contact récent.
      // Les deux états étaient ambre auparavant, ce qui rendait la liste
      // illisible sur un CRM qui démarre : presque tout était orange.
      if (k.joursDepuisContact === null) {
        const dot = document.createElement('span');
        dot.className = 'dot dot-neutral';
        dot.title = 'Aucune interaction enregistrée';
        item.appendChild(dot);
      } else if (k.joursDepuisContact > RELANCE_DAYS) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = 'var(--status-montage)';
        dot.title = 'À relancer — dernier contact il y a ' + k.joursDepuisContact + ' j';
        item.appendChild(dot);
      }

      item.addEventListener('click', () => selectStructure(s));
      listEl.appendChild(item);
    });
  }

  function selectStructure(s) {
    // L'aperçu déplié appartient à la fiche ouverte, pas à la suivante.
    if (!current || current.id !== s.id) { interactionOuverte = null; contactsTousVisibles = false; }
    vue = 'fiche';
    contactOuvert = null;
    current = s;
    grist.setCursorPos({ rowId: s.id }).catch(() => {});
    render();
  }

  // ---------------------------------------------------------------------
  // Fiche
  // ---------------------------------------------------------------------

  function render() {
    renderList();
    renderMain();
    populateFilterPanel();
    window.__crm = {
      structureId: current ? current.id : null,
      kpis: current ? computeKpis(current.id) : null,
      related: Object.fromEntries(Object.entries(related).map(([k, v]) => [k, { tableId: v.tableId, cols: v.cols, nb: v.records.length, error: v.error }]))
    };
  }

  // ---------------------------------------------------------------------
  // Annuaire : les contacts des structures retenues par les filtres de la
  // liste, a plat, pour en copier les adresses d'un bloc. Les filtres sont
  // ceux de la barre laterale — type d'acteur, pilier, axe, recherche : une
  // seule facon de filtrer dans le widget, et l'annuaire suit ce que la liste
  // montre deja.
  // ---------------------------------------------------------------------

  function annuaireLignes() {
    const cols = rel('contacts').cols;
    const lignes = [];
    structuresFiltrees().forEach(s => {
      contactsOf(s.id).forEach(c => {
        lignes.push({
          id: c.id,
          nom: contactName(c),
          fonction: cols.Fonction ? formatValue(c[cols.Fonction]) : '',
          structure: structField(s, 'Nom') || 'Sans nom',
          adresses: emailsOfContact(c),
          linkedin: linkedinLink(c),
          principal: !!(cols.ContactPrincipal && c[cols.ContactPrincipal])
        });
      });
    });
    // Un contact rattache a deux structures retenues apparaitrait deux fois :
    // une seule ligne, mais qui nomme les deux.
    const parId = new Map();
    lignes.forEach(l => {
      const deja = parId.get(l.id);
      if (deja) deja.structure += ', ' + l.structure;
      else parId.set(l.id, l);
    });
    return Array.from(parId.values())
      .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  }

  function annuaireHtml() {
    const lignes = annuaireLignes();
    const avecAdresse = lignes.filter(l => l.adresses.length);
    const coches = lignes.filter(l => annuaireSel.has(l.id) && l.adresses.length);
    const cible = coches.length ? coches : avecAdresse;
    // Compter les adresses et non les lignes : une cellule peut en porter deux,
    // et le bouton doit annoncer ce qui partira vraiment.
    const nbAdresses = new Set(cible.flatMap(l => l.adresses)).size;
    const critères = [
      filterMode === 'partenaires' ? 'partenaires' : (filterMode === 'tous' ? null : filterMode),
      activeFilters.type, activeFilters.pilier, activeFilters.axe,
      query ? '« ' + query + ' »' : null
    ].filter(Boolean);

    const corps = lignes.length === 0
      ? '<div class="panel-empty">Aucun contact pour ces filtres.</div>'
      : '<table class="annuaire-table"><thead><tr>' +
          '<th class="ann-check"><input type="checkbox" id="ann-tout" title="Tout cocher"></th>' +
          '<th>Contact</th><th>Fonction</th><th>Structure</th><th>Adresse</th><th></th>' +
        '</tr></thead><tbody>' +
        lignes.map(l =>
          '<tr class="ann-row' + (l.adresses.length ? '' : ' ann-sans-adresse') + '" data-ann="' + l.id + '">' +
            '<td class="ann-check"><input type="checkbox" data-ann-check="' + l.id + '"' +
              (annuaireSel.has(l.id) ? ' checked' : '') + (l.adresses.length ? '' : ' disabled') + '></td>' +
            '<td class="ann-nom">' + escapeHtml(l.nom) +
              (l.principal ? ' <span class="star" title="Contact principal">★</span>' : '') + '</td>' +
            '<td>' + escapeHtml(l.fonction) + '</td>' +
            '<td>' + escapeHtml(l.structure) + '</td>' +
            '<td class="ann-mail">' + (l.adresses.length
              ? escapeHtml(l.adresses.join(', '))
              : '<span class="ann-vide">—</span>') + '</td>' +
            '<td class="ann-copie">' + l.linkedin + (l.adresses.length
              ? '<button class="copy-btn" data-copy-email="' + escapeHtml(l.adresses.join('; ')) + '" title="Copier">⧉</button>'
              : '') + '</td>' +
          '</tr>').join('') +
        '</tbody></table>';

    return '<div class="annuaire">' +
      '<div class="annuaire-head">' +
        '<div>' +
          '<h2>Annuaire</h2>' +
          '<p class="annuaire-sub">' + lignes.length + ' contact' + (lignes.length > 1 ? 's' : '') +
            ' · ' + new Set(avecAdresse.flatMap(l => l.adresses)).size + ' adresse' +
            (new Set(avecAdresse.flatMap(l => l.adresses)).size > 1 ? 's' : '') +
            (critères.length ? ' · filtres : ' + escapeHtml(critères.join(', ')) : ' · aucun filtre') +
            '</p>' +
        '</div>' +
        '<div class="annuaire-actions">' +
          (annuaireSel.size ? '<button class="btn-mini" id="ann-vider">Décocher</button>' : '') +
          '<button class="btn-primary" id="ann-copier"' + (nbAdresses ? '' : ' disabled') + '>' +
            '⧉ Copier ' + nbAdresses + ' adresse' + (nbAdresses > 1 ? 's' : '') +
            (coches.length ? ' · ' + coches.length + ' coché' + (coches.length > 1 ? 's' : '') : '') + '</button>' +
        '</div>' +
      '</div>' +
      corps +
    '</div>';
  }

  function bindAnnuaireEvents() {
    const lignes = annuaireLignes();
    const tout = document.getElementById('ann-tout');
    if (tout) {
      const avecAdresse = lignes.filter(l => l.adresses.length);
      tout.checked = avecAdresse.length > 0 && avecAdresse.every(l => annuaireSel.has(l.id));
      tout.addEventListener('change', () => {
        if (tout.checked) avecAdresse.forEach(l => annuaireSel.add(l.id));
        else annuaireSel.clear();
        renderMain();
      });
    }
    document.querySelectorAll('[data-ann-check]').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = Number(cb.dataset.annCheck);
        if (cb.checked) annuaireSel.add(id); else annuaireSel.delete(id);
        renderMain();
      });
    });
    const vider = document.getElementById('ann-vider');
    if (vider) vider.addEventListener('click', () => { annuaireSel.clear(); renderMain(); });
    const copier = document.getElementById('ann-copier');
    if (copier) {
      copier.addEventListener('click', () => {
        const coches = lignes.filter(l => annuaireSel.has(l.id) && l.adresses.length);
        const cible = (coches.length ? coches : lignes.filter(l => l.adresses.length));
        const adresses = Array.from(new Set(cible.flatMap(l => l.adresses)));
        copierAdresses(adresses, coches.length ? 'sélection' : 'annuaire filtré');
      });
    }
    // Ouvrir la fiche du contact depuis l'annuaire
    document.querySelectorAll('.ann-nom').forEach(cell => {
      cell.addEventListener('click', () => {
        ouvrirContact(Number(cell.closest('[data-ann]').dataset.ann));
      });
    });
    bindCopyButtons();
  }

  // Les boutons ⧉ sont les memes partout : fiche, annuaire.
  function bindCopyButtons() {
    document.querySelectorAll('[data-copy-email]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        copierAdresses(String(btn.dataset.copyEmail).split(/\s*;\s*/).filter(Boolean));
      });
    });
  }

  // ---------------------------------------------------------------------
  // Fiche d'un contact
  //
  // Un contact traverse le CRM : il est sur des échanges, des opportunités,
  // des actions, et parfois dans plusieurs structures. Jusqu'ici on ne pouvait
  // que l'éditer depuis la fiche d'une structure, sans jamais voir ce qui le
  // concerne. Les rattachements sont trouvés par les colonnes qui pointent
  // vers la table Contacts, relevées dans les métadonnées : aucune liste de
  // noms de colonnes n'est figée ici.
  // ---------------------------------------------------------------------

  function recordsForContact(key, contactId) {
    const colonnes = contactColumnsOf(key);
    if (!colonnes.length || contactId == null) return [];
    return rel(key).records.filter(r =>
      colonnes.some(col => refIdsFromValue(r[col]).includes(contactId)));
  }

  // Les structures auxquelles le contact appartient, via les colonnes de la
  // table Contacts qui pointent vers Structures.
  function structuresOfContact(contactId) {
    const c = rel('contacts');
    const rec = c.records.find(x => x.id === contactId);
    if (!rec) return [];
    const ids = new Set();
    (c.linkCols || []).forEach(col => refIdsFromValue(rec[col]).forEach(id => ids.add(id)));
    return Array.from(ids).map(id => structures.find(x => x.id === id)).filter(Boolean);
  }

  function ouvrirContact(id) {
    contactOuvert = id;
    vue = 'contact';
    render();
  }

  function contactFicheHtml() {
    const c = rel('contacts').records.find(x => x.id === contactOuvert);
    if (!c) return '<div class="placeholder">Ce contact n’existe plus.</div>';
    const cols = rel('contacts').cols;
    const val = (role) => (cols[role] ? formatValue(c[cols[role]]) : '');
    const nom = contactName(c);
    const adresses = emailsOfContact(c);
    const struct = structuresOfContact(c.id);
    const iCols = rel('interactions').cols;
    const oCols = rel('opportunites').cols;
    const aCols = rel('actions').cols;

    const interactions = recordsForContact('interactions', c.id)
      .sort((x, y) => (Number(y[iCols.Date]) || 0) - (Number(x[iCols.Date]) || 0));
    const opportunites = recordsForContact('opportunites', c.id);
    const actions = recordsForContact('actions', c.id);
    const actionsOuvertes = actions.filter(x => !actionEstFaite(x));
    const dernier = interactions.length && iCols.Date ? Number(interactions[0][iCols.Date]) || null : null;

    const meta = [val('Fonction')].filter(Boolean);

    const entete =
      '<div class="fiche-head">' +
        '<div class="logo-frame">' + escapeHtml(initials(nom)) + '</div>' +
        '<div class="head-text">' +
          '<h1>' + escapeHtml(nom) +
            (cols.ContactPrincipal && c[cols.ContactPrincipal]
              ? ' <span class="star" title="Contact principal">★</span>' : '') + '</h1>' +
          '<div class="head-meta">' + escapeHtml(meta.join(' · ')) + '</div>' +
          '<div class="head-pills">' +
            struct.map(st => '<button type="button" class="struct-pill" data-voir-structure="' + st.id + '">' +
              escapeHtml(structField(st, 'Nom') || 'Sans nom') + '</button>').join('') +
            (adresses.length
              ? '<span class="site-link">' + escapeHtml(adresses.join(', ')) + '</span>' +
                '<button class="copy-btn" data-copy-email="' + escapeHtml(adresses.join('; ')) + '"' +
                ' title="Copier">⧉</button>'
              : '') +
            (val('Telephone') ? '<span class="head-tel">' + escapeHtml(val('Telephone')) + '</span>' : '') +
            linkedinLink(c) +
          '</div>' +
        '</div>' +
        '<div class="head-actions">' +
          '<button class="btn-ghost" id="btn-retour-structure">← Retour</button>' +
          '<button class="btn-primary" id="btn-edit-contact">✏️ Modifier</button>' +
        '</div>' +
      '</div>';

    const kpis =
      '<div class="kpi-row">' +
        kpiHtml('Dernier échange', dernier ? escapeHtml(formatDaysSince(dernier)) : '—',
          dernier ? formatDate(dernier) : 'Aucun échange') +
        kpiHtml('Échanges', String(interactions.length), 'où il figure') +
        kpiHtml('Opportunités', String(opportunites.length), 'où il est contact') +
        kpiHtml('Actions', String(actionsOuvertes.length), 'en cours', actionsOuvertes.length > 0) +
      '</div>';

    const oppsHtml = opportunites.length
      ? opportunites.map(o => {
          const statut = oCols.Statut ? formatValue(o[oCols.Statut]) : '';
          return '<div class="opp-row" data-opp="' + o.id + '">' +
            '<div class="o-text">' +
              '<div class="o-title">' + escapeHtml(oCols.Sujet ? formatValue(o[oCols.Sujet]) || 'Sans sujet' : 'Sans sujet') + '</div>' +
              (statut ? '<span class="status-pill" style="background:' + statusColor(statut) +
                ';color:' + statusTextColor(statut) + '">' + escapeHtml(statut) + '</span>' : '') +
              (statut ? ' ' + statusProgressMarkup(statut, statutChoices, { label: false }) : '') +
            '</div>' +
            '<div class="o-amount">' + escapeHtml(formatMontantCompact(oCols.Montant ? o[oCols.Montant] : null)) + '</div>' +
          '</div>';
        }).join('')
      : '<div class="panel-empty">Aucune opportunité.</div>';

    const actionsHtml = actions.length
      ? actions.map(x => {
          const due = aCols.Echeance ? x[aCols.Echeance] : null;
          const retard = due && daysSince(due) > 0 && !actionEstFaite(x);
          return '<div class="act-row' + (actionEstFaite(x) ? ' fait' : '') + '">' +
            '<input type="checkbox" data-action-done="' + x.id + '"' +
              (actionEstFaite(x) ? ' checked' : '') + (aCols.Fait ? '' : ' disabled') + '>' +
            '<div class="act-text"><div class="act-label">' +
              escapeHtml(aCols.Intitule ? formatValue(x[aCols.Intitule]) : 'Sans intitulé') + '</div></div>' +
            (due ? '<span class="act-due' + (retard ? ' retard' : '') + '">' +
              escapeHtml(formatDate(due)) + '</span>' : '') +
          '</div>';
        }).join('')
      : '<div class="panel-empty">Aucune action.</div>';

    const echangesHtml = interactions.length
      ? '<div class="timeline">' + interactions.map(i => {
          const titre = [iCols.Type && formatValue(i[iCols.Type]), iCols.Objet && formatValue(i[iCols.Objet])]
            .filter(Boolean).join(' · ');
          const avec = structuresOfInteraction(i);
          return '<div class="tl-item" data-voir-interaction="' + i.id + '">' +
            '<div class="tl-when">' + escapeHtml(iCols.Date ? formatDate(i[iCols.Date]) : '') + '</div>' +
            '<div class="tl-body">' +
              '<div class="tl-title">' + escapeHtml(titre || 'Sans objet') + '</div>' +
              (avec ? '<div class="tl-meta">' + escapeHtml(avec) + '</div>' : '') +
            '</div>' +
          '</div>';
        }).join('') + '</div>'
      : '<div class="panel-empty">Aucun échange.</div>';

    return '<div class="crm-inner">' + entete + kpis +
      '<div class="crm-grid">' +
        '<div class="crm-col">' +
          panelShell('Opportunités', opportunites.length, null, null, oppsHtml) +
          (rel('actions').tableId ? panelShell('Actions', actionsOuvertes.length, null, null, actionsHtml) : '') +
        '</div>' +
        '<div class="crm-col">' +
          panelShell('Échanges', interactions.length, null, null, echangesHtml) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // Les structures d'un échange, pour situer une ligne de la frise d'un
  // contact : sur sa fiche, l'échange n'est plus vu depuis une structure.
  function structuresOfInteraction(i) {
    const r = rel('interactions');
    const ids = new Set();
    (r.linkCols || []).forEach(col => refIdsFromValue(i[col]).forEach(id => ids.add(id)));
    return Array.from(ids)
      .map(id => { const st = structures.find(x => x.id === id); return st ? structField(st, 'Nom') : ''; })
      .filter(Boolean).join(', ');
  }

  function bindContactFicheEvents() {
    const c = rel('contacts').records.find(x => x.id === contactOuvert);
    const retour = document.getElementById('btn-retour-structure');
    if (retour) retour.addEventListener('click', () => {
      vue = 'fiche';
      if (current) render(); else { const st = structuresOfContact(contactOuvert)[0]; if (st) selectStructure(st); else render(); }
    });
    const modifier = document.getElementById('btn-edit-contact');
    if (modifier && c) modifier.addEventListener('click', () => {
      openContactModal(c, structuresOfContact(c.id)[0] || current);
    });
    document.querySelectorAll('[data-voir-structure]').forEach(btn => {
      btn.addEventListener('click', () => {
        const st = structures.find(x => x.id === Number(btn.dataset.voirStructure));
        if (st) selectStructure(st);
      });
    });
    document.querySelectorAll('[data-voir-interaction]').forEach(el => {
      el.addEventListener('click', () => {
        const i = rel('interactions').records.find(x => x.id === Number(el.dataset.voirInteraction));
        const st = structuresOfContact(contactOuvert)[0] || current;
        if (i && st) openInteractionModal(i, st);
      });
    });
    document.querySelectorAll('[data-opp]').forEach(el => {
      el.addEventListener('click', () => {
        const o = rel('opportunites').records.find(x => x.id === Number(el.dataset.opp));
        const st = structuresOfContact(contactOuvert)[0] || current;
        if (o && st) openOpportuniteModal(o, st);
      });
    });
    document.querySelectorAll('[data-action-done]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const a = rel('actions');
        try {
          await updateRecord(a.tableId, Number(cb.dataset.actionDone), { [a.cols.Fait]: cb.checked });
          await refreshRelated(true);
        } catch (err) { console.error(err); toast('Erreur d’enregistrement', true); }
      });
    });
    bindCopyButtons();
  }

  function renderMain() {
    const main = document.getElementById('main');
    if (vue === 'annuaire') { main.innerHTML = annuaireHtml(); bindAnnuaireEvents(); return; }
    if (vue === 'contact') { main.innerHTML = contactFicheHtml(); bindContactFicheEvents(); return; }
    if (!current) {
      main.innerHTML = '<div class="placeholder">Sélectionnez une structure dans la liste</div>';
      return;
    }
    // The selected structure may have dropped out of a filtered list.
    if (!structures.some(s => s.id === current.id)) {
      current = null;
      main.innerHTML = '<div class="placeholder">Sélectionnez une structure dans la liste</div>';
      return;
    }

    const s = current;
    const k = computeKpis(s.id);
    const nom = structField(s, 'Nom') || 'Sans nom';
    const logo = structField(s, 'Logo');
    // Une structure peut porter plusieurs piliers/axes (ChoiceList) : une
    // pastille par valeur, pas un seul pilule fourre-tout avec un texte
    // "IA fondamentale, Sécurité" et une couleur qui ne représenterait que
    // la première valeur trouvée.
    const pilierValues = choiceListValues(s.PilierSequoia);
    const axeValues = choiceListValues(s.AxeSequoia);
    const site = structField(s, 'SiteWeb');

    const metaParts = [structField(s, 'TypeActeur'), structField(s, 'Categorie'),
      structField(s, 'Taille'), structField(s, 'Activite')].filter(Boolean);

    main.innerHTML =
      '<div class="crm-inner">' +
        '<div class="fiche-head">' +
          '<div class="logo-frame">' +
            (logo ? '<img src="' + escapeHtml(logo) + '" alt="">' : escapeHtml(initials(nom))) +
          '</div>' +
          '<div class="head-text">' +
            '<h1 title="' + escapeHtml(nom) + '">' + escapeHtml(nom) + '</h1>' +
            '<div class="head-meta">' + escapeHtml(metaParts.join(' · ')) + '</div>' +
            '<div class="head-pills">' +
              pilierValues.map(v => '<span class="value-pill ' + pilierClass(v) + '">' + escapeHtml(v) + '</span>').join('') +
              axeValues.map(v => '<span class="type-pill">' + escapeHtml(v) + '</span>').join('') +
              (site ? '<a class="site-link" href="' + escapeHtml(site) + '" target="_blank" rel="noopener">' + escapeHtml(site.replace(/^https?:\/\//, '')) + ' ↗</a>' : '') +
            '</div>' +
          '</div>' +
          '<div class="head-actions">' +
            '<button class="btn-ghost" id="btn-edit-structure">✏️ Modifier</button>' +
            '<button class="btn-primary" id="btn-new-interaction">+ Interaction</button>' +
          '</div>' +
        '</div>' +

        '<div class="kpi-row">' +
          kpiHtml('Dernier contact',
            k.joursDepuisContact === null ? '—' : escapeHtml(formatDaysSince(k.lastContact)),
            k.lastContact ? formatDate(k.lastContact) : 'Aucune interaction',
            k.joursDepuisContact !== null && k.joursDepuisContact > RELANCE_DAYS,
            false,
            // La jauge situe le silence par rapport au seuil de relance : on
            // voit qu'il a débordé, sans compter les jours.
            k.joursDepuisContact === null ? '' : meterMarkup(k.joursDepuisContact, RELANCE_DAYS, {
              unit: 'jours',
              label: k.joursDepuisContact > RELANCE_DAYS ? 'à relancer' : 'dans les temps'
            })) +
          kpiHtml('Interactions', String(k.nbInteractions), k.nbInteractions ? 'depuis le début' : 'aucune', false) +
          kpiHtml('Opportunités',
            k.nbOpportunites + (k.montantTotal ? ' · ' + formatMontantCompact(k.montantTotal) : ''),
            k.nbOpportunites ? 'en cours ou gagnées' : 'aucune', false) +
          kpiHtml('Prochaine action',
            k.prochaineAction ? escapeHtml(excerpt(k.prochaineAction.label, 40)) : '—',
            k.prochaineAction ? 'avant le ' + formatDate(k.prochaineAction.date) : 'rien de planifié',
            false, !!k.prochaineAction) +
        '</div>' +

        '<div class="crm-grid">' +
          '<div class="crm-col">' +
            // Les opportunités passent devant : c'est l'état du partenariat,
            // ce qu'on vient lire en premier. Avec vingt contacts, le pipe
            // était repoussé hors de l'écran.
            oppsPanelHtml(s) +
            contactsPanelHtml(s) +
          '</div>' +
          '<div class="crm-col">' +
            actionsPanelHtml(s) +
            timelinePanelHtml(s) +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('btn-edit-structure').addEventListener('click', () => openStructureModal(s));
    document.getElementById('btn-new-interaction').addEventListener('click', () => openInteractionModal(null, s));
    bindPanelEvents(s);
  }

  // `extra` accueille une jauge ou une répartition : un indicateur qui se voit
  // en plus de se lire.
  function kpiHtml(label, value, sub, warn, small, extra) {
    return '<div class="kpi">' +
      '<div class="kpi-label">' + escapeHtml(label) + '</div>' +
      '<div class="kpi-value' + (warn ? ' warn' : '') + (small ? ' small' : '') + '">' + value + '</div>' +
      (extra || '') +
      '<div class="kpi-sub">' + escapeHtml(sub) + '</div>' +
    '</div>';
  }

  function panelShell(title, count, addId, addLabel, bodyHtml, actionHtml) {
    return '<div class="panel">' +
      '<div class="panel-head">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        (count !== null ? '<span class="count">' + count + '</span>' : '') +
        (actionHtml || '') +
        (addId ? '<button class="btn-add" id="' + addId + '">' + escapeHtml(addLabel) + '</button>' : '') +
      '</div>' +
      '<div class="panel-body">' + bodyHtml + '</div>' +
    '</div>';
  }

  function contactsPanelHtml(s) {
    const r = rel('contacts');
    if (r.error) return panelShell('Contacts', null, null, null, '<div class="panel-warn">' + escapeHtml(r.error) + '</div>');
    const cols = r.cols;
    const list = contactsOf(s.id);

    // Une structure académique peut porter vingt contacts : au-delà de six, la
    // liste chassait tout le reste de la fiche. Les contacts principaux étant
    // triés en tête, ce sont eux qu'on voit d'abord.
    const SEUIL = 6;
    const tronque = !contactsTousVisibles && list.length > SEUIL;
    const affiches = tronque ? list.slice(0, SEUIL) : list;

    const body = list.length === 0
      ? '<div class="panel-empty">Aucun contact rattaché.</div>'
      : affiches.map(c => {
          const fonction = cols.Fonction ? formatValue(c[cols.Fonction]) : '';
          const email = cols.Email ? formatValue(c[cols.Email]) : '';
          const tel = cols.Telephone ? formatValue(c[cols.Telephone]) : '';
          const sub = [fonction, email || tel].filter(Boolean).join(' · ');
          const principal = cols.ContactPrincipal && c[cols.ContactPrincipal];
          // Une cellule peut porter deux adresses : le bouton les copie
          // toutes, separees comme le groupe.
          const adressesContact = emailsOfContact(c);
          return '<div class="contact-row" data-contact="' + c.id + '">' +
            '<div class="avatar">' + escapeHtml(initials(contactName(c))) + '</div>' +
            '<div class="c-text">' +
              '<div class="c-name">' + escapeHtml(contactName(c)) + '</div>' +
              '<div class="c-sub">' + escapeHtml(sub) + '</div>' +
            '</div>' +
            linkedinLink(c) +
            (adressesContact.length
              ? '<button class="copy-btn" data-copy-email="' + escapeHtml(adressesContact.join('; ')) + '"' +
                ' title="Copier ' + escapeHtml(adressesContact.join(', ')) + '">⧉</button>'
              : '') +
            '<span class="star"' + (principal ? ' title="Contact principal">★' : '>') + '</span>' +
          '</div>';
        }).join('');

    const bascule = list.length > SEUIL
      ? '<button type="button" class="btn-mini contacts-toggle" id="btn-contacts-tous">' +
          (tronque ? 'Voir les ' + (list.length - SEUIL) + ' autres contacts' : 'N’en montrer que ' + SEUIL) +
        '</button>'
      : '';

    // Copier d'un coup les adresses de la structure : c'est le geste le plus
    // frequent quand on vient chercher a qui ecrire.
    const adresses = emailsOfStructure(s.id);
    const action = adresses.length
      ? '<button class="btn-mini" id="btn-copy-emails" title="' + escapeHtml(adresses.join('; ')) + '">' +
          '⧉ ' + adresses.length + ' adresse' + (adresses.length > 1 ? 's' : '') + '</button>'
      : '';
    return panelShell('Contacts', list.length, 'btn-new-contact', '+ Contact', body + bascule, action);
  }

  // ---- Actions à mener pour cette structure ----
  //
  // Les actions vivaient dans le widget de pilotage seulement : depuis une
  // fiche, rien ne disait ce qu'on avait prévu de faire avec ce partenaire.
  // Ici, les actions ouvertes en tête, les terminées derrière un bouton, et
  // de quoi en ajouter une en une ligne.
  function actionsOfStructure(structureId) {
    const a = rel('actions');
    if (!a.tableId) return [];
    const directes = linkedRecords('actions', structureId);
    return directes.concat(recordsViaContacts('actions', structureId, directes));
  }

  function actionEstFaite(x) {
    const a = rel('actions');
    return !!(a.cols.Fait && x[a.cols.Fait]);
  }

  function actionsPanelHtml(s) {
    const a = rel('actions');
    if (!a.tableId) return ''; // table absente : le CRM s'en passe
    const liste = actionsOfStructure(s.id);
    const ouvertes = liste.filter(x => !actionEstFaite(x))
      .sort((x, y) => {
        // Les plus urgentes devant ; celles sans échéance à la fin.
        const dx = a.cols.Echeance ? Number(x[a.cols.Echeance]) || Infinity : Infinity;
        const dy = a.cols.Echeance ? Number(y[a.cols.Echeance]) || Infinity : Infinity;
        return dx - dy;
      });
    const faites = liste.filter(actionEstFaite);

    const ligne = (x) => {
      const due = a.cols.Echeance ? x[a.cols.Echeance] : null;
      const retard = due && daysSince(due) > 0 && !actionEstFaite(x);
      const qui = a.cols.Contacts ? contactNamesFor(refIdsFromValue(x[a.cols.Contacts])) : [];
      const via = linkedVia('actions', x, s.id);
      return '<div class="act-row' + (actionEstFaite(x) ? ' fait' : '') + '" data-action-row="' + x.id + '">' +
        '<input type="checkbox" data-action-done="' + x.id + '"' +
          (actionEstFaite(x) ? ' checked' : '') + (a.cols.Fait ? '' : ' disabled') + '>' +
        '<div class="act-text">' +
          '<div class="act-label">' +
            escapeHtml(a.cols.Intitule ? formatValue(x[a.cols.Intitule]) : 'Sans intitulé') +
            (via ? ' <span class="via-pill">' + escapeHtml(via) + '</span>' : '') +
          '</div>' +
          (qui.length ? '<div class="act-sub">' + escapeHtml(qui.join(', ')) + '</div>' : '') +
        '</div>' +
        (due ? '<span class="act-due' + (retard ? ' retard' : '') + '">' +
          escapeHtml(formatDate(due)) + '</span>' : '') +
      '</div>';
    };

    const corps =
      (ouvertes.length ? ouvertes.map(ligne).join('') : '<div class="panel-empty">Aucune action en cours.</div>') +
      (faites.length
        ? (actionsFaitesVisibles
            ? '<div class="act-sep">Terminées</div>' + faites.map(ligne).join('')
            : '') +
          '<button type="button" class="btn-mini act-toggle" id="btn-actions-faites">' +
            (actionsFaitesVisibles ? 'Masquer les terminées'
              : 'Voir les ' + faites.length + ' terminée' + (faites.length > 1 ? 's' : '')) + '</button>'
        : '') +
      '<div class="act-form">' +
        '<input id="act-nouvelle" placeholder="Nouvelle action…">' +
        '<input type="date" id="act-due" title="Échéance">' +
        '<button type="button" class="btn-mini" id="act-ajouter">Ajouter</button>' +
      '</div>';

    return panelShell('Actions', ouvertes.length, null, null, corps);
  }

  function oppsPanelHtml(s) {
    const r = rel('opportunites');
    if (r.error) return panelShell('Opportunités', null, null, null, '<div class="panel-warn">' + escapeHtml(r.error) + '</div>');
    const cols = r.cols;
    const list = opportunitesOf(s.id);

    const body = list.length === 0
      ? '<div class="panel-empty">Aucune opportunité.</div>'
      : list.map(o => {
          const statut = cols.Statut ? formatValue(o[cols.Statut]) : '';
          const montant = cols.Montant ? o[cols.Montant] : null;
          const echeance = cols.Echeance ? o[cols.Echeance] : null;
          return '<div class="opp-row" data-opp="' + o.id + '">' +
            '<div class="o-text">' +
              '<div class="o-title">' + escapeHtml(cols.Sujet ? formatValue(o[cols.Sujet]) || 'Sans sujet' : 'Sans sujet') + '</div>' +
              (statut ? '<span class="status-pill" style="background:' + statusColor(statut) +
                ';color:' + statusTextColor(statut) + '">' + escapeHtml(statut) + '</span>' : '') +
              (linkedVia('opportunites', o, s.id) ? ' <span class="via-pill">' + escapeHtml(linkedVia('opportunites', o, s.id)) + '</span>' : '') +
              // La pastille nomme l'étape, la jauge la situe dans l'entonnoir :
              // « Montage » ne dit pas à soi seul si l'affaire s'achève.
              (statut ? ' ' + statusProgressMarkup(statut, statutChoices, { label: false }) : '') +
              (echeance ? '<div class="o-sub">échéance ' + escapeHtml(formatDate(echeance)) + '</div>' : '') +
            '</div>' +
            '<div class="o-amount">' + escapeHtml(formatMontantCompact(montant)) + '</div>' +
          '</div>';
        }).join('');

    return panelShell('Opportunités', list.length, 'btn-new-opp', '+ Opportunité', body);
  }

  function timelinePanelHtml(s) {
    const r = rel('interactions');
    if (r.error) return panelShell('Historique des échanges', null, null, null, '<div class="panel-warn">' + escapeHtml(r.error) + '</div>');
    const cols = r.cols;
    const list = interactionsOf(s.id);

    if (list.length === 0) {
      return panelShell('Historique des échanges', 0, 'btn-new-interaction-2', '+ Interaction',
        '<div class="panel-empty">Aucune interaction enregistrée. Créez-en une pour démarrer le suivi.</div>');
    }

    // Une frise nue : une ligne par échange, sans aperçu de compte rendu.
    // L'échange sur lequel on clique s'ouvre sur place ; de là, un bouton mène
    // à sa fiche complète. Montrer le dernier compte rendu d'entrée de jeu
    // noyait la cadence du suivi, qui est ce que la frise a à donner à voir.
    const body = list.map(i => {
      const ouvert = i.id === interactionOuverte;
      const who = cols.ContactPartenaire ? contactNamesFor(refIdsFromValue(i[cols.ContactPartenaire])) : [];
      const title = [cols.Type && formatValue(i[cols.Type]), cols.Objet && formatValue(i[cols.Objet])]
        .filter(Boolean).join(' · ');
      const cr = cols.CR ? normalizeCrToHtml(i[cols.CR]) : '';
      return '<div class="tl-item' + (ouvert ? ' open' : '') + '" data-interaction="' + i.id + '">' +
        '<div class="tl-when">' + escapeHtml(cols.Date ? formatDate(i[cols.Date]) : '') + '</div>' +
        '<div class="tl-body">' +
          '<div class="tl-title">' + escapeHtml(title || 'Sans objet') +
            (linkedVia('interactions', i, s.id) ? ' <span class="via-pill">' + escapeHtml(linkedVia('interactions', i, s.id)) + '</span>' : '') +
          '</div>' +
          (who.length ? '<div class="tl-meta">' + escapeHtml(who.join(', ')) + '</div>' : '') +
          (ouvert
            ? '<div class="tl-preview">' +
                (cr
                  ? '<div class="tl-cr" id="tl-cr">' + cr + '</div>'
                  : '<div class="tl-preview-empty">Pas de compte rendu.</div>') +
                '<div class="tl-pj" id="tl-pj"></div>' +
                '<button type="button" class="tl-open-btn" data-open-interaction="' + i.id + '">' +
                  'Ouvrir la fiche complète →</button>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
    }).join('');

    return panelShell('Historique des échanges', list.length, 'btn-new-interaction-2', '+ Interaction',
      '<div class="timeline">' + body + '</div>');
  }

  function bindPanelEvents(s) {
    const byId = (id) => document.getElementById(id);
    const newContact = byId('btn-new-contact');
    if (newContact) newContact.addEventListener('click', () => openContactModal(null, s));
    const newOpp = byId('btn-new-opp');
    if (newOpp) newOpp.addEventListener('click', () => openOpportuniteModal(null, s));
    const newInter2 = byId('btn-new-interaction-2');
    if (newInter2) newInter2.addEventListener('click', () => openInteractionModal(null, s));
    const tousContacts = byId('btn-contacts-tous');
    if (tousContacts) tousContacts.addEventListener('click', () => {
      contactsTousVisibles = !contactsTousVisibles;
      render();
    });

    // ---- Actions de la fiche ----
    const bascule = byId('btn-actions-faites');
    if (bascule) bascule.addEventListener('click', () => {
      actionsFaitesVisibles = !actionsFaitesVisibles;
      render();
    });
    document.querySelectorAll('[data-action-done]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const a = rel('actions');
        try {
          await updateRecord(a.tableId, Number(cb.dataset.actionDone), { [a.cols.Fait]: cb.checked });
          await refreshRelated(true);
        } catch (err) { console.error(err); toast('Erreur d’enregistrement', true); }
      });
    });
    const ajouter = byId('act-ajouter');
    if (ajouter) {
      const creer = async () => {
        const a = rel('actions');
        const champ = byId('act-nouvelle');
        const label = champ.value.trim();
        if (!label) { champ.focus(); return; }
        const fields = {};
        const pose = (colId, valeur) => { if (colId) fields[colId] = valeur; };
        pose(a.cols.Intitule, label);
        const due = byId('act-due').value;
        if (a.cols.Echeance && due) pose(a.cols.Echeance, inputValueToGristDate(due));
        pose(a.cols.Partenaires, refListValue(a.tableId, a.cols.Partenaires, [s.id]));
        try {
          await addRecord(a.tableId, fields);
          await refreshRelated(true);
          toast('Action ajoutée');
        } catch (err) { console.error(err); toast('Erreur à la création', true); }
      };
      ajouter.addEventListener('click', creer);
      byId('act-nouvelle').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); creer(); }
      });
    }

    const copyEmails = byId('btn-copy-emails');
    if (copyEmails) copyEmails.addEventListener('click', () =>
      copierAdresses(emailsOfStructure(s.id), structField(s, 'Nom')));
    bindCopyButtons();

    // Un clic sur un contact ouvre sa fiche — comme pour une structure, le
    // formulaire d'édition est derrière le bouton « Modifier » de la fiche.
    // Les boutons de la ligne (copie, LinkedIn) gardent leur propre geste.
    document.querySelectorAll('[data-contact]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.li-btn') || e.target.closest('.copy-btn')) return;
        ouvrirContact(Number(el.dataset.contact));
      });
    });
    document.querySelectorAll('[data-opp]').forEach(el => {
      el.addEventListener('click', () => {
        const rec = rel('opportunites').records.find(o => o.id === Number(el.dataset.opp));
        if (rec) openOpportuniteModal(rec, s);
      });
    });
    // Un clic sur la ligne déplie son aperçu (et le replie au clic suivant) ;
    // c'est le bouton de l'aperçu qui ouvre la fiche complète. Les pièces
    // jointes, elles, s'ouvrent pour elles-mêmes.
    document.querySelectorAll('[data-interaction]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.pj-chip') || e.target.closest('[data-open-interaction]')) return;
        const id = Number(el.dataset.interaction);
        interactionOuverte = interactionOuverte === id ? null : id;
        render();
      });
    });
    document.querySelectorAll('[data-open-interaction]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rec = rel('interactions').records.find(i => i.id === Number(btn.dataset.openInteraction));
        if (rec) openInteractionModal(rec, s);
      });
    });

    // Images and attachments of the last compte-rendu need authenticated
    // URLs, fetched after the synchronous render.
    const crEl = document.getElementById('tl-cr');
    const pjEl = document.getElementById('tl-pj');
    if (crEl) {
      resolveImagesIn(crEl);
      if (crEl.scrollHeight > crEl.clientHeight + 4) crEl.classList.add('clipped');
    }
    const iCols = rel('interactions').cols;
    const ouverte = rel('interactions').records.find(i => i.id === interactionOuverte);
    if (ouverte && iCols.PJ && pjEl) renderPjChips(attachmentIdsFromValue(ouverte[iCols.PJ]), pjEl);
  }

  async function renderPjChips(ids, container) {
    if (!ids || ids.length === 0) { container.innerHTML = ''; return; }
    const metas = await Promise.all(ids.map(id => getAttachmentMeta(id).catch(() => ({ id, fileName: 'Fichier #' + id }))));
    container.innerHTML = metas.map(m =>
      '<a class="pj-chip" data-att="' + m.id + '">📎<span>' + escapeHtml(m.fileName) + '</span></a>').join('');
    container.querySelectorAll('.pj-chip').forEach(a => {
      a.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        try { window.open(await getAttachmentDownloadUrl(a.dataset.att), '_blank'); } catch (err) { console.error(err); }
      });
    });
  }

  // ---------------------------------------------------------------------
  // Modales
  // ---------------------------------------------------------------------

  const modalEl = document.getElementById('modal');
  const modalContentEl = document.getElementById('modal-content');
  let modalCleanup = null;

  function openModal(html, onMount, wide) {
    modalContentEl.className = 'form-modal' + (wide ? ' wide' : '');
    modalContentEl.innerHTML = html;
    modalEl.hidden = false;
    modalContentEl.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', closeModal));
    modalCleanup = onMount ? onMount(modalContentEl) : null;
  }

  async function closeModal() {
    if (typeof modalCleanup === 'function') { try { await modalCleanup(); } catch (err) { console.error(err); } }
    modalCleanup = null;
    modalEl.hidden = true;
    modalContentEl.innerHTML = '';
    // Autosaves went through applyUserActions, which invalidated the caches;
    // re-read so the fiche shows what was just written.
    await loadRelated();
    render();
  }

  modalEl.addEventListener('click', (e) => { if (e.target === modalEl) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modalEl.hidden) closeModal(); });

  function modalHeadHtml(title) {
    return '<div class="modal-head">' +
      '<h2>' + escapeHtml(title) + '</h2>' +
      '<span class="modal-status" id="modal-status"></span>' +
      '<button class="form-modal-close" data-close>✕</button>' +
    '</div>';
  }

  function setModalStatus(text) {
    const el = document.getElementById('modal-status');
    if (el) el.textContent = text;
  }

  function fieldHtml(id, label, inner, full) {
    return '<div class="form-field' + (full ? ' full' : '') + '">' +
      '<label for="' + id + '">' + escapeHtml(label) + '</label>' + inner + '</div>';
  }

  function textField(id, label, value, full, type) {
    return fieldHtml(id, label,
      '<input id="' + id + '" type="' + (type || 'text') + '" value="' + escapeHtml(value === null || value === undefined ? '' : value) + '">', full);
  }

  function dateField(id, label, value, full) {
    return fieldHtml(id, label, '<input id="' + id + '" type="date" value="' + gristDateToInputValue(value) + '">', full);
  }

  function areaField(id, label, value, full) {
    return fieldHtml(id, label, '<textarea id="' + id + '">' + escapeHtml(value || '') + '</textarea>', full);
  }

  function selectField(id, label, value, full) {
    return fieldHtml(id, label,
      '<select id="' + id + '"><option value="' + escapeHtml(value || '') + '" selected>' + escapeHtml(value || '—') + '</option></select>', full);
  }

  // Fills a <select> with the union of the column's configured Grist choices
  // and the values actually in use (a Choice column can carry values typed
  // before they were added to "Modifier les choix" — Grist keeps them).
  async function populateChoiceSelect(selectId, tableId, colId, records, currentValue) {
    if (!colId) return;
    try {
      const choices = await fetchColumnChoices(tableId, colId);
      const used = Array.from(new Set((records || []).map(r => formatValue(r[colId])).filter(Boolean)));
      const merged = Array.from(new Set([...(choices || []), ...used]));
      if (currentValue && !merged.includes(currentValue)) merged.push(currentValue);
      const el = document.getElementById(selectId);
      if (!el || merged.length === 0) return;
      merged.sort((a, b) => String(a).localeCompare(String(b), 'fr'));
      el.innerHTML = '<option value="">—</option>' + merged.map(c =>
        '<option value="' + escapeHtml(c) + '"' + (c === currentValue ? ' selected' : '') + '>' + escapeHtml(c) + '</option>').join('');
    } catch (err) {
      console.error('populateChoiceSelect', colId, err);
    }
  }

  // Même principe que populateChoiceSelect, mais pour un filtre sur une
  // colonne Choice/ChoiceList : chaque valeur individuelle doit devenir une
  // option (un "IA fondamentale, Sécurité" fusionné ne serait sélectionnable
  // pour aucun des deux piliers pris seul).
  async function populateChoiceListFilterSelect(selectId, colId, records, currentValue) {
    const el = document.getElementById(selectId);
    if (!el || !colId) return;
    try {
      const configured = await fetchColumnChoices(structTableId, colId);
      const used = Array.from(new Set((records || []).flatMap(r => choiceListValues(r[colId]))));
      const merged = Array.from(new Set([...(configured || []), ...used]));
      if (currentValue && !merged.includes(currentValue)) merged.push(currentValue);
      if (merged.length === 0) return;
      merged.sort((a, b) => String(a).localeCompare(String(b), 'fr'));
      el.innerHTML = '<option value="">Tous</option>' + merged.map(v =>
        '<option value="' + escapeHtml(v) + '"' + (v === currentValue ? ' selected' : '') + '>' + escapeHtml(v) + '</option>').join('');
    } catch (err) {
      console.error('populateChoiceListFilterSelect', colId, err);
    }
  }

  function choiceListFieldHtml(id, label, full) {
    return fieldHtml(id, label, '<div id="' + id + '" class="choice-list-field"></div>', full);

  // Multi-select for a Choice/ChoiceList column: chips + a search-to-add
  // input, exactly like renderLocalPicker's contact picker below, except the
  // "options" are the column's own configured choices (plain strings) rather
  // than another table's rows. Only a value matching an existing choice can
  // be added — a closed vocabulary, so no free text slips in as a stray
  // near-duplicate. `onChange` is called with the full array on every
  // add/remove; the caller is responsible for saving it.
  //
  // `opts.single` restreint à une valeur : une colonne Choice simple n'en
  // accepte qu'une, et laisser cocher trois types pour n'en écrire qu'un
  // serait un mensonge du formulaire. Le nouveau choix remplace l'ancien.
  async function renderChoiceListPicker(container, tableId, colId, records, currentValues, onChange, opts) {
    if (!container || !colId) { if (container) container.innerHTML = ''; return; }
    const single = !!(opts && opts.single);
    let values = [...(currentValues || [])];
    if (single) values = values.slice(0, 1);
    let options = [...(currentValues || [])]; // shown immediately, refined once choices are fetched
    const datalistId = 'dl-' + Math.random().toString(36).slice(2);

    function paint() {
      container.innerHTML =
        '<div class="ref-chips">' +
          values.map((v, i) => '<span class="ref-chip">' + escapeHtml(v) +
            '<button type="button" data-i="' + i + '" title="Retirer">✕</button></span>').join('') +
        '</div>' +
        '<input class="editable-input ref-input" list="' + datalistId + '" placeholder="' +
          (single ? 'Choisir… (Entrée)' : 'Ajouter… (Entrée)') + '">' +
        '<datalist id="' + datalistId + '">' +
          options.filter(o => !values.includes(o)).map(o => '<option value="' + escapeHtml(o) + '">').join('') +
        '</datalist>';

      container.querySelectorAll('.ref-chip button').forEach(btn => {
        btn.addEventListener('click', () => {
          values.splice(Number(btn.dataset.i), 1);
          paint();
          onChange([...values]);
        });
      });

      const input = container.querySelector('.ref-input');
      function tryAdd() {
        const val = input.value.trim();
        if (!val) return;
        const match = options.find(o => o.toLowerCase() === val.toLowerCase());
        if (!match) {
          input.classList.add('ref-input-error');
          setTimeout(() => input.classList.remove('ref-input-error'), 900);
          return;
        }
        if (values.includes(match)) { input.value = ''; return; }
        if (single) values = [match]; else values.push(match);
        input.value = '';
        paint();
        onChange([...values]);
      }
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tryAdd(); } });
      input.addEventListener('change', tryAdd); // fires when picking a datalist suggestion
    }

    paint();

    try {
      const configured = await fetchColumnChoices(tableId, colId);
      const used = Array.from(new Set((records || []).flatMap(r => choiceListValues(r[colId]))));
      options = Array.from(new Set([...(configured || []), ...used, ...values]))
        .sort((a, b) => String(a).localeCompare(String(b), 'fr'));
      paint();
    } catch (err) {
      console.error('renderChoiceListPicker', colId, err);
    }
  }

  // Binds an input to a debounced autosave on `tableId`. `transform` adapts
  // the DOM value to what the column expects (date -> epoch, number, ...).
  function bindField(saver, tableId, rowId, elId, colId, transform) {
    const el = document.getElementById(elId);
    if (!el || !colId) return;
    // Un conteneur (le div d'un sélecteur à chips, par exemple) n'a pas de
    // `value` : les événements de ses champs internes remonteraient jusqu'ici
    // et feraient enregistrer `undefined` par-dessus la vraie valeur.
    if (!['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) {
      console.error('bindField : ' + elId + " n'est pas un champ de saisie");
      return;
    }
    const handler = () => saver(tableId, rowId, colId, transform ? transform(el) : el.value);
    el.addEventListener('input', handler);
    if (el.tagName === 'SELECT' || el.type === 'checkbox') el.addEventListener('change', handler);
  }

  const asNumber = (el) => (el.value === '' ? null : Number(el.value));
  const asDate = (el) => inputValueToGristDate(el.value);
  const asChecked = (el) => el.checked;
