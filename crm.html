<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CRM SequoIA — fiche 360</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="./common.css?v=20260918k">
<script src="./common.js?v=20260918k"></script>
<style>
  /* ---------- Sidebar ---------- */
  .filter-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .filter-chip {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-chip:hover { border-color: var(--sequoia-green); color: var(--sequoia-green-dark); }
  .filter-chip.active { background: var(--sequoia-green); border-color: var(--sequoia-green); color: #fff; }

  .sidebar-foot {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .icon-btn {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }

  .list-item .dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0; margin-left: auto;
  }
  .list-item .dot-neutral { background: #fff; border: 1px solid var(--border); }

  /* ---------- Main ---------- */
  .crm-main { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
  .crm-inner { max-width: 1180px; margin: 0 auto; }

  .fiche-head {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 14px;
  }
  .fiche-head .logo-frame {
    width: 52px; height: 52px; min-width: 52px;
    border-radius: 12px;
    background: var(--sequoia-green);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    overflow: hidden;
  }
  .fiche-head .logo-frame img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 5px; }
  .fiche-head .head-text { flex: 1; min-width: 0; }
  .fiche-head h1 {
    margin: 0 0 3px;
    font-size: 20px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fiche-head .head-meta { font-size: 12.5px; color: var(--text-muted); margin-bottom: 7px; }
  .fiche-head .head-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

  .btn-ghost {
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--sequoia-green); color: var(--sequoia-green-dark); }

  .site-link { font-size: 12.5px; color: var(--sequoia-green-dark); text-decoration: none; }
  .site-link:hover { text-decoration: underline; }

  /* ---------- KPI ---------- */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .kpi {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .kpi .kpi-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 5px; font-weight: 600;
  }
  .kpi .kpi-value { font-size: 19px; font-weight: 700; line-height: 1.15; }
  .kpi .kpi-value.small { font-size: 14px; font-weight: 600; }
  .kpi .kpi-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .kpi .mt { margin-top: 5px; }
  .kpi .kpi-value.warn { color: var(--danger); }

  /* ---------- Colonnes ---------- */
  .crm-grid { display: grid; grid-template-columns: minmax(300px, 1fr) 1.25fr; gap: 14px; align-items: start; }
  .crm-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 {
    margin: 0; flex: 1;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); font-weight: 700;
  }
  .panel-head .count {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    background: var(--bg); border-radius: 10px; padding: 1px 8px;
  }
  .panel-body { padding: 6px 0; }
  .panel-empty { padding: 18px 16px; font-size: 13px; color: var(--text-muted); font-style: italic; text-align: center; }
  .panel-warn { padding: 12px 16px; font-size: 12.5px; color: var(--danger); }

  .btn-add {
    border: 1px dashed var(--border);
    background: none;
    color: var(--sequoia-green-dark);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .btn-add:hover { background: var(--sequoia-green-light); border-color: var(--sequoia-green); }

  /* ---- Contacts ---- */
  .contact-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    border-bottom: 1px solid #f2f4f3;
  }
  .contact-row:last-child { border-bottom: none; }
  .contact-row:hover { background: #f7faf8; }
  .contact-row .avatar { width: 30px; height: 30px; font-size: 11px; }
  .contact-row .c-text { min-width: 0; flex: 1; }
  .contact-row .c-name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact-row .c-sub { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* L'etoile occupe sa place meme absente, sinon les boutons de la ligne
     voisine se decalent et la colonne ne se lit plus comme une colonne. */
  .contact-row .star {
    color: #eab308; font-size: 12px; flex-shrink: 0;
    width: 13px; text-align: center;
  }

  /* ---- Opportunités ---- */
  .opp-row {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid #f2f4f3;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .opp-row:last-child { border-bottom: none; }
  .opp-row:hover { background: #f7faf8; }
  .opp-row .o-text { flex: 1; min-width: 0; }
  .opp-row .o-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .opp-row .o-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  .opp-row .o-amount { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .status-pill {
    display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 600; color: #fff;
  }

  /* ---- Copie d'adresses ---- */
  /* Discret tant qu'on ne survole pas la ligne : la fiche n'a pas a etre
     constellee de boutons, mais l'adresse doit partir en un clic. */
  .copy-btn {
    border: 1px solid transparent;
    background: none;
    color: var(--text-muted);
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 0.12s ease;
  }
  .contact-row:hover .copy-btn, .ann-row:hover .copy-btn, .copy-btn:focus { opacity: 1; }
  .copy-btn:hover {
    opacity: 1;
    color: var(--sequoia-green-dark);
    border-color: var(--sequoia-green);
    background: var(--sequoia-green-light);
  }
  /* Lien vers le profil LinkedIn, dans la meme famille que le bouton de copie :
     discret au repos, bleu de la marque au survol. */
  .li-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 11px; font-weight: 700; font-style: italic;
    text-decoration: none;
    opacity: 0.45;
    transition: opacity 0.12s ease;
    flex-shrink: 0;
  }
  .contact-row:hover .li-btn, .ann-row:hover .li-btn, .li-btn:focus { opacity: 1; }
  .li-btn:hover {
    opacity: 1;
    color: #fff;
    background: #0a66c2; /* bleu LinkedIn */
    border-color: #0a66c2;
  }
  .ann-copie .li-btn { margin-right: 4px; }

  /* Bouton d'action discret dans un entete de panneau — plus petit que le
     .btn-ghost de l'entete de fiche, qui garde sa propre taille. */
  .btn-mini {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--sequoia-green-dark);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-mini:hover { border-color: var(--sequoia-green); background: var(--sequoia-green-light); }

  /* ---- Annuaire ---- */
  .annuaire {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .annuaire-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .annuaire-head h2 { font-size: 17px; margin: 0 0 3px; }
  .annuaire-sub { margin: 0; font-size: 12.5px; color: var(--text-muted); }
  .annuaire-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .annuaire-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .annuaire-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); font-weight: 700;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--card-bg);
  }
  .annuaire-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
  .annuaire-table tr:last-child td { border-bottom: none; }
  .ann-row:hover { background: #f7faf8; }
  .ann-check { width: 34px; }
  .ann-check input { cursor: pointer; }
  .ann-nom { font-weight: 600; cursor: pointer; }
  .ann-nom:hover { color: var(--sequoia-green-dark); text-decoration: underline; }
  .ann-mail { color: var(--text-muted); }
  /* Assez large pour le lien et le bouton cote a cote : plus etroit, ils
     s'empilaient et la ligne doublait de hauteur. */
  .ann-copie { width: 78px; text-align: right; white-space: nowrap; }
  .ann-sans-adresse { color: var(--text-muted); }
  .ann-vide { color: var(--border); }

  /* ---- Timeline ---- */
  .timeline { padding: 4px 0; }
  /* Ligne rattachée à la structure par une autre colonne que Partenaire(s)
     (Laboratoire Cluster, Etablissement Cluster…) : on dit laquelle. */
  .via-pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 10.5px;
    font-weight: 600;
    vertical-align: middle;
  }
  .tl-cr {
    font-size: 13px; line-height: 1.55; color: var(--text);
    max-height: 200px; overflow: hidden; position: relative;
  }
  /* Le compte rendu est coupe net : le degrade dit qu'il continue, et le
     bouton « Ouvrir en entier » dit ou. */
  .tl-cr.clipped::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
    background: linear-gradient(180deg, rgba(247,250,248,0), #f4f7f5);
  }
  .tl-cr img { max-width: 100%; border-radius: 6px; }
  .tl-cr h1, .tl-cr h2, .tl-cr h3 { font-size: 14px; margin: 8px 0 3px; }
  .tl-cr ul, .tl-cr ol { padding-left: 20px; margin: 5px 0; }
  .tl-cr p { margin: 0 0 7px; }
  .tl-pj { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pj-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 9px;
    font-size: 12px; color: var(--sequoia-green-dark);
    text-decoration: none; cursor: pointer;
    max-width: 220px;
  }
  .pj-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pj-chip:hover { border-color: var(--sequoia-green); }

  /* Les échanges précédents forment une frise : un filet continu porte un
     point par échange, ce qui donne à voir la cadence du suivi — trois
     réunions en un mois puis six mois de silence se lisent d'un coup, là où
     une liste de dates demande de calculer. */
  .tl-item {
    display: flex; gap: 12px;
    padding: 9px 16px 9px 0;
    cursor: pointer;
    position: relative;
    margin-left: 26px;
  }
  .tl-item:hover { background: #f7faf8; }
  /* Le filet : tiré d'un point à l'autre, interrompu au dernier. */
  .tl-item::before {
    content: ''; position: absolute; left: -15px; top: 0; bottom: 0;
    border-left: 1px solid var(--border);
  }
  .tl-item:last-child::before { bottom: auto; height: 17px; }
  /* Le point, aligné sur la première ligne de texte. */
  .tl-item::after {
    content: ''; position: absolute; left: -18px; top: 13px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--card-bg); border: 1.5px solid var(--text-muted);
  }
  .tl-item:hover::after { border-color: var(--sequoia-green); background: var(--sequoia-green); }
  .tl-item .tl-when { font-size: 11.5px; color: var(--text-muted); min-width: 62px; flex-shrink: 0; padding-top: 1px; }
  .tl-item .tl-body { min-width: 0; flex: 1; }
  .tl-item .tl-title { font-size: 13px; font-weight: 600; }
  .tl-item .tl-meta {
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* L'echange retenu s'ouvre sur place : un apercu du compte rendu et de ses
     pieces jointes, sans quitter la frise. La fiche complete reste a un clic. */
  .tl-item.open { background: #f4f7f5; }
  .tl-item.open::after { border-color: var(--sequoia-green); background: var(--sequoia-green); }
  .tl-item.open .tl-meta { white-space: normal; overflow: visible; }
  .tl-preview { margin: 9px 0 2px; border-top: 1px solid var(--border); padding-top: 9px; }
  .tl-preview-empty { font-size: 12.5px; color: var(--text-muted); font-style: italic; }
  .tl-open-btn {
    margin-top: 10px;
    border: 1px solid var(--sequoia-green);
    background: var(--card-bg);
    color: var(--sequoia-green-dark);
    border-radius: 8px; padding: 5px 11px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .tl-open-btn:hover { background: var(--sequoia-green); color: #fff; }
  .type-pill {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    background: var(--sequoia-green-light); color: var(--sequoia-green-dark);
    font-size: 10.5px; font-weight: 600;
  }

  /* ---------- Modales ---------- */
  .form-modal { max-width: 680px; }
  .form-modal.wide { max-width: 840px; }
  .modal-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .modal-head h2 { margin: 0; flex: 1; font-size: 18px; font-weight: 700; }
  .modal-status { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; padding-top: 4px; }
  .modal-section {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); font-weight: 700;
    margin: 18px 0 8px;
  }
  /* Les popups d'interaction sont longues (méta + CR + PJ) : les actions
     restent collées en bas plutôt que de fuir sous le compte-rendu. */
  .form-modal-actions {
    position: sticky;
    bottom: -28px;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 12px 0 28px;
    margin-bottom: -28px;
  }
  .btn-danger {
    padding: 9px 14px; border-radius: 8px;
    border: 1px solid #f0d4d2; background: #fff;
    color: var(--danger); font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn-danger:hover { background: #fdf3f2; }
  .modal-actions-left { margin-right: auto; }

  /* ---- Éditeur de compte-rendu ---- */
  .cr-toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
    border: 1px solid var(--border); border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 6px 8px;
    background: var(--bg);
  }
  .cr-toolbar button {
    border: 1px solid transparent; background: none; cursor: pointer;
    font-size: 12.5px; padding: 3px 8px; border-radius: 6px; color: var(--text);
  }
  .cr-toolbar button:hover { background: #fff; border-color: var(--border); }
  .cr-toolbar .spacer { flex: 1; }
  .cr-editable {
    width: 100%; min-height: 200px; max-height: 45vh; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 0 0 8px 8px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.6; outline: none;
    background: #fff;
  }
  .cr-editable:focus { border-color: var(--sequoia-green); }
  .cr-editable img { max-width: 100%; border-radius: 6px; margin: 6px 0; }
  .cr-editable:empty::before { content: attr(data-placeholder); color: var(--text-muted); font-style: italic; }
  .cr-editable h1, .cr-editable h2, .cr-editable h3 { font-size: 15px; font-weight: 700; margin: 10px 0 4px; }
  .cr-editable ul, .cr-editable ol { padding-left: 20px; margin: 6px 0; }
  .cr-editable p:first-child { margin-top: 0; }

  .pj-dropzone {
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 13px; text-align: center; font-size: 12.5px;
    color: var(--text-muted); cursor: pointer;
  }
  .pj-dropzone.dragover { border-color: var(--sequoia-green); background: var(--sequoia-green-light); }
  .contacts-toggle { margin: 10px 16px; }

  /* Fiche d'un contact : ses structures sont des boutons, on y va d'un clic. */
  .struct-pill {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--sequoia-green-dark);
    border-radius: 10px;
    padding: 2px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .struct-pill:hover { border-color: var(--sequoia-green); background: var(--sequoia-green-light); }
  .head-tel { font-size: 12.5px; color: var(--text-muted); }

  /* ---- Actions d'une structure ---- */
  .act-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  .act-row:last-of-type { border-bottom: none; }
  .act-row.fait .act-label { text-decoration: line-through; color: var(--text-muted); }
  .act-row input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }
  .act-text { flex: 1; min-width: 0; }
  .act-label { font-size: 13px; font-weight: 600; }
  .act-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .act-due { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }
  .act-due.retard { color: var(--danger); font-weight: 700; }
  .act-sep {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); font-weight: 700;
    padding: 9px 16px 3px;
  }
  .act-toggle { margin: 9px 16px; }
  .act-form { display: flex; gap: 7px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .act-form #act-nouvelle { flex: 1; min-width: 0; }
  .act-form input {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 12.5px; font-family: inherit;
  }
  .act-form input:focus { outline: none; border-color: var(--sequoia-green); }

  /* ---- Actions de suivi d'un echange ---- */
  .suivi-liste { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .suivi-vide { font-size: 12.5px; color: var(--text-muted); font-style: italic; }
  .suivi-item {
    display: flex; align-items: center; gap: 9px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
  }
  .suivi-item.fait .suivi-label { text-decoration: line-through; color: var(--text-muted); }
  .suivi-item .suivi-label { flex: 1; min-width: 0; }
  .suivi-item .suivi-qui, .suivi-item .suivi-due {
    font-size: 11.5px; color: var(--text-muted); flex-shrink: 0;
  }
  .suivi-form { display: flex; gap: 8px; align-items: center; }
  .suivi-form #suivi-label { flex: 1; }
  .suivi-form input {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  .suivi-form input:focus { outline: none; border-color: var(--sequoia-green); }
  .suivi-contacts-field { margin-top: 9px; }

  .pj-list { margin-top: 9px; display: flex; flex-direction: column; gap: 6px; }
  .pj-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px;
  }
  .pj-item .pj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pj-item a { color: var(--sequoia-green-dark); text-decoration: none; font-weight: 500; cursor: pointer; }
  .pj-item .pj-remove { color: var(--danger); cursor: pointer; background: none; border: none; font-size: 13px; }

  @media (max-width: 1000px) {
    .crm-grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
  /* Sous cette largeur, les boutons d'action écraseraient le nom de la
     structure : ils passent sur leur propre ligne. */
  @media (max-width: 820px) {
    .fiche-head { flex-wrap: wrap; }
    .head-actions { flex-basis: 100%; justify-content: flex-end; }
  }
  @media (max-width: 700px) {
    .crm-main { padding: 14px; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
