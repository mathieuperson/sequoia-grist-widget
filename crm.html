  // `s` absent : creation d'une ligne dans la table Structures. Meme
  // formulaire que la fiche, mais rien n'est enregistre avant le clic sur
  // « Creer » — une structure a moitie saisie n'a pas a exister.
  function openStructureModal(s) {
    const isNew = !s;
    const typeActeur = structField(s, 'TypeActeur');
    const html =
      modalHeadHtml(isNew ? 'Nouvelle structure' : 'Fiche structure') +
      '<div class="form-modal-grid">' +
        textField('m-nom', 'Nom', structField(s, 'Nom'), true) +
        areaField('m-description', 'Description', structField(s, 'Description'), true) +
        selectField('m-type', "Type d'acteur", typeActeur) +
        selectField('m-categorie', 'Catégorie', structField(s, 'Categorie')) +
        choiceListFieldHtml('m-activite', 'Activité') +
        selectField('m-taille', 'Taille', structField(s, 'Taille')) +
        choiceListFieldHtml('m-pilier', 'Pilier SequoIA') +
        choiceListFieldHtml('m-axe', 'Axe SequoIA') +
        textField('m-site', 'Site web', structField(s, 'SiteWeb'), true) +
        textField('m-logo', 'URL du logo', structField(s, 'Logo'), true) +
        textField('m-rstructure', 'Structure de recherche', structField(s, 'RechercheStructure')) +
        textField('m-requipe', 'Équipe / activité', structField(s, 'RechercheEquipeActivite')) +
        textField('m-rlabo', 'Laboratoire', structField(s, 'RechercheEquipeLabo')) +
      '</div>' +
      '<div class="form-modal-actions">' +
        (isNew
          ? '<button class="btn-secondary" data-close>Annuler</button>' +
            '<button class="btn-primary" id="m-create">Créer</button>'
          : '<button class="btn-primary" data-close>Terminé</button>') +
      '</div>';

    openModal(html, () => {
      const saver = createRecordSaver(setModalStatus);
      const bind = (elId, role, transform) => {
        if (isNew) return; // rien ne s'enregistre avant la creation
        bindField(saver, structTableId, s.id, elId, mappings[role], transform);
      };
      bind('m-nom', 'Nom');
      bind('m-description', 'Description');
      bind('m-type', 'TypeActeur');
      bind('m-categorie', 'Categorie');
      bind('m-taille', 'Taille');
      bind('m-site', 'SiteWeb');
      bind('m-logo', 'Logo');
      bind('m-rstructure', 'RechercheStructure');
      bind('m-requipe', 'RechercheEquipeActivite');
      bind('m-rlabo', 'RechercheEquipeLabo');

      const raw = rawStructures();
      populateChoiceSelect('m-type', structTableId, mappings.TypeActeur, raw, typeActeur);
      populateChoiceSelect('m-categorie', structTableId, mappings.Categorie, raw, structField(s, 'Categorie'));
      populateChoiceSelect('m-taille', structTableId, mappings.Taille, raw, structField(s, 'Taille'));

      // Activité, Pilier SequoIA et Axe SequoIA : une structure peut porter
      // plusieurs valeurs (ChoiceList), donc un sélecteur multiple plutôt
      // qu'un champ à valeur unique — sauf si le document a fait de la colonne
      // un choix simple, auquel cas il n'en accepte qu'une.
      const choixSaisis = {}; // rôle -> valeurs retenues
      [['m-activite', 'Activite'], ['m-pilier', 'PilierSequoia'], ['m-axe', 'AxeSequoia']]
        .forEach(([elId, role]) => {
          const colId = mappings[role];
          if (!colId) return;
          choixSaisis[role] = choiceListValues(s && s[role]);
          renderChoiceListPicker(
            document.getElementById(elId), structTableId, colId, raw, choixSaisis[role],
            (values) => {
              choixSaisis[role] = values;
              if (!isNew) saver(structTableId, s.id, colId, structColValue(colId, values));
            }, { single: !structListCols.includes(colId) });
        });

      if (!isNew) return;

      document.getElementById('m-nom').focus();
      document.getElementById('m-create').addEventListener('click', async () => {
        const nom = document.getElementById('m-nom').value.trim();
        if (!nom) { document.getElementById('m-nom').focus(); return; }
        const fields = {};
        const set = (role, valeur) => { if (mappings[role]) fields[mappings[role]] = valeur; };
        set('Nom', nom);
        [['m-description', 'Description'], ['m-type', 'TypeActeur'], ['m-categorie', 'Categorie'],
         ['m-taille', 'Taille'], ['m-site', 'SiteWeb'], ['m-logo', 'Logo'],
         ['m-rstructure', 'RechercheStructure'], ['m-requipe', 'RechercheEquipeActivite'],
         ['m-rlabo', 'RechercheEquipeLabo']].forEach(([elId, role]) => {
          const el = document.getElementById(elId);
          if (el) set(role, el.value.trim());
        });
        Object.entries(choixSaisis).forEach(([role, values]) => {
          if (values.length) set(role, structColValue(mappings[role], values));
        });
        try {
          setModalStatus('Création…');
          const nouvelId = await addRecord(structTableId, fields);
          if (nouvelId) ouvrirNouvelleStructure(nouvelId);
          await closeModal();
        } catch (err) { console.error(err); setModalStatus('Erreur à la création'); }
      });
    });
  }

      '</div>' +

        '<button class="btn-secondary" data-close>' + (isNew ? 'Annuler' : 'Fermer') + '</button>' +
        (isNew ? '<button class="btn-primary" id="m-create">Créer</button>' : '') +
      '</div>';

    openModal(html, () => {
      const getStructures = mountRefPicker('m-ref-structures',
        structurePickerOptions(), c, r.tableId, cols.Structures, isNew,
        [{ id: s.id, label: structField(s, 'Nom') || 'Sans nom' }], structureChip);

      if (isNew) {
        document.getElementById('m-nom').focus();
        document.getElementById('m-create').addEventListener('click', async () => {
          const nom = document.getElementById('m-nom').value.trim();
          if (!nom) { document.getElementById('m-nom').focus(); return; }
          const fields = {};
          const set = (role, value) => { if (cols[role]) fields[cols[role]] = value; };
          set('Nom', nom);
          set('Prenom', document.getElementById('m-prenom').value.trim());
          set('Fonction', document.getElementById('m-fonction').value.trim());
          set('Email', document.getElementById('m-email').value.trim());
          set('Telephone', document.getElementById('m-tel').value.trim());
          set('Linkedin', document.getElementById('m-linkedin').value.trim());
          set('Commentaire', document.getElementById('m-commentaire').value.trim());
          const principalEl = document.getElementById('m-principal');
          if (principalEl) set('ContactPrincipal', principalEl.checked);
          // Sans lien le contact n'apparaîtrait sur aucune fiche : la
          // structure ouverte reste le repli si la puce en a été retirée.
          const structureChips = getStructures();
          set('Structures', refListValue(r.tableId, cols.Structures,
            structureChips.length ? structureChips.map(x => x.id) : [s.id]));
          try {
            setModalStatus('Création…');
            await addRecord(r.tableId, fields);
            await closeModal();
          } catch (err) {
            console.error(err);
            setModalStatus('Erreur à la création');

        return;

      const saver = createRecordSaver(setModalStatus);
      const bind = (elId, role, transform) => bindField(saver, r.tableId, c.id, elId, cols[role], transform);

        try {
          await removeRecord(r.tableId, c.id);
          await closeModal();

          Object.entries(getExtraLinks).forEach(([colId, getChips]) => {
            const chips = getChips();
            if (chips.length) fields[colId] = refListValue(r.tableId, colId, chips.map(c => c.id));
          });
          try {
            setModalStatus('Création…');
            await addRecord(r.tableId, fields);
            await closeModal();
          } catch (err) { console.error(err); setModalStatus('Erreur à la création'); }
        });
        return;
      }

      const saver = createRecordSaver(setModalStatus);
      const bind = (elId, role, transform) => bindField(saver, r.tableId, o.id, elId, cols[role], transform);
      bind('m-sujet', 'Sujet');
      bind('m-statut', 'Statut');
      // Type, Pilier et Axe ne sont pas des <input> : leurs sélecteurs
      // enregistrent eux-mêmes à chaque changement, plus haut.
      bind('m-montant', 'Montant', asNumber);
      bind('m-debut', 'DateDebut', asDate);
      bind('m-echeance', 'Echeance', asDate);
      bind('m-commentaire', 'Commentaire');

      document.getElementById('m-delete').addEventListener('click', async () => {
        if (!confirm('Supprimer définitivement cette opportunité ?')) return;
        try {
          await removeRecord(r.tableId, o.id);
          await closeModal();
        } catch (err) { console.error(err); setModalStatus('Erreur à la suppression'); }
      });
    });
  }

  // ---- Interaction (méta + compte-rendu + pièces jointes) ----

  function openInteractionModal(i, s) {
    const r = rel('interactions');
    const cols = r.cols;
    if (!r.tableId) { alert('Table Interactions introuvable.'); return; }
    const isNew = !i;
    const get = (role) => (i && cols[role] ? formatValue(i[cols[role]]) : '');
    const rawGet = (role) => (i && cols[role] ? i[cols[role]] : null);

    const html =
      modalHeadHtml(isNew ? 'Nouvelle interaction' : (get('Objet') || 'Interaction')) +
      '<div class="form-modal-grid">' +
        textField('m-objet', 'Objet', get('Objet'), true) +
        dateField('m-date', 'Date', isNew ? Math.floor(Date.now() / 1000) : rawGet('Date')) +
        selectField('m-type', 'Type', get('Type')) +
        dateField('m-echeance', 'Prochaine échéance', rawGet('ProchaineEcheance')) +
        // « Suites à donner » est une note sur l'échange, pas une action : elle
        // n'a jamais rien écrit dans la table des actions. Tant que celle-ci
        // n'existe pas, le pilotage en déduit une ligne et le champ reste le
        // seul moyen de noter une suite. Dès qu'elle existe, le champ le dit
        // et renvoie au bloc qui, lui, crée une vraie action.
        (rel('actions').tableId && !isNew
          ? textField('m-suites', 'Suites à donner (note libre)', get('Suites')) +
            '<div class="form-field full form-modal-note">Cette note reste sur l’échange. ' +
            'Pour une action suivie — échéance, interlocuteurs, à cocher depuis le pilotage — ' +
            'utilisez <strong>Actions de suivi</strong>, plus bas.' +
            (get('Suites').trim()
              ? ' <button type="button" class="btn-mini" id="suites-reprendre">Reprendre celle-ci comme action</button>'
              : '') + '</div>'
          : textField('m-suites', 'Suites à donner', get('Suites'))) +
        '<div class="form-field full"><label>Partenaire(s)</label><div id="m-ref-partenaires"></div></div>' +
        extraStructureFieldsHtml('interactions') +
        '<div class="form-field full"><label>Contact(s) partenaire</label><div id="m-ref-contacts"></div></div>' +
        '<div class="form-field full"><label>Contact(s) cluster</label><div id="m-ref-contacts-cluster"></div></div>' +
        '<div class="form-modal-note">Créée depuis la fiche <strong>' + escapeHtml(structField(s, 'Nom')) + '</strong> — ajoutez les autres structures présentes ci-dessus si besoin.</div>' +
      '</div>' +
      (isNew ? '' :
        '<div class="modal-section">Compte-rendu</div>' +
        '<div class="cr-toolbar">' +
          '<button type="button" data-cmd="bold" title="Gras"><b>G</b></button>' +
          '<button type="button" data-cmd="italic" title="Italique"><i>I</i></button>' +
          '<button type="button" data-cmd="heading" title="Titre">H</button>' +
          '<button type="button" data-cmd="list" title="Liste">• Liste</button>' +
          '<button type="button" data-cmd="link" title="Lien">🔗</button>' +
          '<span class="spacer"></span>' +
          '<span class="save-status" id="cr-status"></span>' +
        '</div>' +
        '<div class="cr-editable" id="cr-editor" contenteditable="true" data-placeholder="Rédigez le compte-rendu… (collez une image directement)"></div>' +
        '<div class="modal-section">Pièces jointes</div>' +
        '<div class="pj-dropzone" id="pj-dropzone">Glissez un fichier ici, ou cliquez pour parcourir</div>' +
        '<div class="pj-list" id="pj-list"></div>' +
        // Les suites d'un échange méritent mieux qu'une ligne de texte libre :
        // une vraie action, rattachée à l'échange, avec les interlocuteurs
        // concernés — c'est elle qu'on retrouvera dans la todo du pilotage.
        (rel('actions').tableId
          ? '<div class="modal-section">Actions de suivi</div>' +
            '<div class="suivi-liste" id="suivi-liste"></div>' +
            '<div class="suivi-form">' +
              '<input id="suivi-label" placeholder="Que faut-il faire ensuite ?">' +
              '<input type="date" id="suivi-due" title="Échéance">' +
              '<button class="btn-primary" id="suivi-add">+ Action</button>' +
            '</div>' +
            '<div class="form-field full suivi-contacts-field"><label>Contacts concernés</label>' +
              '<div id="suivi-contacts"></div></div>'
          : '')) +
      '<div class="form-modal-actions">' +
        (isNew ? '' : '<button class="btn-danger modal-actions-left" id="m-delete">Supprimer</button>') +
        '<button class="btn-secondary" data-close>' + (isNew ? 'Annuler' : 'Fermer') + '</button>' +
        (isNew ? '<button class="btn-primary" id="m-create">Créer et rédiger le CR</button>' : '') +
      '</div>';

    openModal(html, () => {
      populateChoiceSelect('m-type', r.tableId, cols.Type, r.records, get('Type'));

      const getPartenaires = mountRefPicker('m-ref-partenaires',
        structurePickerOptions(), i, r.tableId, cols.Partenaires, isNew,
        [{ id: s.id, label: structField(s, 'Nom') || 'Sans nom' }], structureChip);
      const getExtraLinks = mountExtraStructureLinks('interactions', i, r.tableId, isNew);
      const getContacts = mountRefPicker('m-ref-contacts',
        contactOptionsForRecord('interactions', i, s.id), i, r.tableId, cols.ContactPartenaire, isNew,
        null, contactChip);
      const getClusterContacts = mountRefPicker('m-ref-contacts-cluster',
        contactPickerOptions(s.id, 'all'), i, r.tableId, cols.ContactCluster, isNew,
        null, contactChip);

      if (isNew) {
        document.getElementById('m-objet').focus();
        document.getElementById('m-create').addEventListener('click', async () => {
          const objet = document.getElementById('m-objet').value.trim();
          if (!objet) { document.getElementById('m-objet').focus(); return; }
          const fields = {};
          const set = (role, value) => { if (cols[role]) fields[cols[role]] = value; };
          set('Objet', objet);
          set('Date', inputValueToGristDate(document.getElementById('m-date').value));
          set('Type', document.getElementById('m-type').value);
          set('ProchaineEcheance', inputValueToGristDate(document.getElementById('m-echeance').value));
          set('Suites', document.getElementById('m-suites').value.trim());
          const contactChips = getContacts();
          const clusterChips = getClusterContacts();
          if (contactChips.length) set('ContactPartenaire',
            refListValue(r.tableId, cols.ContactPartenaire, contactChips.map(c => c.id)));
          if (clusterChips.length) set('ContactCluster',
            refListValue(r.tableId, cols.ContactCluster, clusterChips.map(c => c.id)));
          Object.entries(getExtraLinks).forEach(([colId, getChips]) => {
            const chips = getChips();
            if (chips.length) fields[colId] = refListValue(r.tableId, colId, chips.map(c => c.id));
          });
          // Sans lien l'interaction n'apparaîtrait sur aucune fiche : la
          // structure ouverte reste le repli si la puce en a été retirée.
          const partenaireChips = getPartenaires();
          set('Partenaires', refListValue(r.tableId, cols.Partenaires,
            partenaireChips.length ? partenaireChips.map(c => c.id) : [s.id]));
          try {
            setModalStatus('Création…');
            const newId = await addRecord(r.tableId, fields);
            await loadRelated();
            const created = rel('interactions').records.find(x => x.id === newId);
            // Reopen straight into the full form so the CR can be written now.
            if (created) { modalCleanup = null; openInteractionModal(created, s); }
            else await closeModal();
          } catch (err) { console.error(err); setModalStatus('Erreur à la création'); }
        });
        return;
      }

      const saver = createRecordSaver(setModalStatus);
      const bind = (elId, role, transform) => bindField(saver, r.tableId, i.id, elId, cols[role], transform);
      bind('m-objet', 'Objet');
      bind('m-date', 'Date', asDate);
      bind('m-type', 'Type');
      bind('m-echeance', 'ProchaineEcheance', asDate);
      bind('m-suites', 'Suites');

      document.getElementById('m-delete').addEventListener('click', async () => {
        if (!confirm('Supprimer définitivement cette interaction (et son compte-rendu) ?')) return;
        try {
          await removeRecord(r.tableId, i.id);
          await closeModal();
        } catch (err) { console.error(err); setModalStatus('Erreur à la suppression'); }
      });

      setupCrEditor(r.tableId, i, cols);
      setupAttachments(r.tableId, i, cols);
      setupActionsDeSuivi(i, s);
    }, true);
  }

  // ---- Actions de suivi d'un échange ----
  //
  // Le champ « Suites » est du texte libre : le pilotage en déduit une action,
  // mais sans échéance propre, sans interlocuteur, et sans pouvoir être cochée
  // ailleurs que dans l'échange. Ici on crée une vraie ligne dans la table des
  // actions, rattachée à l'échange, à ses partenaires et à ses opportunités.

  function actionsDeLEchange(interactionId) {
    const a = rel('actions');
    if (!a.tableId || !a.cols.Interaction) return [];
    return a.records.filter(x => recordLinksTo(x, a.cols.Interaction, interactionId));
  }

  function setupActionsDeSuivi(i, s) {
    const a = rel('actions');
    const zone = document.getElementById('suivi-liste');
    if (!a.tableId || !zone) return;
    const inter = rel('interactions');

    function peindre() {
      const liste = actionsDeLEchange(i.id);
      zone.innerHTML = liste.length === 0
        ? '<div class="suivi-vide">Aucune action rattachée à cet échange.</div>'
        : liste.map(x => {
            const fait = !!(a.cols.Fait && x[a.cols.Fait]);
            const due = a.cols.Echeance ? x[a.cols.Echeance] : null;
            const qui = a.cols.Contacts ? contactNamesFor(refIdsFromValue(x[a.cols.Contacts])) : [];
            return '<div class="suivi-item' + (fait ? ' fait' : '') + '">' +
              '<input type="checkbox" data-suivi="' + x.id + '"' + (fait ? ' checked' : '') +
                (a.cols.Fait ? '' : ' disabled') + '>' +
              '<span class="suivi-label">' +
                escapeHtml(a.cols.Intitule ? formatValue(x[a.cols.Intitule]) : 'Sans intitulé') + '</span>' +
              (qui.length ? '<span class="suivi-qui">' + escapeHtml(qui.join(', ')) + '</span>' : '') +
              (due ? '<span class="suivi-due">' + escapeHtml(formatDate(due)) + '</span>' : '') +
            '</div>';
          }).join('');
      zone.querySelectorAll('[data-suivi]').forEach(cb => {
        cb.addEventListener('change', async () => {
          try {
            await updateRecord(a.tableId, Number(cb.dataset.suivi), { [a.cols.Fait]: cb.checked });
            related.actions = await resolveRelated('actions');
            peindre();
          } catch (err) { console.error(err); setModalStatus('Erreur d’enregistrement'); }
        });
      });
    }

    peindre();

    // Les interlocuteurs de l'échange sont proposés d'emblée : une suite
    // concerne le plus souvent les gens qu'on vient de voir.
    const options = contactOptionsForRecord('interactions', i, s.id);
    const dejaIds = inter.cols.ContactPartenaire ? refIdsFromValue(i[inter.cols.ContactPartenaire]) : [];
    let chips = options.filter(o => dejaIds.includes(o.id));
    const zoneContacts = document.getElementById('suivi-contacts');
    if (zoneContacts && a.cols.Contacts) {
      renderLocalPicker(zoneContacts, options, chips, (next) => { chips = next; });
    } else if (zoneContacts) {
      zoneContacts.closest('.suivi-contacts-field').hidden = true;
    }

    const champ = document.getElementById('suivi-label');
    const echeance = document.getElementById('suivi-due');
    const bouton = document.getElementById('suivi-add');

    // Reprendre une note « Suites à donner » déjà écrite : elle devient une
    // action de la table, avec l'échéance de l'échange, et le champ se vide
    // pour qu'elle ne figure pas deux fois dans le pilotage.
    const reprise = document.getElementById('suites-reprendre');
    if (reprise) reprise.addEventListener('click', async () => {
      const note = document.getElementById('m-suites');
      const texte = note.value.trim();
      if (!texte) return;
      reprise.disabled = true;
      champ.value = texte;
      const due = inter.cols.ProchaineEcheance ? i[inter.cols.ProchaineEcheance] : null;
      if (due) echeance.value = gristDateToInputValue(due);
      await creer();
      try {
        const vide = {};
        if (inter.cols.Suites) vide[inter.cols.Suites] = '';
        if (inter.cols.ProchaineEcheance) vide[inter.cols.ProchaineEcheance] = null;
        await updateRecord(inter.tableId, i.id, vide);
        note.value = '';
        const echeanceEchange = document.getElementById('m-echeance');
        if (echeanceEchange) echeanceEchange.value = '';
        reprise.closest('.form-modal-note').remove();
      } catch (err) { console.error(err); setModalStatus('Échange non mis à jour'); }
    });

    async function creer() {
      const label = champ.value.trim();
      if (!label) { champ.focus(); return; }
      const fields = {};
      const pose = (colId, valeur) => { if (colId) fields[colId] = valeur; };
      pose(a.cols.Intitule, label);
      if (a.cols.Echeance && echeance.value) pose(a.cols.Echeance, inputValueToGristDate(echeance.value));
      pose(a.cols.Interaction, refListValue(a.tableId, a.cols.Interaction, [i.id]));
      if (chips.length) pose(a.cols.Contacts, refListValue(a.tableId, a.cols.Contacts, chips.map(c => c.id)));
      // L'action hérite des rattachements de l'échange : c'est le même sujet.
      const partenaires = inter.cols.Partenaires ? refIdsFromValue(i[inter.cols.Partenaires]) : [];
      if (partenaires.length) pose(a.cols.Partenaires, refListValue(a.tableId, a.cols.Partenaires, partenaires));
      const opportunites = inter.cols.Opportunites ? refIdsFromValue(i[inter.cols.Opportunites]) : [];
      if (opportunites.length) pose(a.cols.Opportunite, refListValue(a.tableId, a.cols.Opportunite, opportunites));
      try {
        setModalStatus('Création de l’action…');
        await addRecord(a.tableId, fields);
        related.actions = await resolveRelated('actions');
        champ.value = '';
        echeance.value = '';
        peindre();
        setModalStatus('Action créée ✓');
      } catch (err) { console.error(err); setModalStatus('Erreur à la création de l’action'); }
    }

    bouton.addEventListener('click', creer);
    champ.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); creer(); } });
  }

  // Contacts proposés par un sélecteur : ceux de la structure ouverte pour
  // les contacts partenaire, tout le carnet pour les contacts cluster (ce
  // sont des gens du cluster, pas du partenaire).
  // ---- Adresses ----
  // Une adresse peut etre saisie avec des espaces, en majuscules, ou plusieurs
  // dans la meme cellule separees par une virgule ou un point-virgule : on
  // deplie, on nettoie, et on ecarte ce qui ne ressemble pas a une adresse
  // plutot que de copier un « a demander » dans un champ « A ».
  function emailsOfContact(c) {
    const cols = rel('contacts').cols;
    if (!cols.Email) return [];
    return String(formatValue(c[cols.Email]) || '')
      .split(/[;,\s]+/)
      .map(x => x.trim())
      .filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
  }

  // Le champ LinkedIn est saisi a la main : parfois l'URL complete, parfois
  // « linkedin.com/in/… » sans protocole, parfois l'identifiant seul. On en
  // fait une URL absolue — un href relatif pointerait vers GitHub Pages.
  function linkedinUrl(valeur) {
    const brut = String(valeur || '').trim();
    if (!brut) return '';
    if (/^https?:\/\//i.test(brut)) return brut;
    if (/^(www\.)?linkedin\.com\//i.test(brut)) return 'https://' + brut.replace(/^www\./i, '');
    // Un identifiant seul : pas d'espace, pas de point d'entree douteux.
    if (/^[\w\-À-ÿ.%]+$/.test(brut)) return 'https://www.linkedin.com/in/' + encodeURIComponent(brut);
    return '';
  }

  function linkedinLink(contact) {
    const cols = rel('contacts').cols;
    if (!cols.Linkedin) return '';
    const url = linkedinUrl(formatValue(contact[cols.Linkedin]));
    if (!url) return '';
    return '<a class="li-btn" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer"' +
      ' title="Profil LinkedIn — ' + escapeHtml(contactName(contact)) + '">in</a>';
  }

  function emailsOfStructure(structureId) {
    const vues = new Set();
    contactsOf(structureId).forEach(c => emailsOfContact(c).forEach(a => vues.add(a)));
    return Array.from(vues);
  }

  // Le point-virgule est ce qu'attend Outlook, qui est le client d'ici ;
  // Thunderbird et Gmail l'acceptent aussi.
  function joindreAdresses(adresses) {
    return adresses.join('; ');
  }

  // Copie, et dit ce qui s'est passe. Si le presse-papier est refuse par
  // l'iframe, on montre le texte pour qu'il reste recuperable a la main.
  async function copierAdresses(adresses, quoi) {
    const liste = Array.isArray(adresses) ? adresses : [adresses];
    if (!liste.length) { toast('Aucune adresse à copier', true); return; }
    const texte = joindreAdresses(liste);
    if (await copierTexte(texte)) {
      toast(liste.length === 1 ? liste[0] + ' copiée' : liste.length + ' adresses copiées' + (quoi ? ' — ' + quoi : ''));
      return;
    }
    openModal(
      modalHeadHtml('Copie impossible depuis ce cadre') +
      '<div class="form-modal-grid">' +
        '<div class="form-field full"><label>Adresses — sélectionnez puis Ctrl+C</label>' +
        '<textarea id="m-adresses" rows="6" readonly>' + escapeHtml(texte) + '</textarea></div>' +
      '</div>' +
      '<div class="form-modal-actions"><button class="btn-primary" data-close>Fermer</button></div>',
      () => {
        const zone = document.getElementById('m-adresses');
        zone.focus();
        zone.select();
      });
  }

  function contactPickerOptions(structureId, scope) {
    const list = scope === 'all' ? rel('contacts').records : contactsOf(structureId);
    return list
      .map(c => ({ id: c.id, label: contactName(c) }))
      .sort((a, b) => a.label.localeCompare(b.label, 'fr'));
  }

  // Les contacts proposes pour une ligne : ceux de toutes les structures
  // qu'elle designe, pas seulement celle de la fiche ouverte. Une interaction
  // creee depuis Neverhack et consultee depuis SOTERN doit continuer d'offrir
  // les contacts de Neverhack, sinon ses contacts partenaires deviennent
  // inmodifiables depuis cette fiche.
  function contactOptionsForRecord(key, record, structureId) {
    const structIds = new Set([structureId]);
    if (record) {
      (rel(key).linkCols || []).forEach(col =>
        refIdsFromValue(record[col]).forEach(id => structIds.add(id)));
    }
    const vus = new Set();
    const options = [];
    structIds.forEach(id => contactsOf(id).forEach(c => {
      if (vus.has(c.id)) return;
      vus.add(c.id);
      options.push({ id: c.id, label: contactName(c) });
    }));
    return options.sort((a, b) => a.label.localeCompare(b.label, 'fr'));
  }

  // Etiquette d'un contact / d'une structure par son identifiant, pour les
  // valeurs enregistrees hors de la liste proposee.
  function contactChip(id) {
    const c = rel('contacts').records.find(x => x.id === id);
    return c ? { id, label: contactName(c) } : null;
  }

  // Une colonne de reference peut porter une liste (RefList) ou une seule
  // ligne (Ref) : Grist refuse l'autre forme. Vider une RefList s'ecrit ['L'],
  // vider une Ref s'ecrit 0.
  function refListValue(tableId, colId, ids) {
    const r = Object.keys(related).map(k => related[k]).find(x => x.tableId === tableId)
      || { listCols: structListCols };
    if (isListCol(r, colId)) return ['L', ...ids];
    return ids.length ? ids[0] : 0;
  }

  function structureChip(id) {
    const st = structures.find(x => x.id === id);
    return st ? { id, label: structField(st, 'Nom') || 'Sans nom' } : null;
  }

  // Toutes les structures du document, pour taguer une interaction/
  // opportunité/contact sur plusieurs partenaires présents (ex. une réunion
  // avec deux structures), pas seulement celle depuis laquelle on l'a créée.
  function structurePickerOptions() {
    return structures
      .map(s => ({ id: s.id, label: structField(s, 'Nom') || 'Sans nom' }))
      .sort((a, b) => a.label.localeCompare(b.label, 'fr'));
  }

  // Une interaction/opportunité peut référencer une structure par d'autres
  // colonnes que la principale (Etablissement Cluster, Laboratoire Cluster,
  // Equipe Cluster…) — déjà prises en compte pour l'affichage sur la fiche
  // (linkCols/linkedVia), mais jusqu'ici pas éditables depuis la popup. On
  // les monte ici en sélecteurs multiples génériques, un par colonne
  // découverte, avec le libellé Grist réel de la colonne.
  function extraStructureFieldId(colId) {
    return 'm-ref-extra-' + colId.replace(/[^a-zA-Z0-9_-]/g, '_');
  }

  function extraStructureFieldsHtml(relKey) {
    const r = rel(relKey);
    return (r.extraEditableLinkCols || []).map(colId =>
      '<div class="form-field full"><label>' + escapeHtml(r.colLabels[colId] || colId) + '</label>' +
      '<div id="' + extraStructureFieldId(colId) + '"></div></div>'
    ).join('');
  }

  // Renvoie { colId: getChips } pour lire leur contenu au moment du "Créer".
  function mountExtraStructureLinks(relKey, record, tableId, isNew) {
    const r = rel(relKey);
    const getters = {};
    (r.extraEditableLinkCols || []).forEach(colId => {
      getters[colId] = mountRefPicker(extraStructureFieldId(colId), structurePickerOptions(), record, tableId, colId, isNew, null, structureChip);
    });
    return getters;
  }

  // Monte un sélecteur de références (contacts, structures…) dans une
  // popup : en édition il enregistre à chaque ajout/retrait, en création il
  // retient seulement la sélection (tous les champs sont écrits d'un bloc
  // au moment du "Créer"). `defaultChipsWhenNew` pré-sélectionne une valeur
  // à la création (ex. la structure ouverte) — sans effet en édition, où le
  // point de départ est toujours la valeur déjà enregistrée. Renvoie un
  // accesseur sur la sélection courante.
  // `resoudre(id)` donne l'etiquette d'une valeur enregistree absente de la
  // liste proposee. Sans lui, une telle valeur ne s'affichait pas — et le
  // premier changement du champ l'effacait, puisque l'enregistrement reecrit
  // la colonne entiere a partir des seules pastilles visibles.
  function mountRefPicker(elId, options, record, tableId, colId, isNew, defaultChipsWhenNew, resoudre) {
    let chips = [];
    const el = document.getElementById(elId);
    if (!el) return () => chips;
    let proposees = options;
    if (record && colId) {
      const parId = {};
      options.forEach(o => { parId[o.id] = o; });
      chips = refIdsFromValue(record[colId])
        .map(id => parId[id] || (resoudre && resoudre(id)) || { id, label: 'Ligne #' + id });
      // Ce qui est enregistre doit rester proposable : sinon une valeur
      // retiree par erreur ne pourrait pas etre remise depuis cette fiche.
      const manquantes = chips.filter(c => !parId[c.id]);
      if (manquantes.length) {
        proposees = options.concat(manquantes)
          .sort((x, y) => String(x.label).localeCompare(String(y.label), 'fr'));
      }
    } else {
      chips = defaultChipsWhenNew || [];
    }
    renderLocalPicker(el, proposees, chips, (next) => {
      chips = next;
      if (!isNew && colId && record) {
        updateRecord(tableId, record.id, { [colId]: refListValue(tableId, colId, next.map(c => c.id)) })
          .then(() => setModalStatus('Enregistré ✓'))
          .catch(err => { console.error(err); setModalStatus('Erreur d’enregistrement'); });
      }
    });
    return () => chips;
  }

  // Lightweight chip picker over a fixed option list (no cross-table
  // autocomplete needed: the options are contacts already loaded).
  function renderLocalPicker(container, options, initialChips, onChange) {
    if (!container) return;
    let chips = [...(initialChips || [])];
    const datalistId = 'dl-' + Math.random().toString(36).slice(2);

    function paint() {
      container.innerHTML =
        '<div class="ref-chips">' +
          chips.map((c, idx) => '<span class="ref-chip">' + escapeHtml(c.label) +
            '<button type="button" data-i="' + idx + '" title="Retirer">✕</button></span>').join('') +
        '</div>' +
        '<input class="editable-input ref-input" list="' + datalistId + '" placeholder="Ajouter un contact… (Entrée)">' +
        '<datalist id="' + datalistId + '">' +
          options.filter(o => !chips.some(c => c.id === o.id))
            .map(o => '<option value="' + escapeHtml(o.label) + '">').join('') +
        '</datalist>';

      container.querySelectorAll('.ref-chip button').forEach(btn => {
        btn.addEventListener('click', () => {
          chips.splice(Number(btn.dataset.i), 1);
          paint();
          onChange([...chips]);
        });
      });

      const input = container.querySelector('.ref-input');
      const tryAdd = () => {
        const val = input.value.trim();
        if (!val) return;
        const match = options.find(o => o.label.toLowerCase() === val.toLowerCase());
        if (!match || chips.some(c => c.id === match.id)) {
          input.classList.add('ref-input-error');
          setTimeout(() => input.classList.remove('ref-input-error'), 900);
          return;
        }
        chips.push(match);
        input.value = '';
        paint();
        onChange([...chips]);
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tryAdd(); } });
      input.addEventListener('change', tryAdd);
    }
    paint();
  }

  // ---- Compte-rendu ----

  function setupCrEditor(tableId, i, cols) {
    const editor = document.getElementById('cr-editor');
    if (!editor || !cols.CR) return;
    const setStatus = (t) => { const el = document.getElementById('cr-status'); if (el) el.textContent = t; };

    editor.innerHTML = normalizeCrToHtml(i[cols.CR]);
    resolveImagesIn(editor);

    const saveCR = debounce(async (html) => {
      try {
        setStatus('Enregistrement…');
        await updateRecord(tableId, i.id, { [cols.CR]: html });
        i[cols.CR] = html;
        setStatus('Enregistré ✓');
      } catch (err) {
        setStatus('Erreur d’enregistrement');
        console.error(err);
      }
    }, 800);

    editor.addEventListener('input', () => saveCR(serializeCrForSave(editor)));

    document.querySelectorAll('.cr-toolbar button[data-cmd]').forEach(btn => {
      // mousedown + preventDefault keeps the selection alive (a click would
      // blur the editor first and lose it).
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        editor.focus();
        const cmd = btn.dataset.cmd;
        if (cmd === 'heading') document.execCommand('formatBlock', false, 'H3');
        else if (cmd === 'list') document.execCommand('insertUnorderedList');
        else if (cmd === 'link') {
          const url = prompt('URL du lien :', 'https://');
          if (url) document.execCommand('createLink', false, url);
        } else document.execCommand(cmd);
        saveCR(serializeCrForSave(editor));
      });
    });

    editor.addEventListener('paste', async (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          e.preventDefault();
          const placeholder = document.createElement('span');
          placeholder.textContent = 'Téléversement de l’image…';
          placeholder.style.color = 'var(--text-muted)';
          const sel = window.getSelection();
          if (sel && sel.rangeCount) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(placeholder);
            range.collapse(false);
          } else {
            editor.appendChild(placeholder);
          }
          try {
            const [attId] = await uploadAttachments([item.getAsFile()]);
            const img = document.createElement('img');
            img.setAttribute('data-att-id', attId);
            img.src = await getAttachmentDownloadUrl(attId);
            placeholder.replaceWith(img);
          } catch (err) {
            placeholder.textContent = 'Échec du téléversement de l’image.';
            console.error(err);
          }
          saveCR(serializeCrForSave(editor));
          return;
        }
      }
    });
  }

  // ---- Pièces jointes ----

  function setupAttachments(tableId, i, cols) {
    const zone = document.getElementById('pj-dropzone');
    const listEl = document.getElementById('pj-list');
    const input = document.getElementById('pj-input');
    if (!zone || !listEl || !cols.PJ) return;

    async function paint() {
      const ids = attachmentIdsFromValue(i[cols.PJ]);
      if (ids.length === 0) { listEl.innerHTML = '<div class="panel-empty" style="padding:6px 0;">Aucune pièce jointe.</div>'; return; }
      listEl.innerHTML = '<div class="panel-empty" style="padding:6px 0;">Chargement…</div>';
      const metas = await Promise.all(ids.map(id => getAttachmentMeta(id).catch(() => ({ id, fileName: 'Fichier #' + id }))));
      listEl.innerHTML = metas.map(m =>
        '<div class="pj-item"><span>📎</span><span class="pj-name">' + escapeHtml(m.fileName) + '</span>' +
        '<a data-dl="' + m.id + '">Télécharger</a>' +
        '<button class="pj-remove" data-rm="' + m.id + '" title="Retirer">✕</button></div>').join('');

      listEl.querySelectorAll('[data-dl]').forEach(a => a.addEventListener('click', async () => {
        try { window.open(await getAttachmentDownloadUrl(a.dataset.dl), '_blank'); } catch (err) { console.error(err); }
      }));
      listEl.querySelectorAll('[data-rm]').forEach(btn => btn.addEventListener('click', async () => {
        const remaining = attachmentIdsFromValue(i[cols.PJ]).filter(id => String(id) !== String(btn.dataset.rm));
        try {
          await updateRecord(tableId, i.id, { [cols.PJ]: ['L', ...remaining] });
          i[cols.PJ] = ['L', ...remaining];
          paint();
        } catch (err) { console.error(err); }
      }));
    }

    async function handleFiles(files) {
      if (!files || files.length === 0) return;
      const original = zone.textContent;
      zone.textContent = 'Envoi en cours…';
      try {
        const newIds = await uploadAttachments(Array.from(files));
        const all = [...attachmentIdsFromValue(i[cols.PJ]), ...newIds];
        await updateRecord(tableId, i.id, { [cols.PJ]: ['L', ...all] });
        i[cols.PJ] = ['L', ...all];
        await paint();
      } catch (err) {
        console.error(err);
      } finally {
        zone.textContent = original;
      }
    }

    zone.addEventListener('click', () => { input.value = ''; input.click(); });
    input.onchange = () => handleFiles(input.files);
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    paint();
  }

  // ---------------------------------------------------------------------
  // Événements Grist + UI
  // ---------------------------------------------------------------------

  grist.onRecords(async function (records, maps) {
    mappings = maps || {};
    structures = mapRecords(records, maps);
    if (structTableId === null) {
      try { structTableId = await grist.getTable().getTableId(); } catch (err) { console.error(err); }
      try {
        const meta = await fetchColumnMeta(structTableId);
        structListCols = meta.filter(m => /^(RefList|ChoiceList):?/.test(m.type || '')).map(m => m.id);
      } catch (err) { console.error(err); }
    }
    if (!related.contacts) await loadRelated();
    if (current) {
      // Keep the open fiche in sync with the new data (or drop it if the
      // row fell out of a filtered list — onRecord doesn't always re-fire).
      const fresh = structures.find(s => s.id === current.id);
      current = fresh || null;
    }
    // Une structure vient d'être créée depuis le widget : ouvrir sa fiche dès
    // que Grist la livre. Le filtre par défaut masque les prospects, et une
    // nouvelle structure n'est pas forcément un partenaire — d'où le passage
    // sur « Tous », sinon elle serait créée puis introuvable.
    if (structureAOuvrir !== null && structures.some(s => s.id === structureAOuvrir)) {
      ouvrirNouvelleStructure(structureAOuvrir);
      return;
    }
    render();
  });

  grist.onRecord(function (record, maps) {
    // Deliberately not opening a fiche here: Grist restores the last cursor
    // position at load time, which would auto-open a partner (and fetch its
    // attachments) before being asked. A click in the list is what opens it.
    if (maps) mappings = maps;
  });

  document.getElementById('search').addEventListener('input', (e) => {
    query = e.target.value.trim().toLowerCase();
    filtresChanges();
  });

  // Un filtre a change : la liste evidemment, mais aussi l'annuaire, qui lit
  // les memes filtres. Passer par renderList() seul l'aurait laisse en arriere.
  function filtresChanges() {
    if (vue === 'annuaire') render(); else renderList();
  }

  // Le mode de filtre et la pastille active vont ensemble : les separer
  // laisserait la liste filtree d'un cote et l'affichage de l'autre.
  function setFilterMode(mode) {
    filterMode = mode;
    document.querySelectorAll('.filter-chip').forEach(b =>
      b.classList.toggle('active', b.dataset.filter === mode));
  }

  document.getElementById('filter-chips').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-chip');
    if (!btn) return;
    setFilterMode(btn.dataset.filter);
    filtresChanges();
  });

  // L'annuaire suit les memes filtres que la liste : changer un filtre doit
  // donc le redessiner, d'ou le passage par render() plutot que renderList().
  document.getElementById('btn-annuaire').addEventListener('click', () => {
    vue = vue === 'annuaire' ? 'fiche' : 'annuaire';
    document.getElementById('btn-annuaire').classList.toggle('active', vue === 'annuaire');
    render();
  });

  document.getElementById('btn-new-structure').addEventListener('click', () => {
    if (!structTableId) { alert('Table des structures introuvable.'); return; }
    openStructureModal(null);
  });

  document.getElementById('filter-toggle').addEventListener('click', () => {
    const panel = document.getElementById('filter-panel');
    panel.hidden = !panel.hidden;
    updateFilterPanelUI();
  });
  document.getElementById('filter-reset').addEventListener('click', () => {
    Object.keys(PANEL_FILTERS).forEach(key => {
      activeFilters[key] = '';
      const el = document.getElementById('filter-' + key);
      if (el) el.value = '';
    });
    updateFilterPanelUI();
    filtresChanges();
  });
  Object.keys(PANEL_FILTERS).forEach(key => {
    const el = document.getElementById('filter-' + key);
    if (el) el.addEventListener('change', () => {
      activeFilters[key] = el.value;
      updateFilterPanelUI();
      filtresChanges();
    });
  });
  document.getElementById('active-chips').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (!btn) return;
    const key = btn.dataset.key;
    activeFilters[key] = '';
    const el = document.getElementById('filter-' + key);
    if (el) el.value = '';
    updateFilterPanelUI();
    filtresChanges();
  });

  document.getElementById('btn-refresh').addEventListener('click', () => refreshRelated(true));

  // Another widget (or another user) may have changed a linked table while
  // this one sat in the background — re-read on focus rather than polling.
  window.addEventListener('focus', () => { if (modalEl.hidden) refreshRelated(true); });
</script>
