<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fiche contact</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="./common.css">
<script src="./common.js"></script>
<style>
  .list-item .name { font-weight: 600; }

  .header-text h1 { overflow: visible; white-space: normal; }

  .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 2px; }

  .edit-toggle-btn {
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }
  .edit-toggle-btn:hover { background: rgba(255,255,255,0.32); }

  .close-fiche-btn {
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }
  .close-fiche-btn:hover { background: #dc2626; }

  .name-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: #fff;
    font-size: 21px;
    font-weight: 700;
    padding: 2px 0;
    width: 100%;
    min-width: 0;
  }
  .name-input::placeholder { color: rgba(255,255,255,0.6); }
  .name-input:hover { border-bottom-color: rgba(255,255,255,0.4); }
  .name-input:focus { outline: none; border-bottom-color: #fff; }

  .subtitle-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: #fff;
    opacity: 0.9;
    font-size: 13px;
    padding: 2px 0;
    width: 100%;
    min-width: 0;
    margin-top: 4px;
  }
  .subtitle-input::placeholder { color: rgba(255,255,255,0.6); }
  .subtitle-input:hover { border-bottom-color: rgba(255,255,255,0.4); }
  .subtitle-input:focus { outline: none; border-bottom-color: #fff; }

  .principal-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--sequoia-green-dark);
  }
  .principal-row input { cursor: pointer; }
  .principal-row label { cursor: pointer; }

  .input-with-action { display: flex; align-items: center; gap: 4px; }
  .input-with-action .editable-input { flex: 1; }
  .copy-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 6px;
    line-height: 1;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); }
  .copy-btn.copied { color: var(--sequoia-green); }

  .empty-hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="btn-new" id="btn-new">+ Nouveau contact</button>
    </div>
    <div class="list" id="list">
      <div class="empty-list">Chargement…</div>
    </div>
  </aside>

  <main class="fiche-wrap" id="fiche-wrap">
    <div class="placeholder">Sélectionnez un contact</div>
  </main>
</div>

<div class="form-modal-backdrop" id="create-modal" hidden>
  <div class="form-modal">
    <button class="form-modal-close" id="create-close">✕</button>
    <h2 class="form-modal-title">Nouveau contact</h2>
    <div class="form-modal-grid">
      <div class="form-field full"><label>Nom</label><input id="new-nom" autofocus></div>
      <div class="form-field"><label>Prénom (facultatif)</label><input id="new-prenom"></div>
      <div class="form-field"><label>Fonction</label><input id="new-fonction"></div>
      <div class="form-field"><label>Email</label><input id="new-email" type="email"></div>
      <div class="form-field"><label>Téléphone</label><input id="new-telephone"></div>
      <div class="form-field full"><label>Linkedin</label><input id="new-linkedin"></div>
      <div class="form-field full"><label>Commentaire</label><textarea id="new-commentaire"></textarea></div>
      <div class="form-modal-note">La structure associée n'est pas modifiable depuis ce widget : renseignez-la depuis la table Contacts dans Grist si besoin.</div>
    </div>
    <div class="form-modal-actions">
      <button class="btn-secondary" id="create-cancel">Annuler</button>
      <button class="btn-primary" id="create-submit">Créer</button>
    </div>
  </div>
</div>

<script>
  const COLUMNS = [
    { name: 'Nom', title: 'Nom', optional: false },
    { name: 'Prenom', title: 'Prénom', optional: true },
    { name: 'Fonction', title: 'Fonction', optional: true },
    { name: 'Structures', title: 'Structure(s)', optional: true },
    { name: 'Email', title: 'Email', optional: true },
    { name: 'Telephone', title: 'Téléphone', optional: true },
    { name: 'Linkedin', title: 'Linkedin', optional: true },
    { name: 'ContactPrincipal', title: 'Contact principal', optional: true },
    { name: 'Commentaire', title: 'Commentaire', optional: true }
  ];

  let allRecords = [];
  let currentMappings = null;
  let currentId = null;
  let currentRecord = null;
  let editMode = false;

  grist.ready({ requiredAccess: 'full', columns: COLUMNS, allowSelectBy: true });

  function fullName(c) {
    return [c.Nom, c.Prenom].filter(Boolean).join(' ') || 'Sans nom';
  }

  function sortByName(records) {
    return [...records].sort((a, b) => fullName(a).localeCompare(fullName(b), 'fr'));
  }

  function renderList() {
    const listEl = document.getElementById('list');
    const sorted = sortByName(allRecords);

    if (sorted.length === 0) {
      listEl.innerHTML = '<div class="empty-list">Aucun contact. Cliquez sur "+ Nouveau contact" pour en créer un.</div>';
      return;
    }

    listEl.innerHTML = '';
    sorted.forEach(c => {
      const item = document.createElement('div');
      item.className = 'list-item' + (c.id === currentId ? ' active' : '');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = initials(fullName(c));

      const info = document.createElement('div');
      info.style.overflow = 'hidden';
      info.innerHTML =
        '<div class="name">' + escapeHtml(fullName(c)) + '</div>' +
        '<div class="sub">' + escapeHtml(c.Fonction || '') + '</div>';

      item.appendChild(avatar);
      item.appendChild(info);
      item.addEventListener('click', () => {
        grist.setCursorPos({ rowId: c.id }).catch(() => {});
        currentId = c.id;
        editMode = false;
        renderFiche(c);
        renderList();
      });

      listEl.appendChild(item);
    });
  }

  // ---- Autosave (debounced per field) ----
  const pendingSaves = {};
  function saveField(recordId, colId, value, statusEl) {
    if (!colId) return;
    clearTimeout(pendingSaves[colId]);
    pendingSaves[colId] = setTimeout(async () => {
      try {
        if (statusEl) statusEl.textContent = 'Enregistrement…';
        await grist.getTable().update({ id: recordId, fields: { [colId]: value } });
        if (statusEl) statusEl.textContent = 'Enregistré ✓';
      } catch (err) {
        console.error(err);
        if (statusEl) statusEl.textContent = 'Erreur d’enregistrement';
      }
    }, 700);
  }

  function bindInput(id, recordId, colId, statusEl) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => saveField(recordId, colId, el.value, statusEl));
  }

  function viewItem(label, valueHtml) {
    if (!valueHtml) return '';
    return '<div class="info-item"><div class="label">' + label + '</div><div class="value">' + valueHtml + '</div></div>';
  }

  function renderFiche(c) {
    currentRecord = c;
    const wrap = document.getElementById('fiche-wrap');
    if (!c) {
      wrap.innerHTML = '<div class="placeholder">Sélectionnez un contact, ou créez-en un nouveau</div>';
      return;
    }

    if (editMode) renderEditMode(c); else renderViewMode(c);
  }

  function renderViewMode(c) {
    const wrap = document.getElementById('fiche-wrap');

    const rows = [
      viewItem('Prénom', c.Prenom ? escapeHtml(c.Prenom) : ''),
      viewItem('Email', c.Email ? '<a href="mailto:' + escapeHtml(c.Email) + '">' + escapeHtml(c.Email) + '</a>' : ''),
      viewItem('Téléphone', c.Telephone ? '<a href="tel:' + escapeHtml(c.Telephone) + '">' + escapeHtml(c.Telephone) + '</a>' : ''),
      viewItem('Linkedin', c.Linkedin ? '<a href="' + escapeHtml(c.Linkedin) + '" target="_blank" rel="noopener">Profil ↗</a>' : '')
    ].join('');

    const hasComment = !!(c.Commentaire && c.Commentaire.trim());
    const nothingElse = !rows && !hasComment;

    wrap.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div class="header-icon">' + initials(fullName(c)) + '</div>' +
          '<div class="header-text">' +
            '<h1>' + escapeHtml(fullName(c)) + '</h1>' +
            (c.Fonction ? '<div class="subtitle">' + escapeHtml(c.Fonction) + '</div>' : '') +
          '</div>' +
          '<div class="header-actions">' +
            '<button class="edit-toggle-btn" id="toggle-edit" title="Modifier">✏️</button>' +
            '<button class="close-fiche-btn" id="close-fiche" title="Fermer">✕</button>' +
          '</div>' +
        '</div>' +
        '<div class="card-body">' +
          (c.ContactPrincipal ? '<div class="badge" style="background:var(--sequoia-green-light);color:var(--sequoia-green-dark);margin-bottom:16px;">★ Contact principal</div>' : '') +
          (rows ? '<div class="info-grid">' + rows + '</div>' : '') +
          (hasComment ? '<div class="section-title">Commentaire</div><div class="value" style="white-space:pre-wrap;">' + escapeHtml(c.Commentaire) + '</div>' : '') +
          (nothingElse ? '<div class="empty-hint">Aucune information renseignée. Cliquez sur "✏️ Modifier" pour compléter la fiche.</div>' : '') +
        '</div>' +
      '</div>';

    document.getElementById('toggle-edit').addEventListener('click', () => {
      editMode = true;
      renderFiche(currentRecord);
    });
    document.getElementById('close-fiche').addEventListener('click', closeFiche);
  }

  function closeFiche() {
    currentId = null;
    editMode = false;
    renderFiche(null);
    renderList();
  }

  function renderEditMode(c) {
    const wrap = document.getElementById('fiche-wrap');

    wrap.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div class="header-icon">' + initials(fullName(c)) + '</div>' +
          '<div class="header-text">' +
            '<input class="name-input" id="f-nom" placeholder="Nom" value="' + escapeHtml(c.Nom || '') + '">' +
            '<input class="subtitle-input" id="f-fonction" placeholder="Fonction" value="' + escapeHtml(c.Fonction || '') + '">' +
          '</div>' +
          '<div class="header-actions">' +
            '<button class="edit-toggle-btn" id="toggle-edit" title="Terminé">✓</button>' +
            '<button class="close-fiche-btn" id="close-fiche" title="Fermer">✕</button>' +
          '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="principal-row">' +
            '<input type="checkbox" id="f-principal"' + (c.ContactPrincipal ? ' checked' : '') + '>' +
            '<label for="f-principal">★ Contact principal</label>' +
          '</div>' +
          '<div class="info-grid">' +
            '<div class="info-item"><div class="label">Prénom <span style="text-transform:none;">(facultatif)</span></div><input class="editable-input" id="f-prenom" value="' + escapeHtml(c.Prenom || '') + '"></div>' +
            '<div class="info-item"><div class="label">Email</div><div class="input-with-action">' +
              '<input class="editable-input" id="f-email" type="email" value="' + escapeHtml(c.Email || '') + '">' +
              '<button type="button" class="copy-btn" id="copy-email" title="Copier l\'email">📋</button>' +
            '</div></div>' +
            '<div class="info-item"><div class="label">Téléphone</div><input class="editable-input" id="f-telephone" value="' + escapeHtml(c.Telephone || '') + '"></div>' +
            '<div class="info-item"><div class="label">Linkedin</div><input class="editable-input" id="f-linkedin" value="' + escapeHtml(c.Linkedin || '') + '"></div>' +
          '</div>' +
          '<div class="section-title">Structure(s)</div>' +
          '<div id="ref-structures"></div>' +
          '<div class="section-title">Commentaire <span class="cr-save-status" id="save-status"></span></div>' +
          '<textarea class="editable-textarea" id="f-commentaire" placeholder="Aucun commentaire.">' + escapeHtml(c.Commentaire || '') + '</textarea>' +
        '</div>' +
      '</div>';

    const statusEl = document.getElementById('save-status');
    bindInput('f-prenom', c.id, currentMappings.Prenom, statusEl);
    bindInput('f-nom', c.id, currentMappings.Nom, statusEl);
    bindInput('f-fonction', c.id, currentMappings.Fonction, statusEl);
    bindInput('f-email', c.id, currentMappings.Email, statusEl);
    bindInput('f-telephone', c.id, currentMappings.Telephone, statusEl);
    bindInput('f-linkedin', c.id, currentMappings.Linkedin, statusEl);
    bindInput('f-commentaire', c.id, currentMappings.Commentaire, statusEl);

    const structuresLabels = formatValue(c.Structures) ? formatValue(c.Structures).split(', ') : [];
    renderRefPicker(
      document.getElementById('ref-structures'),
      structuresLabels,
      'Structures',
      (labels) => saveRefField(c.id, currentMappings.Structures, labels, statusEl)
    );

    const copyBtn = document.getElementById('copy-email');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const email = document.getElementById('f-email').value.trim();
        if (!email) return;
        try {
          await navigator.clipboard.writeText(email);
          copyBtn.textContent = '✓';
          copyBtn.classList.add('copied');
          setTimeout(() => { copyBtn.textContent = '📋'; copyBtn.classList.remove('copied'); }, 1200);
        } catch (err) {
          console.error(err);
        }
      });
    }

    const principalEl = document.getElementById('f-principal');
    if (principalEl) {
      principalEl.addEventListener('change', async () => {
        try {
          await grist.getTable().update({ id: c.id, fields: { [currentMappings.ContactPrincipal]: principalEl.checked } });
        } catch (err) { console.error(err); }
      });
    }

    document.getElementById('toggle-edit').addEventListener('click', () => {
      editMode = false;
      renderFiche(currentRecord);
    });
    document.getElementById('close-fiche').addEventListener('click', closeFiche);
  }

  const createModal = document.getElementById('create-modal');

  function openCreateModal() {
    ['new-nom', 'new-prenom', 'new-fonction', 'new-email', 'new-telephone', 'new-linkedin', 'new-commentaire']
      .forEach(id => { document.getElementById(id).value = ''; });
    createModal.hidden = false;
    document.getElementById('new-nom').focus();
  }
  function closeCreateModal() { createModal.hidden = true; }

  document.getElementById('btn-new').addEventListener('click', openCreateModal);
  document.getElementById('create-close').addEventListener('click', closeCreateModal);
  document.getElementById('create-cancel').addEventListener('click', closeCreateModal);
  createModal.addEventListener('click', (e) => { if (e.target === createModal) closeCreateModal(); });

  document.getElementById('create-submit').addEventListener('click', async () => {
    const nom = document.getElementById('new-nom').value.trim();
    if (!nom) { document.getElementById('new-nom').focus(); return; }

    const fields = {};
    if (currentMappings.Nom) fields[currentMappings.Nom] = nom;
    if (currentMappings.Prenom) fields[currentMappings.Prenom] = document.getElementById('new-prenom').value.trim();
    if (currentMappings.Fonction) fields[currentMappings.Fonction] = document.getElementById('new-fonction').value.trim();
    if (currentMappings.Email) fields[currentMappings.Email] = document.getElementById('new-email').value.trim();
    if (currentMappings.Telephone) fields[currentMappings.Telephone] = document.getElementById('new-telephone').value.trim();
    if (currentMappings.Linkedin) fields[currentMappings.Linkedin] = document.getElementById('new-linkedin').value.trim();
    if (currentMappings.Commentaire) fields[currentMappings.Commentaire] = document.getElementById('new-commentaire').value.trim();

    try {
      const created = await grist.getTable().create({ fields });
      const newId = Array.isArray(created) ? created[0].id : created.id;
      closeCreateModal();
      grist.setCursorPos({ rowId: newId }).catch(() => {});
    } catch (err) {
      console.error(err);
      alert('Erreur lors de la création du contact.');
    }
  });

  grist.onRecords(function (records, mappings) {
    currentMappings = mappings;
    allRecords = mapRecords(records, mappings);
    // If the record shown in the fiche fell out of the (possibly filtered)
    // list — e.g. the linked Structure changed and has no more contacts —
    // Grist doesn't always re-fire onRecord, so clear it here explicitly.
    if (currentId !== null && !allRecords.some(c => c.id === currentId)) {
      currentId = null;
      renderFiche(null);
    }
    renderList();
  });

  grist.onRecord(function (record, mappings) {
    // Deliberately not rendering the fiche here: Grist restores the last
    // cursor position on load, which would otherwise auto-open a contact
    // (and its attachments-free fields) before the user asked for it. The
    // list-click handler is the only thing that opens the fiche.
    currentMappings = mappings;
  });
</script>

</body>
</html>
